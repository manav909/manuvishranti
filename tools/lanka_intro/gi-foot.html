    var sh=Math.round(217-120*night),land='rgb('+sh+','+Math.round(210-118*night)+','+Math.round(180-100*night)+')';
    cx.fillStyle=land;cx.strokeStyle='#8F7C50';cx.lineWidth=2;
    if(CIN.length){cx.beginPath();poly(cx,PR,CIN);cx.fill();cx.stroke()}
    if(CLK.length){cx.beginPath();poly(cx,PR,CLK);cx.fill();cx.stroke()}
    if(BN.length&&BS.length){cx.beginPath();poly(cx,PR,BN.concat(BS));cx.fillStyle='rgba(217,210,180,'+(.5-.3*night)+')';cx.fill()}
    HILLS.forEach(function(hl){var q=PR(hl[0],hl[1]),r=hl[2]*(PR(8,80)[1]-PR(8.1,80)[1])*.6;var hg2=cx.createRadialGradient(q[0]-r*.2,q[1]-r*.3,0,q[0],q[1],r);hg2.addColorStop(0,'rgba(120,110,80,'+(.16-.06*night)+')');hg2.addColorStop(1,'rgba(120,110,80,0)');cx.fillStyle=hg2;cx.beginPath();cx.ellipse(q[0],q[1],r,r*.75,0,0,7);cx.fill()});
    cx.save();cx.globalCompositeOperation='lighter';cx.strokeStyle='rgba(157,194,212,'+(.25+.15*Math.sin(t/700))+')';cx.lineWidth=6;cx.filter='blur(3px)';if(CLK.length){cx.beginPath();poly(cx,PR,CLK);cx.stroke()}cx.restore();
    if(t<2600){var dusk=cx.createRadialGradient(W*.2,H*.1,0,W*.2,H*.1,Math.max(W,H));dusk.addColorStop(0,'rgba(255,150,70,.35)');dusk.addColorStop(1,'rgba(255,150,70,0)');cx.fillStyle=dusk;cx.fillRect(0,0,W,H)}
    cx.globalCompositeOperation='lighter';
    var a=PR(P0[0],P0[1]),b=PR(P1[0],P1[1]),c=[(a[0]+b[0])/2,Math.min(a[1],b[1])-H*.42];
    var u=(t-900)/1900;
    if(u>0&&u<1.15){var e=Math.min(1,u);e=e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2;var p=qb(a,c,b,e);trail.push(p);if(trail.length>40)trail.shift();
      for(var i=0;i<trail.length;i++){var al=i/trail.length;cx.fillStyle='rgba(255,200,110,'+al*.7+')';cx.beginPath();cx.arc(trail[i][0],trail[i][1],1+al*5,0,7);cx.fill()}
      if(u<1){var hg=cx.createRadialGradient(p[0],p[1],0,p[0],p[1],40);hg.addColorStop(0,'rgba(255,250,230,1)');hg.addColorStop(.25,'rgba(255,190,90,.8)');hg.addColorStop(1,'rgba(255,140,40,0)');cx.fillStyle=hg;cx.fillRect(p[0]-40,p[1]-40,80,80);
        if(Math.random()<.8)embers.push({x:p[0],y:p[1],vx:(Math.random()-.5)*1.2,vy:Math.random()*1.2,l:1,s:1+Math.random()*2})}}
    if(t>2800){var ft=(t-2800)/900;if(ft<1){var r=ft*Math.max(W,H)*.5;var fg=cx.createRadialGradient(b[0],b[1],0,b[0],b[1],r);fg.addColorStop(0,'rgba(255,230,180,'+(1-ft)*.9+')');fg.addColorStop(1,'rgba(255,160,60,0)');cx.fillStyle=fg;cx.fillRect(0,0,W,H);
        cx.strokeStyle='rgba(255,210,140,'+(1-ft)+')';cx.lineWidth=3;cx.beginPath();cx.arc(b[0],b[1],r*.6,0,7);cx.stroke()}
      lights.forEach(function(l,i){var on=Math.min(1,Math.max(0,(t-2900-i*18)/300));if(!on)return;var tw=.6+.4*Math.sin(t/500+l.tw);
        var lg=cx.createRadialGradient(l.x,l.y,0,l.x,l.y,9);lg.addColorStop(0,'rgba(255,230,160,'+on*tw+')');lg.addColorStop(1,'rgba(255,170,70,0)');cx.fillStyle=lg;cx.fillRect(l.x-9,l.y-9,18,18);
        cx.fillStyle='rgba(255,245,215,'+on+')';cx.fillRect(l.x-1,l.y-1,2,2)});
      if(Math.random()<.4)embers.push({x:b[0]+(Math.random()-.5)*60,y:b[1]+(Math.random()-.5)*30,vx:(Math.random()-.5)*.4,vy:-(.3+Math.random()*.8),l:1,s:1+Math.random()*1.5})}
    for(var j=embers.length-1;j>=0;j--){var m=embers[j];m.x+=m.vx;m.y+=m.vy;m.l-=.012;if(m.l<=0){embers.splice(j,1);continue}cx.fillStyle='rgba(255,170,80,'+m.l*.8+')';cx.beginPath();cx.arc(m.x,m.y,m.s,0,7);cx.fill()}
    cx.globalCompositeOperation='source-over';
    var vg=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');cx.fillStyle=vg;cx.fillRect(0,0,W,H);
    var cg=cx.createLinearGradient(0,H*.25,0,H*.75);cg.addColorStop(0,'rgba(7,19,27,0)');cg.addColorStop(.5,'rgba(7,19,27,'+.45*Math.min(1,t/3500)+')');cg.addColorStop(1,'rgba(7,19,27,0)');cx.fillStyle=cg;cx.fillRect(0,0,W,H);
    function at(k,ms,fn){if(!marks[k]&&t>=ms){marks[k]=1;fn()}}
    at('leap',900,function(){SFX.leap()});
    at('boom',2800,function(){SFX.boom();gi.classList.remove('shake');void gi.offsetWidth;gi.classList.add('shake')});
    at('title',3300,function(){SFX.title()});
    if(heroOn&&!gi.classList.contains('gone')&&!reduce)raf=requestAnimationFrame(hframe);
  }

  /* the map section: every place pinned, popping in */
  var mc=$('#giMap'),mx=mc.getContext('2d'),mW,mH,MP,mpins=[],mt0=0,mraf=0;
  function mlay(){var r=mc.getBoundingClientRect();mW=r.width;mH=r.height;mc.width=Math.round(mW*DPR);mc.height=Math.round(mH*DPR);MP=proj([13.9,75.4,5.6,82.4],mW,mH,1);
    mpins=pts().map(function(p){var q=MP(p[0],p[1]);return {x:q[0],y:q[1]}}).sort(function(a,b){return a.y-b.y})}
  function mframe(now){
    mraf=0;var t=now-mt0;mx.setTransform(DPR,0,0,DPR,0,0);mx.fillStyle='#9DC2D4';mx.fillRect(0,0,mW,mH);
    mx.strokeStyle='rgba(255,255,255,.3)';for(var y=16;y<mH;y+=26){mx.beginPath();for(var x=0;x<=mW;x+=16){var yy=y+Math.sin(x/40+t/800+y)*2;x?mx.lineTo(x,yy):mx.moveTo(x,yy)}mx.stroke()}
    mx.fillStyle='#D9D2B4';mx.strokeStyle='#8F7C50';mx.lineWidth=2;
    if(CIN.length){mx.beginPath();poly(mx,MP,CIN);mx.fill();mx.stroke()}if(CLK.length){mx.beginPath();poly(mx,MP,CLK);mx.fill();mx.stroke()}
    if(CITY.length){mx.beginPath();poly(mx,MP,CITY);mx.fillStyle='rgba(165,49,31,.25)';mx.fill()}
    var a=MP(P0[0],P0[1]),b=MP(P1[0],P1[1]),c=[(a[0]+b[0])/2,Math.min(a[1],b[1])-mH*.18];var u=Math.min(1,t/1600);
    mx.setLineDash([3,7]);mx.strokeStyle='#A5311F';mx.lineWidth=3;mx.beginPath();mx.moveTo(a[0],a[1]);for(var s=0;s<=u;s+=.02){var q=qb(a,c,b,s);mx.lineTo(q[0],q[1])}mx.stroke();mx.setLineDash([]);
    mpins.forEach(function(p,i){var k=Math.min(1,Math.max(0,(t-600-i*22)/260));if(!k)return;var sc=k<1?1+Math.sin(k*Math.PI)*.6:1,r=4*sc;
      mx.fillStyle='rgba(23,34,47,.25)';mx.beginPath();mx.ellipse(p.x,p.y+2,r,r*.5,0,0,7);mx.fill();
      mx.fillStyle=i%9===0?'#E2B24A':'#A5311F';mx.beginPath();mx.arc(p.x,p.y-r,r,0,7);mx.fill();mx.fillStyle='#fff';mx.beginPath();mx.arc(p.x,p.y-r,r*.4,0,7);mx.fill()});
    if(t<600+mpins.length*22+800&&!gi.classList.contains('gone'))mraf=requestAnimationFrame(mframe);
  }
  function mstatic(){mt0=performance.now()-99999;mframe(performance.now())}

  /* ---------- reveals and counters ---------- */
  function count(el){$$('b[data-n]',el).forEach(function(b){var n=+b.dataset.n,s=performance.now();(function st(now){var u=Math.min(1,(now-s)/1500);b.textContent=Math.round(n*(1-Math.pow(1-u,3)));if(u<1)requestAnimationFrame(st)})(s)})}
  var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;var el=e.target;el.classList.add('in');io.unobserve(el);
    if(el.id==='giStats')count(el);if(el.id==='giMapBox'){mlay();if(reduce)mstatic();else{mt0=performance.now();mframe(mt0)}}
    if(el.id==='giRoles'&&!reduce)$$('.gi-role',el).forEach(function(r,i){setTimeout(SFX.card,i*90)})})},{root:gi,threshold:.2}):null;
  $$('.gi-rv,#giRoles,#giNights,#giMis').forEach(function(el){if(io&&!reduce)io.observe(el);else{el.classList.add('in')}});
  if(!io||reduce){count($('#giStats'));mlay();mstatic()}
  $$('.gi-role').forEach(function(b){b.addEventListener('click',function(){b.classList.toggle('flip');SFX.card()})});
  new IntersectionObserver(function(es){heroOn=es[0].isIntersecting;$('#giFloat').classList.toggle('on',!heroOn);if(heroOn&&!raf&&!reduce)raf=requestAnimationFrame(hframe)},{root:gi,threshold:.25}).observe($('.gi-hero'));

  /* ---------- into the game ---------- */
  function start(){
    if(gi.classList.contains('gone'))return;SFX.go();gi.classList.add('gone');
    setTimeout(function(){if(raf)cancelAnimationFrame(raf);gi.remove();var a=document.getElementById('app');if(a){a.setAttribute('tabindex','-1');a.focus({preventScroll:true})}},950);
  }
  $$('[data-go]').forEach(function(b){b.addEventListener('click',start)});
  $('#giMore').addEventListener('click',function(){$('#giBody').scrollIntoView({behavior:reduce?'auto':'smooth'})});
  $('#giDown').addEventListener('click',function(){$('#giBody').scrollIntoView({behavior:reduce?'auto':'smooth'})});
  document.addEventListener('keydown',function k(e){if(!document.body.contains(gi)){document.removeEventListener('keydown',k);return}
    if((e.key==='Enter'||e.key===' ')&&(e.target===document.body||e.target===gi)){e.preventDefault();start()}});
  window.addEventListener('resize',function(){hlay();if(reduce){t0=performance.now()-9000;hframe(performance.now())}});

  hlay();
  if(reduce){gi.classList.add('play');t0=performance.now()-9000;marks={leap:1,boom:1,title:1};hframe(performance.now())}
  else{requestAnimationFrame(function(){t0=performance.now();gi.classList.add('play');raf=requestAnimationFrame(hframe)})}
  gi.focus&&gi.setAttribute('tabindex','-1');
})();
</script>
