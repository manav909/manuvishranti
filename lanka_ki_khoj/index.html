<!doctype html>
<html lang="hi" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="लंका की खोज: सुंदरकांड की एक रात, असली भूगोल के नक्शे पर।">
<title>लंका की खोज</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--page:#f0f2ed;--ink:#17222f;--quiet:#586a79;--rule:#c6cfc8;--tide:#236f68;--haldi:#9a6a09;--fire:#a5311f;
 --mark:#e2e8df;--sea:#9dc2d4;--sea2:#c4dce7;--land:#d9d2b4;--land2:#ece5cb;--wall:#8f7c50;--walldark:#6f6040;
 --rock:#bdb493;--rocklit:#d8d2b6;--grove:#95b487;--grovedark:#75996c;--street:#c6bda3;--roof:#c9b795;
 --roofdark:#a08e6d;--roofside:#b3a17f;--wave:#8fb4c4;--shade:#6f7d80;--shoal:#bcd8e0;--gone:#8b9aa1;
 --shell:#e3e7e0;--barbg:#e7ebe3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --page:#0d1520;--ink:#e9e1cd;--quiet:#94a3b2;--rule:#26364a;--tide:#5fb3aa;--haldi:#e0a93c;--fire:#e06a58;
 --mark:#16212f;--sea:#0b2033;--sea2:#123047;--land:#39432f;--land2:#4b553c;--wall:#9c8a5c;--walldark:#61553a;
 --rock:#5a6350;--rocklit:#79826a;--grove:#3f5a46;--grovedark:#2e4435;--street:#5a5340;--roof:#6b5f46;
 --roofdark:#413826;--roofside:#544936;--wave:#1d3d54;--shade:#050a10;--shoal:#16405a;--gone:#5d6c7a;
 --shell:#070c14;--barbg:#121d2b}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--shell);color:var(--ink);overflow:hidden;
 font-family:"Tiro Devanagari Hindi","Noto Serif Devanagari",serif;font-size:1.06rem;line-height:1.8}

/* ---- the shell: a bar on top, two panes below, each with its own scroll ---- */
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-height:100%;max-width:84rem;margin:0 auto;
 background:var(--page);box-shadow:0 0 0 1px var(--rule)}
#bar{flex:0 0 auto;display:flex;align-items:center;gap:.5rem;padding:.3rem .6rem;
 background:var(--barbg);border-bottom:1px solid var(--rule);min-height:2.6rem}
.brand{font-family:"Rozha One",serif;font-size:1.15rem;color:var(--haldi);white-space:nowrap}
.barmid{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:.5rem;justify-content:center}
.now{font-family:"Rozha One",serif;font-size:1rem;color:var(--ink);white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:.26rem;align-items:center;flex:0 0 auto}
.pip{width:.5rem;height:.5rem;border-radius:50%;background:var(--rule)}
.pip.past{background:var(--tide)}.pip.now{background:var(--haldi);box-shadow:0 0 0 3px rgba(154,106,9,.18)}
.tally{font-size:.82rem;color:var(--quiet);white-space:nowrap}
#board{flex:1 1 auto;min-height:0;display:grid;
 grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46%) minmax(0,1fr)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--page)}
#mapPane{border-bottom:1px solid var(--rule)}
.panehead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:.4rem;
 padding:.25rem .45rem;background:var(--barbg);border-bottom:1px solid var(--rule);overflow:hidden}
.headbtns{display:flex;gap:.3rem;align-items:center;flex-wrap:nowrap;overflow:hidden}
.chip{background:var(--page);border:1px solid var(--rule);border-radius:99px;padding:.16rem .7rem;
 font:inherit;font-size:.86rem;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--haldi)}
.chip.on{background:var(--tide);border-color:var(--tide);color:var(--page)}
.chip.sq{width:1.9rem;padding:0;text-align:center;font-size:1rem}
.fold{background:none;border:1px solid var(--rule);border-radius:99px;padding:.16rem .7rem;
 font:inherit;font-size:.86rem;color:var(--quiet);cursor:pointer;white-space:nowrap;flex:0 0 auto}
.fold:hover{color:var(--ink);border-color:var(--haldi)}
.fold b{font-weight:400;font-family:"Rozha One",serif;color:var(--haldi);font-size:.95rem}
#stage{position:relative;flex:1 1 auto;min-height:0;background:var(--sea);touch-action:none;overflow:hidden}
#map{display:block;width:100%;height:100%;cursor:grab}
#map.drag{cursor:grabbing}
.panebody{flex:1 1 auto;min-height:0;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
 padding:1rem 1.1rem 2rem;-webkit-overflow-scrolling:touch}
.panel[hidden]{display:none}

/* ---- folded panes keep their bar, so nothing disappears ---- */
#app.mapmin #board{grid-template-rows:auto minmax(0,1fr)}
#app.mapmin #stage{display:none}
#app.mapmin #mapPane .headbtns{display:none}
#app.sidemin #board{grid-template-rows:minmax(0,1fr) auto}
#app.sidemin .panebody{display:none}
#app.sidemin #sidePane .headbtns{display:none}
@media (min-width:900px){
 #board{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 #mapPane{border-bottom:none;border-right:1px solid var(--rule)}
 #app.mapmin #board{grid-template-columns:2.9rem minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 #app.mapmin #mapPane .panehead{writing-mode:vertical-rl;height:100%;justify-content:flex-start;
  padding:.6rem .25rem;border-bottom:none;border-right:1px solid var(--rule)}
 #app.sidemin #board{grid-template-columns:minmax(0,1fr) 2.9rem;grid-template-rows:minmax(0,1fr)}
 #app.sidemin #sidePane .panehead{writing-mode:vertical-rl;height:100%;justify-content:flex-start;
  padding:.6rem .25rem;border-bottom:none}
}

/* ---- things that sit on the map ---- */
/* ---- the journey strip under the map ---- */
.trail{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;gap:.35rem;align-items:center;
 padding:.35rem .5rem;overflow-x:auto;overflow-y:hidden;background:var(--barbg);
 border-top:1px solid var(--rule)}
.trail:empty{display:none}
.twatch{flex:0 0 auto;font-size:.74rem;color:var(--quiet);padding:0 .2rem;white-space:nowrap}
.tchip{flex:0 0 auto;display:flex;align-items:center;gap:.35rem;white-space:nowrap;cursor:pointer;
 background:var(--page);border:1px solid var(--rule);border-radius:99px;padding:.16rem .6rem;
 font:inherit;font-size:.82rem;color:var(--ink)}
.tchip:hover{border-color:var(--haldi)}
.tchip i{width:.5rem;height:.5rem;border-radius:50%;background:var(--rule);display:block}
.tchip.went i{background:var(--tide)}
.tchip.full i{background:#3f9d5a}
.tchip.now{border-color:var(--haldi);color:var(--haldi)}
.tmiss{flex:0 0 auto;font-size:.74rem;color:var(--quiet);white-space:nowrap;padding:0 .2rem;opacity:.8}
.mini{position:absolute;left:.5rem;top:.5rem;z-index:5;width:min(30%,7.6rem);
 background:var(--page);border:1px solid var(--rule);border-radius:.6rem;overflow:hidden;
 box-shadow:0 6px 18px rgba(0,0,0,.24)}
.mini.shut{width:auto}
.mini.shut #minimap{display:none}
#minimap{display:block;width:100%;height:auto;cursor:pointer;background:var(--sea)}
.minibar{display:flex;align-items:center;justify-content:space-between;gap:.4rem;
 padding:.1rem .45rem;border-top:1px solid var(--rule)}
.mini.shut .minibar{border-top:none}
.wx{font-size:.72rem;color:var(--quiet);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minix{background:none;border:none;font:inherit;font-size:.72rem;color:var(--tide);cursor:pointer;padding:0;white-space:nowrap}
.minix:hover{color:var(--haldi)}
#minimap .mland{fill:var(--land);stroke:var(--wall);stroke-width:.8}
#minimap .mshoal{fill:var(--shoal);opacity:.6}
#minimap .mcity{fill:none;stroke:var(--wall);stroke-width:1.4;opacity:.8}
#minimap .mdot{fill:var(--gone);opacity:.7}
#minimap .mdot.live{fill:var(--tide);opacity:1}
#minimap .mdot.done{fill:#3f9d5a;opacity:1}
#minimap .mdot.here{fill:var(--haldi)}
#minimap .mvp{fill:var(--haldi);fill-opacity:.12;stroke:var(--haldi);stroke-width:2.2;
 vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion:no-preference){
 #minimap .mdot.here{animation:hglow 3s ease-in-out infinite}
 @keyframes hglow{0%,100%{opacity:.7}50%{opacity:1}}
}
#wx .sky{pointer-events:none}
@media (prefers-reduced-motion:no-preference){
 .cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
 @keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(230px)}}
 .moon circle{animation:glow 6s ease-in-out infinite}
 @keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}
 .smoke ellipse{animation:rise 7s ease-in-out infinite}
 .smoke ellipse:nth-child(2){animation-delay:1.2s}
 .smoke ellipse:nth-child(3){animation-delay:2.4s}
 @keyframes rise{0%{transform:translateY(4px) scale(.85);opacity:.15}45%{opacity:.5}100%{transform:translateY(-14px) scale(1.25);opacity:0}}
 .wind path{stroke-dasharray:10 26;animation:gust 3.2s linear infinite}
 @keyframes gust{to{stroke-dashoffset:-36}}
 .mist ellipse{animation:sway 9s ease-in-out infinite}
 @keyframes sway{0%,100%{transform:translateX(-6px)}50%{transform:translateX(8px)}}
}
.sheet{position:absolute;left:.5rem;right:.5rem;bottom:3.1rem;background:var(--page);border:1px solid var(--rule);
 border-radius:.7rem;padding:.5rem .7rem;display:none;box-shadow:0 8px 22px rgba(0,0,0,.2);z-index:5}
.sheet.open{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sheet b{font-family:"Rozha One",serif;font-weight:400;font-size:1.05rem;display:block}
.sheet span{color:var(--quiet);font-size:.9rem;display:block;line-height:1.5}
.sheet .whyline{color:var(--fire)}
.go{display:inline-flex;align-items:center;background:var(--tide);color:var(--page);
 border:1px solid var(--tide);border-radius:99px;padding:.22rem .9rem;font:inherit;font-size:.9rem;
 line-height:1.6;cursor:pointer;white-space:nowrap;text-decoration:none}
.go:hover{background:var(--haldi);border-color:var(--haldi);color:var(--page)}
.go.ghost{background:none;border-color:var(--rule);color:var(--ink)}
.go.ghost:hover{background:none;border-color:var(--haldi);color:var(--haldi)}
.go[disabled],.go.shut{background:none;border-color:var(--rule);color:var(--quiet);cursor:not-allowed}
.go.shut:hover{background:none;border-color:var(--rule);color:var(--quiet)}
.panel h1{font-family:"Rozha One",serif;font-weight:400;font-size:2.4rem;color:var(--haldi);margin:.2rem 0 .3rem;line-height:1.15}
.panel h2{font-family:"Rozha One",serif;font-weight:400;font-size:1.45rem;margin:1.4rem 0 .3rem}
.panel p{margin:0 0 .9rem}
.quiet{color:var(--quiet);font-style:italic}
.gain{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin:.2rem 0 .9rem}
.gain b{font-weight:400;font-family:"Rozha One",serif;color:var(--page);background:var(--haldi);
 border-radius:99px;padding:.06rem .6rem;font-size:.92rem}
.gain span{border:1px solid var(--rule);border-radius:99px;padding:.06rem .6rem;
 font-size:.82rem;color:var(--quiet)}
.gain .gain-all{border-color:var(--haldi);color:var(--haldi)}
.scrollbtn{background:none;border:1px solid var(--haldi);border-radius:99px;color:var(--haldi);
 padding:.1rem .8rem;font:inherit;font-size:.84rem;cursor:pointer;white-space:nowrap;margin-right:.4rem}
.scrollbtn:hover{background:var(--haldi);color:var(--page)}
@media print{
 body>*{display:none!important}
 body.printing #scroll{display:block!important;position:static;padding:0}
 body.printing #scroll .pcard-back,body.printing #scroll .pcard-btns{display:none!important}
 body.printing #scroll .pcard-box{box-shadow:none;border:none;max-height:none;width:auto}
 body.printing #weave{overflow:visible;color:#000}
 body.printing #weave h2,body.printing #weave .w-where{color:#000}
}
.weave{font-size:1.06rem;line-height:1.95}
.weave h2{font-family:"Rozha One",serif;font-weight:400;font-size:1.5rem;color:var(--haldi);
 margin:1.4rem 0 .5rem;text-align:center}
.weave h2:first-child{margin-top:.2rem}
.weave p{margin:0 0 1rem;text-align:justify}
.weave i{color:var(--quiet);font-style:italic}
.w-where{font-family:"Rozha One",serif;color:var(--haldi);font-size:1.02rem;margin:1rem 0 .2rem;
 text-align:left;opacity:.95}
.w-turn{text-align:center;color:var(--haldi);font-family:"Rozha One",serif;margin:1.2rem 0 .8rem}
.w-also{display:block;margin-top:.4rem;padding-left:.8rem;border-left:2px solid var(--rule)}
.w-card{display:block;margin-top:.4rem;padding-left:.8rem;border-left:2px solid var(--haldi)}
.w-src{color:var(--quiet);font-size:.84rem;margin:.2rem 0 .6rem}
.w-refs{font-size:.82rem;color:var(--quiet);text-align:left}
.lamp{background:var(--haldi);color:var(--page);border:none;border-radius:99px;
 padding:.1rem .7rem;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap;margin-right:.4rem}
.lamp[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){
 .lamp{animation:lampglow 2.2s ease-in-out infinite}
 @keyframes lampglow{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,.5)}50%{box-shadow:0 0 0 7px rgba(212,160,23,0)}}
}
.claim{background:var(--haldi);color:var(--page);border:none;border-radius:99px;padding:.1rem .7rem;
 font:inherit;font-size:.8rem;cursor:pointer;white-space:nowrap;margin-top:.3rem}
.pcell.ready{opacity:1;border-color:var(--haldi);background:rgba(212,160,23,.1)}
.mypad{margin:0 0 .3rem;font-size:1.05rem}
.mypad b{font-weight:400;font-family:"Rozha One",serif;font-size:1.35rem;color:var(--haldi)}
.pgroup{margin:.7rem 0 .2rem;font-size:.86rem;color:var(--quiet)}
.myname{font-family:"Rozha One",serif;color:var(--ink);margin-right:.5rem}
.tinybar{display:inline-block;width:4.5rem;height:7px;background:var(--rule);border-radius:99px;
 overflow:hidden;vertical-align:middle;margin-right:.5rem}
.tinybar i{display:block;height:100%;background:var(--tide)}
.giftrow{display:flex;flex-direction:column;gap:.5rem;margin:.4rem 0 .8rem}
.coin{border:1px solid var(--haldi);border-radius:99px;padding:.02rem .5rem;color:var(--haldi);margin-right:.4rem}
.pick.buy{border-color:var(--haldi);color:var(--haldi)}
.chose{color:var(--tide)}
.about{border:1px dashed var(--rule);border-radius:.7rem;margin:.3rem 0 .8rem;overflow:hidden}
.aboutlid{display:flex;align-items:center;justify-content:space-between;gap:.5rem;width:100%;
 background:none;border:none;font:inherit;cursor:pointer;padding:.4rem .7rem;text-align:left}
.aboutlid b{font-weight:400;font-size:.92rem;color:var(--quiet)}
.abouttag{font-size:.78rem;border:1px solid var(--rule);border-radius:99px;padding:.04rem .55rem;color:var(--quiet)}
.aboutlid:hover b,.aboutlid:hover .abouttag{color:var(--haldi);border-color:var(--haldi)}
.aboutbody{padding:0 .8rem .5rem;color:var(--quiet);font-size:.94rem}
.aboutbody p{margin:0 0 .5rem;line-height:1.75}
.about.shut .aboutbody{display:none}
.elsew{border:1px dashed var(--rule);border-radius:.7rem;margin:.5rem 0 .8rem;overflow:hidden}
.elsewlid{display:flex;align-items:center;justify-content:space-between;gap:.5rem;width:100%;
 background:none;border:none;font:inherit;cursor:pointer;padding:.45rem .7rem;text-align:left}
.elsewlid b{font-weight:400;font-family:"Rozha One",serif;font-size:1rem;color:var(--quiet)}
.elsewtag{font-size:.78rem;border:1px solid var(--rule);border-radius:99px;padding:.04rem .55rem;color:var(--quiet)}
.elsewlid:hover b,.elsewlid:hover .elsewtag{color:var(--haldi);border-color:var(--haldi)}
.elsewbody{padding:0 .8rem .6rem}
.elsewbody p{margin:0 0 .5rem;line-height:1.75}
.elsewbody b{font-weight:400;color:var(--tide)}
.elsew.shut .elsewbody{display:none}
.thread{margin:.2rem 0 .6rem;padding-left:.8rem;border-left:3px solid var(--tide);color:var(--ink)}
.thread b{font-weight:400;color:var(--tide)}
/* ---- a find, wrapped ---- */
.gift{border:1px solid var(--haldi);border-radius:.8rem;overflow:hidden;margin:.6rem 0 .9rem;
 background:var(--mark)}
.gift.g-man{border-color:var(--fire)}
.gift.g-gr{border-color:var(--tide)}
.giftlid{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;cursor:pointer;
 background:none;border:none;font:inherit;padding:.6rem .7rem;position:relative;overflow:hidden}
.giftlid b{flex:1 1 auto;min-width:0;font-weight:400;font-family:"Rozha One",serif;font-size:1.08rem;color:var(--haldi)}
.gift.g-man .giftlid b{color:var(--fire)}
.gift.g-gr .giftlid b{color:var(--tide)}
.gifttag{flex:0 0 auto;font-size:.74rem;border:1px solid var(--rule);border-radius:99px;
 padding:.04rem .55rem;color:var(--quiet)}
.giftact{flex:0 0 auto;font-size:.8rem;border:1px solid var(--rule);border-radius:99px;
 padding:.06rem .6rem;color:var(--quiet)}
.giftlid:hover .giftact{border-color:var(--haldi);color:var(--haldi)}
.giftbody{padding:0 .8rem .7rem;line-height:1.8}
.giftbody b{display:block;font-weight:400;font-family:"Rozha One",serif;font-size:1.05rem;
 color:var(--ink);margin:.1rem 0 .3rem}
.giftbody p{margin:0 0 .4rem}
.gift.shut .giftbody{display:none}
@media (prefers-reduced-motion:no-preference){
 .gift.shut{animation:giftbob 2.6s ease-in-out infinite}
 @keyframes giftbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
 .gift.shut .giftlid::after{content:"";position:absolute;top:0;bottom:0;width:40%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.18),rgba(255,255,255,0));
  animation:giftshine 2.6s linear infinite}
 @keyframes giftshine{0%{left:-45%}100%{left:105%}}
 .gift.just .giftbody{animation:giftopen .45s ease-out 1}
 @keyframes giftopen{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
}
.fbox{border:1px solid var(--haldi);border-left-width:4px;border-radius:.7rem;
 padding:.6rem .8rem;margin:.6rem 0 .9rem;background:var(--mark)}
.fbox b{display:block;font-weight:400;font-family:"Rozha One",serif;font-size:1.1rem;
 color:var(--haldi);margin-bottom:.3rem}
.fbox p{margin:0 0 .4rem;line-height:1.8}
.mool{margin:.5rem 0;padding:.5rem .7rem;border-left:3px solid var(--tide);background:var(--page);
 border-radius:.4rem}
.mool-line{display:block;font-size:1.02rem;line-height:1.9;color:var(--ink)}
.mool-arth{display:block;font-size:.86rem;color:var(--quiet);margin-top:.25rem}
.giftwhere{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:.6rem;
 padding-top:.5rem;border-top:1px solid var(--rule)}
.giftwhere span{font-size:.82rem;color:var(--quiet)}
.tucked{margin:.2rem 0 .6rem;font-size:.86rem;color:var(--quiet)}
.fsrc{display:block;font-size:.82rem;color:var(--quiet)}
.found{border-left:3px solid var(--haldi);background:var(--mark);padding:.45rem .8rem;margin:0 0 .9rem;border-radius:0 5px 5px 0}
.found b{font-weight:400;font-family:"Rozha One",serif}
.gift{border-left-color:var(--fire)}
/* ---- the story as a stack of cards ---- */
.step{border:1px solid var(--rule);border-radius:.9rem;padding:.2rem .9rem .9rem;margin:0 0 .8rem;
 background:var(--page)}
.step:last-child{border-color:var(--haldi)}
.stephead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:.6rem;
 background:none;border:none;font:inherit;color:var(--quiet);cursor:pointer;padding:.55rem 0;text-align:left}
.stephead b{font-weight:400;font-family:"Rozha One",serif;font-size:1rem;color:var(--haldi)}
.stephead .steptag{font-size:.8rem;border:1px solid var(--rule);border-radius:99px;padding:.06rem .6rem}
.step.shut{padding:0 .9rem;background:var(--mark)}
.step.shut .stepbody{display:none}
.stephead:hover .steptag{border-color:var(--haldi);color:var(--haldi)}
.ask{margin:.8rem 0 .4rem;font-family:"Rozha One",serif;font-size:1.15rem;color:var(--haldi)}
.fork{display:flex;flex-direction:column;gap:.5rem;margin:.2rem 0 .6rem}
/* ---- a place you can tap ---- */
.card-pick{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;cursor:pointer;
 background:var(--mark);border:1px solid var(--rule);border-radius:.8rem;padding:.6rem .7rem;font:inherit;
 min-height:3.4rem;transition:border-color .15s,transform .1s}
.card-pick:hover{border-color:var(--haldi)}

 adhy:{lore:"दर्शन की तरफ़ झुकी हुई कथा, जो शिव पार्वती के संवाद के रूप में चलती है। यहाँ राम ब्रह्म हैं और सीता माया, इसलिए द्वार पर रोकने वाली भी पहले से जानती है कि जनक के घर जन्मी योगमाया हैं। इसका सुंदरकांड पाँच सर्गों का है।",n:"अध्यात्म रामायण",level:"pal",who:"ब्रह्मांड पुराण के उत्तर भाग में; परंपरा इसे रामानंद से भी जोड़ती है",lang:"संस्कृत",when:"तेरहवीं से पंद्रहवीं सदी; सुंदरकांड पाँच सर्गों का, शिव और पार्वती के संवाद में",

 kamba:{lore:"तमिल की सबसे बड़ी रामकथा, जिसे कंबन ने रचा। इसमें हर हिस्से का अपना अध्याय है, जैसे नगर ढूँढने का अध्याय और लौटकर चरणों में सिर रखने का अध्याय। कंबन ब्योरे में नहीं, दृश्य में जाते हैं, इसलिए उनकी लंका देखी हुई लगती है।",n:"कंब रामायण",level:"pal",who:"कंबन",lang:"तमिल",when:"सुंदरकांडम् में 14 पडलम्",

 jain:{lore:"सबसे पुरानी जैन रामकथा, प्राकृत में। यहाँ लंका के लोग राक्षस नहीं, विद्याधर हैं, और हनुमान भी वानर नहीं, विद्याधर वीर हैं। उड़ना जादू नहीं, विद्या है। सबसे बड़ा फ़र्क़ यह कि यहाँ पूँछ में आग लगने की बात ही नहीं आती।",n:"पउमचरिय",level:"pal",u:"https://archive.org/details/cWFP_paumacariyam-of-acharya-vimala-suri-with-hindi-trans.-part-2-editor-dr.-h.-jacob",un:"प्राकृत मूल, हिंदी अनुवाद सहित (भाग 2, प्राकृत टेक्स्ट सोसाइटी)",who:"विमलसूरि",lang:"प्राकृत, जैन परंपरा",when:"सबसे पुरानी जैन रामकथा; अध्ययन इसे चौथी सदी के आसपास रखते हैं",

 gaakar:{t:"सीधे बात नहीं, कथा सुनाई",l:"chh",x:"वे सीधे सामने नहीं आते। डाल पर बैठकर, धीमी और मीठी आवाज़ में, वे राम की पूरी कहानी सुनाने लगते हैं: दशरथ नाम का एक राजा था, फिर वन, फिर हरण, फिर सुग्रीव, और आख़िर में यह कि एक दूत ढूँढता हुआ लंका पहुँचा। सीता वह सुनती हैं, और उसी में उन्हें भरोसा मिलता है। फिर वे ऊपर देखती हैं और पेड़ पर बैठा वानर दिखता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 31"},
 ravan_dekhna:{t:"दुश्मन को देखकर पहला ख़याल",l:"man",x:"दरबार में बँधे हुए खड़े होकर वे पहली बार रावण को सामने से देखते हैं, और जो सोचते हैं वह चौंकाने वाला है: कितना तेज है, कितना रूप, कितनी धीरता। अगर यह अधर्म पर न टिका होता तो देवताओं का राज भी सँभाल सकता था। दुश्मन की बड़ाई मान लेना कमज़ोरी नहीं, नाप लेना है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 49"},
 dut_bhashan:{t:"बँधे हुए का भाषण",l:"chh",x:"पूछे जाने पर वे साफ़ कहते हैं कि मैं वानरों के राजा सुग्रीव का दूत हूँ और राम का संदेश लाया हूँ। फिर वे सलाह देते हैं, माँगते नहीं: सीता को लौटा दो, वरना जो जनस्थान में हुआ वही यहाँ होगा, और उस वक़्त तुम्हें कोई नहीं बचा सकेगा। बँधा हुआ दूत दरबार को सलाह दे रहा है, और यही इस पूरे हिस्से की सबसे बड़ी बात है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 50 और 51"},
 pahli_awaaz:{t:"लौटते ही पहली आवाज़",l:"chh",x:"उस पार उतरते ही वे इतनी ज़ोर से गरजते हैं कि पहाड़ हिल जाता है। यह ख़बर देने से पहले की ख़बर है: इंतज़ार करते वानर उसी आवाज़ से समझ जाते हैं कि काम हो गया। वे कूदते हैं, चिल्लाते हैं, और पेड़ों की डालें हिलाने लगते हैं। शब्द बाद में आते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 57"},
 peshkash:{t:"रावण की पेशकश",l:"chh",x:"धमकी से पहले वह मनाने की कोशिश करता है। वह कहता है कि मेरी सारी रानियों के ऊपर तुम्हारी जगह होगी, सारा धन तुम्हारा होगा, बस मान जाओ। उसी बातचीत में वह अपनी ताक़त भी गिनाता है। सीता बीच में एक तिनका रखकर जवाब देती हैं, यानी सीधे उसकी तरफ़ देखे बिना। मनाना पूरा होते ही अवधि और धमकी शुरू होती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 20 से 22"},
 bada_roop:{t:"ले चलने के लिए बड़ा होना",l:"chh",x:"जब वे कहते हैं कि मैं आपको पीठ पर बैठाकर ले चल सकता हूँ, तब सीता को यक़ीन नहीं होता कि इतना सा जीव यह कर पाएगा। तब वे उनके सामने अपना बड़ा रूप कर लेते हैं, पहाड़ जितना। रूप दिखाना यहाँ डराने के लिए नहीं, भरोसा दिलाने के लिए है। फिर भी सीता मना कर देती हैं, और इसी से पता चलता है कि उनका मना करना ताक़त पर शक नहीं था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 37"},
 shakun:{t:"बाईं आँख का फड़कना",l:"man",x:"तानों के बाद वे सबसे नीचे थीं, और आस टूटने के क़रीब। तभी शरीर ने अपने आप कुछ कहा: बाईं आँख फड़की, फिर बायाँ कंधा, फिर बाईं जाँघ। पुरानी मान्यता में स्त्री के लिए बाईं तरफ़ का फड़कना शुभ माना जाता है। कवि कहते हैं कि वे ऐसे खिल उठीं जैसे सूखा पौधा देर से आई बारिश में। जो बात हनुमान अभी कहने वाले थे, उसकी ख़बर उन्हें शरीर से पहले ही मिल गई।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 29"},
 sita_jawab:{t:"सीता का जवाब",l:"chh",x:"रावण के सामने वे झुकती नहीं। वे साफ़ कहती हैं कि तेरे जीने का एक ही रास्ता है, मुझे लौटा दे। और यह भी कि जो अपनी ताक़त पर भरोसा करता है वह चुराकर नहीं लाता। यही जवाब सुनकर वह अवधि देता है और राक्षसियों को डराने का काम सौंपता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 21 और 22"},
 sandeh:{t:"कहीं यह रावण ही तो नहीं",l:"man",x:"पहली बात सुनकर भी उन्हें भरोसा नहीं होता। वे सोचती हैं कि रावण एक बार साधु का वेश धरकर आ चुका है, तो यह वानर भी वही हो सकता है। वे कहती हैं कि अगर तू वही है और फिर से छल कर रहा है, तो मेरा दुख और बढ़ा रहा है। संदेह मूर्खता नहीं थी, पहले का अनुभव था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 33 और 34"},
 parichay:{t:"अपना परिचय देकर भरोसा जीतना",l:"chh",x:"भरोसा जीतने के लिए हनुमान अपनी ही कहानी सुनाते हैं: किसका बेटा हूँ, किसके यहाँ रहता हूँ, राम से कैसे मिला, और सुग्रीव से क्या तय हुआ। फिर वे राम और लक्ष्मण का हुलिया एक एक करके बताते हैं। हथियार से नहीं, ब्योरे से भरोसा बनता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 35"},
 vidai:{t:"विदाई के शब्द",l:"man",x:"आख़िर में वे विदा करती हैं, पर एक शर्त के साथ: जल्दी करना। वे कहती हैं कि राम से कहना कि एक महीने के भीतर आ जाएँ, उसके बाद वे मुझे जीवित नहीं पाएँगे। यही वाक्य आगे पूरी लड़ाई की रफ़्तार तय करता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 39 और 40"},
 kinkar_80:{t:"अस्सी हज़ार और एक लोहे का डंडा",l:"chh",x:"पहली टोली का नाम किंकर था, और गिनती अस्सी हज़ार। वाल्मीकि कहते हैं कि वे बड़े पेट और लंबे दाँतों वाले थे। हनुमान ने कोई हथियार साथ नहीं रखा था, इसलिए उन्होंने फाटक के मेहराब से ही एक लोहे का डंडा उखाड़ लिया और उसी से सब निपटा दिया। लड़ाई के बाद वे फिर उसी मेहराब पर जा बैठे, और यही इस पूरे हिस्से का ढंग है: मारना, फिर लौटकर वहीं बैठ जाना।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 42"},
 jambumali:{t:"जंबुमाली, पहला नाम वाला योद्धा",l:"chh",x:"किंकरों के बाद रावण ने अपने प्रधान मंत्री प्रहस्त के बेटे जंबुमाली को भेजा। वह पहला है जिसका नाम लेकर भेजा गया। उसने बाणों से मारा, हनुमान ने चट्टान फेंकी, उसने बाणों से उसे तोड़ दिया। फिर साल का पेड़ फेंका गया, वह भी टूटा। आख़िर में वही लोहे का डंडा काम आया।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 44"},
 saat_bete:{t:"मंत्री के सात बेटे",l:"chh",x:"इसके बाद रावण ने अपने प्रधान मंत्री के सातों बेटों को भेजा। वे बड़ी सेना लेकर आए और आसमान बाणों से भर दिया। इस बार हनुमान ने कोई हथियार नहीं उठाया, सिर्फ़ हथेली, मुट्ठी, नाखून और जाँघों से काम लिया। कथा यह गिनकर बताती है, ताकि अगली बार भेजे जाने वाले का दर्जा समझ आए।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 45"},
 paanch_senapati:{t:"पाँच सेनापतियों के नाम",l:"chh",x:"फिर पाँच सेनापति भेजे गए: विरूपाक्ष, यूपाक्ष, दुर्धर, प्रघस और भासकर्ण। भेजते वक़्त रावण ख़ुद कहता है कि यह शायद आम वानर नहीं, इंद्र का भेजा कोई और ही जीव है। पहले दुर्धर गिरा, फिर साल के पेड़ से विरूपाक्ष और यूपाक्ष, और आख़िर में पहाड़ की चोटी उखाड़कर प्रघस और भासकर्ण। उसके बाद ही अक्षकुमार की बारी आती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 46"},
 v_taali:{t:"एक ताली से बिखरी सेना",l:"chh",x:"पाताल के उस रावण के हज़ार सिर हैं, और उसे मारने का कोई सीधा रास्ता कथा में नहीं मिलता। मैदान में लड़ाई हुई ही नहीं, उसने बस ताली बजाई और पूरी सेना उड़ गई। राम भी दूर जाकर गिरे और बेहोश हो गए। लंका वाली रात में हर लड़ाई में कोई न कोई सामने था, यहाँ सामने कुछ भी नहीं है, सिर्फ़ एक आवाज़ है।",s:"sarala",p:1,ref:"विलंका रामायण, पूर्व खंड"},
 v_maya:{t:"माया का रूप धरकर निगलना",l:"chh",x:"सुरेखा सामने आकर लड़ती नहीं, माया का रूप धरकर पहले भरोसा जीतती है और फिर निगल लेती है। यह सुरसा वाले पल का उलटा है: वहाँ मुँह में घुसना परीक्षा थी, यहाँ धोखा है। भीतर अँधेरे में भी हनुमान वही करते हैं जो लंका में किया था, छोटे होते हैं और रास्ता ढूँढ लेते हैं।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 9"},
 v_kambu_card:{t:"ब्राह्मण के वेश में आया असुर",l:"chh",x:"कम्बु नाम का असुर भीख माँगने के बहाने पास आता है और मौक़ा देखकर राम को ही उठा ले जाता है। यह वही चाल है जो हरण के वक़्त चली गई थी, साधु का वेश धरकर, और कथा इसे दोहराकर याद दिलाती है कि छल हर बार वेश बदलकर आता है। छुड़ाने के बाद उसी रात विलंका जलती है।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 10, पृष्ठ 34"},
 v_lana:{t:"इस बार लोगों को पहुँचाना",l:"man",x:"पहली रात में हनुमान का काम ख़बर पहुँचाना था। यहाँ काम उलटा है: उन्हें लोगों को पहुँचाना है। देवताओं के कहने पर वे सीता और लक्ष्मण को पाताल तक लाते हैं, और यही इस पूरी कथा का सबसे बड़ा मोड़ है, क्योंकि इसके बाद अंत उनके हाथ नहीं रहता।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 17 और 18, पृष्ठ 68 और 76"},
 v_phool:{t:"लोहे का नहीं, फूलों का धनुष",l:"chh",x:"देवी मंगला जो धनुष देती हैं वह लोहे का नहीं, फूलों का है। देखने में वह खिलौना लगता है, और यही इस कथा की सबसे बड़ी बात है: जिस चीज़ को कोई हथियार मानता ही नहीं, वही अंत करती है। धनुष हाथ में आते ही मैदान चुप हो जाता है।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 20"},
 v_kshama:{t:"मरते हुए क्षमा माँगना",l:"man",x:"फूल का बाण छूटते ही उसका मन डोल जाता है और वहीं उसका अंत हो जाता है। पर कथा यहीं नहीं रुकती: मरते हुए वही असुर सीता से क्षमा माँगता है। लंका वाली रात में रावण आख़िर तक अकड़ा रहता है, और यही इन दोनों रातों का सबसे साफ़ फ़र्क़ है।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 20"},
 v_khal:{t:"दो जो भेजे गए थे",l:"chh",x:"यह पूरी कथा एक चाल से शुरू होती है। देवता चाहते थे कि पाताल का रावण भी मारा जाए, इसलिए ब्रह्मा ने दो को भेजा, खल और दुर्बल। खल सीता के कंठ में बैठा और दुर्बल राम के। उसी के असर में राम कह बैठे कि रावण मैंने अकेले मारा, और सीता ने कहा कि असल कारण मैं थी। फिर उन्हीं ने ललकारा कि जाओ, विलंका के रावण को मारकर दिखाओ। यानी लड़ाई बाहर से नहीं, एक बात से शुरू हुई।",s:"sarala",p:1,ref:"विलंका रामायण, पूर्व खंड, अध्याय 1 और 2"},
 v_chhah:{t:"छह महीने पड़े रहना",l:"chh",x:"फाटक पर हार जाने के बाद वे छह महीने वहीं पड़े रहते हैं। यह इस कथा का सबसे अलग हिस्सा है, क्योंकि बाकी कथाओं में हनुमान कभी इतनी देर रुके हुए नहीं दिखते। उठाने भी कोई अपना नहीं आता, देवता आते हैं। जो रात लंका में एक ही रात थी, वह यहाँ महीनों में फैल जाती है।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 3, पृष्ठ 12"},
 v_maafi:{t:"अंत में क्षमा",l:"man",x:"इस कथा का अंत मारने पर नहीं रुकता। मरते हुए वही असुर सीता से क्षमा माँगता है। लंका वाली रात में रावण आख़िर तक अकड़ा रहता है, यहाँ वही अकड़ आख़िरी पल में टूट जाती है। ओड़िया परंपरा इसी मोड़ के लिए याद की जाती है।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 20"},
 w_badal:{t:"बादलों के बीच से",l:"chh",x:"उड़ते हनुमान के साथ रंग बिरंगे बादल चिपकते और छूटते रहे। बीच बीच में वे बादलों में छिप जाते और फिर बाहर निकल आते थे।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 w_hawa:{t:"अकेली दिखती उड़ान",l:"chh",x:"उस उड़ान में सूरज ने उन्हें तपाया नहीं और हवा ठंडी होकर साथ चली। कारण कथा ख़ुद बताती है: हवा के देवता उनके पिता हैं, और बेटे के इस काम में वे पीछे नहीं रहते। रास्ते में देवता और गंधर्व फूल बरसाते हैं। यानी यह अकेली उड़ान दिखती है, पर अकेली है नहीं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 w_chand:{t:"उस रात का चाँद",l:"chh",x:"लंका में घुसने का वक़्त चाँद की रोशनी से तय हुआ। रात की चाँदनी में सोने के महल और सोया नगर दोनों साफ़ दिखते थे।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2 और 5"},
 w_bhor:{t:"भोर से पहले की हवा",l:"chh",x:"रात का आख़िरी हिस्सा सबसे ठंडा और सबसे चुप होता है। बात इसी वक़्त हुई, और उजाला होने से पहले ख़त्म भी हो गई।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 29 और 30"},
 w_dhuan:{t:"ऊपर से दिखती जलती लंका",l:"chh",x:"जलती लंका का वर्णन ऊपर से है, इसलिए पहले चमक दिखती है, फिर धुआँ, और फिर नीचे भागते लोग। कथा कहती है कि छतों से गिरते हुए स्त्रियाँ और बच्चे चिल्ला रहे थे, और कुछ राक्षस कह रहे थे कि यह वानर नहीं, ब्रह्मा और देवताओं के शाप का नतीजा है। सोने का नगर उसी रात धुएँ का हो गया।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 54"},
 mainak:{t:"मैनाक का पुराना क़र्ज़",l:"chh",x:"मैनाक समुद्र में यों ही नहीं बैठा था। इंद्र ने उसे पाताल के मुँह पर ढक्कन की तरह रखा था, ताकि नीचे के असुर ऊपर न आ सकें। और वह पानी के भीतर इसलिए था कि कृतयुग में पहाड़ों के पंख होते थे, इंद्र ने वज्र से सबके काट दिए, पर पवन ने मैनाक को पंख समेत उठाकर समुद्र में छिपा दिया। इसीलिए वह आज पवन के बेटे का क़र्ज़ मानता है। हनुमान ने उसे पहले रुकावट समझकर छाती से गिराया, फिर वह आदमी का रूप लेकर सामने आया। हनुमान ने विश्राम से मना कर दिया, यह कहकर कि दिन ढल रहा है और वचन दिया जा चुका है, बस हाथ से छूकर आगे उड़ गए। बाद में इंद्र ने ख़ुश होकर मैनाक को अभय दे दिया।",s:"vr",ref:"सुंदरकांड, सर्ग 1"},
 surasa:{t:"वरदान तोड़े बिना निकलना",l:"chh",x:"सुरसा नागों की माता हैं, और दक्ष की बेटी भी, यह ख़ुद हनुमान उन्हें संबोधित करते हुए कहते हैं। उन्हें देवताओं ने भेजा था, दुश्मन बनाकर नहीं, परीक्षा के लिए। ब्रह्मा का वरदान उनके पास था कि कोई भी उनके मुँह में घुसे बिना आगे नहीं जा सकता। हनुमान बड़े होते गए, वे मुँह उतना ही बड़ा करती गईं, नब्बे योजन तक। तब हनुमान अंगूठे जितने छोटे होकर मुँह में गए और बाहर आ गए। न वरदान टूटा, न लड़ाई हुई। यही इस पूरी उड़ान का ढंग है: जीतना नहीं, निकल जाना।",s:"vr",ref:"सुंदरकांड, सर्ग 1"},
 simhika:{t:"सुग्रीव की बताई हुई बात",l:"chh",x:"सिंहिका परछाईं पकड़कर उड़ते जीवों को नीचे खींच लेती थी। हनुमान को पहले लगा कि वे उलटी हवा में फँसी नाव की तरह पीछे खिंच रहे हैं। फिर नीचे देखकर वे तुरंत पहचान गए, क्योंकि चलने से पहले सुग्रीव ने इसी जीव के बारे में बता रखा था। इसीलिए यहाँ घबराहट नहीं होती। वे उसके मुँह में घुसकर भीतर से चीरते हैं और निकल आते हैं। आसमान में खड़े लोग तब चार बातें गिनाते हैं जो इस काम के लिए चाहिए: साहस, नज़र, बुद्धि और कौशल।",s:"vr",ref:"सुंदरकांड, सर्ग 1"},
 chhaya:{t:"दस और तीस योजन",l:"chh",x:"उड़ते हनुमान की परछाईं पानी पर दस योजन चौड़ी और तीस योजन लंबी थी, सफ़ेद बादलों की कतार जैसी। वही परछाईं आगे चलकर काम बिगाड़ती है, क्योंकि सिंहिका शरीर नहीं, यही परछाईं पकड़ती है। कवि पहले उसे सुंदर बताता है, फिर उसी को ख़तरा बना देता है।",s:"vr",ref:"सुंदरकांड, सर्ग 1"},
 chhota:{t:"जब जो रूप ज़रूरी हो",l:"chh",x:"आकार का यह चुनाव पूरी रात का सबसे बड़ा फ़ैसला है। बड़े रूप में पूरी सेना से लड़ना पड़ता, और तब खोज कभी पूरी न होती। इसीलिए वे साँझ का इंतज़ार करते हैं और बिल्ली जितने छोटे होकर भीतर जाते हैं। यही वानर आगे उसी रात नब्बे योजन तक बड़े भी होते हैं। जब जो ज़रूरी हो, वही रूप, यही उनका ढंग है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2"},
 intzaar:{t:"उस पार का इंतज़ार",l:"man",x:"समुद्र के इस पार वानर बैठे हैं। न ख़बर है, न खाना, बस लौटने का डर। यही इंतज़ार सुंदरकांड के आख़िरी हिस्से तक चलता है, जब तक लौटकर ख़बर नहीं आ जाती।",s:"vr",p:1,ref:"वाल्मीकि रामायण, किष्किंधा कांड का अंत और सुंदरकांड, सर्ग 57 से 59"},
 lankini:{t:"वह पहरेदार नहीं, नगर ही है",l:"chh",sl:"अहं तु नगरी लङ्का स्वयमेव प्लवङ्गम",slm:"हे वानर, मैं ख़ुद ही लंका नगरी हूँ।",x:"गिरने के बाद वह जो कहती है, वही इस रात की सबसे बड़ी बात है: मैं कोई पहरेदार नहीं, मैं ख़ुद लंका नगरी हूँ। ब्रह्मा ने उसे बहुत पहले कहा था कि जिस दिन कोई वानर तुझे अपने बल से वश में कर ले, उसी दिन से राक्षसों का डर शुरू समझना। वह ख़ुद कहती है कि वह दिन आज तेरे दिखते ही आ गया, और ब्रह्मा की कही बात टलती नहीं। फिर वही उसे भीतर जाने देती है और कहती है कि इस शापग्रस्त नगरी में जहाँ चाहे घूम।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 3"},
 nagar:{t:"बीच नगर में किसी और का विमान",l:"chh",x:"बीच नगर में जो उड़ने वाला विमान खड़ा है, वह रावण का बनाया हुआ नहीं है। पुष्पक पहले कुबेर के पास था, और रावण उसे लड़ाई में छीनकर लाया था। वाल्मीकि उसे सोने की जालीदार खिड़कियों और रत्न जड़े खंभों वाला बताते हैं। यानी जिस नगर में हनुमान घूम रहे हैं, उसकी सबसे सुंदर चीज़ भी किसी और से ली हुई है।",s:"vr",p:1,ref:"पुष्पक का वर्णन: सुंदरकांड, सर्ग 7 और 8; कुबेर से छीनने की बात: किष्किंधाकांड, सर्ग 43 तथा उत्तरकांड"},
 sita_raat:{t:"पहचान कैसे हुई",l:"man",x:"पहचान कपड़ों या गहनों से नहीं होती। वाल्मीकि लिखते हैं कि वे एक ही वस्त्र में हैं, वह भी मैला, बाल बिखरे हुए, और वे ज़मीन पर बैठी हैं, पेड़ के नीचे। हनुमान उन्हें उस चीज़ से पहचानते हैं जो उन्हें पहले बताई गई थी: जो गहने वे गिराती गई थीं, उनमें से बचे हुए अब भी उन्हीं पर हैं। दुबली, चुप, और दिन गिनती हुई।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 15 और 17; गिराए हुए गहनों वाली बात: किष्किंधाकांड, सर्ग 6"},
 mandodari:{t:"ठिठकना और फिर आगे बढ़ना",l:"chh",x:"जिसे देखकर वे ठिठके, वह मंदोदरी थी, मय दानव की बेटी और लंका की बड़ी रानी। ख़ुद को टोकते हुए वे जो तर्क देते हैं, वही याद रखने लायक है: जो अपने पति से बिछड़ी हो, वह न सोती है, न सिंगार करती है, न खाती पीती है, और न किसी और को देखती है, चाहे वह देवताओं का राजा ही क्यों न हो। इसी तर्क से वे आगे बढ़ जाते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 10"},
 pangrih:{t:"नशे का घर",l:"chh",x:"इसी सर्ग में एक बात और आती है जो कम पढ़ी जाती है। सोई हुई स्त्रियों को देखकर हनुमान ख़ुद से पूछते हैं कि कहीं यह देखना पाप तो नहीं, और फिर ख़ुद ही जवाब देते हैं कि मन डोला ही नहीं, इसलिए दोष नहीं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 11"},
 kuber_shaap:{t:"लंका पहले किसकी थी",l:"chh",x:"यह नगरी हमेशा से रावण की नहीं थी। पहले यहाँ कुबेर का राज था। रावण ने उसे हराकर लंका छीन ली, और उसी के साथ एक शाप भी मिला। विभीषण उस वक़्त कुबेर के साथ चला गया था, क्योंकि उसने वरदान में बल नहीं, धर्म पर टिके रहना माँगा था। इसीलिए द्वार पर रोकने वाली भी लंका को शापग्रस्त नगरी कहती है, और इसीलिए इस नगर में एक घर बाकी सबसे अलग दिखता है।",s:"mbh",p:1,ref:"महाभारत, वनपर्व का रामोपाख्यान: कुबेर से लंका छीनना, शाप, और विभीषण का वरदान; शापग्रस्त नगरी वाली बात वाल्मीकि सुंदरकांड, सर्ग 3"},
 vibhishan:{t:"तुलसी से हुई पहचान",l:"gr",x:"मानस में पहचान की निशानी हथियार या पहरा नहीं, तुलसी का पौधा और राम का नाम है। उसी से हनुमान समझ जाते हैं कि इस नगर में एक घर अलग है। वाल्मीकि में यह प्रसंग इस रूप में नहीं आता, वहाँ विभीषण दरबार में सामने आते हैं। तुलसीदास ने भक्त को भक्त से मिलवाया।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड, दोहा 5 और उसके बाद का संवाद"},
 nirasha:{t:"हार का मन",l:"man",x:"पूरी लंका छानने के बाद भी सीता नहीं मिलीं। हनुमान का मन बैठ गया, फिर उन्होंने सोचा कि निराशा से बड़ा कोई दुश्मन नहीं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 12 और 13"},
 angad_tanav:{t:"अंगद और सुग्रीव के बीच की गाँठ",l:"chh",x:"लौटती टोली में अंगद यों ही आगे नहीं है। वह बालि का बेटा है, यानी उसी राजा का जिसे मारकर सुग्रीव गद्दी पर बैठे। खोज के लिए सुग्रीव ने एक महीने की हद बाँधी थी, और वह हद बीत चुकी थी। इसीलिए लौटते वक़्त डर भी था और ऊधम भी, और मधुवन में शहद पीने की इजाज़त अंगद ने ही दी। ख़बर अच्छी थी, वरना वह ऊधम भारी पड़ता।",s:"vr",p:1,ref:"बालि और सुग्रीव तथा एक महीने की हद: किष्किंधाकांड, सर्ग 26 से 29; मधुवन में अंगद की इजाज़त: सुंदरकांड, सर्ग 61 से 63"},
 avadhi:{t:"दसवाँ महीना चल रहा है",l:"chh",x:"अवधि पहले बारह महीने की थी, जो हरण के वक़्त दी गई थी। सीता ख़ुद हनुमान को बताती हैं कि अभी दसवाँ महीना चल रहा है और सिर्फ़ दो बचे हैं। इसीलिए वे कहती हैं कि राम को जल्दी करने को कहना, क्योंकि उतने ही दिन वे जीवित रहेंगी। यह पूरी रात इसी गिनती के ऊपर टिकी है।",s:"vr",p:1,ref:"बारह महीने की अवधि: अरण्यकांड, सर्ग 56; दो महीने बाकी: सुंदरकांड, सर्ग 22 और सर्ग 37"},
 trijata:{t:"सपने का पूरा ब्योरा",l:"chh",x:"त्रिजटा का सपना ब्योरेवार है, इसीलिए वह डराता है। उसमें रावण तेल में सना हुआ, नशे में चूर, पुष्पक से नीचे गिरा हुआ दिखता है, और उसे दक्षिण की ओर घसीटा जा रहा है, यानी यम की दिशा में। वह गधे या सूअर पर बैठा है और कीचड़ में धँसता जाता है। दूसरी तरफ़ राम की जीत दिखती है। सपना सुनाकर त्रिजटा बाकियों को चुप करा देती है, और उसी घड़ी बग़ीचे का डर थोड़ा हल्का हो जाता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 27"},
 bhasha:{t:"कौन सी बोली बोलें",l:"man",x:"वाल्मीकि इसे भाषा के चुनाव की तरह लिखते हैं। संस्कृत में बोलें तो वे इसे ब्राह्मण का भेस धरे रावण समझेंगी, इसलिए वही बोली चुनी गई जो आम लोग बोलते हैं। पूरे सुंदरकांड में यह अकेली जगह है जहाँ भाषा ख़ुद एक फ़ैसला बन जाती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 30"},
 anguthi:{t:"कहानी पहले, अँगूठी बाद में",l:"chh",x:"अँगूठी पहले नहीं दी जाती, पहले कहानी सुनाई जाती है, वह भी धीरे और आम बोली में, ताकि वे इसे रावण का छल न समझें। अँगूठी पर राम का नाम खुदा है, और उसे देखते ही वे उसे चेहरे से लगा लेती हैं। दस महीने में यह पहली चीज़ है जो राम के हाथ से चलकर उन तक पहुँची है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 36"},
 kaua:{t:"एक आँख के बदले जान",l:"chh",x:"वह पुरानी बात यह थी। एक कौआ उन्हें चोंच मार रहा था। राम ने अपने कुश के बिछौने से एक तिनका उठाया, उस पर ब्रह्मास्त्र चढ़ाया और छोड़ दिया। तिनका आग की तरह जलता हुआ कौए के पीछे लगा। वह तीनों लोक भागा, पर न पिता ने बचाया, न देवताओं ने। आख़िर लौटकर राम की ही शरण में आया। तब उसने ख़ुद कहा कि मेरी दाईं आँख ले लो, और तिनके ने वही आँख ली। जान बच गई, एक आँख के बदले। यह बात सिर्फ़ वे दोनों जानते थे, इसीलिए यही सबसे पक्की निशानी बनी। वाल्मीकि उसे सिर्फ़ कौआ कहते हैं; बाद की परंपरा में उसे इंद्र का बेटा जयंत बताया जाता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 38 (सीता ने सुनाई) और सर्ग 67 (हनुमान ने राम को दोहराई)"},
 peeth:{t:"मना करने की दो वजहें",l:"man",x:"मना करने की वजह वे ख़ुद दो टुकड़ों में कहती हैं। पहली, पति के प्रति निष्ठा के नाते वे राम के सिवा किसी और के शरीर को छू नहीं सकतीं, और जो रावण का स्पर्श हुआ वह बेबसी में हुआ, अपनी मर्ज़ी से नहीं। दूसरी, यह उचित तभी होगा जब राम यहीं आकर रावण को उसके कुल समेत मारें और फिर उन्हें ले जाएँ। यानी यह डर या शर्म नहीं, दो साफ़ कारण हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 37"},
 adhy_sita:{t:"दुश्मन की तरफ़ से पहला संकेत",l:"gr",x:"इस कथा में द्वार पर रोकने वाली ख़ुद कहती है कि जनक के घर जन्मी वे योगमाया हैं। यानी जिसे ढूँढा जा रहा है, उसके बारे में पहला संकेत दुश्मन की तरफ़ से मिलता है। यहाँ राम ब्रह्म हैं और सीता माया, और हनुमान का काम लड़ना नहीं, पहचान कराना है।",s:"adhy",p:1,ref:"अध्यात्म रामायण, सुंदरकांड, सर्ग 1 (लंका देवी का यह कहना कि जनक के घर जन्मी योगमाया हैं); पूरा सुंदरकांड पाँच सर्गों का है"},
 maya_sita:{t:"तो वाटिका में कौन बैठी थी",l:"gr",x:"यह विचार सबसे पहले कूर्म पुराण में मिलता है, लगभग डेढ़ हज़ार साल पहले, और वहीं से पद्म पुराण, ब्रह्मवैवर्त, अध्यात्म रामायण और मानस तक जाता है। मानस में तो हरण से पहले ही अग्नि में जाने की बात आ जाती है, यानी पूरी लंका की लड़ाई एक छाया के लिए लड़ी गई।",s:"kurma",p:1,ref:"कूर्म पुराण (लगभग 550 से 850 ईस्वी) में पहली बार; फिर पद्म पुराण, ब्रह्मवैवर्त पुराण, अध्यात्म रामायण और रामचरितमानस में"},
 vatika_tod:{t:"उजाड़ना, सोचा हुआ काम",l:"chh",x:"यह ग़ुस्सा नहीं, सोचा हुआ काम था। वे ख़ुद तय करते हैं कि यह बग़ीचा रावण को प्यारा है, इसलिए इसे उजाड़ने से सेना आएगी, और तभी पता चलेगा कि लंका में कितना बल है। साथ ही बँधकर रावण तक पहुँचने का रास्ता भी खुलेगा। एक दूत का काम सिर्फ़ ख़बर लाना नहीं, ताक़त नापना भी होता है।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 41 और 42"},
 kinkar:{t:"एक के बाद एक भेजना",l:"chh",x:"रावण ने एक साथ सब नहीं भेजा, एक के बाद एक भेजा। पहले किंकर नाम के पहरेदार, फिर चैत्य महल का रखवाला, फिर पाँच सेनापति, फिर अपना छोटा बेटा, और आख़िर में इंद्रजित। हर बार वही होता है, कोई लौटकर नहीं आता। कथा इसी क्रम से बताती है कि लंका को समझ में आने में कितनी देर लगी कि यह अकेला वानर क्या है।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 44 से 46"},
 akshay:{t:"सबसे छोटा बेटा",l:"chh",x:"अक्षकुमार रथ पर आया और पहले बाणों से घेरा। वाल्मीकि कहते हैं कि आख़िर में उसे पैरों से पकड़कर घुमाया गया और ज़मीन पर पटक दिया गया। रथ, सारथी और घोड़े भी उसी के साथ चूर हो गए।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 47"},
 brahmastra:{t:"पहरेदारों ने अस्त्र बेकार कर दिया",l:"man",x:"इंद्रजित के बाणों से बात नहीं बनी, तब उसने ब्रह्मास्त्र चलाया और वही बाँध सका। हनुमान चाहते तो छूट सकते थे, पर उन्होंने ब्रह्मा की मर्यादा रखी और चुप पड़े रहे, क्योंकि बँधकर ही रावण तक पहुँचा जा सकता था। असली मोड़ इसके बाद आता है: राक्षसों ने उन्हें छाल और सन की रस्सियों से भी बाँध दिया, और उसी पल ब्रह्मास्त्र का बंधन छूट गया, क्योंकि वह अस्त्र किसी दूसरे बंधन के साथ नहीं ठहरता। हनुमान को ख़ुद भी पता नहीं चला कि वे छूट चुके हैं। यानी रावण के अपने पहरेदारों ने ज़्यादा सावधानी दिखाकर सबसे बड़ा अस्त्र बेकार कर दिया।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 48, श्लोक 48 के आसपास"},
 dut:{t:"दूत को मारा नहीं जाता",l:"chh",x:"दंड चुनते वक़्त तर्क यह दिया गया कि वानरों को अपनी पूँछ सबसे प्यारी होती है, इसलिए वही जलाई जाए। मारने की जगह अपमान चुना गया, और वही फ़ैसला आगे लंका को ले डूबा।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 52"},
 poonch:{t:"सज़ा, जो टोह बन गई",l:"chh",x:"दंड चुनने की बहस के बाद रावण ने कहा कि मारना नहीं, कुछ और करो। तब तय हुआ कि पूँछ जलाई जाए, क्योंकि वानरों को अपनी पूँछ सबसे प्यारी होती है, और उसे पूरे नगर के चौराहों पर घुमाया जाए। हनुमान चुप इसलिए रहे कि यही मौक़ा था दिन के उजाले में पूरा नगर देख लेने का, जो रात में पूरा नहीं देखा जा सका था। सज़ा ही उनकी दूसरी टोह बन गई।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 53"},
 dahan:{t:"आग ने उसे क्यों नहीं जलाया",l:"chh",x:"आग हनुमान को ख़ुद क्यों नहीं जलाती, इसका कारण वे ख़ुद गिनाते हैं: सीता का अडिग रहना, राम का तेज, और अपने पिता पवन की अग्नि से मित्रता। इसी बीच वाटिका में सीता अग्नि से प्रार्थना कर रही होती हैं कि इस वानर का कुछ न बिगड़े। फिर पूँछ की आग छत दर छत फैलती है और सोने के महल राख होने लगते हैं।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 54"},
 dar_sita:{t:"जलाने के बाद का डर",l:"man",x:"लंका जलाकर वे समुद्र में पूँछ बुझाते हैं, और उसी पल उन्हें एक डर पकड़ता है: अगर सारा नगर जला है तो वाटिका भी जली होगी, और वहाँ तो वही बैठी थीं। वे ख़ुद को कोसते हैं कि ग़ुस्से में यह क्या कर दिया। फिर अपने ही तर्क से सँभलते हैं: जो आग मुझे नहीं जला सकी, वह उन्हें कैसे जलाएगी। तभी आसमान से चारण यह कहते सुनाई देते हैं कि लंका जली है, पर वे सुरक्षित हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 55"},
 charan:{t:"डर और राहत",l:"man",x:"आग लगाने के बाद हनुमान को डर लगा कि कहीं सीता भी न जल गई हों। तभी आसमान से आवाज़ें आईं कि वे सुरक्षित हैं, और उन्होंने ख़ुद जाकर देखा।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 55 और 56"},
 madhuvan:{t:"मना किया हुआ बाग़",l:"chh",x:"मधुवन कोई आम बाग़ नहीं था, वह सुग्रीव का अपना संरक्षित बाग़ था, जिसमें बिना इजाज़त घुसना मना था। लौटते वानरों ने अंगद की इजाज़त लेकर शहद पिया, फल तोड़े, और रोकने आए रखवालों को धकेल दिया। यही ऊधम आगे चलकर ख़बर बन जाता है।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 61"},
 khabar:{t:"पहला वाक्य, बाकी सब बाद में",l:"man",x:"वे पहले सीता की दिशा में सिर झुकाते हैं, फिर बोलते हैं। पहला वाक्य ब्योरा नहीं, सिर्फ़ इतना है कि सीता देखी गईं, जीवित हैं, और मन तुममें लगाए हुए हैं। लड़ाई, आग, दरबार, यह सब उसके बाद आता है। जो सबसे ज़रूरी था वह पहले कह दिया गया, बाकी सब उसके पीछे।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 65"},
 jain_lanka:{t:"दूसरी परंपरा की लंका",l:"gr",x:"जैन रामकथा में यह पूरा हिस्सा अलग ढंग से चलता है। वहाँ रावण विद्याधर राजा है और घटनाओं का क्रम भी बदला हुआ है।",s:"jain",p:2,ref:"पउमचरिय, उद्देश 51 (नाना महेंद्र वाला प्रसंग) और आगे के उद्देश"},
 lautna:{t:"जाते और लौटते का फ़र्क़",l:"chh",x:"लौटने की छलाँग जाने वाली छलाँग से भारी है, क्योंकि अब ख़बर साथ है। वे अरिष्ट पहाड़ की चोटी पर चढ़कर कूदते हैं, और उस धक्के से पेड़ उखड़ते हैं और चोटी दब जाती है। जाते वक़्त पहाड़ ने रुकने को कहा था, लौटते वक़्त पहाड़ नीचे दबता है। कथा यही फ़र्क़ दिखाकर बताती है कि अब वे वही नहीं रहे।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 57"},
 jambavan_role:{t:"जिसने याद दिलाया, वही अब पूछता है",l:"chh",x:"किनारे पर हाल पूछने वाले जांबवान यों ही सबसे आगे नहीं हैं। उड़ान से पहले जब सब हिम्मत हार चुके थे, तब उन्होंने ही हनुमान को उनका अपना बल और जन्म याद दिलाया था, और तभी वे इतने बड़े हुए कि समुद्र लाँघ सकें। इसलिए लौटकर पहला ब्योरा उन्हीं के सामने रखा जाता है।",s:"vr",p:1,ref:"जांबवान का याद दिलाना: किष्किंधाकांड, सर्ग 66; लौटकर सुनाना: सुंदरकांड, सर्ग 57 से 59"},
 katha:{t:"पूरी कथा एक साँस में",l:"chh",x:"वाल्मीकि यह हाल तीन बार सुनवाते हैं: पहले किनारे पर साथियों को, फिर सुग्रीव के सामने, और आख़िर में राम के सामने। हर बार ब्योरा थोड़ा बदलता है, और राम के सामने वह सबसे छोटा हो जाता है, क्योंकि पहला वाक्य ही सब कह देता है।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 58 और 59"},
 josh:{t:"जोश और रोक",l:"man",x:"जोश में अंगद कहता है कि अभी लौट चलो, हम ही लंका तोड़ देंगे और सीता को ले आएँगे। जांबवान रोक देते हैं, क्योंकि यह तय करना राम का काम है, टोली का नहीं। जीत के तुरंत बाद वाला यही पल सबसे कच्चा होता है, और कथा उसे बिना छिपाए दिखाती है।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 60"},
 dadhimukh:{t:"शिकायत में छिपी ख़बर",l:"chh",x:"दधिमुख शिकायत लेकर सीधे किष्किंधा पहुँचा। सुग्रीव ने सुनते ही उलटा अर्थ निकाला और लक्ष्मण से कहा कि जो हारकर लौटते हैं वे ऐसा ऊधम नहीं करते, इसलिए काम हो गया है, सीता मिल गई हैं, और यह किसी और से नहीं, हनुमान से ही हुआ होगा। यानी ख़बर पहुँचने से पहले ही पढ़ ली गई, एक शिकायत में से।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 62"},
 sugriva:{t:"नुक़सान छोड़ना",l:"man",x:"सुग्रीव ने दधिमुख को सज़ा नहीं दी, उलटा समझाकर लौटा दिया कि जाओ, उन्हें आने दो, वे मेरे पास आ रहे हैं। राजा के लिए यही परख का पल था: एक तरफ़ अपने बाग़ का नुक़सान, दूसरी तरफ़ वह ख़बर जिसका महीनों इंतज़ार था। उन्होंने नुक़सान छोड़ दिया।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 63"},
 manshila:{t:"गाल पर लगाया हुआ रंग",l:"chh",x:"सीता एक और निशानी भेजती हैं, जो कौए वाली बात से भी निजी है। एक दिन उनके माथे का टीका मिट गया था, तब राम ने गेरू जैसे लाल रंग से उनके गाल पर वही निशान बना दिया था। यह याद दिलाने को कहकर वे हनुमान को विदा करती हैं। यानी पहचान के लिए हथियार या मणि नहीं, एक छोटा सा दिन याद दिलाया जाता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 40"},
 rakshasi_naam:{t:"घेरे में बैठी राक्षसियों के नाम",l:"chh",x:"वाल्मीकि उन्हें भीड़ की तरह नहीं लिखते, नाम लेकर लिखते हैं। एकजटा, जिसकी आँखें ग़ुस्से से लाल हैं; हरिजटा, जिसकी आँखें बिल्ली जैसी हैं; प्रघसा, विकटा और दुर्मुखी। हर एक बारी बारी से डराती है, कोई समझाकर, कोई धमकाकर। आख़िर में वे कहती हैं कि इसका मांस खाकर निकुंभिला के मैदान में नाचेंगी, जहाँ रावण यज्ञ करता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 23 और 24"},
 chudamani:{t:"मणि का अपना इतिहास",l:"chh",x:"मणि हाथ में लेते ही राम उसे छाती से लगाकर रो पड़ते हैं। फिर वे सुग्रीव को उसका इतिहास बताते हैं: यह मणि पानी से निकली थी और यज्ञ से प्रसन्न होकर इंद्र ने जनक को दी थी। इसीलिए वे कहते हैं कि इसे देखकर मुझे अपने पिता और जनक, दोनों के दर्शन हो रहे हैं। दस महीने सीता ने इसे कपड़े में छिपाकर सँभाले रखा था।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 65"},
 sandesh:{t:"संदेश में तीन चीज़ें",l:"man",x:"संदेश में तीन चीज़ें थीं: कौए वाली पुरानी बात, गाल पर लगाए रंग की याद, और यह गिनती कि दो महीने बचे हैं। इसी के साथ वे कहती हैं कि राम से कहना जल्दी करें, क्योंकि उतने ही दिन वे जी सकेंगी। सुनने वाला एक वानर है, पर बात सीधे राम से कही जा रही है।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 68"},
 ram_ro:{t:"दोबारा सुनने की माँग",l:"man",x:"वे मणि को छाती से लगाकर रोते हैं और सुग्रीव से कहते हैं कि इसे देखकर मुझे अपने पिता और जनक दोनों के दर्शन हो रहे हैं। फिर वे हनुमान से वही बात दोबारा कहने को कहते हैं जो सीता ने कही थी, एक एक शब्द। सुनी हुई बात पर उन्हें भरोसा नहीं होता, वे उसे दोहराकर सुनना चाहते हैं।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 66"},
 manas_sandesh:{t:"मानस वाली विदाई",l:"gr",x:"मानस में लौटने के बाद हनुमान चूड़ामणि सौंपते हैं, राम उसे छाती से लगा लेते हैं, और सीता का संदेश सुनते ही उनकी आँखें भर आती हैं।",s:"manas",p:3,ref:"रामचरितमानस, सुंदरकांड, दोहा 31 और 32 के आसपास (संदेश, चूड़ामणि और राम का भर आना)"},
 sagar:{t:"समुद्र ने मदद क्यों की",l:"chh",x:"समुद्र ख़ुद सोचता है कि इस वानर को थकने नहीं देना चाहिए, क्योंकि उसे इसी वंश के सगर ने खुदवाकर बड़ा किया था। वह कहता है कि जो एहसान करे, उसका बदला लौटाना पुरानी रीत है। इसीलिए वह मैनाक से कहता है कि ऊपर उठकर इस मेहमान को ठहरने की जगह दे।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1; समुद्र का अपना कथन और मैनाक से उसका कहना"},
 baaje:{t:"बाजों को गले लगाकर सोना",l:"chh",x:"महल का सबसे याद रह जाने वाला दृश्य यही है। नाचने गाने वाली स्त्रियाँ थककर वहीं सो गई हैं, और हर एक अपना बाजा गले लगाए हुए है। कोई वीणा से लिपटी है, किसी की बग़ल में मड्डुक दबा है जैसे कोई बच्चे को लिए सो रही हो, कोई मृदंग से चिपकी है, कोई बाँसुरी थामे। कवि कहता है कि वे सब सोई हुई कमलिनियों जैसी लगती थीं। हनुमान इसी बीच से गुज़रते हुए उन्हें एक एक करके देखते हैं, और आगे बढ़ जाते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 10 और 11"},
 shinshapa:{t:"जिस पेड़ पर वे छिपे थे",l:"chh",x:"वाटिका में वे किसी भी पेड़ पर नहीं चढ़े थे। जिस पेड़ के नीचे सीता बैठी थीं, वे उसी शिंशपा पर ऊपर छिपे थे, पत्तों में पक्षी की तरह। इसीलिए रावण के आने पर वे सब कुछ ऊपर से देख और सुन पाते हैं, और बाद में राम को यह पूरा हाल सुना पाते हैं। छिपने की जगह वही थी जहाँ सबसे ज़्यादा ख़तरा था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 14 और सर्ग 58, जहाँ हनुमान ख़ुद यह बताते हैं"},
 nagri_stri:{t:"नगरी, सजी हुई स्त्री जैसी",l:"chh",sl:"ताम् रत्न वसन उपेताम् कोष्ठ आगार अवतंसकाम्",slm:"रत्न जिसके कपड़े हैं, और भंडार घर जिसके कान के कुंडल।",x:"वाल्मीकि नगर को एक सजी हुई स्त्री की तरह देखते हैं: रत्न उसके कपड़े हैं, भंडार घर कान के कुंडल, और हथियारों के घर उसकी छाती। दीयों से जलते बड़े मकानों के कारण वहाँ अँधेरा बचा ही नहीं था। यही नगर कुछ ही घंटों बाद धुएँ में बदल जाता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 3, श्लोक 18 और 19"},
 dvar_rok:{t:"यहाँ से आगे नहीं जा सकते",l:"chh",sl:"न शक्यम् खल्वियम् लङ्का प्रवेष्टुम् वानर त्वया",slm:"हे वानर, तुझसे यह लंका भीतर घुसी नहीं जा सकती।",x:"फाटक पर पहली बात यही कही जाती है, और वह धमकी नहीं, दावा है। रावण की सेना चारों तरफ़ पहरे पर है, इसलिए यह नगरी किसी के घुसने लायक नहीं। उसी दावे के बाद हनुमान पूछते हैं कि तू कौन है, और वहीं से पूरी बात खुलती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 3, श्लोक 24"},
 bhogavati:{t:"नगर किससे मिलता जुलता था",l:"chh",sl:"भुजग आचरिताम् गुप्ताम् शुभाम् भोगवतीम् इव",slm:"साँपों से भरी और उन्हीं से सुरक्षित, शुभ भोगवती नगरी जैसी।",x:"वाल्मीकि लंका की तुलना दो नगरों से करते हैं। एक भोगवती, जो नागों की नगरी है और साँपों से घिरी रहती है, और दूसरी अमरावती, जो इंद्र की नगरी है। यानी यह नगर देवताओं जैसा सुंदर भी है और साँपों जैसा ख़तरनाक भी। दीवारें सोने की हैं, और झंडों पर लगी छोटी घंटियाँ हवा में बजती रहती हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2 और 3"},
 naap:{t:"किसने कितनी छलाँग बताई",l:"chh",x:"चलने से पहले सबने अपनी अपनी हद बताई थी। गज ने दस योजन, गवाक्ष ने बीस, गवय ने तीस, शरभ ने चालीस, गंधमादन ने पचास, मैंद ने साठ, द्विविद ने सत्तर, सुषेण ने अस्सी, और बूढ़े जांबवान ने नब्बे, यह कहकर कि अब उम्र इतनी ही देती है। अंगद ने कहा सौ तो जाऊँगा, पर लौट पाऊँगा या नहीं, यह पक्का नहीं। किसी ने जाकर लौटने की बात नहीं कही। तब जांबवान हनुमान की तरफ़ मुड़े।",s:"vr",p:1,ref:"किष्किंधाकांड, सर्ग 65"},
 nirasha_gehra:{t:"लौटूँ ही नहीं, ऐसा भी सोचा",l:"man",x:"पूरा नगर छान लेने के बाद जो हार उन्हें लगी, वह कथा छिपाती नहीं। वे सोचते हैं कि बिना ख़बर लौटा तो समुद्र लाँघना, लंका में घुसना, यह सब बेकार गया। फिर आगे बढ़कर सोचते हैं कि किष्किंधा लौटूँगा ही नहीं, क्योंकि सुग्रीव के सामने ख़ाली हाथ कैसे जाऊँ, और वहाँ इंतज़ार कर रहे जांबवान और अंगद से क्या कहूँ। यह पूरी रात का सबसे नीचा पल है, और वे इसी से उठकर आगे बढ़ते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 12 और 13"},
 hath_roka:{t:"आधा ही ज़ोर लगाया",l:"chh",sl:"स्त्री चेति मन्यमानेन नातिक्रोधः स्वयम् कृतः",slm:"यह स्त्री है, ऐसा मानकर उन्होंने पूरा क्रोध नहीं किया।",x:"द्वार पर मार पड़ने के बाद भी उन्होंने पूरा ज़ोर नहीं लगाया। वाल्मीकि साफ़ लिखते हैं कि यह स्त्री है, ऐसा मानकर उन्होंने पूरा क्रोध नहीं किया, और बाएँ हाथ की मुट्ठी से ही मारा। गिरने के बाद उन्हें उस पर दया भी आई। पूरी रात में यह पहला मौक़ा है जहाँ ताक़त रोकी गई है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 3, श्लोक 40 से 43"},
 naag:{t:"साँप और गरुड़ की पुरानी दुश्मनी",l:"chh",x:"साँप गरुड़ से क्यों डरते हैं, यह पुरानी दुश्मनी है। कद्रू और विनता दो बहनें थीं। घोड़े के रंग पर लगी शर्त कद्रू ने छल से जीत ली, और विनता उसकी दासी बन गई। विनता के बेटे गरुड़ ने माँ को छुड़ाने के लिए स्वर्ग से अमृत लाकर दिया, और उसी दिन से नाग उनका भोजन ठहरे। इसीलिए ऊपर से गुज़रती परछाईं देखकर समुद्र के साँप छिप जाते हैं।",s:"vr",p:1,ref:"साँपों का गरुड़ समझना: सुंदरकांड, सर्ग 1, श्लोक 68; कद्रू और विनता की शर्त तथा गरुड़ का अमृत लाना: महाभारत, आदिपर्व, आस्तीक पर्व"},
 machhli:{t:"नीचे से दिखती उड़ान",l:"chh",x:"नीचे से देखने पर यह उड़ान तूफ़ान जैसी थी। वाल्मीकि कहते हैं कि पानी इतना उछला कि व्हेल, मछलियाँ, कछुए और मगर ऐसे खुलकर दिखने लगे जैसे किसी के ऊपर से कपड़ा हटा दिया गया हो। और जिस रास्ते से वे गुज़रे, वहाँ पानी में गड्ढा बन जाता रहा। ऊपर एक अकेली परछाईं थी, नीचे पूरा समुद्र उलट पलट रहा था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 dekhne_wale:{t:"आसमान के दर्शक",l:"chh",x:"ऋषियों, देवताओं और गंधर्वों ने उड़ते हनुमान को देखकर उनकी तारीफ़ की। सूरज ने उन्हें तपाया नहीं, और हवा ने साथ दिया।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 aam_ghar:{t:"आम घरों की रात",l:"chh",x:"वाल्मीकि यहाँ घरों के भीतर तक ले जाते हैं। किसी घर में हँसी है, किसी में झगड़ा, कोई अकेली करवटें बदल रही है, और कहीं कोई ऊँची आवाज़ में पाठ कर रहा है। पूरा नगर एक साथ सोता नहीं, हिस्सों में सोता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 4 और 5"},
 chowki_card:{t:"पहरे की चौकी",l:"chh",x:"लंका के हर द्वार पर पहरा था, और भीतर भी टोलियाँ घूमती थीं। इसी वजह से बड़े शरीर के साथ भीतर जाना मुमकिन नहीं था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 3 और 4"},
 chaitya_card:{t:"लंका की पहली आग",l:"chh",x:"बाग़ उजाड़ने और किंकरों को मारने के बाद वे ख़ुद सोचते हैं कि चैत्य महल अभी बचा हुआ है, और वही राक्षसों के रक्षक देवता की जगह है। चोटी पर चढ़कर उन्होंने ताली बजाई, और उस आवाज़ से पक्षी तक गिर पड़े। फिर सौ पहरेदार हथियार लेकर घेर लेते हैं। आख़िर में वे वहीं का एक खंभा उखाड़कर घुमाते हैं, दूसरे खंभों से रगड़ खाकर आग पैदा होती है, और वही महल जल उठता है। लंका में पहली आग यहीं लगती है, पूँछ से नहीं।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 43"},
 mantri_card:{t:"एक अकेली आवाज़",l:"chh",x:"दरबार में पहले प्रहस्त पूछता है कि तू कौन है, कहाँ से आया, बाग़ क्यों उजाड़ा। हनुमान साफ़ कहते हैं कि मैं दूत हूँ। इसके बाद मंत्री एक ही राय पर आ जाते हैं, इसे मार डालो। तब विभीषण अकेला खड़ा होकर नियम याद दिलाता है कि दूत वध नहीं होता। रावण मानता है, और यहीं से पूँछ वाला फ़ैसला निकलता है।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 49 से 52"},
 kritti_lanka:{t:"बांग्ला कथा की रात",l:"gr",x:"बांग्ला की कृत्तिवासी रामायण पाँचाली के ढंग में है। उसके सुंदरकांड में लंका के द्वार पर रोकने वाली का नाम चामुंडी है, और वहाँ हनुमान को एक ऋषि का वरदान भी मिलता है।",s:"krittivasa",p:1,ref:"कृत्तिवासी रामायण, सुंदराकांड, अध्याय 1 से 9 (सागर पार की बातचीत, जन्म वृत्तांत, वरदान, लंका प्रवेश और चामुंडी से भेंट)"},
 ranga_lanka:{t:"तेलुगु कथा की लंका",l:"gr",x:"तेलुगु की पहली पूरी रामायण, द्विपद छंद में। उसके सुंदरकांडम् में लंका में घुसना, उद्यान वन, सीता का दर्शन, मंदोदरी का रावण को नीति समझाना, और लंका दहन, सब क्रम से आते हैं।",s:"ranganatha",p:1,ref:"रंगनाथ रामायण (वाविल्ल संस्करण), सुंदरकांडम्: लंकापुरी में प्रवेश पृष्ठ 211, उद्यान वन 214, सीता दर्शन 216, मंदोदरी की नीति 220, लंका दहन 236, ख़बर 240"},
 eknath_sita:{t:"कई बाग़ों वाली खोज",l:"gr",x:"मराठी की इस कथा में खोज एक बाग़ में नहीं, कई बाग़ों में चलती है, और हर बाग़ का नाम अलग लिया जाता है। इसी वजह से वह हिस्सा यहाँ सबसे लंबा है: अकेले सुंदरकांड बीस से ज़्यादा अध्यायों का है, और पहले ही अध्याय का नाम है लंकेचा शोध। ढूँढने में जितना वक़्त लगा, कथा उतना ही वक़्त लेती है।",s:"eknath",p:1,ref:"भावार्थ रामायण, सुंदरकांड, अध्याय 1 (लंकेचा शोध) से आगे; इस कांड में कम से कम 21 अध्याय"},
 ezhu_vatika:{t:"मलयालम कथा का बग़ीचा",l:"gr",x:"मलयालम की किलिप्पाट्टु में सुंदरकांडम् ग्यारह खंडों का है। वाटिका का पल खंड 5.4 सीता संदर्शनम् और खंड 5.7 हनुमत् सीता संवादम् में आता है, और द्वार पर रोकने वाली का नाम वहाँ लंका लक्ष्मी है।",s:"ezhu",p:1,ref:"अध्यात्म रामायण किलिप्पाट्टु, सुंदरकांडम्, खंड 5.1 से 5.11; यह पल खंड 5.4 और 5.7 में"},
 kandali_udaan:{t:"असमिया कथा की उड़ान",l:"gr",x:"असमिया की पहली बड़ी रामकथा, चौदहवीं सदी में राजा महामाणिक्य के कहने पर लिखी गई। उसके सुंदराकांड का एक हिस्सा आज भी हनुमान का लंका दर्शन नाम से अलग पढ़ा जाता है।",s:"kandali",p:1,ref:"सप्तकांड रामायण, सुंदराकांड का हनुमंतर लंकादर्शन वाला हिस्सा; आदिकांड और उत्तराकांड बाद में जोड़े गए"},
 rang_mandodari:{t:"मंदोदरी की नसीहत",l:"man",x:"तेलुगु की रंगनाथ रामायण में, सीता के ठुकराने के तुरंत बाद मंदोदरी रावण को रोकती है और कहती है कि बहू बेटी जैसी को मत छेड़। यह बात सुंदरकांड की बाकी कथाओं में कम आती है।",s:"ranganatha",p:2,ref:"रंगनाथ रामायण, सुंदरकांडम्, वाविल्ल 1947 संस्करण, पृष्ठ 220"},
 sarala_lanka:{t:"ओड़िया कथा की लंका",l:"gr",x:"ओड़िया की वह कथा जो लंका के बाद शुरू होती है। पाताल की दूसरी लंका, हज़ार सिर वाला रावण, और अंत में सीता के हाथ का फूल वाला बाण।",s:"sarala",p:2,ref:"विलंका रामायण, पूर्व खंड (ओड़िया विभव की छपी प्रति); बीस अध्याय: हनुमान का विलंका पहुँचना और छह महीने पड़े रहना पृष्ठ 12, कम्बु का राम को ले जाना और विलंका दहन 34, सीता को लाना 76"},
 torave_aag:{t:"कन्नड़ कथा की आग",l:"gr",x:"कन्नड़ की पहली बड़ी रामकथा, भामिनी षट्पदी छंद में, नडुगन्नड़ भाषा में। इसके सुंदरकांड की आठवीं संधि कहती है कि हनुमान ने लंका को आग में ऐसे झोंका कि वह त्रिपुर दहन से पाँच गुना कहा जाए।",s:"torave",p:2,ref:"तोरवे रामायण, मैसूर प्राच्य विद्या संस्थान संस्करण 1966, संपुट 1; सुंदरकांड की नौ संधियाँ, पृष्ठ 439 से 541; लंका दहन आठवीं संधि, पृष्ठ 521 से 529"},
 mbh_short:{t:"सांत्वना के लिए सुनाई गई कथा",l:"gr",x:"यह कथा किसी को सांत्वना देने के लिए सुनाई जा रही है। युधिष्ठिर अपनी पत्नी के हरण से दुखी हैं, तब ऋषि कहते हैं कि सुनो, तुमसे पहले भी एक आदमी के साथ यही हुआ था। इसीलिए यहाँ ब्योरे नहीं हैं, सिर्फ़ ढाँचा है, और सबसे ज़्यादा ठहराव इस बात पर है कि सहने वाले को आख़िर में रास्ता मिलता है।",s:"mbh",p:1,ref:"महाभारत, वनपर्व (आरण्यक पर्व), अध्याय 258 से 275; कुछ छपी प्रतियों में गिनती अलग है"},
 adbhuta_sita:{t:"सीता की शक्ति वाली कथा",l:"gr",x:"इस कथा में सीता रावण की ही बेटी बताई गई हैं, और आगे चलकर वही हज़ार मुँह वाले बड़े रावण का अंत करती हैं। उस समय वे महाकाली का रूप लेती हैं, और उसके बाद राम उन्हें सहस्रनाम से स्तुति करते हैं।",s:"adbhuta",p:1,ref:"अद्भुत रामायण, सर्ग 23 से 25; पूरा ग्रंथ 27 सर्गों का"},
 ananda_extra:{t:"पूरी रात, एक सर्ग में",l:"gr",x:"यहाँ पूरी रात एक ही सर्ग में समा जाती है, और उसका नाम ही सब कह देता है: हनुमान सीता को ढूँढते हुए लंका पहुँचते हैं और लंका जलाते हैं। जो कथा दूसरी जगह पूरा कांड लेती है, वह यहाँ एक साँस है। इसका कारण यह है कि सुनाने वाले शिव हैं और सुनने वाली पार्वती, और उन्हें ब्योरा नहीं, सार चाहिए।",s:"ananda",p:2,ref:"आनंद रामायण, सार कांड, सर्ग 9 (हनुमान का सीता को ढूँढते हुए लंका पहुँचना और लंका दहन); सार कांड कुल तेरह सर्ग"},
 chalisa_yaad:{t:"पूरी रात, एक चौपाई में",l:"gr",x:"चालीस चौपाइयों में से सिर्फ़ एक इस पूरी रात को समेट लेती है: छोटा रूप धरकर उन्हें दिखाना, और डरावना रूप धरकर लंका जलाना। यानी जो कथा हज़ारों पंक्तियों में फैली है, वह रोज़ पढ़ी जाने वाली रचना में दो साँसों में आ जाती है। बहुत से लोग इस रात को इसी एक पंक्ति से जानते हैं।",s:"chalisa",p:2,ref:"हनुमान चालीसा, चौपाई 9; पूरी रचना में 40 चौपाइयाँ और 2 दोहे"},
 manas_lankini:{t:"मानस वाली रक्षिका",l:"gr",x:"रामचरितमानस में भी द्वार पर रोकने वाली रक्षिका है। हनुमान के एक घूँसे से वह गिर पड़ती है, और गिरकर वही पुरानी बात याद करती है जो उसे बहुत पहले कही गई थी।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड, दोहा 3 से 4 के बीच"},
 manas_masak:{t:"मच्छर जितना",l:"gr",x:"रामचरितमानस में हनुमान लंका में घुसने के लिए मच्छर जितने छोटे हो जाते हैं। वाल्मीकि में वे बिल्ली जितने छोटे होते हैं।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड, दोहा 3 और उसके बाद की पहली चौपाई"},
 manas_roop:{t:"बड़ा रूप दिखाना",l:"gr",x:"रामचरितमानस में सीता को यक़ीन नहीं आता कि इतना छोटा जीव राम का दूत है। तब हनुमान उन्हें अपना बड़ा रूप दिखाते हैं, और फिर छोटे हो जाते हैं।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड, दोहा 12 और 13 के आसपास"},
 manas_sabha:{t:"भरे दरबार में जवाब",l:"gr",x:"मानस में यह जवाब चेतावनी बन जाता है: जिसने पहाड़ जैसे बलवानों को तिनके की तरह उठा दिया, उसी की स्त्री तूने उठाई है। तुलसीदास इसे दोहा 20 के आसपास रखते हैं, और आगे विभीषण वाली बात भी इसी क्रम में आती है।",s:"manas",p:2,ref:"रामचरितमानस, सुंदरकांड, दोहा 20 के बाद का संवाद"},
 manas_poonch:{t:"जाने से पहले विदा",l:"gr",x:"मानस में आग बुझाने के बाद वे सीधे नहीं लौटते। वे दोबारा सीता के पास जाते हैं, विदा माँगते हैं, और तभी चलते हैं। वाल्मीकि में लौटने से पहले यह दूसरी भेंट इस तरह नहीं आती। तुलसीदास के लिए विदा लेना उतना ही ज़रूरी है जितना लंका जलाना।",s:"manas",p:2,ref:"रामचरितमानस, सुंदरकांड, दोहा 24 और उसके बाद"},
 jain_sabha:{t:"वहाँ दरबार आता ही नहीं",l:"gr",x:"यहाँ दरबार का मतलब ही बदल जाता है। हनुमान चोरी छिपे पकड़े गए दूत नहीं हैं, वे भेजे हुए दूत हैं, और राम ने अपनी अँगूठी देकर कहा है कि सीता की चूड़ामणि लेकर आना। इसलिए वहाँ ब्रह्मास्त्र, बंधन और सज़ा वाली पूरी कड़ी ही नहीं आती। रावण भी राक्षस नहीं, विद्याधरों का बड़ा राजा है।",s:"jain",p:2,ref:"पउमचरिय, उद्देश 49 (हनु को दूत बनाना और अँगूठी देना) तथा 53 (लंका में विभीषण से भेंट, ग्यारहवाँ दिन)"},
 adhy_updesh:{t:"दरबार में दर्शन की बात",l:"gr",x:"अध्यात्म रामायण में हनुमान दरबार में रावण को सिर्फ़ चेतावनी नहीं देते। वे उसे समझाते हैं कि देह तू नहीं है, न इंद्रियाँ, न मन। जो जानने वाला है, वही तू है। और यह जानते ही बंधन छूट जाता है।",s:"adhy",ref:"अध्यात्म रामायण, सुंदरकांड, सर्ग 4",p:2},
 adhy_agni:{t:"आग देखकर जलाती है",l:"gr",x:"जलती लंका में एक घर बचा रह जाता है, और वह विभीषण का है। इसी परंपरा में आग का ठंडा होना भी दो कारणों से जुड़ता है, सीता की प्रार्थना और पवन से अग्नि की मित्रता। यानी यहाँ आग अंधी नहीं है, वह देखकर जलाती है।",s:"adhy",ref:"अध्यात्म रामायण, सुंदरकांड, सर्ग 4",p:2},
 adhy_milan:{t:"राम का गले लगाना",l:"gr",x:"यहाँ राम बदले की बात करते हैं और फिर कहते हैं कि देने को कुछ बचा ही नहीं। इसी सर्ग में वे आलिंगन को ही सबसे बड़ा दान कहते हैं, और यही इस कथा का अंत है, कोई वरदान या भेंट नहीं।",s:"adhy",ref:"अध्यात्म रामायण, सुंदरकांड, सर्ग 5",p:3},
 adhy_vatika:{t:"वाटिका, दर्शन की नज़र से",l:"gr",x:"अध्यात्म रामायण के सुंदरकांड में यही दृश्य दर्शन की तरह पढ़ा गया है। वहाँ सीता का बंधन जीव के बंधन जैसा है, और हनुमान का आना पहचान लौटने जैसा।",s:"adhy",p:1,ref:"अध्यात्म रामायण, सुंदरकांड, सर्ग 2 (शिंशपा के नीचे सीता, रावण का आना, त्रिजटा का सपना) और सर्ग 3 (मुद्रिका, चूड़ामणि, विशाल रूप)"},
 kamba_nagar:{t:"कंबन की लंका",l:"gr",x:"कंबन का सुंदरकांडम् चौदह पडलम् में बँटा है। नगर की खोज वाला हिस्सा दूसरा पडलम् है, जिसका नाम ही है ऊर् तेडु पडलम्, यानी नगर ढूँढने का अध्याय।",s:"kamba",p:1,ref:"कंब रामायण, सुंदरकांडम्, पडलम् 2 (ऊर् तेडु पडलम्)"},
 kamba_lanka:{t:"तमिल की लंका",l:"gr",x:"सुंदरकांडम् का आख़िरी पडलम् तिरुवडि तोऴुद पडलम् है, यानी वह अध्याय जिसमें लौटकर चरणों में प्रणाम किया जाता है। यहीं ख़बर पहुँचती है।",s:"kamba",p:3,ref:"कंब रामायण, सुंदरकांडम्, पडलम् 14 (तिरुवडि तोऴुद पडलम्)"},

const PRJ={lon0:74,lat0:17,k:20,sq:.99};
function PX(lat,lon){return [(lon-PRJ.lon0)*PRJ.k*PRJ.sq,(PRJ.lat0-lat)*PRJ.k];}
function CAM(latN,lonW,latS,lonE){const a=PX(latN,lonW),b=PX(latS,lonE);return [a[0],a[1],b[0]-a[0],b[1]-a[1]];}
function LINE(pts){return pts.map((q,i)=>(i?"L":"M")+PX(q[0],q[1]).map(v=>v.toFixed(2)).join(" ")).join(" ");}

 devlok:{n:"आसमान के दर्शक",la:9.02,lo:79.62,t:"ऊपर से कोई देख रहा है",lore:"आसमान में खड़े वे लोग जो यह सब देख रहे थे: सिद्ध, चारण, गंधर्व और देवता। वे फूल बरसाते हैं, और सिंहिका के मरने के बाद वही चार बातें गिनाते हैं जो ऐसे काम के लिए चाहिए: साहस, नज़र, बुद्धि और कौशल।"},
 akash:{n:"समुद्र के ऊपर",la:8.86,lo:79.58,t:"रास्ते में तीन रुकावटें",lore:"यह सौ योजन चौड़ा समुद्र है। संपाति ने बताया था कि लंका यहाँ से सौ योजन दूर एक द्वीप पर है, और यही दूरी नापकर सब अपनी अपनी हद बता रहे थे। परछाईं पानी पर दस योजन चौड़ी और तीस योजन लंबी पड़ती है।"},
 samudra:{n:"पानी के भीतर",la:8.62,lo:79.52,t:"साँप ऊपर देखकर छिप रहे हैं",lore:"समुद्र के भीतर का वह हिस्सा जहाँ से यह उड़ान तूफ़ान जैसी दिखी। पानी इतना उछला कि मछलियाँ, कछुए और मगर खुलकर दिखने लगे, और जिस रास्ते से वे गुज़रे वहाँ पानी में गड्ढा बनता गया। नीचे रहने वाले साँपों ने उन्हें गरुड़ समझा, और वह डर पुराना है।"},
 arisht:{n:"लौटती उड़ान",la:8.3,lo:80.3,t:"चोटी से वापसी की छलाँग",lore:"अरिष्ट पहाड़ की वह चोटी जहाँ से लौटने की छलाँग लगी। उस धक्के से पेड़ उखड़े और चोटी दब गई। जाते वक़्त एक पहाड़ ने रुकने को कहा था, लौटते वक़्त पहाड़ नीचे दबता है, और कथा यही फ़र्क़ दिखाकर बताती है कि अब वे वही नहीं रहे।"},
 trikut:{n:"त्रिकूट की चोटी",la:7.957,lo:80.76,t:"ऊपर से पूरी लंका दिखती है",lore:"लंका त्रिकूट नाम के पहाड़ पर बसी है, और कथा कहती है कि उसे विश्वकर्मा ने बनाया था। चोटी से नीचे देखने पर पूरा नगर एक साथ दिखता है, इसीलिए असमिया कथा में इस हिस्से का नाम ही हनुमान का लंका दर्शन है।"},
 dvar:{n:"लंका का द्वार",la:7.905,lo:80.712,t:"दीवार पर कोई पहरा दे रहा है",lore:"नगर की दीवार सोने के रंग की है, फाटक सफ़ेद, और मेहराबों पर हाथी खड़े हैं। झंडों पर लगी छोटी घंटियाँ हवा में बजती रहती हैं। यहीं वह रक्षिका खड़ी रहती है जो असल में ख़ुद नगरी है।"},
 chowki:{n:"पहरेदारों की चौकी",la:7.882,lo:80.748,t:"पहरेदार आपस में बात कर रहे हैं",lore:"लंका के हर द्वार पर पहरा था और भीतर भी टोलियाँ घूमती थीं। इसी वजह से बड़े शरीर के साथ भीतर जाना मुमकिन नहीं था। पहरेदारों को यह पता ही नहीं चलता कि जिस पर नज़र रखनी थी वह बिल्ली जितना होकर ऊपर से निकल गया।"},
 nagar:{n:"नगर की गलियाँ",la:7.93,lo:80.8,t:"संगीत, नशा और सोने की छतें",lore:"गलियों में सोने के महल, रत्न जड़े फ़र्श, और क्रौंच तथा मोर की आवाज़ें। वाल्मीकि नगर को सजी हुई स्त्री की तरह देखते हैं, और यह भी कहते हैं कि यह भोगवती और अमरावती दोनों जैसा है, यानी सुंदर भी और ख़तरनाक भी।"},
 aamghar:{n:"आम घरों की गली",la:7.968,lo:80.836,t:"किसी घर में कोई जाग रहा है",lore:"लंका के आम घर, जहाँ वाल्मीकि भीतर तक ले जाते हैं। किसी घर में हँसी है, किसी में झगड़ा, कोई अकेली करवटें बदल रही है, कहीं कोई ऊँची आवाज़ में पाठ कर रहा है। पूरा नगर एक साथ नहीं सोता, हिस्सों में सोता है।"},
 chhat:{n:"जलती छतें",la:7.942,lo:80.868,t:"आग एक छत से दूसरी तक",lore:"लंका की छतें, जिन पर से होकर आग फैली। जलते हुए नगर का वर्णन ऊपर से है, इसलिए पहले चमक दिखती है, फिर धुआँ, फिर नीचे भागते लोग। बीच में विभीषण का घर बचा रह जाता है।"},
 mahal:{n:"रावण का महल",la:7.998,lo:80.792,t:"सब सो रहे हैं",lore:"रावण का महल, जिसके बीच में पुष्पक विमान खड़ा है। भीतर सोने की जालीदार खिड़कियाँ, रत्न जड़े खंभे, और बाजों को गले लगाए सोई हुई स्त्रियाँ। यही वह जगह है जहाँ एक पल को लगा कि खोज पूरी हो गई।"},
 pangrih:{n:"नशे का घर",la:7.995,lo:80.906,t:"रात का दौर ख़त्म हो चुका है",lore:"वह जगह जहाँ रात भर पीने पिलाने का दौर चलता है। वाल्मीकि इसका ब्योरा खुलकर देते हैं: जूठे बरतन, बचा हुआ खाना, बिखरी मालाएँ। इसी सर्ग में हनुमान ख़ुद से पूछते हैं कि कहीं यह देखना पाप तो नहीं।"},
 chaitya:{n:"चैत्य महल",la:7.9,lo:80.828,t:"सबसे ऊँची चोटी पर कोई चढ़ा है",lore:"राक्षसों के रक्षक देवता का ऊँचा महल। बाग़ उजाड़ने के बाद वे ख़ुद तय करते हैं कि यह अभी बचा हुआ है, और चोटी पर चढ़कर ताली बजाते हैं। लंका की पहली आग यहीं लगती है, पूँछ से नहीं, खंभों की रगड़ से।"},
 chowk:{n:"नगर का चौक",la:7.858,lo:80.806,t:"भीड़ जमा है",lore:"नगर का वह चौक जहाँ भीड़ जमा होती है। यहीं एक एक करके भेजे गए योद्धा आते हैं, यहीं पूँछ पर कपड़े लपेटे जाते हैं, और यहीं से जलते हुए पूरे नगर में घुमाया जाता है। सज़ा को तमाशा बनाने की जगह यही है।"},
 sabha:{n:"रावण का दरबार",la:7.845,lo:80.86,t:"बँधा हुआ दूत खड़ा है",lore:"रावण का दरबार, जहाँ बँधे हुए दूत को लाया जाता है। पूछताछ प्रहस्त करता है, मंत्री मारने की राय देते हैं, और विभीषण अकेला खड़ा होकर नियम याद दिलाता है। यहीं वह भाषण होता है जिसमें बँधा हुआ दूत दरबार को सलाह देता है।"},
 mantri:{n:"मंत्रियों की बैठक",la:7.812,lo:80.892,t:"सब एक ही राय पर हैं",lore:"दरबार से लगा वह कमरा जहाँ मंत्री आपस में बात करते हैं। सब एक ही राय पर हैं, इसे मार डालो। एक अकेली आवाज़ पूरा फ़ैसला बदल देती है, और दंड में मौत की जगह पूँछ चुनी जाती है।"},
 ghar:{n:"एक अलग सा घर",la:7.828,lo:80.744,t:"यहाँ कोई नाम ले रहा है",lore:"नगर में वह एक घर जो बाकी सबसे अलग है। मानस में हनुमान उसे तुलसी और राम के नाम से पहचानते हैं, और वहीं उन्हें विभीषण मिलते हैं। यही घर आगे जलती लंका में बचा रह जाता है, और इसका कारण बहुत पुराना है: जब रावण ने कुबेर से लंका छीनी, तब विभीषण कुबेर के साथ चला गया था।"},
 vatika:{n:"अशोक वाटिका",la:6.9332,lo:80.8105,t:"पेड़ों के बीच कोई अकेली बैठी है",lore:"अशोक का मतलब ही है बिना शोक के, और कथा की सबसे बड़ी विडंबना यही है कि सबसे ज़्यादा शोक इसी बाग़ में है। बीच में एक शिंशपा पेड़ है, उसी के नीचे वे बैठी हैं, और राक्षसियाँ घेरा बनाकर पहरा देती हैं।"},
 kona:{n:"वाटिका का कोना",la:6.9,lo:80.766,t:"कोई नींद से हड़बड़ाकर उठी है",lore:"वाटिका का वह कोना जहाँ पहरा देने वाली राक्षसियाँ बैठती हैं। यहीं त्रिजटा नींद से हड़बड़ाकर उठती है और अपना सपना सुनाती है, और उसी से उस रात के ताने थम जाते हैं।"},
 daal:{n:"पेड़ की ऊँची डाल",la:6.962,lo:80.848,t:"पत्तों के बीच कोई छिपा है",lore:"शिंशपा पेड़ की वही डाल, जिस पर छिपकर सब कुछ देखा और सुना गया। वहीं से कथा गाकर सुनाई गई, वहीं से नीचे अँगूठी डाली गई, और वहीं बैठकर रावण का आना भी देखा गया।"}

 "vilanka-v_fatak-0":{src:"sarala",say:["फाटक पर कोई बैठी है। वह गाँव की देवी है, और यहाँ का नियम यही है कि जो शत्रु आए उसे पीने को दिया जाए।",

 "vilanka-v_maidan-0":{src:"sarala",cards:["v_taali"],say:["मैदान में सेना बिखरी पड़ी है। यहाँ लड़ाई हुई ही नहीं, बस एक आवाज़ हुई थी।",

 "vilanka-v_surekha-1":{src:"sarala",cards:["v_maya"],say:["एक असुरी सामने आती है। नाम सुरेखा है, और वह माया का रूप धर लेती है।",

 "vilanka-v_kambu-1":{src:"sarala",cards:["v_kambu_card"],say:["एक असुर ब्राह्मण का वेश धरकर आता है। नाम कम्बु है।",

 "vilanka-v_dhanush-2":{src:"sarala",cards:["v_phool"],say:["देवी मंगला सामने आती हैं और सीता को एक धनुष देती हैं। वह लोहे का नहीं, फूलों का है।",

 "khoj-akash-0":{say:["तुम हवा में हो। नीचे पानी है, और पानी पर एक बहुत बड़ी परछाईं दौड़ रही है।",

 "khoj-kinara-0":{say:["समुद्र के इस पार वानर बैठे हैं। किसी ने कुछ खाया नहीं।",

 "aag-mantri-2":{say:["दरबार से लगा एक कमरा, जहाँ मंत्री आपस में बात कर रहे हैं।",

 {src:"ranganatha",say:["तेलुगु की इस कथा में रात यहीं से खुलती है: लंकापुरी में घुसना। जो पहला पन्ना है, वही यह गली है।",

 "khoj-vatika-1":{say:["नगर से दूर एक बग़ीचा। यहाँ संगीत नहीं पहुँचता।",

 {src:"ezhu",say:["यहाँ यह पल दो हिस्सों में खुलता है। पहले सिर्फ़ देखना: पेड़ के पीछे से वे दूर बैठी दिखती हैं, और देखने वाला कुछ कहता नहीं।",

function clamp(v){

 let cx=v[0]+v[2]/2, cy=v[1]+v[3]/2;
 const B=holdBox();
 /* the drawn world never slides off into emptiness: inside the box, or centred */
 cx=w>=B[2]?B[0]+B[2]/2:Math.max(B[0]+w/2,Math.min(cx,B[0]+B[2]-w/2));
 cy=h>=B[3]?B[1]+B[3]/2:Math.max(B[1]+h/2,Math.min(cy,B[1]+B[3]-h/2));

   const px=worldW*unit,x=(q[0]-cam[0])*unit,y=(q[1]-cam[1])/cam[3]*H;
   const show=(sel||px>=SCENE_MIN_PX)&&x>-px-40&&y>-px-40&&x<W+px+40&&y<H+px+40;
   n.setAttribute("class","sc home"+(sel?" live focus":" live"));

 svg.querySelectorAll(".home").forEach(n=>{n.style.opacity="0";});
 const sx=id=>(PLACES[id].x-cam[0])*unit, sy=id=>(PLACES[id].y-cam[1])/cam[3]*H;

 const kept=[],fold={};
 Object.keys(PLACES).forEach(id=>{if(!shown(id))setOff(id,true);});
 ids.forEach(id=>{

 });

let anim=0;
function flyTo(box,pad){
 const to=fit(box,pad),from=cam.slice(),t0=performance.now(),dur=720,id=++anim;
 const lerp=(a,b,e)=>a+(b-a)*e;
 const step=now=>{if(id!==anim)return;
  const k=Math.min(1,(now-t0)/dur),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  const w=Math.exp(lerp(Math.log(from[2]),Math.log(to[2]),e));
  const cx=lerp(from[0]+from[2]/2,to[0]+to[2]/2,e), cy=lerp(from[1]+from[3]/2,to[1]+to[3]/2,e);
  const h=w/aspect();
  apply([cx-w/2,cy-h/2,w,h]);
  if(k<1)requestAnimationFrame(step);else apply(to);};
 requestAnimationFrame(step);
}
function around(id,span){const P=PLACES[id];return [P.x-span/2,P.y-span/2,span,span];}
function watchBox(){
 const W=run&&run.N.watches[Math.min(run.w,run.N.watches.length-1)];
 if(!W)return fitAll();
 const pts=W.spots.map(id=>PLACES[id]).filter(Boolean);
 if(!pts.length)return W.cam||fitAll();
 let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
 pts.forEach(P=>{x0=Math.min(x0,P.x);y0=Math.min(y0,P.y);x1=Math.max(x1,P.x);y1=Math.max(y1,P.y);});
 const padx=Math.max((x1-x0)*.28,3.2), pady=Math.max((y1-y0)*.28,3.2);
 return [x0-padx,y0-pady-1.5,(x1-x0)+padx*2,(y1-y0)+pady*2+1.5];
}
function fitAll(){return CAM(16,74.4,6,81.8);}

function pick(a,n){return a[n%a.length];}
const ABOUT=/(सदी की रचना|सदी में लिखी|सदी की है|के कहने पर|द्विपद छंद|छंद में|गाकर सुनाई|गाकर पढ़ा|अध्यायों का है|सर्गों का है|इसका सुंदरकांड|पहले ही अध्याय का नाम|सुनाने वाला कोई आदमी नहीं|इसका ढंग|कवि ने ख़ुद लिखा|अनुवाद है|संस्करण)/;
function splitSay(lines){                /* the moment first, the book's own story apart */
 const story=[],about=[];
 (lines||[]).forEach(t=>{(ABOUT.test(t)?about:story).push(t);});
 return story.length?{story:story,about:about}:{story:lines||[],about:[]};
}
function aboutStrip(name,lines,host){
 if(!lines.length)return;
 const box=document.createElement("div");box.className="about shut";
 const lid=document.createElement("button");lid.className="aboutlid";lid.type="button";
 const b=document.createElement("b");b.textContent=name+" के बारे में";
 const tag=document.createElement("span");tag.className="abouttag";tag.textContent="देखो";
 lid.appendChild(b);lid.appendChild(tag);
 const body=document.createElement("div");body.className="aboutbody";
 body.innerHTML=lines.map(t=>"<p>"+t+"</p>").join("");
 lid.onclick=()=>{const shut=box.classList.contains("shut");
  box.classList.toggle("shut",!shut);tag.textContent=shut?"बंद करो":"देखो";};
 box.appendChild(lid);box.appendChild(body);
 (host||curStep||story).appendChild(box);
}
function bigWords(t){const o={};String(t).replace(/[।,:;()]/g," ").split(/\s+/).forEach(w=>{if(w.length>3)o[w]=1;});return o;}
function echoes(a,b){                    /* does b mostly repeat a */
 const A=bigWords(a),B=Object.keys(bigWords(b));
 if(!B.length)return false;
 return B.filter(w=>A[w]).length/B.length>=.42;
}
function weaveDoc(){
 let out="",total=0,used={},rasa={},refs=[],cn=0;
 NIGHTS.forEach(N=>{
  const mine=[];
  N.watches.forEach((w,i)=>w.spots.forEach(id=>{
   const key=N.id+"-"+id+"-"+i,d=depthOf(key);
   if(SC[key]&&d>0)mine.push({key:key,id:id,w:i,d:d});
  }));
  if(!mine.length)return;
  out+='<h2>'+N.name+"</h2>";
  out+="<p>"+W_OPEN[N.id]+"</p>";
  let lastW=-1,n=0;
  mine.forEach(m=>{
   const L=layersOf(m.key),seen=L.slice(0,Math.min(m.d,L.length));
   if(m.w!==lastW){if(W_TURN[m.w]&&lastW>=0)out+='<p class="w-turn">'+W_TURN[m.w]+"</p>";lastW=m.w;}
   const lead=n===0?"":pick(W_JOIN,n);
   out+='<p class="w-where">'+PLACES[m.id].n+"</p>";
   let para=lead?lead+" ":"";
   seen.forEach((S,li)=>{
    const g=SRC[S.src||"vr"].n;
    const lines=splitSay(S.say).story.join(" ");
    if(li===0)para+=lines+' <i>'+pick(W_SAYS,n+li).replace("{g}",g)+"</i> ";
    else para+='<br><span class="w-also"><i>'+pick(W_ALSO,n+li).replace("{g}",g)+"</i> "+lines+"</span> ";
    used[g]=(used[g]||0)+1;
    (S.cards||[]).forEach(c=>{
     if(!save.cards[c]||!CARDS[c])return;
     const C=CARDS[c];
     if(echoes(lines,C.x))return;         /* say nothing twice in the same breath */
     para+='<span class="w-card"><i>'+pick(W_CARD[C.l||"chh"],cn++)+"</i> "+C.x+"</span> ";
     if(C.ref&&refs.indexOf(C.ref)<0)refs.push(C.ref);
    });
   });
   out+="<p>"+para.trim()+"</p>";
   if(RAS[m.key])rasa[RAS[m.key]]=(rasa[RAS[m.key]]||0)+1;
   n++;total++;
  });
 });
 if(!total)return '<p class="quiet">अभी कुछ जिया नहीं गया। एक हिस्सा खेलो, फिर यह पोथी अपने आप लिखी जाने लगेगी।</p>';
 const top=Object.keys(used).sort((a,b)=>used[b]-used[a]);
 const topRas=Object.keys(rasa).sort((a,b)=>rasa[b]-rasa[a])[0];
 out+="<h2>अंत में</h2>";
 out+="<p>इस तरह तुम्हारा सुंदरकांड "+total+" पलों का बना। सबसे ज़्यादा "+top[0]+" बोली"+
  (top[1]?", और उसके साथ "+top[1]:"")+"। "+
  (topRas?"जो रस सबसे ज़्यादा ठहरा, वह "+RASA[topRas]+" था।":"")+"</p>";
 out+="<p>यह वही कथा है जो सबने सुनी है, पर इस तरह सिर्फ़ तुमने सुनी है।</p>";
 const met=Object.keys(PATRA).filter(k=>save.patra&&save.patra[k]).map(k=>PATRA[k].n);
 const held=Object.keys(VASTU).filter(vastuGot).map(k=>VASTU[k].n);
 if(met.length)out+="<h2>रास्ते में जो मिले</h2><p>"+met.join(", ")+"।</p>";
 if(held.length)out+="<h2>जो बटोरा</h2><p>"+held.join(", ")+"।</p>";
 if(refs.length)out+='<p class="w-refs">हवाले: '+refs.join("; ")+"।</p>";
 return out;
}
