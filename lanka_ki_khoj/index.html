 /* one body per kind of being, each with its own build, dress and stance */
 person:(x,y,s,i,o)=>{
  o=o||{};let kind=o.kind||"nar";
  if(kind==="man")kind="nar"; if(kind==="woman")kind="nari"; if(kind==="guard")kind="rakshasa";
  if(kind==="king")kind="ravan";
  const f=o.face===undefined?1:o.face, act=o.act||"stand", d=-((i||0)*.47).toFixed(2);
  const sh=(w)=>'<ellipse class="dsh" cx="'+x+'" cy="'+(y+1*s)+'" rx="'+(w*s)+'" ry="'+(1.4*s)+'"/>';
  const legs=(cls,hip,wd,len)=>'<g class="dleg dleg2"><path class="'+cls+'" d="M'+(x-wd*s)+' '+hip+' l'+(-.7*s)+' '+(len*s)+
    ' h'+(2.6*s)+' l'+(.3*s)+' '+(-len*s)+' Z"/></g>'+
   '<g class="dleg dleg1"><path class="'+cls+'" d="M'+(x+wd*s)+' '+hip+' l'+(.7*s)+' '+(len*s)+
    ' h'+(-2.6*s)+' l'+(-.3*s)+' '+(-len*s)+' Z"/></g>';
  const shula=(dir)=>'<path class="dspear" d="M'+(x+dir*5*s)+' '+(y+.6*s)+' v'+(-21*s)+'"/>'+
   '<path class="dblade" d="M'+(x+dir*5*s)+' '+(y-21*s)+' l'+(1.5*s)+' '+(3.2*s)+' h'+(-3*s)+' Z"/>';
  const mudgar=(dir)=>'<path class="dspear" d="M'+(x+dir*5*s)+' '+(y+.6*s)+' v'+(-15*s)+'"/>'+
   '<ellipse class="dclub" cx="'+(x+dir*5*s)+'" cy="'+(y-18*s)+'" rx="'+(2.6*s)+'" ry="'+(3.4*s)+'"/>';

  /* ---- nar and nari: plain people of the city ---- */
  if(kind==="nar"||kind==="nari"){
   const woman=kind==="nari", H=y-16.2*s, hip=y-7.6*s, sho=y-12.4*s;
   let g='<g class="dper '+(act==="walk"?"dwalking":"")+'" style="animation-delay:'+d+'s">'+sh(4.4);
   g+='<path class="dlimb dlimbback" d="M'+(x-2.2*s)+' '+sho+' q'+(-3.4*f*s)+' '+(2.8*s)+' '+(-2.4*f*s)+' '+(6.6*s)+'"/>';
   g+=legs(woman?"dsari":"dleg1p",hip,1.9,7.6);
   g+='<path class="'+(woman?"dsari":"ddhoti")+'" d="M'+(x-3.4*s)+' '+hip+' h'+(6.8*s)+' l'+(woman?1.6*s:1.1*s)+' '+
    ((woman?7.4:4.6)*s)+' h'+(-(woman?10*s:9*s))+' Z"/>';
   g+='<path class="dtorso" d="M'+(x-3.2*s)+' '+sho+' q'+(3.2*s)+' '+(-1.4*s)+' '+(6.4*s)+' 0 l'+(-.6*s)+' '+(5.2*s)+' h'+(-5.2*s)+' Z"/>';
   g+='<circle class="dskin" cx="'+x+'" cy="'+H+'" r="'+(2.5*s)+'"/>';
   g+='<path class="dhair" d="M'+(x-2.5*s)+' '+(H-.4*s)+' a'+(2.5*s)+' '+(2.5*s)+' 0 0 1 '+(5*s)+' 0 q'+(-2.5*s)+' '+(-1.8*s)+' '+(-5*s)+' 0 Z"/>';
   if(woman)g+='<path class="dhair" d="M'+(x-2.4*f*s)+' '+(H-.6*s)+' q'+(-2.4*f*s)+' '+(4.6*s)+' '+(.6*f*s)+' '+(7.4*s)+
     ' q'+(1.4*f*s)+' '+(-3.6*s)+' '+(1*f*s)+' '+(-7*s)+' Z"/>';
   else g+='<circle class="dhair" cx="'+x+'" cy="'+(H-3*s)+'" r="'+(1.1*s)+'"/>';
   if(act==="pray")g+='<path class="dlimb" d="M'+(x-2.2*s)+' '+sho+' q'+(2.2*s)+' '+(2.4*s)+' 0 '+(4.4*s)+
     ' M'+(x+2.2*s)+' '+sho+' q'+(-2.2*s)+' '+(2.4*s)+' 0 '+(4.4*s)+'"/>';
   else if(act==="point")g+='<path class="dlimb" d="M'+(x+2.2*s)+' '+sho+' q'+(4*f*s)+' '+(-1.4*s)+' '+(7.4*f*s)+' '+(-3.2*s)+'"/>';
   else if(act==="carry")g+='<path class="dlimb" d="M'+(x+2.2*s)+' '+sho+' q'+(2.6*f*s)+' '+(1.6*s)+' '+(1.4*f*s)+' '+(4.2*s)+'"/>'+
     '<ellipse class="dpot" cx="'+(x+3.6*f*s)+'" cy="'+(y-6.6*s)+'" rx="'+(2.2*s)+'" ry="'+(2.6*s)+'"/>';
   else if(woman)g+='<path class="dlimb dlimbfront" d="M'+(x+2.2*s)+' '+sho+' q'+(3*f*s)+' '+(2.2*s)+' '+(1.2*f*s)+' '+(5*s)+'"/>'+
     '<circle class="dbangle" cx="'+(x+3.4*f*s)+'" cy="'+(sho+5*s)+'" r="'+(.9*s)+'"/>';
   else g+='<path class="dlimb dlimbfront" d="M'+(x+2.2*s)+' '+sho+' q'+(3.4*f*s)+' '+(2.6*s)+' '+(2.6*f*s)+' '+(6.4*s)+'"/>';
   return g+"</g>";
  }

  /* ---- rakshasa: taller, heavier, wild hair, tusks, a pike in the fist ---- */
  if(kind==="rakshasa"){
   const H=y-18.4*s, hip=y-8.4*s, sho=y-14*s;
   let g='<g class="dper drak '+(act==="walk"?"dwalking":"")+'" style="animation-delay:'+d+'s">'+sh(5.4);
   g+=(act==="club"?mudgar(-f):shula(-f));
   g+='<path class="dlimbr dlimbback" d="M'+(x-3.4*s)+' '+sho+' q'+(-4*f*s)+' '+(2.6*s)+' '+(-1.6*f*s)+' '+(6.6*s)+'"/>';
   g+=legs("dlegr",hip,2.4,8.6);
   g+='<path class="drakcloth" d="M'+(x-4.4*s)+' '+hip+' h'+(8.8*s)+' l'+(1.4*s)+' '+(5*s)+' h'+(-11.6*s)+' Z"/>';
   g+='<path class="dtorsor" d="M'+(x-4.4*s)+' '+sho+' q'+(4.4*s)+' '+(-1.8*s)+' '+(8.8*s)+' 0 q'+(.6*s)+' '+(4*s)+' '+(-1.4*s)+' '+(6*s)+
    ' h'+(-6*s)+' q'+(-2*s)+' '+(-2*s)+' '+(-1.4*s)+' '+(-6*s)+' Z"/>';
   g+='<path class="dbelt" d="M'+(x-4.2*s)+' '+(hip-.6*s)+' h'+(8.4*s)+'"/>';
   g+='<circle class="dskinr" cx="'+x+'" cy="'+H+'" r="'+(2.9*s)+'"/>';
   g+='<path class="dhairr" d="M'+(x-3*s)+' '+(H-.6*s)+' l'+(-1.4*s)+' '+(-3*s)+' l'+(1.8*s)+' '+(1*s)+' l'+(.4*s)+' '+(-3.4*s)+
    ' l'+(1.6*s)+' '+(2.4*s)+' l'+(1.2*s)+' '+(-3*s)+' l'+(1.2*s)+' '+(3*s)+' l'+(1.6*s)+' '+(-2.2*s)+' l'+(.4*s)+' '+(3.2*s)+
    ' l'+(1.8*s)+' '+(-1*s)+' l'+(-1.4*s)+' '+(3*s)+' Z"/>';
   g+='<path class="dtusk" d="M'+(x-1.5*s)+' '+(H+1*s)+' l'+(.7*s)+' '+(1.8*s)+' l'+(.5*s)+' '+(-1.8*s)+' Z'+
    ' M'+(x+.4*s)+' '+(H+1*s)+' l'+(.7*s)+' '+(1.8*s)+' l'+(.5*s)+' '+(-1.8*s)+' Z"/>';
   g+='<circle class="deye" cx="'+(x-1.1*s)+'" cy="'+(H-.5*s)+'" r="'+(.6*s)+'"/>'+
      '<circle class="deye" cx="'+(x+1.1*s)+'" cy="'+(H-.5*s)+'" r="'+(.6*s)+'"/>';
   g+='<circle class="dring2" cx="'+(x-2.9*s)+'" cy="'+(H+1.6*s)+'" r="'+(.9*s)+'"/>'+
      '<circle class="dring2" cx="'+(x+2.9*s)+'" cy="'+(H+1.6*s)+'" r="'+(.9*s)+'"/>';
   g+='<path class="dlimbr" d="M'+(x+3.4*s)+' '+sho+' q'+(3*f*s)+' '+(-1*s)+' '+(1.6*f*s)+' '+(5.6*s)+'"/>';
   return g+"</g>";
  }

  /* ---- rakshasi: the guard women of the grove, each with a different face ---- */
  if(kind==="rakshasi"){
   const t=(i||0)%5, H=y-17.4*s, hip=y-8*s, sho=y-13.4*s;
   let g='<g class="dper drak" style="animation-delay:'+d+'s">'+sh(5);
   g+=mudgar(-f);
   g+='<path class="dlimbr dlimbback" d="M'+(x-3.2*s)+' '+sho+' q'+(-3.6*f*s)+' '+(2.8*s)+' '+(-1.6*f*s)+' '+(6.4*s)+'"/>';
   g+=legs("dlegr",hip,2.2,8.2);
   g+='<path class="drakcloth" d="M'+(x-4*s)+' '+hip+' h'+(8*s)+' l'+(1.4*s)+' '+(6.4*s)+' h'+(-10.8*s)+' Z"/>';
   g+='<path class="dtorsor" d="M'+(x-3.8*s)+' '+sho+' q'+(3.8*s)+' '+(-1.6*s)+' '+(7.6*s)+' 0 q'+(.4*s)+' '+(3.4*s)+' '+(-1.2*s)+' '+(5.4*s)+
    ' h'+(-5.2*s)+' q'+(-1.8*s)+' '+(-1.8*s)+' '+(-1.2*s)+' '+(-5.4*s)+' Z"/>';
   g+='<circle class="dskinr" cx="'+x+'" cy="'+H+'" r="'+(2.7*s)+'"/>';
   if(t===0){  /* boar face: a snout and one tusk */
    g+='<ellipse class="dsnout" cx="'+(x+1.8*f*s)+'" cy="'+(H+.8*s)+'" rx="'+(1.8*s)+'" ry="'+(1.3*s)+'"/>'+
       '<path class="dtusk" d="M'+(x+2.4*f*s)+' '+(H+.4*s)+' l'+(.5*f*s)+' '+(-2.2*s)+' l'+(.7*f*s)+' '+(2*s)+' Z"/>';
   }else if(t===1){  /* elephant ears */
    g+='<ellipse class="dskinr" cx="'+(x-3.4*s)+'" cy="'+(H+.4*s)+'" rx="'+(1.8*s)+'" ry="'+(2.6*s)+'"/>'+
       '<ellipse class="dskinr" cx="'+(x+3.4*s)+'" cy="'+(H+.4*s)+'" rx="'+(1.8*s)+'" ry="'+(2.6*s)+'"/>';
   }else if(t===2){  /* one eye only */
    g+='<circle class="deye" cx="'+x+'" cy="'+(H-.4*s)+'" r="'+(1.1*s)+'"/>';
   }else if(t===3){  /* ears hanging like cloth, long neck */
    g+='<path class="dskinr" d="M'+(x-2.8*s)+' '+(H-.4*s)+' q'+(-1.8*s)+' '+(4.4*s)+' '+(.6*s)+' '+(5*s)+' Z'+
       ' M'+(x+2.8*s)+' '+(H-.4*s)+' q'+(1.8*s)+' '+(4.4*s)+' '+(-.6*s)+' '+(5*s)+' Z"/>';
   }else{  /* hunched, with high teeth */
    g+='<path class="dtusk" d="M'+(x-1.4*s)+' '+(H+1*s)+' l'+(.7*s)+' '+(2*s)+' l'+(.5*s)+' '+(-2*s)+' Z"/>'+
       '<circle class="deye" cx="'+(x-1.2*s)+'" cy="'+(H-.6*s)+'" r="'+(.6*s)+'"/>'+
       '<circle class="deye" cx="'+(x+1.2*s)+'" cy="'+(H-.6*s)+'" r="'+(.6*s)+'"/>';
   }
   if(t!==1&&t!==3)g+='<path class="dhairr" d="M'+(x-2.8*s)+' '+(H-.8*s)+' l'+(-.6*s)+' '+(-2.6*s)+' l'+(1.8*s)+' '+(1.2*s)+
    ' l'+(.8*s)+' '+(-3*s)+' l'+(1.4*s)+' '+(2.8*s)+' l'+(1.6*s)+' '+(-2*s)+' l'+(.2*s)+' '+(3.6*s)+' Z"/>';
   g+='<path class="dlimbr" d="M'+(x+3.2*s)+' '+sho+' q'+(3*f*s)+' '+(-.8*s)+' '+(1.6*f*s)+' '+(5.4*s)+'"/>';
   return g+"</g>";
  }


  /* ---- gandharva: singer of the sky, wings behind, a veena across the chest ---- */
  if(kind==="gandharva"){
   const H=y-16*s, hip=y-7.4*s, sho=y-12.2*s;
   let g='<g class="dper dgan" style="animation-delay:'+d+'s">'+sh(4.2);
   g+='<g class="dwingg"><path class="dwing" d="M'+(x-1*s)+' '+(sho+.6*s)+' q'+(-8*s)+' '+(-3*s)+' '+(-10*s)+' '+(-9*s)+
    ' q'+(7*s)+' '+(2.6*s)+' '+(10*s)+' '+(7*s)+' Z"/>'+
    '<path class="dwing" d="M'+(x+1*s)+' '+(sho+.6*s)+' q'+(8*s)+' '+(-3*s)+' '+(10*s)+' '+(-9*s)+
    ' q'+(-7*s)+' '+(2.6*s)+' '+(-10*s)+' '+(7*s)+' Z"/></g>';
   g+=legs("dganleg",hip,1.7,7.2);
   g+='<path class="dganrobe" d="M'+(x-3*s)+' '+hip+' h'+(6*s)+' l'+(1.4*s)+' '+(6.6*s)+' h'+(-8.8*s)+' Z"/>';
   g+='<path class="dtorsog" d="M'+(x-2.9*s)+' '+sho+' q'+(2.9*s)+' '+(-1.3*s)+' '+(5.8*s)+' 0 l'+(-.5*s)+' '+(5*s)+' h'+(-4.8*s)+' Z"/>';
   g+='<circle class="dskind" cx="'+x+'" cy="'+H+'" r="'+(2.4*s)+'"/>';
   g+='<path class="dcrown" d="M'+(x-2.4*s)+' '+(H-1.8*s)+' l'+(.8*s)+' '+(-2.4*s)+' l'+(1.6*s)+' '+(1.6*s)+' l'+(1.6*s)+' '+(-1.6*s)+
    ' l'+(.8*s)+' '+(2.4*s)+' Z"/>';
   g+='<path class="dveena" d="M'+(x-3.6*s)+' '+(sho+5.4*s)+' l'+(7.6*s)+' '+(-5.6*s)+'"/>'+
    '<ellipse class="dveenab" cx="'+(x-4.2*s)+'" cy="'+(sho+5.8*s)+'" rx="'+(2*s)+'" ry="'+(2.4*s)+'"/>'+
    '<ellipse class="dveenab" cx="'+(x+4.2*s)+'" cy="'+(sho-.4*s)+'" rx="'+(1.3*s)+'" ry="'+(1.6*s)+'"/>';
   g+='<path class="dlimbg" d="M'+(x-2.9*s)+' '+sho+' q'+(-2.4*s)+' '+(3.4*s)+' '+(-.8*s)+' '+(5.2*s)+
    ' M'+(x+2.9*s)+' '+sho+' q'+(2.4*s)+' '+(1.4*s)+' '+(1.2*s)+' '+(3*s)+'"/>';
   return g+"</g>";
  }

  /* ---- apsara: the dance stance, one arm curved over the head ---- */
  if(kind==="apsara"){
   const H=y-16*s, hip=y-7.6*s, sho=y-12.2*s;
   let g='<g class="dper dapsara" style="animation-delay:'+d+'s">'+sh(4.2);
   g+='<path class="dlimbd" d="M'+(x-2.6*s)+' '+sho+' q'+(-4.4*f*s)+' '+(1.4*s)+' '+(-5.4*f*s)+' '+(4.6*s)+'"/>';
   g+=legs("dapleg",hip,1.7,7.4);
   g+='<path class="dapsaracloth" d="M'+(x-3.2*s)+' '+hip+' h'+(6.4*s)+' l'+(2*s)+' '+(7*s)+' h'+(-10.4*s)+' Z"/>';
   g+='<path class="dtorsod" d="M'+(x-2.8*s)+' '+sho+' q'+(2.8*s)+' '+(-1.3*s)+' '+(5.6*s)+' 0 l'+(-1.2*s)+' '+(5*s)+' h'+(-4*s)+' Z"/>';
   g+='<circle class="dskind" cx="'+x+'" cy="'+H+'" r="'+(2.4*s)+'"/>';
   g+='<path class="dhair" d="M'+(x-2.4*s)+' '+(H-.4*s)+' a'+(2.4*s)+' '+(2.4*s)+' 0 0 1 '+(4.8*s)+' 0 q'+(-2.4*s)+' '+(-1.7*s)+' '+(-4.8*s)+' 0 Z"/>'+
    '<path class="dhair" d="M'+(x+2.2*f*s)+' '+(H-.4*s)+' q'+(2.6*f*s)+' '+(4*s)+' '+(-.4*f*s)+' '+(6.6*s)+' q'+(-1*f*s)+' '+(-3.4*s)+' '+(-1.2*f*s)+' '+(-6*s)+' Z"/>';
   g+='<path class="dlimbd" d="M'+(x+2.6*s)+' '+sho+' q'+(5*f*s)+' '+(-2.6*s)+' '+(3.4*f*s)+' '+(-7*s)+'"/>';
   g+='<circle class="dbangle" cx="'+(x+5.4*f*s)+'" cy="'+(sho-6.4*s)+'" r="'+(1*s)+'"/>';
   return g+"</g>";
  }

  /* ---- rishi: matted hair, beard, staff and water pot ---- */
  if(kind==="rishi"){
   const H=y-15.6*s, hip=y-7.4*s, sho=y-12*s;
   let g='<g class="dper drishi" style="animation-delay:'+d+'s">'+sh(4.4);
   g+='<path class="dstaff" d="M'+(x-5*f*s)+' '+(y+.6*s)+' v'+(-18*s)+'"/>';
   g+=legs("dleg1p",hip,1.8,7.2);
   g+='<path class="drishirobe" d="M'+(x-3.4*s)+' '+hip+' h'+(6.8*s)+' l'+(1.4*s)+' '+(6.2*s)+' h'+(-9.6*s)+' Z"/>';
   g+='<path class="dtorso" d="M'+(x-3*s)+' '+sho+' q'+(3*s)+' '+(-1.4*s)+' '+(6*s)+' 0 l'+(-.6*s)+' '+(5*s)+' h'+(-4.8*s)+' Z"/>';
   g+='<path class="djanev" d="M'+(x-2.4*s)+' '+(sho+.4*s)+' l'+(4.6*s)+' '+(4.4*s)+'"/>';
   g+='<circle class="dskin" cx="'+x+'" cy="'+H+'" r="'+(2.4*s)+'"/>';
   g+='<path class="djata" d="M'+(x-2.4*s)+' '+(H-.4*s)+' a'+(2.4*s)+' '+(2.4*s)+' 0 0 1 '+(4.8*s)+' 0 Z"/>'+
    '<circle class="djata" cx="'+x+'" cy="'+(H-3.4*s)+'" r="'+(1.8*s)+'"/>';
   g+='<path class="djata" d="M'+(x-1.8*s)+' '+(H+1.4*s)+' q'+(1.8*s)+' '+(4.4*s)+' '+(3.6*s)+' 0 Z"/>';
   g+='<path class="dlimb" d="M'+(x+2.8*s)+' '+sho+' q'+(2.6*f*s)+' '+(2*s)+' '+(1.4*f*s)+' '+(4.6*s)+'"/>';
   g+='<ellipse class="dpot" cx="'+(x+4.2*f*s)+'" cy="'+(y-6*s)+'" rx="'+(1.8*s)+'" ry="'+(2.2*s)+'"/>';
   return g+"</g>";
  }

  /* ---- deva: still, haloed, one hand raised in blessing ---- */
  if(kind==="deva"){
   const H=y-16.2*s, hip=y-7.6*s, sho=y-12.4*s;
   let g='<g class="dper ddev" style="animation-delay:'+d+'s">'+sh(4.2);
   g+='<circle class="dhalo" cx="'+x+'" cy="'+H+'" r="'+(4.6*s)+'"/>';
   g+=legs("ddevleg",hip,1.8,7.4);
   g+='<path class="ddevrobe" d="M'+(x-3.2*s)+' '+hip+' h'+(6.4*s)+' l'+(1.2*s)+' '+(6.4*s)+' h'+(-8.8*s)+' Z"/>';
   g+='<path class="dtorsod" d="M'+(x-3*s)+' '+sho+' q'+(3*s)+' '+(-1.4*s)+' '+(6*s)+' 0 l'+(-.6*s)+' '+(5*s)+' h'+(-4.8*s)+' Z"/>';
   g+='<circle class="dskind" cx="'+x+'" cy="'+H+'" r="'+(2.4*s)+'"/>';
   g+='<path class="dcrown" d="M'+(x-2.4*s)+' '+(H-1.8*s)+' l'+(.8*s)+' '+(-3*s)+' l'+(1.6*s)+' '+(2*s)+' l'+(1.6*s)+' '+(-2*s)+
    ' l'+(.8*s)+' '+(3*s)+' Z"/>';
   g+='<path class="dlimbg" d="M'+(x+2.8*s)+' '+sho+' q'+(2.6*f*s)+' '+(-2.4*s)+' '+(1.6*f*s)+' '+(-5*s)+
    ' M'+(x-2.8*s)+' '+sho+' q'+(-2.2*s)+' '+(2.8*s)+' '+(-.8*s)+' '+(5*s)+'"/>';
   return g+"</g>";
  }

  /* ---- ravan: the king of the rakshasas, heads to either side ---- */
  if(kind==="ravan"){
   const H=y-19*s, hip=y-8.6*s, sho=y-14.4*s;
   let g='<g class="dper drak dravan">'+sh(6);
   g+=legs("dlegr",hip,2.6,8.8);
   g+='<path class="dking" d="M'+(x-5*s)+' '+hip+' h'+(10*s)+' l'+(1.6*s)+' '+(5.2*s)+' h'+(-13.2*s)+' Z"/>';
   g+='<path class="dtorsor" d="M'+(x-5*s)+' '+sho+' q'+(5*s)+' '+(-2*s)+' '+(10*s)+' 0 q'+(.6*s)+' '+(4*s)+' '+(-1.6*s)+' '+(6.2*s)+
    ' h'+(-6.8*s)+' q'+(-2.2*s)+' '+(-2.2*s)+' '+(-1.6*s)+' '+(-6.2*s)+' Z"/>';
   g+='<path class="dsash" d="M'+(x-4.4*s)+' '+(sho+1.4*s)+' l'+(8.8*s)+' '+(4*s)+'"/>';
   [-4.6,4.6].forEach(o=>{g+='<circle class="dskinr dsidehead" cx="'+(x+o*s)+'" cy="'+(H+2.2*s)+'" r="'+(1.9*s)+'"/>'+
     '<path class="dcrown" d="M'+(x+o*s-1.7*s)+' '+(H+.8*s)+' l'+(.7*s)+' '+(-1.8*s)+' l'+(1*s)+' '+(1.2*s)+' l'+(1*s)+' '+(-1.2*s)+
     ' l'+(.7*s)+' '+(1.8*s)+' Z"/>';});
   g+='<circle class="dskinr" cx="'+x+'" cy="'+H+'" r="'+(3.1*s)+'"/>';

  const k=x.src||"vr",nm=SRC[k].n;
  const c=(x.cards||[]).find(c=>CARDS[c]&&CARDS[c].s===k&&CARDS[c].ref);
  return nm+(c?" ("+CARDS[c].ref.split(";")[0].trim()+")":"");
 });
 return L.length>1?"इस पल को "+L.length+" ग्रंथ कहते हैं: "+bits.join(", ")
                  :"यह पल "+bits[0]+" से है";

function readLayer(k){
 if(!run)return null;
 const pre=run.N.id+"-";
 for(const key in SC){
  if(key.indexOf(pre)!==0)continue;
  const cut=key.lastIndexOf("-");
  const id=key.slice(pre.length,cut),w=+key.slice(cut+1);
  if(!PLACES[id]||!run.N.watches[w])continue;
  const L=layersOf(key);
  for(let i=0;i<L.length;i++)if((L[i].src||"vr")===k&&depthOf(key)>i)return {id:id,w:w,li:i};
 }
 return null;
}

   if(!SC[key]||!d)return;

   const line=(S.say||[]).find(x=>x&&x.length>12)||(S.say||[])[0]||"";
   const src=SRC[S.src||"vr"];
   const card=(S.cards||[]).find(c=>CARDS[c]&&CARDS[c].ref);
   rows.push({w:w.n,p:PLACES[id].n,line:line,src:src.n,

 });

 rows.forEach(r=>{

 });

 const list=Object.keys(used).sort((a,b)=>used[b]-used[a]).map(k=>k+" ("+used[k]+")").join(", ");
 el('<p class="quiet">इसमें '+rows.length+" पल हैं, और ये ग्रंथ बोले: "+list+"।</p>");
 const refs=[];rows.forEach(r=>{if(refs.indexOf(r.ref)<0)refs.push(r.ref);});

/* the moments of this night you have not read yet */
function missedList(){
 if(!run)return [];
 const out=[];
 run.N.watches.forEach((w,i)=>{
  w.spots.forEach(id=>{
   const key=run.N.id+"-"+id+"-"+i;if(!SC[key])return;
   const L=layersOf(key),d=depthOf(key);
   for(let li=d;li<L.length;li++)
    out.push({id:id,w:i,li:li,p:PLACES[id].n,w_n:run.N.watches[i].n,
              src:SRC[L[li].src||"vr"].n});
  });
 });
 return out.slice(0,8);
}
function whereFound(c){                  /* which moment holds this find */
 let out="";
 Object.keys(SC).forEach(k=>{
  if(out)return;
  layersOf(k).forEach(L=>{
   if(out||!(L.cards||[]).includes(c))return;
   const cut=k.lastIndexOf("-"),night=k.slice(0,k.indexOf("-"));
   const id=k.slice(night.length+1,cut),w=+k.slice(cut+1);
   const N=NIGHTS.find(n=>n.id===night);
   if(N&&PLACES[id])out=PLACES[id].n+", "+N.watches[w].n;
  });
 });
 return out;
}
let findQ="";
function drawFind(){
 const box=document.getElementById("findout");if(!box)return;
 const q=(findQ||"").trim();
 if(q.length<2){box.innerHTML='<p class="shut-note">दो अक्षर या उससे ज़्यादा लिखो।</p>';return;}
 const hit=[];
 Object.keys(CARDS).forEach(c=>{const C=CARDS[c];
  if(!save.cards[c])return;
  if((C.t+" "+C.x).indexOf(q)>-1)hit.push({k:"बात",n:C.t,go:()=>deepCard(c)});});
 Object.keys(PATRA).forEach(k=>{const P=PATRA[k];
  if(!(save.patra&&save.patra[k]))return;
  if((P.n+" "+P.x).indexOf(q)>-1)hit.push({k:"पात्र",n:P.n,go:()=>deepPerson(k)});});
 Object.keys(VASTU).forEach(k=>{const V=VASTU[k];
  if(!vastuGot(k))return;
  if((V.n+" "+V.x+" "+V.who+" "+V.from).indexOf(q)>-1)hit.push({k:VKIND[V.k],n:V.n,go:()=>deepVastu(k)});});
 Object.keys(PLACES).forEach(id=>{const P=PLACES[id];
  if((P.n+" "+P.t+" "+(P.lore||"")).indexOf(q)>-1)hit.push({k:"जगह",n:P.n,go:()=>deepPlace(id)});});
 Object.keys(SRC).forEach(k=>{const S=SRC[k];
  if((S.n+" "+(S.lore||"")+" "+(S.who||"")+" "+(S.lang||"")).indexOf(q)>-1)
   hit.push({k:"ग्रंथ",n:S.n,go:()=>deepGranth(k)});});
 if(!hit.length){box.innerHTML='<p class="shut-note">कुछ नहीं मिला। हो सकता है वह बात अभी खुली न हो।</p>';return;}
 box.innerHTML='<p class="shut-note">'+hit.length+" मिलीं</p>"+
  hit.slice(0,40).map((h,i)=>'<div class="note tapme" data-hit="'+i+'"><div class="who">'+h.n+
   '</div><span class="vkind">'+h.k+'</span><span class="more">पूरा पढ़ो</span></div>').join("");
 box.querySelectorAll("[data-hit]").forEach(b=>{b.onclick=()=>hit[+b.dataset.hit].go();});
}
