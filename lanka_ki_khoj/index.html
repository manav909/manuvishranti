 nikumbhila_naam:{t:"धमकी में आया एक नाम",l:"chh",x:"वाटिका में डराती हुई राक्षसियाँ एक जगह का नाम लेती हैं: निकुंभिला। वे कहती हैं कि इसका मांस खाकर वहीं नाचेंगी। उस वक़्त वह सिर्फ़ एक धमकी है। पर वही मैदान आगे की कथा में सबसे बड़ा मोड़ बनता है, क्योंकि वहीं रावण का बेटा वह यज्ञ करता है जिसके पूरा होने पर उसे कोई हरा नहीं सकता।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 24"},
 manas_nikumbhila:{t:"वही नाम, आगे की लड़ाई में",l:"gr",x:"मानस में यह नाम इस रात नहीं आता, आगे की लड़ाई में आता है। वहाँ रावण का बेटा निकुंभिला पर यज्ञ करता है, और वही यज्ञ तोड़ा जाता है, जिससे लड़ाई का रुख़ बदल जाता है। इससे पता चलता है कि कथा में कोई नाम यूँ ही नहीं रखा जाता, वह आगे कहीं लौटकर आता है।",s:"manas",p:1,ref:"रामचरितमानस, लंकाकांड"},
 mainak_karz:{t:"रुकने से मना करना",l:"man",x:"पहाड़ सामने आकर कहता है कि थोड़ी देर ठहर जाइए, और वह न्योता सच्चा है, क्योंकि उसके पीछे एक पुराना एहसान है। फिर भी मना कर दिया जाता है, और कारण भी साफ़ बताया जाता है: दिन ढल रहा है और वचन दिया जा चुका है। आदर के साथ मना करना भी एक कला है, और इस पूरी रात में यह पहला मौक़ा है जहाँ वह दिखती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 mainak_chhoti:{t:"वहाँ पहाड़ रुकता नहीं",l:"gr",x:"असम की कथा में यह पूरा ठहराव एक साँस में निपट जाता है। पहाड़ उठता है, अपनी बात कहता है, और पीछे छूट जाता है। कवि ने ख़ुद लिखा है कि उन्होंने विस्तार छोड़कर सार लिया, और यहाँ वह साफ़ दिखता है। जो दृश्य वाल्मीकि में कई श्लोकों का है, वहाँ वह दो पंक्तियों का है।",s:"kandali",p:1,ref:"सप्तकांड रामायण, सुंदरकांड"},
 molla_hisab:{t:"सिर्फ़ नतीजा",l:"gr",x:"तेलुगु की उस छोटी कथा में लौटकर सुनाने का पूरा हाल थोड़े में कह दिया जाता है। वहाँ हर बात दोहराई नहीं जाती, सिर्फ़ नतीजा रखा जाता है, और सुनने वाले को उतना ही मिलता है जितना आगे बढ़ने के लिए चाहिए। वाल्मीकि यही हाल तीन बार सुनवाते हैं, और वहाँ एक बार में निपट जाता है।",s:"molla",p:1,ref:"मोल्ला रामायणम्"},
 giridhar_sur:{t:"ख़बर सुर से पहुँचती है",l:"gr",x:"गुजराती की उस कथा में यह पल गाकर कहा जाता है, और हर प्रसंग की अपनी धुन तय है। इसलिए धुन बदलते ही सुनने वाला समझ जाता है कि अब ख़ुशी की बात आने वाली है। शब्द बाद में आते हैं, सुर पहले पहुँचता है, और यही गाई जाने वाली कथाओं की अपनी ताक़त है।",s:"giridhar",p:1,ref:"गिरधर रामायण, 1835"},
 jn_log:{t:"वहाँ राक्षस नहीं, लोग हैं",l:"chh",x:"जैन परंपरा में लंका के रहने वाले राक्षस नहीं, विद्याधर हैं। वे मांस नहीं खाते और डरावने नहीं हैं, वे बस दूसरे लोग हैं, जिनके पास कुछ विद्याएँ हैं। इसीलिए इस कथा में दुश्मनी तो है पर नफ़रत नहीं, और यही उसका सबसे बड़ा फ़र्क़ है।",s:"jain",p:1,ref:"पउमचरिय, विमलसूरि"},
 jn_sikha:{t:"उड़ना सीखी हुई विद्या",l:"chh",x:"यहाँ उड़ना किसी वरदान से नहीं आता, सीखा जाता है। जिसने विद्या सीखी, वह उड़ा। इसीलिए इस कथा में उड़ान पर कोई चौंकता नहीं, और रास्ते की वे तीनों रुकावटें भी नहीं आतीं जो बाकी कथाओं में सबसे मशहूर हैं।",s:"jain",p:1,ref:"पउमचरिय, विमलसूरि"},
 jn_bheja:{t:"अँगूठी लेकर आया दूत",l:"chh",x:"दूत यहाँ चोरी छिपे नहीं आता, भेजा जाता है, और उसके पास राम की अँगूठी है। लौटते वक़्त वह सीता की चूड़ामणि लेकर जाता है। इसलिए पकड़े जाने, बँधने और सज़ा वाली वह पूरी कड़ी इस परंपरा में है ही नहीं।",s:"jain",p:1,ref:"पउमचरिय; इस परंपरा में दूत वाला प्रसंग"},
 jn_binabandh:{t:"बिना बंधन वाला दरबार",l:"chh",x:"दरबार में वह बँधा हुआ नहीं आता, इसलिए न मंत्रियों की मारने वाली राय होती है, न विभीषण का नियम याद दिलाना, न पूँछ वाला दंड। बात सीधे होती है और उसी तरह ख़त्म भी। जो दृश्य बाकी कथाओं में सबसे बड़ा मोड़ है, वह यहाँ ग़ायब है।",s:"jain",p:1,ref:"पउमचरिय, विमलसूरि"},
 jn_aag:{t:"आग वही, कारण दूसरा",l:"chh",x:"लंका यहाँ भी जलती है, पर पूँछ से नहीं। इस परंपरा में वह दृश्य आता ही नहीं जिसे बाकी सब सबसे ज़्यादा याद रखते हैं। अंत वही रहता है और रास्ता पूरा बदल जाता है, और यही बताता है कि कथा का अंत एक होने पर भी उसका अर्थ अलग हो सकता है।",s:"jain",p:1,ref:"पउमचरिय, विमलसूरि"},
 jn_seedha:{t:"बिना नाटक के लौटना",l:"man",x:"निशानी लेकर वह सीधे लौट जाता है। न जलती पूँछ, न तमाशा, न सज़ा। काम हुआ और लौटना हुआ। जो कथा हर बात का कारण बताती है, वह अंत भी बिना नाटक के करती है, और इसी सादगी में उसकी अपनी ताक़त है।",s:"jain",p:1,ref:"पउमचरिय, विमलसूरि"},
 gobind_dwar:{t:"सोचने की जगह सामना",l:"gr",x:"ब्रजभाषा वाली उस रचना में फाटक पर रुकने की जगह सामना करने की बात आती है। वहाँ छंद छोटे और तेज़ हैं, इसलिए ठहराव कम और आगे बढ़ना ज़्यादा है। हिम्मत सिखाने वाली कथा में सोचने का हिस्सा भी छोटा रखा जाता है।",s:"gobind",p:1,ref:"दसम ग्रंथ, रामावतार"},
 mbh_kinara:{t:"एक पंक्ति में उतरना",l:"gr",x:"रामोपाख्यान में यह पूरा उतरना एक पंक्ति में बीत जाता है। वहाँ कथा किसी को सहारा देने के लिए कही जा रही है, इसलिए ब्योरे की जगह नहीं है। सुनने वाले को यह जानना है कि आगे क्या हुआ, यह नहीं कि पैर कहाँ पड़े।",s:"mbh",p:1,ref:"महाभारत, वनपर्व का रामोपाख्यान"},
 tib_tukde:{t:"गुफा में बचे टुकड़े",l:"gr",x:"हिमालय के पार मिली उस कथा के पन्ने टुकड़ों में हैं। दुनहुआंग की गुफाओं में सदियों तक बंद पड़ी पोथियों में से कुछ हिस्से तिब्बती रामकथा के निकले, और खोतान की कथा भी उन्हीं से मिलती जुलती है। इसलिए वहाँ पूरा दृश्य नहीं मिलता, बस इतना कि यह रात वहाँ तक पहुँची थी। जो बचा है, वही सबूत है, और वही बताता है कि कहानियाँ भी व्यापार के रास्तों पर चलती थीं।",s:"tibbati",p:1,ref:"दुनहुआंग से मिली तिब्बती पांडुलिपियाँ"},
 kannassa_ghar:{t:"कम शब्दों की गली",l:"gr",x:"चौदहवीं सदी की उस मलयालम रचना में घरों का ब्योरा थोड़े में आता है। भाषा तब बन ही रही थी, इसलिए वाक्य सीधे और कम हैं। फिर भी वही कम शब्द उस गली को खड़ा कर देते हैं।",s:"kannassa",p:1,ref:"कण्णस्स रामायणम्, निरणम राम पणिक्कर"},
 maranao_gaana:{t:"शोर भी ताल में",l:"gr",x:"लानाओ झील के आसपास यह हिस्सा गाकर सुनाया जाता है। गाने वाला भीड़ की हलचल को ताल में बाँध देता है, इसलिए वहाँ शोर भी लय में सुनाई देता है। कथा वहाँ पढ़ी नहीं, सुनी जाती है।",s:"maranao",p:1,ref:"महारादिया लावाना, मरानाओ परंपरा"},
 mappila_bagh:{t:"उजड़ना, हँसी के साथ",l:"gr",x:"मालाबार की उस गाई जाने वाली कथा में यह उजाड़ना हँसी के साथ कहा जाता है। गाने वाला बीच में चुटकी लेता है, और सुनने वाले हँस पड़ते हैं। उसी हँसी के भीतर से कथा आगे बढ़ती है।",s:"mappila",p:1,ref:"मापिला रामायणम्, मालाबार"},
 ramch_yuddh:{t:"कथा बीच से उठाई गई",l:"gr",x:"मलयालम की सबसे पुरानी बची हुई रचना इसी कथा पर है, पर वह इस घड़ी से आगे की बात कहती है। उसमें लौटकर सुनाना नहीं, सीधे लड़ाई है। यानी उस भाषा ने कथा को बीच से उठाया, शुरू से नहीं।",s:"ramacharitam",p:1,ref:"रामचरितम्, चीरामन"},
 lao_chadhai:{t:"जल्दी के बिना चढ़ाई",l:"gr",x:"लाओ कथा में यह चढ़ाई शांत ढंग से कही जाती है। वहाँ राम को बुद्ध का पहले का जन्म माना जाता है, इसलिए जीत का जोश कम और ठहराव ज़्यादा है। आख़िरी क़दम वहाँ भी अकेले के हैं, पर उनमें जल्दी नहीं है।",s:"lao",p:1,ref:"फ्रा लक फ्रा लाम, लाओ परंपरा"},
 r_niyam:{t:"दूत मारा नहीं जाता",l:"chh",x:"मंत्री मार डालने की राय दे चुके थे, और तभी विभीषण खड़ा होकर वह पुराना नियम याद दिलाता है कि दूत को मारा नहीं जाता, उसे दंड देकर लौटाया जाता है। रावण यह मान लेता है। पूरी रात में यही अकेली जगह है जहाँ किसी को नियम बचाता है, ताक़त नहीं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 52"},
 r_ulta:{t:"नियम मानने से जो हुआ",l:"man",x:"नियम माना गया, इसलिए मारने की जगह पूँछ जलाने की सज़ा तय हुई। और उसी सज़ा से नगर जला। यानी जिस बात ने दूत को बचाया, उसी ने नगर को जलाया। कथा इसे कहती नहीं, होने देती है, और यही उसका सबसे तीखा हिस्सा है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 52 और 53"},
 r_rang:{t:"दरबार में मंदोदरी भी बोलती है",l:"gr",x:"रंगनाथ रामायण में दरबार की बातें और खुलकर आती हैं, और वहाँ मंदोदरी भी नीति की बात कहती है तथा समझाने की कोशिश करती है। दरबार में सिर्फ़ मंत्री नहीं बोलते, यह बात वही कथा दिखाती है, और उससे वह दरबार ज़्यादा असली लगने लगता है।",s:"ranganatha",p:1,ref:"रंगनाथ रामायण, सुंदरकांड"},
 r_dut:{t:"मैं भेजा हुआ हूँ",l:"chh",x:"बँधा हुआ आदमी बीच दरबार में खड़ा होकर कहता है कि वह किसी का भेजा हुआ है, और दूत होने के नाते उसे बोलने का हक़ है। वही हक़ माँगकर वह पूरा संदेश कह देता है। अधिकार यहाँ पद से नहीं, काम से आता है, और दरबार को वह मानना पड़ता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 51"},
 r_sandesh:{t:"बँधे हुए का भाषण",l:"man",x:"वह जो कहता है वह विनती नहीं है। वह रावण से कहता है कि सीता लौटा दो, वरना जो होगा उसे रोकना तुम्हारे बस में नहीं होगा। बँधा हुआ आदमी जब शर्त रखे, तो साफ़ हो जाता है कि असली दबाव किस तरफ़ है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 51"},
 r_jain:{t:"वहाँ यह कड़ी है ही नहीं",l:"gr",x:"जैन कथा में यह पूरी कड़ी आती ही नहीं, क्योंकि वहाँ दूत बँधकर नहीं आता। वह खुलकर आता है और उसका हक़ पहले से माना हुआ है। जहाँ अधिकार पहले से तय हो, वहाँ उसे माँगना नहीं पड़ता, और यही उस परंपरा का अपना ढंग है।",s:"jain",p:1,ref:"पउमचरिय, विमलसूरि"},
 r_sunna:{t:"शिकायत सुनने का ढंग",l:"man",x:"बाग़ का रखवाला दौड़ा हुआ आता है और पैरों में गिरकर शिकायत करता है। सुग्रीव सुनता है और उलटा अर्थ निकालता है: जो हारकर लौटते हैं वे ऐसा ऊधम नहीं करते, इसलिए काम हो चुका है। सुनने का यही ढंग राजा को राजा बनाता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 62 और 63"},
 r_maaf:{t:"सज़ा की जगह समझाना",l:"man",x:"शिकायत करने वाले को सज़ा नहीं मिलती, उसे समझाकर लौटा दिया जाता है। उसने अपना काम किया था, और राजा ने अपना। इस पूरी कथा में यह अकेली जगह है जहाँ किसी की शिकायत ख़ारिज होकर भी उसका मान बचा रहता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 63"},
 r_kamba_darbar:{t:"वहाँ लहजे पर भी नज़र है",l:"gr",x:"तमिल कथा में दरबार की मर्यादा हर दृश्य में साथ चलती है, और कवि की नज़र इस पर रहती है कि कौन किससे किस लहजे में बोल रहा है। इसलिए वहाँ शिकायत भी क़ायदे के भीतर कही जाती है, और जवाब भी उसी तरह आता है।",s:"kamba",p:1,ref:"कंब रामायण, सुंदर कांडम्"},
 r_pehla:{t:"ख़बर के बाद पहला सवाल",l:"man",x:"ख़बर मिलते ही जो पहला सवाल पूछा जाता है, वह यह नहीं होता कि लंका कैसी है या कितने मारे गए। पूछा यह जाता है कि वे कैसी हैं और उन्होंने क्या कहा। कोई भी बड़ा फ़ैसला ख़बर से नहीं, उसके बाद पूछे गए सवाल से बनता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 65 और 66"},
 r_kya:{t:"जवाब में निशानी",l:"chh",x:"जवाब में सबसे पहले चूड़ामणि रखी जाती है, फिर कही हुई बात दोहराई जाती है, और आख़िर में वह अवधि बताई जाती है जो रावण ने दी थी। तीनों चीज़ें अलग अलग काम करती हैं: एक सबूत है, दूसरी भरोसा, और तीसरी घड़ी की चेतावनी।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 65 और 66"},
 r_adhy_milan:{t:"वहाँ सवाल से पहले गले लगाना",l:"gr",x:"अध्यात्म वाली कथा में यह घड़ी गले लगाने पर ठहरती है। वहाँ सवाल से पहले पहचान आती है, और पहचान ही सबसे बड़ा जवाब है। इसलिए वहाँ यह हिस्सा नीति का नहीं, मिलन का है, और उसी से उस पाठ का पूरा मिज़ाज पता चलता है।",s:"adhy",p:1,ref:"अध्यात्म रामायण, सुंदरकांड"},
 j_nahi:{t:"न मिलना भी एक ख़बर है",l:"man",x:"यह पूरा हिस्सा छान लिया गया और यहाँ कुछ नहीं मिला। कथा ऐसे कोनों को छोड़ती नहीं, गिनाती है। हर ख़ाली कोना अगली जगह को थोड़ा और पक्का कर देता है, और यही खोज का असली ढंग है, चाहे वह किसी नगर में हो या किसी किताब में।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 5 से 13"},
 j_gin:{t:"गिनी हुई नाकामी",l:"chh",x:"वाल्मीकि इन हिस्सों को एक एक करके गिनाते हैं: महल, पुष्पक, अंतःपुर, पानगृह, चित्रशाला। हर बार वही नतीजा आता है और हर बार वह लिखा जाता है। इसी गिनती से पता चलता है कि खोज में कितनी देर लगी और ढूँढने वाला कितना थक चुका था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 5 से 13"},
 j_eknath:{t:"मराठी में हर कोना नाम से",l:"gr",x:"भावार्थ रामायण में ये ख़ाली कोने नाम लेकर गिनाए जाते हैं, एक एक बाग़ और एक एक हिस्सा। हर बार वही नतीजा आता है। इसी गिनती से वहाँ सुनने वाले को यह एहसास होता है कि खोज में सचमुच कितना वक़्त लगा।",s:"eknath",p:1,ref:"भावार्थ रामायण, एकनाथ, सुंदरकांड"},
 j_do:{t:"दो खुले रास्ते",l:"chh",x:"नगर के भीतर कई जगह ऐसी आती हैं जहाँ से दो रास्ते निकलते हैं और दोनों खुले होते हैं। एक तरफ़ भरी हुई बस्ती और दूसरी तरफ़ ऊँची दीवारें और चुप्पी। कथा में इन मोड़ों का ब्योरा इसलिए है कि खोज सीधी नहीं थी, उसमें कई बार लौटना भी पड़ा।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 4 से 6"},
 j_faisla:{t:"रास्ता ढूँढने वाले ने चुना",l:"man",x:"इस रात में कई बार आगे का रास्ता किसी और ने नहीं, ढूँढने वाले के अपने फ़ैसले ने तय किया। कोई बताने वाला साथ नहीं था। यही बात इस कांड को बाकी कांडों से अलग करती है, क्योंकि यहाँ पूरी कथा एक आदमी के अपने फ़ैसलों से बनती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2 से 13"},
 j_kritti2:{t:"बांग्ला में हर मोड़ पर ठहराव",l:"gr",x:"कृत्तिवासी रामायण में रास्ते का यह चुनाव घर की बात जैसा कहा जाता है, और सुनाने वाला सुनने वालों से बात करता चलता है। इसलिए वहाँ हर मोड़ पर एक छोटा सा ठहराव आ जाता है, जिससे कथा सुनने में आसान हो जाती है।",s:"krittivasa",p:1,ref:"कृत्तिवासी रामायण, सुंदरकांड"},
 j_bacha:{t:"बचे हुए सवाल",l:"man",x:"सब कह दिया गया, और फिर भी कुछ सवाल बचे रह जाते हैं। जो छाया थी वह क्या थी, जो पीछे छूट गए उनका क्या हुआ, और जो नगर जला उसमें कौन कौन था। कथा हर बात का जवाब नहीं देती, और यह कमी नहीं है, यही उसे ज़िंदा रखती है।",s:"vr",p:1,ref:"सुंदरकांड; और आगे की परंपराएँ"},
 j_aage:{t:"अधूरेपन से बनी नई कथाएँ",l:"man",x:"यही अधूरापन आगे की कथाओं को जन्म देता है। छाया वाली सीता, पाताल की दूसरी लंका, हज़ार मुँह वाला रावण, ये सब उन्हीं बचे हुए सवालों से निकले हैं। इसी वजह से इस एक रात पर सदियों से लिखा जाता रहा और आज भी लिखा जा रहा है।",s:"vr",p:1,ref:"विलंका रामायण; अद्भुत रामायण; कूर्म पुराण"},
 j_vilanka2:{t:"वहीं से एक और कथा शुरू होती है",l:"gr",x:"ओड़िया की विलंका रामायण ऐसे ही एक सवाल से शुरू होती है। जहाँ बाकी सब ख़त्म करते हैं, वह वहीं से चलना शुरू करती है और बीस अध्यायों की एक और रात लिखती है। यही बताता है कि कथाएँ ख़त्म नहीं होतीं, दूसरी कथाओं में बदल जाती हैं।",s:"sarala",p:1,ref:"विलंका रामायण, सारला दास"},
 s_28:{t:"वह सर्ग जो यहाँ नहीं है",l:"chh",x:"वाल्मीकि के सुंदरकांड का एक पूरा सर्ग उस हाल का है जब बैठी हुई स्त्री अपने बारे में सबसे कठोर बात सोचती हैं। इस खेल में वह सर्ग जान बूझकर नहीं लिखा गया, क्योंकि उसे ब्योरे में रखना ठीक नहीं लगा। कथा उसके अगले सर्ग से फिर सँभलती है, और वह हिस्सा खेल में मौजूद है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 28 और 29"},
 s_chunav:{t:"क्या छोड़ा गया, यह भी पाठ है",l:"man",x:"किसी पाठ को समझने के लिए यह देखना भी ज़रूरी है कि उसने क्या छोड़ा और क्यों। इस खेल ने एक सर्ग छोड़ा है और वह बात छिपाई नहीं गई। पुरानी परंपराओं ने भी यही किया है: कोई कथा एक दृश्य पर रुकती है और कोई उसे छोड़कर आगे बढ़ जाती है, और वही उसकी पहचान बन जाती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 28"},
 s_adhy_28:{t:"वहाँ यह बंधन दूसरी चीज़ है",l:"gr",x:"अध्यात्म रामायण इस हाल को दूसरी तरह पढ़ती है। वहाँ यह बंधन जीव के बंधन जैसा है, और छूटना पहचान लौटने जैसा। इसलिए ब्योरे की जगह अर्थ आता है। एक ही हाल, और दो पाठों में दो अलग रास्ते।",s:"adhy",p:1,ref:"अध्यात्म रामायण, सुंदरकांड"},
 s_kyon:{t:"यह कांड सुंदर क्यों",l:"chh",x:"रामायण के सातों कांडों में बाकी छह के नाम जगह या घटना पर हैं: बाल, अयोध्या, अरण्य, किष्किंधा, युद्ध और उत्तर। यह अकेला कांड है जिसका नाम किसी गुण पर है। इसी सवाल पर सदियों से टीकाएँ लिखी गई हैं, और हर परंपरा ने अपना जवाब दिया है।",s:"vr",p:1,ref:"वाल्मीकि रामायण, कांडों के नाम"},
 s_alag:{t:"अलग से पढ़ा जाने वाला कांड",l:"man",x:"यही अकेला कांड है जिसे लोग पूरी रामायण से अलग करके भी पढ़ते हैं। बाकी कांड क्रम में पढ़े जाते हैं, और यह अपने आप में पूरा माना जाता है। इसकी एक वजह यह भी है कि इसमें कथा शुरू से अंत तक एक ही आदमी के साथ चलती है और एक ही रात में पूरी हो जाती है।",s:"vr",p:1,ref:"सुंदरकांड; पाठ की परंपरा"},
 s_chalisa:{t:"एक चौपाई में पूरी रात",l:"gr",x:"हनुमान चालीसा में यही पूरी रात एक चौपाई में आ जाती है: छोटा रूप धरकर दिखाई देना और डरावना रूप धरकर लंका जलाना। जो कांड अलग से पढ़ा जाता हो, उसकी गूँज ऐसी छोटी रचनाओं में भी मिलती है, और वहीं से वह सबसे ज़्यादा लोगों तक पहुँचता है।",s:"chalisa",p:1,ref:"हनुमान चालीसा, चौपाई 9"},
 s_paath:{t:"जहाँ कवि सीधे बात करता है",l:"chh",x:"कांड के अंत में कवि सुनने वाले से सीधे बात करता है और बताता है कि इसे पढ़ने या सुनने से क्या मिलता है। यही वह हिस्सा है जिसे लोग पाठ के अंत में पढ़ते हैं। कथा के भीतर से निकलकर कथा के बाहर आना, यह पुराने ग्रंथों का अपना ढंग है।",s:"vr",p:1,ref:"सुंदरकांड का अंतिम भाग"},
 s_ghar:{t:"घरों तक पहुँचा हुआ कांड",l:"man",x:"इसी वजह से सुंदरकांड घरों में अलग से पढ़ा जाने वाला कांड बन गया। मंगलवार और शनिवार को इसका पाठ आम है, और कई घरों में यही अकेला हिस्सा है जो पूरा पढ़ा जाता है। किसी कथा का घर तक पहुँच जाना अपने आप में उसकी सबसे बड़ी परीक्षा है।",s:"vr",p:1,ref:"सुंदरकांड; पाठ की परंपरा"},
 s_kamba_ant:{t:"वहाँ अंत झुकने पर है",l:"gr",x:"तमिल कथा में आख़िरी अध्याय का नाम तिरुवडि तोऴुद पडलम् है, यानी चरणों में सिर रखने वाला अध्याय। वहाँ अंत ख़बर पर नहीं, झुकने पर होता है। अंत का नाम बता देता है कि उस परंपरा के लिए सबसे बड़ी बात क्या थी।",s:"kamba",p:1,ref:"कंब रामायण, सुंदर कांडम्"},
 sd_sawal:{t:"ख़ुद से पूछा गया सवाल",l:"man",x:"सोई हुई स्त्रियों के बीच से गुज़रते हुए वे रुककर ख़ुद से पूछते हैं कि यह देखना ठीक है या नहीं। वाल्मीकि यह सवाल छिपाते नहीं, खुलकर रखते हैं। किसी पात्र का अपने ही काम पर सवाल उठाना उसे बड़ा बनाता है, छोटा नहीं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 11"},
 sd_jawab:{t:"और उसी का जवाब",l:"man",x:"जवाब भी वही देते हैं: ढूँढना उसी जगह पड़ता है जहाँ वह हो सकती है, और देखते हुए मन में कोई हलचल नहीं है। यानी काम वही रहता है, और नीयत उसे साफ़ कर देती है। इस पूरी रात का सबसे कठिन पहरा यही है, और वह बाहर नहीं, भीतर लगा है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 11"},
 sd_manas:{t:"मानस यह सवाल उठाता ही नहीं",l:"gr",x:"मानस इस सवाल पर ठहरता नहीं, क्योंकि वहाँ यह बात पहले से तय है कि भीतर जाने वाला किस भाव से जा रहा है। इसलिए तुलसीदास को यह सवाल उठाने की ज़रूरत ही नहीं पड़ती। दो पाठों का यह फ़र्क़ बताता है कि हर कथा अपने सुनने वालों को जानती है।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड"},
 sd_naam:{t:"नाम लेकर बढ़ता क़दम",l:"man",x:"हर मुश्किल से पहले वही एक नाम लिया जाता है और फिर क़दम बढ़ता है। यह जादू नहीं, ठहरने का तरीक़ा है, क्योंकि नाम लेते ही जल्दी उतर जाती है और सोचने की जगह बन जाती है। इसी वजह से यह कांड डर के वक़्त पढ़ा जाने वाला पाठ बना।",s:"vr",p:1,ref:"सुंदरकांड; और रामचरितमानस, सुंदरकांड"},
 sd_paath:{t:"कथा से पाठ तक",l:"man",x:"यही वह मोड़ है जहाँ एक कथा पढ़ने की चीज़ से दोहराने की चीज़ बन जाती है। लोग इसे कहानी की तरह कम और सहारे की तरह ज़्यादा पढ़ते हैं। कोई कथा जब रोज़ दोहराई जाने लगे, तो वह किताब में नहीं, लोगों में रहने लगती है।",s:"vr",p:1,ref:"सुंदरकांड; पाठ की परंपरा"},
 sd_sumiri:{t:"सुमिरि नरहरी",l:"gr",x:"मानस में यह बात एक ही पंक्ति में आ जाती है: छोटा रूप लेकर वे राम को याद करते हुए लंका की तरफ़ चले। यही वह पंक्ति है जो सबसे ज़्यादा दोहराई जाती है, क्योंकि उसमें डर और सहारा दोनों एक साथ हैं।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड"},
 sd_wait:{t:"कुछ न करना भी काम है",l:"man",x:"बाग़ में पहुँचकर तुरंत सामने आना सबसे आसान होता, और सबसे ग़लत भी। इसलिए वहाँ घंटों सिर्फ़ बैठकर देखना पड़ता है। न बोलना, न हिलना, क्योंकि एक भी ग़लत क़दम पूरी रात बेकार कर देगा। कथा इस ठहराव को उतनी ही जगह देती है जितनी लड़ाई को।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 15 से 17"},
 sd_samay:{t:"सही वक़्त की परख",l:"man",x:"वे ख़ुद कहते हैं कि काम की सफलता देश और काल के मेल पर टिकी है। इसी सोच से साँझ का इंतज़ार किया गया, इसी से डाल पर बैठकर देखा गया, और इसी से बात तब शुरू हुई जब रावण जा चुका था। पूरी रात में सबसे काम की चीज़ ताक़त नहीं, वक़्त की परख है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2 और 30"},
 sd_adhy_wait:{t:"वहाँ इंतज़ार साधना है",l:"gr",x:"अध्यात्म वाली कथा इस ठहराव को दर्शन की तरह पढ़ती है। वहाँ इंतज़ार बाधा नहीं, अपने आप में एक साधना है, क्योंकि पहचान लौटने में वक़्त लगता है। उसी नज़र से यह पूरा कोना बदल जाता है, और जो अटकाव लगता था वह रास्ता बन जाता है।",s:"adhy",p:1,ref:"अध्यात्म रामायण, सुंदरकांड"},
 k_bhram:{t:"पल भर की ग़लतफ़हमी",l:"chh",x:"महल के एक कमरे में सोई हुई स्त्री को देखकर पल भर के लिए लगता है कि खोज पूरी हो गई, और ख़ुशी में वे उछल पड़ते हैं। वाल्मीकि इस भूल को छिपाते नहीं, पूरा दिखाते हैं, क्योंकि उसी से पता चलता है कि ढूँढने वाला कितना थक चुका था और कितना चाहता था कि काम पूरा हो जाए।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 10 और 11"},
 k_tark:{t:"अपने ही तर्क से टूटी भूल",l:"man",x:"ग़लतफ़हमी किसी और ने नहीं तोड़ी, उनके अपने सवाल ने तोड़ी: जो अपने पति के बिना दुख में हो, वह ऐसे सजकर और ऐसे चैन से कैसे सो सकती है। यही इस पूरी रात का ढंग है, हर बार जवाब बाहर से नहीं, सोचने से आता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 11"},
 k_manas_bhram:{t:"मानस यहाँ रुकता ही नहीं",l:"gr",x:"मानस इस ग़लतफ़हमी पर देर तक नहीं रुकता और कथा सीधे आगे बढ़ जाती है, क्योंकि तुलसीदास के लिए यह दृश्य काम का नहीं था। कौन सी कथा कहाँ रुकती है और कहाँ से निकल जाती है, इसी से उसका मिज़ाज पता चलता है।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड"},
 k_saaz:{t:"साज़ों पर सोए हुए लोग",l:"chh",x:"रात का संगीत ख़त्म हो चुका है और बजाने वाले अपने ही साज़ों पर सो गए हैं। कोई वीणा से लिपटा है, कोई ढोल पर सिर रखे है, और किसी के हाथ से बाँसुरी छूट गई है। यह पूरा ब्योरा वाल्मीकि देते हैं, और यही उस रात का सबसे शांत हिस्सा है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 9 और 10"},
 k_nazar:{t:"दुश्मन के नगर को ऐसे देखना",l:"man",x:"जो कवि दुश्मन के नगर में सोए हुए बजाने वालों का इतना ब्योरा दे, वह उस नगर को सिर्फ़ दुश्मन की तरह नहीं देख रहा। यही वाल्मीकि की सबसे बड़ी बात है: वे लंका को एक जगह की तरह देखते हैं, जहाँ लोग रहते हैं, सोते हैं और थकते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 9 और 10"},
 k_kamba_saaz:{t:"तमिल में यह हिस्सा और लंबा",l:"gr",x:"कंब रामायण में यह हिस्सा और भी लंबा है, और वहाँ हर साज़ तथा हर सोने वाले का अपना वर्णन मिलता है। कंबन के लिए लंका का ठाठ दिखाना कथा का ज़रूरी हिस्सा था, क्योंकि जितना बड़ा नगर होगा, उतना बड़ा वह काम लगेगा जो एक अकेला वहाँ कर रहा है।",s:"kamba",p:1,ref:"कंब रामायण, सुंदर कांडम्"},
 k_sapna_card:{t:"तेल, गधा और दक्षिण दिशा",l:"chh",x:"त्रिजटा का सपना ब्योरे में कहा जाता है: रावण तेल में सना हुआ, नशे में चूर, पुष्पक से गिरा हुआ, और दक्षिण की तरफ़ घसीटा जा रहा है, जो यम की दिशा है। दूसरी तरफ़ राम की जीत दिख रही है। सपने की हर चीज़ अशुभ के पुराने चिह्नों से बनी है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 27"},
 k_chup:{t:"सपने से रुकी हुई भीड़",l:"man",x:"सपना सुनाते ही ताने थम जाते हैं और उस रात बाग़ चुप हो जाता है। जिन्हें डराने भेजा गया था, वे ख़ुद डर जाती हैं। इस पूरी रात में यह अकेली जगह है जहाँ किसी को बचाने का काम शब्दों से होता है, और वह भी उसी तरफ़ की किसी स्त्री के शब्दों से।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 27"},
 k_ananda_sapna:{t:"कहीं यह सपना एक पंक्ति का है",l:"gr",x:"आनंद रामायण में यह सपना बहुत थोड़े में आता है, क्योंकि वहाँ पूरी रात ही एक सर्ग में सिमटी हुई है। एक ही सपना, कहीं पूरा दृश्य और कहीं एक पंक्ति। इससे साफ़ दिखता है कि हर कथा ने अपने लिए क्या ज़रूरी माना।",s:"ananda",p:1,ref:"आनंद रामायण, सारकांड"},
 b_machhli:{t:"परछाईं देखकर भागती मछलियाँ",l:"chh",x:"उड़ते हुए नीचे देखो तो पानी के भीतर बड़ी बड़ी आकृतियाँ तैरती दिखती हैं, और ऊपर से गुज़रती परछाईं देखकर मछलियाँ इधर उधर बिखर जाती हैं। वाल्मीकि यह छोटी सी बात भी लिखते हैं, और उसी से यह उड़ान सचमुच की लगने लगती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 b_hawa:{t:"हवा से फटता हुआ पानी",l:"chh",x:"इतनी तेज़ हवा चलती है कि समुद्र बीच से फट सा जाता है और दोनों तरफ़ झाग उठता है। पेड़ उखड़कर साथ उड़ते हैं और फिर पानी में गिरते हैं। यह वर्णन बताता है कि उड़ान कितनी तेज़ थी, बिना यह कहे कि वह कितनी तेज़ थी।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 b_kandali:{t:"असम में यह सब दो पंक्तियों में",l:"gr",x:"असम की कथा में यह पूरी उड़ान बहुत थोड़े में कही जाती है, क्योंकि कवि ने ख़ुद लिखा है कि उन्होंने विस्तार छोड़कर सार लिया। इसलिए वहाँ यह मज़ेदार हिस्सा बस दो पंक्तियों का है। छोटा करना भी एक चुनाव है।",s:"kandali",p:1,ref:"सप्तकांड रामायण, सुंदरकांड"},
 b_billi:{t:"पहाड़ जितना, फिर बिल्ली जितना",l:"chh",x:"अभी थोड़ी देर पहले शरीर पहाड़ जितना था, और नगर में घुसने के लिए वह बिल्ली जितना कर लिया जाता है। इतना छोटा कि पहरेदार के पास से निकल जाओ और उसे पता भी न चले। इस रात यही सबसे काम की चाल है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2"},
 b_chal:{t:"यहाँ छोटा होना जीत है",l:"man",x:"पूरी कथा में ताक़त की बात बार बार आती है, पर इस रात जीत बड़े होने से नहीं, छोटे होने से मिलती है। जिसे सब बल से पहचानते हैं, वह यहाँ चुपचाप निकल जाने से काम बनाता है। यही इस पूरे कांड का सबसे अलग सबक़ है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2"},
 b_masak:{t:"मानस में मच्छर जितना",l:"gr",x:"मानस में यह रूप और भी छोटा है, मच्छर जितना। बिल्ली फिर भी दिख सकती है, मच्छर नहीं। इसी छोटे से फ़र्क़ से तुलसीदास अपनी बात कह देते हैं, कि भीतर जाने वाला किसी की नज़र में आया ही नहीं।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड"},
 b_shor:{t:"पंछी पहले बता देते हैं",l:"chh",x:"जब आदमी चुप हों, तब पंछी ही बताते हैं कि आसपास क्या चल रहा है। उनकी हलचल से पता चलता है कि कोई आ रहा है, और उसी से सँभलने का वक़्त मिल जाता है। कथा में पंछी बार बार आते हैं, कभी ख़बर की तरह और कभी गवाह की तरह।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 14 और 15"},
 b_chhipna:{t:"डाल पर छिपकर देखना",l:"man",x:"बाग़ में सीधे सामने आना ख़तरनाक था, इसलिए पहले ऊपर से देखा गया। पत्तों के बीच बैठकर घंटों देखते रहना भी एक काम है, और कथा इसे उतनी ही जगह देती है जितनी लड़ाई को। धीरज यहाँ ताक़त जितना ही ज़रूरी है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 14 और 15"},
 b_tota:{t:"वहाँ पंछी ही कथा कहता है",l:"gr",x:"मलयालम कथा में तो पूरी कहानी ही एक पंछी सुना रहा है, क्योंकि किलिप्पाट्टु का मतलब ही है तोते का गीत। वहाँ रचयिता कहता है कि अब तू कह। इसलिए उस कथा में पंछी सिर्फ़ दर्शक नहीं, सुनाने वाला है।",s:"ezhu",p:1,ref:"अध्यात्म रामायण किलिप्पाट्टु"},
 b_udham:{t:"बाग़ में ऊधम",l:"chh",x:"लौटती टोली ने मधुवन पर धावा बोल दिया। फल टूट रहे हैं, टहनियाँ गिर रही हैं, और रखवाले दौड़ते हैं तो उन्हें भी हँसते हुए भगा दिया जाता है। यह ऊधम बताता है कि डर उतर चुका है, क्योंकि काम हो चुका है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 61 और 62"},
 b_hansi:{t:"पूरी कथा में सबसे हल्की जगह",l:"man",x:"इस पूरी कथा में यही एक जगह है जहाँ डर बिल्कुल नहीं है और सब खुलकर हँसते हैं। कथा इसे जान बूझकर रखती है, क्योंकि उससे पहले की रात बहुत भारी थी। और इसी हँसी के भीतर से सबसे बड़ी ख़बर निकलती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 62"},
 b_kritti:{t:"बांग्ला में यह और भी हल्का",l:"gr",x:"कृत्तिवासी रामायण घर में सुनाने के लिए लिखी गई थी, इसलिए वहाँ यह हिस्सा और भी हल्का और हँसी वाला है। बच्चों को सुनाई जाने वाली कथा में ऐसी जगहें सबसे ज़्यादा याद रहती हैं, और शायद इसीलिए वह कथा घर घर पहुँची।",s:"krittivasa",p:1,ref:"कृत्तिवासी रामायण, सुंदरकांड"},
 t_khai:{t:"खाई में कमल और पहरा",l:"chh",x:"नगर के चारों ओर चौड़ी खाई है और उसमें पानी भरा है। उसी पानी में कमल भी खिले हैं और नीचे हिलती हुई परछाइयाँ भी, इसलिए वहाँ सुंदरता और पहरा एक साथ हैं। किसी नगर की रक्षा उसकी सबसे सजी हुई चीज़ भी हो सकती है, यह बात यहीं दिखती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 3"},
 t_burj:{t:"दीवार के ऊपर के बुर्ज",l:"chh",x:"दीवार ऊँची है और उस पर बुर्ज बने हैं, और हर बुर्ज पर कोई न कोई खड़ा है। वाल्मीकि इस दीवार को सोने की कहते हैं, और उसके साथ यह भी बताते हैं कि ऊपर से नीचे देखने वालों की नज़र कहाँ तक जाती है। इसी वजह से भीतर जाने के लिए साँझ का इंतज़ार करना पड़ा।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2 और 3"},
 t_kamba_nagar:{t:"वहाँ नगर का अपना अध्याय है",l:"gr",x:"तमिल कथा इस दीवार और नगर पर देर तक ठहरती है, इतना कि वहाँ नगर का अपना अलग अध्याय है, ऊर् तेडु पडलम्। कंबन के लिए लंका सिर्फ़ दुश्मन का ठिकाना नहीं, एक बड़ा और सुंदर नगर है, और यह बात उस पूरे वर्णन से झलकती है।",s:"kamba",p:1,ref:"कंब रामायण, सुंदर कांडम्"},
 t_gali:{t:"चौड़ी सड़कें, सटी हुई दुकानें",l:"chh",x:"नगर की सड़कें चौड़ी हैं और दोनों तरफ़ दुकानें और घर सटे हुए हैं। वाल्मीकि इस हिस्से में घरों की क़िस्में तक गिनाते हैं, और उससे पता चलता है कि यह नगर किसी क़िले जैसा नहीं, एक भरी हुई बस्ती जैसा था, जिसमें हर तरह के लोग रहते थे।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 4 और 5"},
 t_raunak:{t:"आधी रात की रौनक़",l:"man",x:"इतनी रात गए भी वहाँ रोशनी जल रही है, कहीं संगीत है, कहीं हँसी, और कहीं कोई सो रहा है। यह ब्योरा कथा में यूँ ही नहीं है: जिस नगर की आधी रात ऐसी हो, उसमें बिना नज़र में आए घूमना कितना कठिन होगा, यह उसी से समझ आता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 4 और 5"},
 t_eknath:{t:"मराठी कथा में हर हिस्सा अलग",l:"gr",x:"भावार्थ रामायण में नगर के हिस्से अलग अलग गिनाए जाते हैं, बाज़ार, बाग़, महल, सब अपने नाम से। इससे नगर बड़ा लगने लगता है और ढूँढने में लगी देर भी सच्ची लगती है। एकनाथ की कथा लोगों को सुनाने के लिए थी, इसलिए वहाँ ब्योरा सुनने वाले के काम का रखा गया।",s:"eknath",p:1,ref:"भावार्थ रामायण, एकनाथ, सुंदरकांड"},
 t_chhat:{t:"छतों वाला रास्ता",l:"chh",x:"नगर के भीतर आगे का रास्ता ज़मीन पर नहीं, छतों पर है। एक अटारी से दूसरी अटारी तक कूदते हुए, और बीच में नीचे झाँकते हुए। वाल्मीकि बार बार बताते हैं कि खोज ऊपर से हुई, और यही वजह है कि पहरेदारों को आख़िर तक पता नहीं चला।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 5 और 6"},
 t_naksha:{t:"ऊपर से दिखता पूरा नक्शा",l:"man",x:"ऊपर से पूरी बनावट एक साथ दिख जाती है: कहाँ बस्ती है, कहाँ दीवार, कहाँ महल और कहाँ बाग़। यही वह नज़र है जिससे बाद में यह तय होता है कि किस तरफ़ अभी देखा ही नहीं गया। खोज में सबसे काम की चीज़ ताक़त नहीं, ऊँचाई निकलती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 5 और 6"},
 t_java:{t:"वहाँ नगर दीवार पर खुदा है",l:"gr",x:"जावा की कथा में यह सब पत्थर पर खुदा हुआ मिलता है। देखने वाला मंदिर की दीवार के साथ चलकर नगर देखता है, और पढ़ना तथा चलना एक ही काम हो जाते हैं। इसीलिए उस परंपरा में नगर का लंबा वर्णन लिखने की ज़रूरत नहीं पड़ी, वह सामने खड़ा है।",s:"kakawin",p:1,ref:"ककविन रामायण; जावा के मंदिरों की दीवारें"},
 t_kism:{t:"पेड़ों की क़तारें",l:"chh",x:"बाग़ में पेड़ों की अपनी क़तारें हैं और हर क़तार अलग किस्म की है: अशोक, चंपा, सप्तपर्ण, और बीच बीच में फूलों की बेलें। वाल्मीकि इन नामों को गिनाते हैं, और यही गिनती बताती है कि यह जंगल नहीं, लगाया हुआ बाग़ था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 14 और 15"},
 t_shauk:{t:"किसी का शौक़, किसी की क़ैद",l:"man",x:"इतनी सजावट बताती है कि यह बाग़ किसी का शौक़ था। और उसी शौक़ के बीच कोई बंदी बनाकर रखी गई है। कथा यह बात कहती नहीं, दोनों चीज़ें एक साथ दिखा देती है, और वहीं से इस जगह का पूरा भारीपन आता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 14 और 15"},
 t_ezhu:{t:"पेड़ों के नाम लय में",l:"gr",x:"मलयालम कथा में यह बाग़ गाकर सुनाया जाता है, इसलिए वहाँ पेड़ों के नाम लय में आते हैं और सुनने वाले को याद रह जाते हैं। और उसी लय के बीच वह चुप्पी भी सुनाई देती है जो बाग़ के बीचोंबीच बैठी है।",s:"ezhu",p:1,ref:"अध्यात्म रामायण किलिप्पाट्टु, एषुत्तच्छन"},
 y_ghera:{t:"घेरकर लड़ने का जवाब",l:"chh",x:"किंकर घेरकर लड़ते हैं, इसलिए उनके बीच पीछे हटने की जगह नहीं बचती। जवाब में वही किया जाता है जो घेरे में सबसे काम आता है: बीच में खड़े होकर चारों तरफ़ घुमाना, और बीच बीच में ऊपर उठ जाना। वाल्मीकि यहाँ यह भी दिखाते हैं कि गिनती बड़ी होने से लड़ाई आसान नहीं होती, कई बार वही सबसे बड़ी अड़चन बन जाती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 42 और 43"},
 y_danda:{t:"तोरण का लोहे का डंडा",l:"chh",x:"वे हथियार लेकर नहीं गए थे, इसलिए पहला हथियार वहीं से उठाया गया, तोरण के मेहराब में लगा लोहे का डंडा। इसी से पहला घेरा तोड़ा गया। इस पूरी रात में यही सबसे साफ़ बात है कि लड़ाई सामान से नहीं, जगह के इस्तेमाल से लड़ी गई।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 42"},
 y_ginti:{t:"वहाँ गिनती नहीं, हिम्मत",l:"gr",x:"कन्नड़ की उस कथा में इस भीड़ का ब्योरा बहुत थोड़े में है। वहाँ ज़ोर इस पर नहीं कि कितने आए, बल्कि इस पर कि अकेला आदमी घबराया नहीं। नरहरि ने पूरी कथा को छोटा और गाने लायक रखा था, और उसका असर यहाँ साफ़ दिखता है।",s:"torave",p:1,ref:"तोरवे रामायण, सुंदरकांड"},
 y_dhanush:{t:"पहली बार सामने धनुष",l:"chh",x:"जम्बुमाली रथ पर आता है और उसके पास धनुष है, इसलिए यह पहला ऐसा मुक़ाबला है जिसमें दूर से वार होता है। उसके बाण लगते भी हैं। जवाब में वही डंडा नहीं, एक भारी परिघ उठाया जाता है। यहीं से लड़ाई का ढंग बदलता है, क्योंकि अब सामने भीड़ नहीं, एक जानकार लड़ाका है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 44"},
 y_naam:{t:"नाम लेकर भेजा गया पहला",l:"man",x:"जम्बुमाली प्रहस्त का बेटा है, और वह पहला है जिसे नाम लेकर भेजा गया। इससे पहले जो आए वे गिनती थे। कथा में यह छोटा सा फ़र्क़ बड़ा है, क्योंकि जिस दिन दुश्मन को नाम से भेजना पड़े, उस दिन मान लिया जाता है कि सामने वाला हल्का नहीं है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 44"},
 y_kamba:{t:"वहाँ वंश भी तौला जाता है",l:"gr",x:"तमिल कथा में इस मुक़ाबले को अलग तरह से तौला गया है। वहाँ यह देखा जाता है कि सामने वाला किस घराने से है और उसका दर्जा क्या है। कंबन के लिए वंश और मर्यादा हर दृश्य में साथ चलते हैं, इसलिए उनकी लड़ाइयाँ भी दरबार की नज़र से लिखी जाती हैं।",s:"kamba",p:1,ref:"कंब रामायण, सुंदर कांडम्"},
 y_saat_card:{t:"मंत्रियों के सात बेटे",l:"chh",x:"किंकरों और जम्बुमाली के बाद सात मंत्रिपुत्र एक साथ भेजे जाते हैं। इनके पास रथ हैं, धनुष हैं, और इनके पीछे अपनी अपनी टुकड़ियाँ हैं। एक साथ भेजे जाने का मतलब यही है कि अकेले भेजने पर भरोसा नहीं रहा।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 45"},
 y_darbar_dar:{t:"दरबार का डर पहली बार",l:"man",x:"जिस दिन राजा अपने मंत्रियों के बेटों को एक साथ भेजे, उस दिन डर दरबार तक पहुँच चुका होता है। कथा इसे कहती नहीं, दिखाती है: भेजे जाने वालों का दर्जा हर बार बढ़ता जाता है, और यही सबसे साफ़ नाप है कि सामने वाला कितना भारी पड़ रहा है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 45 और 46"},
 y_adhy:{t:"वहाँ हर भिड़ंत एक ही बात कहती है",l:"gr",x:"अध्यात्म रामायण इन लड़ाइयों पर देर तक नहीं रुकती। वहाँ हर भिड़ंत एक ही बात दोहराती है, कि जो सामने है वह टिकेगा नहीं, क्योंकि यह लड़ाई बल की नहीं है। इसलिए उस पाठ में ब्योरा कम है और अर्थ ज़्यादा।",s:"adhy",p:1,ref:"अध्यात्म रामायण, सुंदरकांड"},
 y_paanch:{t:"पाँच सेनापति, अपनी अपनी सेना",l:"chh",x:"मंत्रिपुत्रों के बाद पाँच सेनापति भेजे जाते हैं, और हर एक अपनी टुकड़ी के साथ आता है। इनके नाम गिनाए जाते हैं, क्योंकि अब भीड़ भेजने से काम नहीं चल रहा। यह उस दिन की आख़िरी पूरी सेना है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 46"},
 y_baad:{t:"इसके बाद अपने बेटे",l:"man",x:"पाँच सेनापतियों के बाद दरबार के पास भेजने को सेना नहीं बचती, अपने बेटे बचते हैं। पहले अक्षकुमार आता है, और उसके बाद इंद्रजित। इसी क्रम से पता चलता है कि उस दिन नगर कहाँ से कहाँ पहुँच गया, और यही इस पूरे दिन का असली हिसाब है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 46 से 48"},
 y_manas:{t:"मानस में गिनती नहीं, नतीजा",l:"gr",x:"मानस में यह पूरी क़तार चंद पंक्तियों में निपट जाती है। तुलसीदास के लिए यह दिन लड़ाई का नहीं, संदेश का है, इसलिए वहाँ कौन कब आया इसकी गिनती नहीं मिलती, सीधे नतीजा मिलता है। दो पाठों का यही सबसे बड़ा फ़र्क़ है।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड"},
 burma_saaf:{t:"चेहरा नहीं बदलता, चाल बदलती है",l:"gr",x:"बर्मी कठपुतली के मंच पर पुतलियों के चेहरे नहीं बदलते, इसलिए सब कुछ हरकत और ढोल की ताल से कहा जाता है। डर और राहत, दोनों वहाँ शरीर की चाल से पहुँचते हैं। यही कारण है कि उस परंपरा में हर हरकत बड़ी और साफ़ रखी जाती है।",s:"yama",p:1,ref:"यम ज़ातदो; यम ज़ात प्वे"},
 khmer_hansi:{t:"भारी दृश्यों के बीच हल्की जगह",l:"gr",x:"खमेर मंच पर नाचने वाले बीच बीच में दर्शकों की तरफ़ मुड़ते हैं, और हँसी की जगह बन जाती है। यह ठहराव जान बूझकर रखा जाता है, ताकि भारी दृश्य लगातार भारी न पड़ें। जो कथा मंच के लिए बनी हो, उसे सुनने वालों की साँस का भी ध्यान रखना पड़ता है।",s:"reamker",p:1,ref:"रीमकेर; खमेर नाच"},
 taili_aag:{t:"विहार और गाँव, दोनों जगह",l:"gr",x:"युन्नान की उस कथा की अपनी ख़ासियत यह है कि वह विहार और गाँव, दोनों जगह चलती है। इसलिए एक ही दृश्य कहीं गंभीर सुनाई देता है और कहीं सीधा सादा। एक कथा जब दो तरह के घरों में रहती है, तो उसकी दो आवाज़ें बन जाती हैं।",s:"taili",p:1,ref:"लंका सिप हो, ताई लू"},
 newar_lauti:{t:"घर लौटने जैसी घड़ी",l:"gr",x:"नेवारी कथा घाटी के घरों और चौकों में पढ़ी जाती रही, इसलिए उसकी भाषा रोज़ की है। लौटने की इस घड़ी को वहाँ बड़ी जीत की तरह नहीं, चैन की साँस की तरह कहा जाता है। जो कथा घर में पढ़ी जाती है, वह घर जैसी ही बोलती है।",s:"siddhi",p:1,ref:"सिद्धि रामायण"},
 kash_kinara:{t:"किनारा भी घाटी का",l:"gr",x:"कश्मीरी रामावतारचरित में जब कवि पानी, पहाड़ और ठंडी हवा का ज़िक्र करता है, तो वे उसी घाटी के होते हैं। इसलिए इंतज़ार करने वाले लोग भी पड़ोसी जैसे लगने लगते हैं। यही उस कथा की सबसे बड़ी पहचान है: दूर का देश पास का इलाक़ा बन जाता है।",s:"kashmiri",p:1,ref:"रामावतारचरित, कश्मीरी"},
 nep_pahad:{t:"पहाड़ वहाँ अजीब नहीं",l:"gr",x:"नेपाली कथा में पहाड़ का उठना घर की बात जैसी कही जाती है, क्योंकि सुनने वाले पहाड़ों के बीच ही रहते हैं। भाषा सीधी है और चाल गाने जैसी, इसलिए यह पल जल्दी बीत जाता है। जो दृश्य कहीं चमत्कार लगता है, वहाँ वह रोज़ की दुनिया का हिस्सा लगता है।",s:"bhanubhakta",p:1,ref:"भानुभक्त रामायण"},
 pampa_daal:{t:"छिपना नहीं, समझदारी",l:"gr",x:"कन्नड़ की जैन कथा में डाल पर बैठना भी कारण बताकर कहा जाता है। वहाँ यह छिपना नहीं, समझदारी है, क्योंकि सामने आने से पहले भरोसा बनाना ज़रूरी है। उस परंपरा में हर क़दम के पीछे की वजह साथ ही दी जाती है, और इसी से कथा का मिज़ाज बदल जाता है।",s:"pampa",p:1,ref:"रामचंद्र चरित पुराण, नागचंद्र"},
 odia_ghar:{t:"घर में बैठकर सुनने लायक",l:"gr",x:"जगमोहन रामायण ओड़िशा में रोज़ पढ़ी जाने वाली पोथी है, इसलिए उसकी भाषा घर के भीतर बैठकर सुनने लायक रखी गई है। वहाँ पहरे का ब्योरा कम है और उस अकेलेपन पर ठहराव ज़्यादा। रोज़ पढ़ी जाने वाली किताबें डराती नहीं, साथ देती हैं।",s:"jagamohan",p:1,ref:"जगमोहन रामायण, बलराम दास"},
 adb_dweep:{t:"एक और नगर बचा रह गया",l:"chh",x:"अद्भुत रामायण में हज़ार मुँह वाला रावण पुष्कर द्वीप से आता है। यानी लंका जीतने के बाद भी एक और नगर बचा रह गया था, और वह पहले से बड़ा निकला। कथा यह दिखाने के लिए उसे लाती है कि जीत कभी पूरी नहीं लगती, और सबसे बड़ी लड़ाई के बाद भी कुछ सामने आ सकता है।",s:"adbhuta",p:1,ref:"अद्भुत रामायण, सर्ग 23"},
 jn_dono:{t:"दो निशानियाँ, बिना तमाशे के",l:"chh",x:"जैन कथा में दोनों निशानियाँ साफ़ दिखती हैं: जाते वक़्त राम की अँगूठी और लौटते वक़्त सीता की चूड़ामणि। बीच में न पकड़ है, न बंधन, न दंड, सिर्फ़ लेना और देना। इसी से पता चलता है कि यह परंपरा कथा को घटना की तरह नहीं, काम की तरह देखती है।",s:"jain",p:1,ref:"पउमचरिय; इस परंपरा में दूत वाला प्रसंग"},
 adb_baad:{t:"जहाँ बाकी कथाएँ ख़त्म होती हैं",l:"chh",x:"अद्भुत रामायण की अपनी कथा वहीं से शुरू होती है जहाँ बाकी कथाएँ ख़त्म होती हैं। लंका की लड़ाई बीत चुकी है, सब सँभल रहे हैं, और तभी एक और नाम सुनाई देता है। सत्ताईस सर्गों वाले इस ग्रंथ में यह हिस्सा सर्ग तेईस से पच्चीस तक चलता है, और यही उसकी पहचान है।",s:"adbhuta",p:1,ref:"अद्भुत रामायण, सर्ग 23"},
 adb_hazar:{t:"हज़ार मुँह वाला",l:"chh",x:"वह दूसरा रावण, जिसके हज़ार मुँह हैं, लंका वाले से कहीं बड़ा है। उसकी ललकार सुनकर वह सेना ठिठक जाती है जो अभी अभी जीती थी। कथा यह दिखाने के लिए उसे लाती है कि सबसे बड़ी जीत के बाद भी कुछ बचा रह सकता है, और उसे किसी और तरह से ही जीता जा सकता है।",s:"adbhuta",p:1,ref:"अद्भुत रामायण, सर्ग 23"},
 adb_bandhan:{t:"जब सबसे बड़े भी बँध गए",l:"chh",x:"लड़ाई शुरू होते ही माया फैलती है और दोनों भाई बँध जाते हैं। कोई अस्त्र काम नहीं आता, और वही लोग बेबस हो जाते हैं जिनके नाम से यह पूरी कथा चलती है। यही वह मोड़ है जिसके बाद कथा किसी और तरफ़ देखती है।",s:"adbhuta",p:1,ref:"अद्भुत रामायण, सर्ग 24"},
 adb_aage:{t:"चुप्पी रुका हुआ बल थी",l:"man",x:"दोनों भाई बँधे पड़े हैं और सेना हिल तक नहीं पा रही। तभी वे आगे बढ़ती हैं जो अब तक पीछे रहीं। इस परंपरा में बग़ीचे वाली चुप्पी कमज़ोरी नहीं थी, रुका हुआ बल थी, और वही चुप्पी अब मैदान में खड़ी है। जो अब तक बचाई जा रही थीं, वही अब सबको बचाने खड़ी हैं, और यही इस पूरे ग्रंथ का मोड़ है।",s:"adbhuta",p:1,ref:"अद्भुत रामायण, सर्ग 24"},
 adb_roop:{t:"महाकाली का रूप",l:"chh",x:"वे अपना मनुष्य रूप छोड़कर महाकाली का रूप लेती हैं और पल भर में उसके हज़ार सिर काट देती हैं। पूरी परंपरा में यही दृश्य इस ग्रंथ की पहचान है, और इसी वजह से इसे शाक्त परंपरा की रामकथा कहा जाता है।",s:"adbhuta",p:1,ref:"अद्भुत रामायण, सर्ग 24 और 25"},
 adb_saath:{t:"शक्ति के साथ ही",l:"man",x:"अंत के बाद ब्रह्मा राम को समझाते हैं कि जो कुछ होता है, शक्ति के साथ ही होता है। इसलिए यह कथा हार जीत की नहीं, साथ की है। इसी एक वाक्य के लिए पूरे तीन सर्ग खड़े किए गए हैं।",s:"adbhuta",p:1,ref:"अद्भुत रामायण, सर्ग 25"},
 chhaya_pakad:{t:"शरीर नहीं, परछाईं",l:"chh",x:"यह रुकावट बाकी सबसे अलग है, क्योंकि यहाँ पकड़ शरीर की नहीं होती। सिंहिका नीचे से परछाईं पकड़ती है और ऊपर उड़ने वाला पीछे खिंचने लगता है। पहले लगता है कि उलटी हवा है, फिर नीचे देखने पर बात समझ आती है। पहचानते ही डर हट जाता है, क्योंकि चलने से पहले सुग्रीव ने इसी जीव के बारे में बता रखा था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 jain_bina:{t:"वहाँ यह ख़तरा है ही नहीं",l:"gr",x:"जैन कथा में समुद्र पार करना चमत्कार नहीं है, इसलिए रास्ते की ये तीनों रुकावटें आती ही नहीं। न कोई पहाड़ उठकर रोकता है, न कोई मुँह खोलकर परखता है, न कोई परछाईं पकड़ता है। उड़ना वहाँ विद्या है, जो सीखी जाती है। जो और कथाओं में सबसे बड़ा ख़तरा है, वह इस परंपरा में है ही नहीं।",s:"jain",p:1,ref:"पउमचरिय, विमलसूरि"},
 kannassa_pehle:{t:"तोते से भी पहले",l:"chh",x:"केरल की सबसे मशहूर रामकथा एषुत्तच्छन की है, पर उससे दो सदी पहले निरणम के राम पणिक्कर ने कण्णस्स रामायणम् रचा था। निरणम के कवियों का घराना इसी काम के लिए याद किया जाता है कि उन्होंने उस भाषा को बड़ी कथा कहने लायक बनाया। मशहूर रचना के पीछे हमेशा कुछ पुराने काम खड़े होते हैं, जिनका नाम कम लिया जाता है।",s:"kannassa",p:1,ref:"कण्णस्स रामायणम्, चौदहवीं सदी"},
 taili_naam:{t:"नाम में ही लंका",l:"chh",x:"युन्नान के ताई लू लोगों के बीच इस कथा को लंका सिप हो कहते हैं, यानी नाम में ही वह नगर है। यह चीन की सीमा के भीतर की परंपरा है, और वहाँ तक कथा दक्षिण पूर्व एशिया के रास्ते पहुँची। यानी इस रात की कथा जहाँ भी गई, वहाँ लोगों ने उसे अपने नाम दिए, पर लंका का नाम कहीं नहीं छूटा।",s:"taili",p:1,ref:"लंका सिप हो, ताई लू"},
 mappila_lok:{t:"मजलिस में गाई जाने वाली कथा",l:"chh",x:"मालाबार के मापिला मुसलमानों के बीच यह कथा गाई जाने वाली शक्ल में मिलती है, और उसे मापिला रामायणम् कहते हैं। यह किसी दरबार की रचना नहीं, लोगों के बीच बनी कथा है। उसकी बोली, मुहावरे और चुटकियाँ उसी समाज की हैं, और उसमें हँसी मज़ाक की जगह भी है, क्योंकि यह मंच और मजलिस की चीज़ है, पोथी की नहीं।",s:"mappila",p:1,ref:"मापिला रामायणम्, मालाबार"},
 mal_pehli:{t:"शुरुआत लड़ाई वाले हिस्से से",l:"chh",x:"मलयालम की सबसे पुरानी बची हुई काव्य रचना रामचरितम् है, जिसे चीरामन ने लगभग बारहवीं सदी में रचा। उसमें पूरी रामकथा नहीं है, सिर्फ़ युद्ध वाला हिस्सा है। यानी उस भाषा का पहला बड़ा काव्य ही उस मोड़ से शुरू हुआ जो कथा में बाद में आता है। उसकी भाषा में मलयालम और तमिल दोनों की छाया दिखती है, क्योंकि वह दोनों के अलग होने के बीच का समय था।",s:"ramacharitam",p:1,ref:"रामचरितम्, चीरामन"},
 maranao_naam:{t:"वहाँ नाम ही बदल गया",l:"chh",x:"फिलीपींस के मरानाओ लोगों की कथा में हनुमान वाला काम लक्षमाना के नाम से आता है, और जगहें लानाओ झील के आसपास की हो जाती हैं। यह अकेली किताब नहीं, दारंगन नाम की एक बड़ी कथा माला का हिस्सा है, जो गाकर सुनाई जाती है। यह कथा वहाँ जावा और मलय के रास्ते पहुँची, और सन 1968 में पहली बार लिखकर दर्ज की गई, जब एक शोधकर्ता ने इसे वहाँ के गाने वालों से सुना।",s:"maranao",p:1,ref:"महारादिया लावाना; 1968 में दर्ज"},
 dunhuang:{t:"गुफा में मिले पन्ने",l:"chh",x:"दुनहुआंग की गुफाओं में सदियों तक हज़ारों पुरानी पोथियाँ बंद पड़ी रहीं, और उन्हीं में से कुछ टुकड़े तिब्बती रामकथा के निकले। यह पूरी किताब की शक्ल में नहीं मिलती, बस हिस्सों में, और खोतान की कथा भी इसी से मिलती जुलती है। इससे पता चलता है कि यह कथा रेशम के रास्ते से होकर हिमालय के पार भी पहुँची थी, और वहाँ भी इसे सँभालकर रखा गया।",s:"tibbati",p:1,ref:"दुनहुआंग से मिली तिब्बती पांडुलिपियाँ"},
 newari_doosri:{t:"एक देश, दो ज़बानें",l:"chh",x:"नेपाल में एक ही समय कई भाषाएँ चलती हैं। भानुभक्त की कथा नेपाली में है, और सिद्धिदास महाजु की सिद्धि रामायण नेपाल भाषा यानी नेवारी में, बीसवीं सदी की शुरुआत में। काठमांडू की घाटी के लोग इसे अपनी पुरानी बोली में सुनते हैं। इससे पता चलता है कि एक ही जगह पर भी कथा एक नहीं होती, जितनी ज़बानें उतनी कथाएँ।",s:"siddhi",p:1,ref:"सिद्धि रामायण, नेपाल भाषा"},
 nayi_sadi:{t:"बीसवीं सदी में दोबारा",l:"chh",x:"रामायण कल्पवृक्षम् उस समय लिखी गई जब बहुत से लोग कह रहे थे कि अब पुरानी कथाओं का ज़माना चला गया। विश्वनाथ सत्यनारायण ने वही कथा दोबारा कही, अपने ढंग से और अपने समय की भाषा में, और उसी पर उन्हें ज्ञानपीठ मिला। यह इस खेल की सबसे नई कथा है, और यही बताती है कि यह रात किसी पुरानी सदी में बंद नहीं हुई।",s:"kalpavruksham",p:1,ref:"रामायण कल्पवृक्षम्, विश्वनाथ सत्यनारायण, बीसवीं सदी"},
 kannada_jain:{t:"जैन कथा की दूसरी ज़बान",l:"chh",x:"जैन परंपरा की दूसरी बड़ी रामकथा नागचंद्र की है, बारहवीं सदी की कन्नड़ में, जिसे लोग पंप रामायण भी कहते हैं। उसका ढंग वही है जो पउमचरिय का है: हर बात का कारण बताना, चमत्कार से बचना, और मारने पर ठहरकर सोचना। एक ही परंपरा, दो भाषाएँ, और सदियों का फ़ासला। इससे पता चलता है कि यह नज़रिया किसी एक किताब का नहीं था, पूरी परंपरा का था।",s:"pampa",p:1,ref:"रामचंद्र चरित पुराण, नागचंद्र"},
 gobind_veer:{t:"वीर रस वाली कथा",l:"chh",x:"दसम ग्रंथ के चौबीस अवतार वाले हिस्से में यह कथा रामावतार के नाम से आती है, ब्रजभाषा में। वहाँ ज़ोर डर या विनती पर नहीं, हिम्मत और सामना करने पर रहता है। छंद तेज़ हैं और शब्द ऐसे चुने गए हैं जो सुनते ही खड़ा कर दें। सत्रहवीं सदी की यह रचना उसी कथा को उपदेश से ज़्यादा हिम्मत की बात बनाकर कहती है।",s:"gobind",p:1,ref:"दसम ग्रंथ, रामावतार"},
 malay_laksamana:{t:"वहाँ छोटा भाई आगे है",l:"chh",x:"मलय कथा में कई जगह लक्ष्मण का दर्जा राम से भी बड़ा हो जाता है। वे आगे रहते हैं, तेज़ फ़ैसले लेते हैं, और लोग उन्हीं की हिम्मत की बात करते हैं। राम सही तो हैं, पर कई प्रसंगों में पीछे रह जाते हैं। यही बात लाओ कथा में भी दिखती है, जहाँ नाम ही पहले भाई का है। नाम भी वहाँ ढल जाते हैं: राम सेरी राम, सीता सिति देवी, और रावण महाराजा वाना।",s:"hikayat",p:1,ref:"हिकायत सेरी राम, मलय"},
 malay_gady:{t:"छंद नहीं, कहानी",l:"chh",x:"हिकायत का मतलब ही है सुनाई जाने वाली कहानी। इसलिए यह कथा छंद में नहीं, गद्य में है, और उसमें बोलचाल का ढंग है। इसे दरबार और मजलिस में पढ़कर सुनाया जाता था। इसकी पांडुलिपि लगभग सन 1600 में इकट्ठा की गई। आगे चलकर यही कथा छाया के परदे पर भी उतरी, जहाँ चमड़े के पुतलों से वही दृश्य दिखाए जाते हैं। हनुमान वहाँ सफ़ेद वानर हैं।",s:"hikayat",p:1,ref:"हिकायत सेरी राम; लगभग 1600 की पांडुलिपि"},
 molla_bhasha:{t:"कुम्हार की बेटी की भाषा",l:"chh",x:"मोल्ला ने सोलहवीं सदी में यह कथा तेलुगु में रची। वे एक कुम्हार की बेटी थीं, किसी बड़े पढ़े लिखे घराने से नहीं, और ख़ुद कहती हैं कि उनकी कविता उन्हें मिली हुई देन है। सबसे बड़ी बात उनकी भाषा है: उन्होंने जान बूझकर सीधी तेलुगु चुनी और संस्कृत के भारी शब्द बहुत कम रखे, जबकि उनसे पहले के कवि उन्हें खुलकर बरतते थे। यह तेलुगु की पहली संक्षेप रामकथा मानी जाती है।",s:"molla",p:1,ref:"मोल्ला रामायणम्; आतुकूरि मोल्ला, सोलहवीं सदी"},
 odia_do:{t:"एक भाषा, दो अलग कवि",l:"chh",x:"ओड़िया में रामकथा के दो बड़े नाम हैं, और दोनों अलग दिशा में गए। बलराम दास की जगमोहन रामायण, जिसे लोग दांडी रामायण कहते हैं, पूरी रामकथा है और जगन्नाथ को अर्पित है। सारला दास की विलंका रामायण लंका के बाद की कथा कहती है, जो और कहीं मिलती ही नहीं। एक ही भाषा में एक कवि ने पूरी कथा दी और दूसरे ने वह हिस्सा जो किसी और ने कहा ही नहीं।",s:"jagamohan",p:1,ref:"जगमोहन रामायण, बलराम दास; और विलंका रामायण, सारला दास"},
 kashmir_apni:{t:"सब कुछ अपनी घाटी का",l:"chh",x:"कश्मीरी रामावतारचरित की सबसे अलग बात यह है कि उसमें सब कुछ कश्मीर का हो जाता है। कपड़े, खाना, रीति रिवाज, घरों का ढंग और जगहों की सुंदरता, सब वहीं से उठाई गई है। पढ़ते हुए लगता है कि यह सब अयोध्या या लंका में नहीं, उसी घाटी में हो रहा है। नाम भी वहीं के ढंग के हो जाते हैं, जैसे इंद्रजित वहाँ इंद्रजेथ है और संपाति संपथ।",s:"kashmiri",p:1,ref:"रामावतारचरित, दिवाकर प्रकाश भट्ट"},
 gujarat_raag:{t:"रागों में बँधी कथा",l:"chh",x:"गिरधर ने सन 1835 में यह कथा गुजराती में पूरी की, और उसे कई रागों तथा छंदों में बाँधा: धनाश्री, बिलावल, मारू, सोरठ, आसावरी, दोहा, चौपाई और घनाक्षरी। इसलिए वहाँ हर प्रसंग की अपनी धुन है, और सुनने वाला सुर से ही समझ जाता है कि अब क्या होने वाला है। कथा उन्होंने वाल्मीकि और हनुमन्नाटक से ली, पर भाषा सीधी सादी रखी।",s:"giridhar",p:1,ref:"गिरधर रामायण, 1835"},
 nepali_zaban:{t:"अपनी ज़बान में पहली बार",l:"chh",x:"उन्नीसवीं सदी तक नेपाल में धर्म की बात संस्कृत में ही लिखी जाती थी। भानुभक्त ने वही कथा नेपाली में रची, और इसी से वह पंडितों के दायरे से निकलकर घरों तक पहुँची। कहा जाता है कि उन्हें यह ख़याल एक घसियारे से मिला, जो घास बेचकर गुज़ारा करता था और चाहता था कि उसके जाने के बाद भी लोग उसे याद रखें। नेपाल में भानुभक्त को आदिकवि कहा जाता है।",s:"bhanubhakta",p:1,ref:"भानुभक्त रामायण; घसियारे वाली परंपरा"},
 nepali_zabani:{t:"छपने से पहले ज़बानी",l:"chh",x:"यह कथा पहले किसी किताब से नहीं फैली। लोग इसे याद करके सुनाते रहे, और पूरी छपी सन 1887 में, कवि के जाने के उन्नीस साल बाद। इसीलिए इसकी चाल गाने जैसी है। इसे नेपाली भाषा की पहली बड़ी रचना माना जाता है, और आज भी वहाँ यह घर घर में पढ़ी जाती है।",s:"bhanubhakta",p:1,ref:"भानुभक्त रामायण, पूरी छपी 1887 में, मोतीराम भट्ट के हाथों"},
 kavit_kaal:{t:"काल की फैली हुई जीभ",l:"chh",x:"कवितावली में लंका दहन का वर्णन सबसे तेज़ है। वहाँ कहा जाता है कि पूँछ की विकराल लपटें देखकर लगा मानो काल ने पूरी लंका को निगलने के लिए अपनी जीभ फैला दी हो। फिर धुएँ से भरा आसमान, उसमें चमकती बिजली, और जलती लंका ऐसी जैसे सुमेरु से आग की नदी बह रही हो। आख़िर में बाज़ार, रास्ते, गढ़, गली और अटारी एक एक करके गिनाए जाते हैं, क्योंकि आग वहीं वहीं लगती जाती है।",s:"kavitavali",p:1,ref:"कवितावली, लंका दहन वाले छंद"},
 kavit_do:{t:"एक ही कवि, दो अलग कथाएँ",l:"chh",x:"मानस और कवितावली, दोनों तुलसीदास की हैं, पर वे एक जैसी नहीं हैं। मानस अवधी में है और चौपाई दोहे में, कवितावली ब्रजभाषा में है और कवित्त तथा सवैया में। मानस पूरी कथा क्रम से कहती है, कवितावली सिर्फ़ चुने हुए दृश्य बहुत ज़ोर से कहती है। इसीलिए वहाँ लंका दहन और मंदोदरी का रोना जैसे हिस्से याद रह जाते हैं, और बाकी बहुत कुछ आता ही नहीं।",s:"kavitavali",p:1,ref:"कवितावली और रामचरितमानस, तुलसीदास"},
 burma_kathputli:{t:"डोरियों से चलती कथा",l:"chh",x:"बर्मा में यह कथा ज़्यादातर कठपुतली के मंच पर मिलती है, जिसे यम ज़ात प्वे कहते हैं। लकड़ी की पुतलियाँ, ऊपर लटकी डोरियाँ, और किनारे बजते ढोल। इसीलिए वहाँ हर हरकत बड़ी और साफ़ रखी जाती है, ताकि दूर बैठा भी समझ ले। तेरहवीं सदी के आख़िर में आवा में इसका ज़िक्र मिलता है, और सोलहवीं सदी तक यह ज़बानी ही चलती रही। वहाँ राम को यम कहते हैं।",s:"yama",p:1,ref:"यम ज़ातदो; आवा में तेरहवीं सदी का ज़िक्र"},
 lao_naam:{t:"पहले भाई, फिर राम",l:"chh",x:"लाओस में इस कथा का नाम फ्रा लक फ्रा लाम है, यानी पहले लक्ष्मण, फिर राम। नाम का यह क्रम ही बता देता है कि वहाँ साथ देने वाले भाई का दर्जा कितना बड़ा है। उस परंपरा में राम को बुद्ध का ही पहले का जन्म माना जाता है, इसलिए कथा जीत हार से ज़्यादा सही रास्ते पर चलने की बात करती है। यह मंदिरों की दीवारों पर बनी मिलती है और गाकर भी सुनाई जाती है।",s:"lao",p:1,ref:"फ्रा लक फ्रा लाम, लाओ परंपरा"},
 khmer_manch:{t:"मंच के लिए लिखी गई कथा",l:"chh",x:"खमेर कथा किताब से ज़्यादा मंच पर मिलती है। उसका पाठ ही ऐसा लिखा गया है कि नाच के साथ बोला जा सके, इसलिए वाक्य छोटे हैं और ठहराव वहाँ आते हैं जहाँ नाचने वाले को रुकना है। छाया के पुतलों वाला खेल भी इसी कथा पर चलता है। यानी वहाँ कथा सुनाई नहीं जाती, दिखाई जाती है, और सुनने वाला असल में देखने वाला होता है।",s:"reamker",p:1,ref:"रीमकेर; खमेर नाच और छाया नाटक"},
 khmer_naam:{t:"नाम और रंग, दोनों बदले हुए",l:"chh",x:"वहाँ राम प्रेअह रीम हैं, सीता नेअंग सेदा, और रावण क्रोंग रीप। कथा पर बौद्ध रंग चढ़ा हुआ है, इसलिए ज़ोर मारने पर कम और सही ग़लत पर ज़्यादा रहता है। सबसे पुरानी चर्चा सातवीं सदी के एक पत्थर के लेख में मिलती है, और जो पाठ आज बचा है वह सोलहवीं सदी का है। इसके दृश्य अंकोर वात की दीवारों पर भी हैं।",s:"reamker",p:1,ref:"रीमकेर; वेअल कंतेल का सातवीं सदी वाला लेख और सोलहवीं सदी का पाठ"},
 java_patthar:{t:"पत्थर पर खुदी हुई कथा",l:"chh",x:"जावा में यह कथा सिर्फ़ पढ़ी नहीं जाती, दीवारों पर देखी जाती है। वहाँ के पत्थर के मंदिरों पर रामकथा के दृश्य एक के बाद एक खुदे हैं, और लोग दीवार के साथ साथ चलते हुए कथा आगे बढ़ाते हैं। यानी वहाँ पढ़ना और चलना एक ही काम है। शायद इसीलिए उस कथा में नगर का लंबा वर्णन नहीं है, क्योंकि नगर सामने पत्थर में खड़ा है।",s:"kakawin",p:1,ref:"ककविन रामायण; जावा के मंदिरों की दीवारों की रामकथा"},
 java_bhatti:{t:"जड़ कहीं और है",l:"chh",x:"यह कथा वाल्मीकि से सीधे नहीं ली गई। इसकी जड़ भट्टिकाव्य है, यानी रावणवध, एक संस्कृत रचना जो कथा सुनाते हुए व्याकरण भी सिखाती थी। इसीलिए ककविन का पहला आधा नपा तुला और मूल के पास है, और दूसरा आधा अपने रास्ते चला जाता है, जहाँ जावा की अपनी बातें जुड़ने लगती हैं। छब्बीस सर्गों की यह रचना नौवीं सदी की है, यानी कई देसी रामकथाओं से पुरानी।",s:"kakawin",p:1,ref:"ककविन रामायण, नौवीं सदी, 26 सर्ग; मूल भट्टिकाव्य"},
 thai_teen:{t:"अकेले नहीं, तीन भेजे गए",l:"chh",x:"थाई कथा में फ्रा राम तीन को भेजते हैं: हनुमान, ओंगकोत और चोमफूफान। यानी वहाँ यह अकेले की उड़ान नहीं, एक टोली का काम है। रास्ते में भी कई पड़ाव आते हैं: समुद्र का एक जीव, एक ऋषि की परीक्षा, और लोंगका का एक पहरेदार। नाम भी बदले हुए हैं, राम वहाँ फ्रा राम हैं, सीता नांग सीदा, रावण थोतसकान, और विभीषण फिपेक।",s:"ramakien",p:1,ref:"रामकियेन, राम प्रथम वाला पाठ"},
 thai_laar:{t:"लार से बुझाई गई आग",l:"chh",x:"वहाँ भी पूँछ जलती है और लोंगका जलती है, पर बुझाने का ढंग अलग है। हनुमान समुद्र में पूँछ नहीं डुबोते, अपनी ही लार से आग बुझाते हैं। यह छोटा सा फ़र्क़ इसलिए है कि वहाँ यह दृश्य पढ़ा नहीं, नाचकर दिखाया जाता है, और उसमें हँसी की जगह भी रखी जाती है। सफ़ेद हनुमान थाई खोन नृत्य के सबसे जाने पहचाने चेहरों में हैं।",s:"ramakien",p:1,ref:"रामकियेन; खोन नृत्य की परंपरा"},
 ghar_ghar:{t:"एक एक घर, नाम लेकर",l:"chh",x:"नगर की खोज भीड़ की तरह नहीं लिखी गई, घर के नाम लेकर लिखी गई है। प्रहस्त का घर, महापार्श्व का, कुंभकर्ण का जो बादल जैसा दिखता था, विभीषण का, फिर महोदर, विरूपाक्ष, विद्युज्जिह्व, शुक, सारण, इंद्रजित, जंबुमाली और धूम्राक्ष के घर। हर घर के बाद वही एक बात लौटती है कि वे यहाँ नहीं हैं। सबसे आख़िर में रावण का अपना घर आता है, जिसके बारे में वे सोचते हैं कि यही लंका का गहना है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 6"},
 ravan_aana:{t:"तेज ऐसा कि छिपना पड़ा",l:"chh",x:"रात थोड़ी बची थी जब रावण की नींद खुली और सीता याद आईं। वह अपनी बड़ी रानियों को साथ लेकर, दीयों के उजाले में बग़ीचे की तरफ़ चला। उसी वक़्त हनुमान वहाँ खोज रहे थे, और उन्होंने पहले वेद पढ़ने की आवाज़ें सुनीं। रावण को आते देखकर वे नीचे उतरे और पत्तों के पीछे छिप गए। कथा साफ़ कहती है कि अपने बल के बावजूद वे उसके तेज के सामने दब से गए।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 18"},
 oopar_dekha:{t:"तब उन्होंने ऊपर देखा",l:"man",x:"कथा सुनते सुनते उन्हें लगा कि यह आवाज़ कहीं ऊपर से आ रही है। तब उन्होंने पहली बार ऊपर देखा, और पत्तों के बीच बैठा वह छोटा सा वानर दिखा। दस महीने में यह पहली बार है जब उनकी नज़र ज़मीन से उठती है। इसी के बाद संदेह, परख और फिर भरोसा, तीनों आते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 32"},
 dobara_sandesh:{t:"वही शब्द, दोबारा",l:"chh",x:"मणि देखने के बाद राम चुप नहीं रहते, वे कहते हैं कि सीता ने जो कहा वह फिर से सुनाओ। हनुमान वही शब्द दोबारा कहते हैं, और उसी में वह गिनती भी आती है कि अब कितने दिन बचे हैं। यह पूरे सुंदरकांड का आख़िरी काम है: कही हुई बात को ज्यों का त्यों पहुँचा देना।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 67"},
 kinkar_80:{t:"अस्सी हज़ार और एक लोहे का डंडा",l:"chh",x:"पहली टोली का नाम किंकर था, और गिनती अस्सी हज़ार। वाल्मीकि कहते हैं कि वे बड़े पेट और लंबे दाँतों वाले थे। हनुमान ने कोई हथियार साथ नहीं रखा था, इसलिए उन्होंने फाटक के मेहराब से ही एक लोहे का डंडा उखाड़ लिया और उसी से सब निपटा दिया। लड़ाई के बाद वे फिर उसी मेहराब पर जा बैठे, और यही इस पूरे हिस्से का ढंग है: मारना, फिर लौटकर वहीं बैठ जाना।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 42"},
 jambumali:{t:"जंबुमाली, पहला नाम वाला योद्धा",l:"chh",x:"किंकरों के बाद रावण ने अपने प्रधान मंत्री प्रहस्त के बेटे जंबुमाली को भेजा। वह पहला है जिसका नाम लेकर भेजा गया। उसने बाणों से मारा, हनुमान ने चट्टान फेंकी, उसने बाणों से उसे तोड़ दिया। फिर साल का पेड़ फेंका गया, वह भी टूटा। आख़िर में वही लोहे का डंडा काम आया।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 44"},
 saat_bete:{t:"मंत्री के सात बेटे",l:"chh",x:"इसके बाद रावण ने अपने प्रधान मंत्री के सातों बेटों को भेजा। वे बड़ी सेना लेकर आए और आसमान बाणों से भर दिया। इस बार हनुमान ने कोई हथियार नहीं उठाया, सिर्फ़ हथेली, मुट्ठी, नाखून और जाँघों से काम लिया। कथा यह गिनकर बताती है, ताकि अगली बार भेजे जाने वाले का दर्जा समझ आए।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 45"},
 paanch_senapati:{t:"पाँच सेनापतियों के नाम",l:"chh",x:"फिर पाँच सेनापति भेजे गए: विरूपाक्ष, यूपाक्ष, दुर्धर, प्रघस और भासकर्ण। भेजते वक़्त रावण ख़ुद कहता है कि यह शायद आम वानर नहीं, इंद्र का भेजा कोई और ही जीव है। पहले दुर्धर गिरा, फिर साल के पेड़ से विरूपाक्ष और यूपाक्ष, और आख़िर में पहाड़ की चोटी उखाड़कर प्रघस और भासकर्ण। उसके बाद ही अक्षकुमार की बारी आती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 46"},
 v_taali:{t:"एक ताली से बिखरी सेना",l:"chh",x:"पाताल के उस रावण के हज़ार सिर हैं, और उसे मारने का कोई सीधा रास्ता कथा में नहीं मिलता। मैदान में लड़ाई हुई ही नहीं, उसने बस ताली बजाई और पूरी सेना उड़ गई। राम भी दूर जाकर गिरे और बेहोश हो गए। लंका वाली रात में हर लड़ाई में कोई न कोई सामने था, यहाँ सामने कुछ भी नहीं है, सिर्फ़ एक आवाज़ है।",s:"sarala",p:1,ref:"विलंका रामायण, पूर्व खंड"},
 v_maya:{t:"माया का रूप धरकर निगलना",l:"chh",x:"सुरेखा सामने आकर लड़ती नहीं, माया का रूप धरकर पहले भरोसा जीतती है और फिर निगल लेती है। यह सुरसा वाले पल का उलटा है: वहाँ मुँह में घुसना परीक्षा थी, यहाँ धोखा है। भीतर अँधेरे में भी हनुमान वही करते हैं जो लंका में किया था, छोटे होते हैं और रास्ता ढूँढ लेते हैं।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 9"},
 v_kambu_card:{t:"ब्राह्मण के वेश में आया असुर",l:"chh",x:"कम्बु नाम का असुर भीख माँगने के बहाने पास आता है और मौक़ा देखकर राम को ही उठा ले जाता है। यह वही चाल है जो हरण के वक़्त चली गई थी, साधु का वेश धरकर, और कथा इसे दोहराकर याद दिलाती है कि छल हर बार वेश बदलकर आता है। छुड़ाने के बाद उसी रात विलंका जलती है।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 10, पृष्ठ 34"},
 v_lana:{t:"इस बार लोगों को पहुँचाना",l:"man",x:"पहली रात में हनुमान का काम ख़बर पहुँचाना था। यहाँ काम उलटा है: उन्हें लोगों को पहुँचाना है। देवताओं के कहने पर वे सीता और लक्ष्मण को पाताल तक लाते हैं, और यही इस पूरी कथा का सबसे बड़ा मोड़ है, क्योंकि इसके बाद अंत उनके हाथ नहीं रहता।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 17 और 18, पृष्ठ 68 और 76"},
 v_phool:{t:"लोहे का नहीं, फूलों का धनुष",l:"chh",x:"देवी मंगला जो धनुष देती हैं वह लोहे का नहीं, फूलों का है। देखने में वह खिलौना लगता है, और यही इस कथा की सबसे बड़ी बात है: जिस चीज़ को कोई हथियार मानता ही नहीं, वही अंत करती है। धनुष हाथ में आते ही मैदान चुप हो जाता है।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 20"},
 v_kshama:{t:"मरते हुए क्षमा माँगना",l:"man",x:"फूल का बाण छूटते ही उसका मन डोल जाता है और वहीं उसका अंत हो जाता है। पर कथा यहीं नहीं रुकती: मरते हुए वही असुर सीता से क्षमा माँगता है। लंका वाली रात में रावण आख़िर तक अकड़ा रहता है, और यही इन दोनों रातों का सबसे साफ़ फ़र्क़ है।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 20"},
 v_khal:{t:"दो जो भेजे गए थे",l:"chh",x:"यह पूरी कथा एक चाल से शुरू होती है। देवता चाहते थे कि पाताल का रावण भी मारा जाए, इसलिए ब्रह्मा ने दो को भेजा, खल और दुर्बल। खल सीता के कंठ में बैठा और दुर्बल राम के। उसी के असर में राम कह बैठे कि रावण मैंने अकेले मारा, और सीता ने कहा कि असल कारण मैं थी। फिर उन्हीं ने ललकारा कि जाओ, विलंका के रावण को मारकर दिखाओ। यानी लड़ाई बाहर से नहीं, एक बात से शुरू हुई।",s:"sarala",p:1,ref:"विलंका रामायण, पूर्व खंड, अध्याय 1 और 2"},
 v_chhah:{t:"छह महीने पड़े रहना",l:"chh",x:"फाटक पर हार जाने के बाद वे छह महीने वहीं पड़े रहते हैं। यह इस कथा का सबसे अलग हिस्सा है, क्योंकि बाकी कथाओं में हनुमान कभी इतनी देर रुके हुए नहीं दिखते। उठाने भी कोई अपना नहीं आता, देवता आते हैं। जो रात लंका में एक ही रात थी, वह यहाँ महीनों में फैल जाती है।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 3, पृष्ठ 12"},
 v_maafi:{t:"अंत में क्षमा",l:"man",x:"इस कथा का अंत मारने पर नहीं रुकता। मरते हुए वही असुर सीता से क्षमा माँगता है। लंका वाली रात में रावण आख़िर तक अकड़ा रहता है, यहाँ वही अकड़ आख़िरी पल में टूट जाती है। ओड़िया परंपरा इसी मोड़ के लिए याद की जाती है।",s:"sarala",p:1,ref:"विलंका रामायण, अध्याय 20"},
 w_badal:{t:"बादलों के बीच से",l:"chh",x:"उड़ते हनुमान के साथ रंग बिरंगे बादल चिपकते और छूटते रहे। बीच बीच में वे बादलों में छिप जाते और फिर बाहर निकल आते थे।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 w_hawa:{t:"अकेली दिखती उड़ान",l:"chh",x:"उस उड़ान में सूरज ने उन्हें तपाया नहीं और हवा ठंडी होकर साथ चली। कारण कथा ख़ुद बताती है: हवा के देवता उनके पिता हैं, और बेटे के इस काम में वे पीछे नहीं रहते। रास्ते में देवता और गंधर्व फूल बरसाते हैं। यानी यह अकेली उड़ान दिखती है, पर अकेली है नहीं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 w_chand:{t:"उस रात का चाँद",l:"chh",x:"लंका में घुसने का वक़्त चाँद की रोशनी से तय हुआ। रात की चाँदनी में सोने के महल और सोया नगर दोनों साफ़ दिखते थे।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2 और 5"},
 w_bhor:{t:"भोर से पहले की हवा",l:"chh",x:"रात का आख़िरी हिस्सा सबसे ठंडा और सबसे चुप होता है। बात इसी वक़्त हुई, और उजाला होने से पहले ख़त्म भी हो गई।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 29 और 30"},
 w_dhuan:{t:"ऊपर से दिखती जलती लंका",l:"chh",x:"जलती लंका का वर्णन ऊपर से है, इसलिए पहले चमक दिखती है, फिर धुआँ, और फिर नीचे भागते लोग। कथा कहती है कि छतों से गिरते हुए स्त्रियाँ और बच्चे चिल्ला रहे थे, और कुछ राक्षस कह रहे थे कि यह वानर नहीं, ब्रह्मा और देवताओं के शाप का नतीजा है। सोने का नगर उसी रात धुएँ का हो गया।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 54"},
 mainak:{t:"मैनाक का पुराना क़र्ज़",l:"chh",x:"मैनाक समुद्र में यों ही नहीं बैठा था। इंद्र ने उसे पाताल के मुँह पर ढक्कन की तरह रखा था, ताकि नीचे के असुर ऊपर न आ सकें। और वह पानी के भीतर इसलिए था कि कृतयुग में पहाड़ों के पंख होते थे, इंद्र ने वज्र से सबके काट दिए, पर पवन ने मैनाक को पंख समेत उठाकर समुद्र में छिपा दिया। इसीलिए वह आज पवन के बेटे का क़र्ज़ मानता है। हनुमान ने उसे पहले रुकावट समझकर छाती से गिराया, फिर वह आदमी का रूप लेकर सामने आया। हनुमान ने विश्राम से मना कर दिया, यह कहकर कि दिन ढल रहा है और वचन दिया जा चुका है, बस हाथ से छूकर आगे उड़ गए। बाद में इंद्र ने ख़ुश होकर मैनाक को अभय दे दिया।",s:"vr",ref:"सुंदरकांड, सर्ग 1"},
 surasa:{t:"वरदान तोड़े बिना निकलना",l:"chh",x:"सुरसा नागों की माता हैं, और दक्ष की बेटी भी, यह ख़ुद हनुमान उन्हें संबोधित करते हुए कहते हैं। उन्हें देवताओं ने भेजा था, दुश्मन बनाकर नहीं, परीक्षा के लिए। ब्रह्मा का वरदान उनके पास था कि कोई भी उनके मुँह में घुसे बिना आगे नहीं जा सकता। हनुमान बड़े होते गए, वे मुँह उतना ही बड़ा करती गईं, नब्बे योजन तक। तब हनुमान अंगूठे जितने छोटे होकर मुँह में गए और बाहर आ गए। न वरदान टूटा, न लड़ाई हुई। यही इस पूरी उड़ान का ढंग है: जीतना नहीं, निकल जाना।",s:"vr",ref:"सुंदरकांड, सर्ग 1"},
 simhika:{t:"सुग्रीव की बताई हुई बात",l:"chh",x:"सिंहिका परछाईं पकड़कर उड़ते जीवों को नीचे खींच लेती थी। हनुमान को पहले लगा कि वे उलटी हवा में फँसी नाव की तरह पीछे खिंच रहे हैं। फिर नीचे देखकर वे तुरंत पहचान गए, क्योंकि चलने से पहले सुग्रीव ने इसी जीव के बारे में बता रखा था। इसीलिए यहाँ घबराहट नहीं होती। वे उसके मुँह में घुसकर भीतर से चीरते हैं और निकल आते हैं। आसमान में खड़े लोग तब चार बातें गिनाते हैं जो इस काम के लिए चाहिए: साहस, नज़र, बुद्धि और कौशल।",s:"vr",ref:"सुंदरकांड, सर्ग 1"},
 chhaya:{t:"दस और तीस योजन",l:"chh",x:"उड़ते हनुमान की परछाईं पानी पर दस योजन चौड़ी और तीस योजन लंबी थी, सफ़ेद बादलों की कतार जैसी। वही परछाईं आगे चलकर काम बिगाड़ती है, क्योंकि सिंहिका शरीर नहीं, यही परछाईं पकड़ती है। कवि पहले उसे सुंदर बताता है, फिर उसी को ख़तरा बना देता है।",s:"vr",ref:"सुंदरकांड, सर्ग 1"},
 chhota:{t:"जब जो रूप ज़रूरी हो",l:"chh",x:"आकार का यह चुनाव पूरी रात का सबसे बड़ा फ़ैसला है। बड़े रूप में पूरी सेना से लड़ना पड़ता, और तब खोज कभी पूरी न होती। इसीलिए वे साँझ का इंतज़ार करते हैं और बिल्ली जितने छोटे होकर भीतर जाते हैं। यही वानर आगे उसी रात नब्बे योजन तक बड़े भी होते हैं। जब जो ज़रूरी हो, वही रूप, यही उनका ढंग है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2"},
 intzaar:{t:"उस पार का इंतज़ार",l:"man",x:"समुद्र के इस पार वानर बैठे हैं। न ख़बर है, न खाना, बस लौटने का डर। सुग्रीव ने एक महीने की हद बाँधी थी और वह बीत चुकी है, इसलिए लौटना भी आसान नहीं रहा। कुछ कहते हैं कि यहीं प्राण छोड़ देंगे, कुछ कहते हैं कि आगे जाकर मर जाएँगे। यही इंतज़ार सुंदरकांड के आख़िरी हिस्से तक चलता है, जब तक लौटकर ख़बर नहीं आ जाती, और तभी यह समझ आता है कि सबसे लंबा हिस्सा किसी और ने नहीं, इन्होंने काटा।",s:"vr",p:1,ref:"वाल्मीकि रामायण, किष्किंधा कांड का अंत और सुंदरकांड, सर्ग 57 से 59"},
 lankini:{t:"वह पहरेदार नहीं, नगर ही है",l:"chh",sl:"अहं तु नगरी लङ्का स्वयमेव प्लवङ्गम",slm:"हे वानर, मैं ख़ुद ही लंका नगरी हूँ।",x:"गिरने के बाद वह जो कहती है, वही इस रात की सबसे बड़ी बात है: मैं कोई पहरेदार नहीं, मैं ख़ुद लंका नगरी हूँ। ब्रह्मा ने उसे बहुत पहले कहा था कि जिस दिन कोई वानर तुझे अपने बल से वश में कर ले, उसी दिन से राक्षसों का डर शुरू समझना। वह ख़ुद कहती है कि वह दिन आज तेरे दिखते ही आ गया, और ब्रह्मा की कही बात टलती नहीं। फिर वही उसे भीतर जाने देती है और कहती है कि इस शापग्रस्त नगरी में जहाँ चाहे घूम।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 3"},
 nagar:{t:"बीच नगर में किसी और का विमान",l:"chh",x:"बीच नगर में जो उड़ने वाला विमान खड़ा है, वह रावण का बनाया हुआ नहीं है। पुष्पक पहले कुबेर के पास था, और रावण उसे लड़ाई में छीनकर लाया था। वाल्मीकि उसे सोने की जालीदार खिड़कियों और रत्न जड़े खंभों वाला बताते हैं। यानी जिस नगर में हनुमान घूम रहे हैं, उसकी सबसे सुंदर चीज़ भी किसी और से ली हुई है।",s:"vr",p:1,ref:"पुष्पक का वर्णन: सुंदरकांड, सर्ग 7 और 8; कुबेर से छीनने की बात: किष्किंधाकांड, सर्ग 43 तथा उत्तरकांड"},
 sita_raat:{t:"पहचान कैसे हुई",l:"man",x:"पहचान कपड़ों या गहनों से नहीं होती। वाल्मीकि लिखते हैं कि वे एक ही वस्त्र में हैं, वह भी मैला, बाल बिखरे हुए, और वे ज़मीन पर बैठी हैं, पेड़ के नीचे। हनुमान उन्हें उस चीज़ से पहचानते हैं जो उन्हें पहले बताई गई थी: जो गहने वे गिराती गई थीं, उनमें से बचे हुए अब भी उन्हीं पर हैं। दुबली, चुप, और दिन गिनती हुई।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 15 और 17; गिराए हुए गहनों वाली बात: किष्किंधाकांड, सर्ग 6"},
 mandodari:{t:"ठिठकना और फिर आगे बढ़ना",l:"chh",x:"जिसे देखकर वे ठिठके, वह मंदोदरी थी, मय दानव की बेटी और लंका की बड़ी रानी। ख़ुद को टोकते हुए वे जो तर्क देते हैं, वही याद रखने लायक है: जो अपने पति से बिछड़ी हो, वह न सोती है, न सिंगार करती है, न खाती पीती है, और न किसी और को देखती है, चाहे वह देवताओं का राजा ही क्यों न हो। इसी तर्क से वे आगे बढ़ जाते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 10"},
 pangrih:{t:"नशे का घर",l:"chh",x:"इसी सर्ग में एक बात और आती है जो कम पढ़ी जाती है। सोई हुई स्त्रियों को देखकर हनुमान ख़ुद से पूछते हैं कि कहीं यह देखना पाप तो नहीं, और फिर ख़ुद ही जवाब देते हैं कि मन डोला ही नहीं, इसलिए दोष नहीं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 11"},
 kuber_shaap:{t:"लंका पहले किसकी थी",l:"chh",x:"यह नगरी हमेशा से रावण की नहीं थी। पहले यहाँ कुबेर का राज था। रावण ने उसे हराकर लंका छीन ली, और उसी के साथ एक शाप भी मिला। विभीषण उस वक़्त कुबेर के साथ चला गया था, क्योंकि उसने वरदान में बल नहीं, धर्म पर टिके रहना माँगा था। इसीलिए द्वार पर रोकने वाली भी लंका को शापग्रस्त नगरी कहती है, और इसीलिए इस नगर में एक घर बाकी सबसे अलग दिखता है।",s:"mbh",p:1,ref:"महाभारत, वनपर्व का रामोपाख्यान: कुबेर से लंका छीनना, शाप, और विभीषण का वरदान; शापग्रस्त नगरी वाली बात वाल्मीकि सुंदरकांड, सर्ग 3"},
 vibhishan:{t:"तुलसी से हुई पहचान",l:"gr",x:"मानस में पहचान की निशानी हथियार या पहरा नहीं, तुलसी का पौधा और राम का नाम है। उसी से हनुमान समझ जाते हैं कि इस नगर में एक घर अलग है। वाल्मीकि में यह प्रसंग इस रूप में नहीं आता, वहाँ विभीषण दरबार में सामने आते हैं। तुलसीदास ने भक्त को भक्त से मिलवाया।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड, दोहा 5 और उसके बाद का संवाद"},
 nirasha:{t:"हार का मन",l:"man",x:"पूरी लंका छानने के बाद भी सीता नहीं मिलीं, और हनुमान का मन बैठ गया। वे सोचते हैं कि अब लौटकर क्या कहूँगा, और क्या सबको यही ख़बर दूँ कि कुछ नहीं मिला। फिर वे ख़ुद को सँभालते हैं और वही बात कहते हैं जो पूरी कथा में सबसे काम की है: निराशा से बड़ा कोई दुश्मन नहीं, क्योंकि वही बचा हुआ रास्ता भी बंद कर देती है। इसके बाद वे एक बार और ढूँढने का तय करते हैं, और तभी बाग़ की तरफ़ नज़र जाती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 12 और 13"},
 angad_tanav:{t:"अंगद और सुग्रीव के बीच की गाँठ",l:"chh",x:"लौटती टोली में अंगद यों ही आगे नहीं है। वह बालि का बेटा है, यानी उसी राजा का जिसे मारकर सुग्रीव गद्दी पर बैठे। खोज के लिए सुग्रीव ने एक महीने की हद बाँधी थी, और वह हद बीत चुकी थी। इसीलिए लौटते वक़्त डर भी था और ऊधम भी, और मधुवन में शहद पीने की इजाज़त अंगद ने ही दी। ख़बर अच्छी थी, वरना वह ऊधम भारी पड़ता।",s:"vr",p:1,ref:"बालि और सुग्रीव तथा एक महीने की हद: किष्किंधाकांड, सर्ग 26 से 29; मधुवन में अंगद की इजाज़त: सुंदरकांड, सर्ग 61 से 63"},
 avadhi:{t:"दसवाँ महीना चल रहा है",l:"chh",x:"अवधि पहले बारह महीने की थी, जो हरण के वक़्त दी गई थी। सीता ख़ुद हनुमान को बताती हैं कि अभी दसवाँ महीना चल रहा है और सिर्फ़ दो बचे हैं। इसीलिए वे कहती हैं कि राम को जल्दी करने को कहना, क्योंकि उतने ही दिन वे जीवित रहेंगी। यह पूरी रात इसी गिनती के ऊपर टिकी है।",s:"vr",p:1,ref:"बारह महीने की अवधि: अरण्यकांड, सर्ग 56; दो महीने बाकी: सुंदरकांड, सर्ग 22 और सर्ग 37"},
 trijata:{t:"सपने का पूरा ब्योरा",l:"chh",x:"त्रिजटा का सपना ब्योरेवार है, इसीलिए वह डराता है। उसमें रावण तेल में सना हुआ, नशे में चूर, पुष्पक से नीचे गिरा हुआ दिखता है, और उसे दक्षिण की ओर घसीटा जा रहा है, यानी यम की दिशा में। वह गधे या सूअर पर बैठा है और कीचड़ में धँसता जाता है। दूसरी तरफ़ राम की जीत दिखती है। सपना सुनाकर त्रिजटा बाकियों को चुप करा देती है, और उसी घड़ी बग़ीचे का डर थोड़ा हल्का हो जाता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 27"},
 bhasha:{t:"कौन सी बोली बोलें",l:"man",x:"वाल्मीकि इसे भाषा के चुनाव की तरह लिखते हैं। संस्कृत में बोलें तो वे इसे ब्राह्मण का भेस धरे रावण समझेंगी, इसलिए वही बोली चुनी गई जो आम लोग बोलते हैं। पूरे सुंदरकांड में यह अकेली जगह है जहाँ भाषा ख़ुद एक फ़ैसला बन जाती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 30"},
 anguthi:{t:"कहानी पहले, अँगूठी बाद में",l:"chh",x:"अँगूठी पहले नहीं दी जाती, पहले कहानी सुनाई जाती है, वह भी धीरे और आम बोली में, ताकि वे इसे रावण का छल न समझें। अँगूठी पर राम का नाम खुदा है, और उसे देखते ही वे उसे चेहरे से लगा लेती हैं। दस महीने में यह पहली चीज़ है जो राम के हाथ से चलकर उन तक पहुँची है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 36"},
 kaua:{t:"एक आँख के बदले जान",l:"chh",x:"वह पुरानी बात यह थी। एक कौआ उन्हें चोंच मार रहा था। राम ने अपने कुश के बिछौने से एक तिनका उठाया, उस पर ब्रह्मास्त्र चढ़ाया और छोड़ दिया। तिनका आग की तरह जलता हुआ कौए के पीछे लगा। वह तीनों लोक भागा, पर न पिता ने बचाया, न देवताओं ने। आख़िर लौटकर राम की ही शरण में आया। तब उसने ख़ुद कहा कि मेरी दाईं आँख ले लो, और तिनके ने वही आँख ली। जान बच गई, एक आँख के बदले। यह बात सिर्फ़ वे दोनों जानते थे, इसीलिए यही सबसे पक्की निशानी बनी। वाल्मीकि उसे सिर्फ़ कौआ कहते हैं; बाद की परंपरा में उसे इंद्र का बेटा जयंत बताया जाता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 38 (सीता ने सुनाई) और सर्ग 67 (हनुमान ने राम को दोहराई)"},
 peeth:{t:"मना करने की दो वजहें",l:"man",x:"मना करने की वजह वे ख़ुद दो टुकड़ों में कहती हैं। पहली, पति के प्रति निष्ठा के नाते वे राम के सिवा किसी और के शरीर को छू नहीं सकतीं, और जो रावण का स्पर्श हुआ वह बेबसी में हुआ, अपनी मर्ज़ी से नहीं। दूसरी, यह उचित तभी होगा जब राम यहीं आकर रावण को उसके कुल समेत मारें और फिर उन्हें ले जाएँ। यानी यह डर या शर्म नहीं, दो साफ़ कारण हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 37"},
 adhy_sita:{t:"दुश्मन की तरफ़ से पहला संकेत",l:"gr",x:"इस कथा में द्वार पर रोकने वाली ख़ुद कहती है कि जनक के घर जन्मी वे योगमाया हैं। यानी जिसे ढूँढा जा रहा है, उसके बारे में पहला संकेत दुश्मन की तरफ़ से मिलता है। यहाँ राम ब्रह्म हैं और सीता माया, और हनुमान का काम लड़ना नहीं, पहचान कराना है।",s:"adhy",p:1,ref:"अध्यात्म रामायण, सुंदरकांड, सर्ग 1 (लंका देवी का यह कहना कि जनक के घर जन्मी योगमाया हैं); पूरा सुंदरकांड पाँच सर्गों का है"},
 maya_sita:{t:"तो वाटिका में कौन बैठी थी",l:"gr",x:"यह विचार सबसे पहले कूर्म पुराण में मिलता है, लगभग डेढ़ हज़ार साल पहले, और वहीं से पद्म पुराण, ब्रह्मवैवर्त, अध्यात्म रामायण और मानस तक जाता है। मानस में तो हरण से पहले ही अग्नि में जाने की बात आ जाती है, यानी पूरी लंका की लड़ाई एक छाया के लिए लड़ी गई।",s:"kurma",p:1,ref:"कूर्म पुराण (लगभग 550 से 850 ईस्वी) में पहली बार; फिर पद्म पुराण, ब्रह्मवैवर्त पुराण, अध्यात्म रामायण और रामचरितमानस में"},
 vatika_tod:{t:"उजाड़ना, सोचा हुआ काम",l:"chh",x:"यह ग़ुस्सा नहीं, सोचा हुआ काम था। वे ख़ुद तय करते हैं कि यह बग़ीचा रावण को प्यारा है, इसलिए इसे उजाड़ने से सेना आएगी, और तभी पता चलेगा कि लंका में कितना बल है। साथ ही बँधकर रावण तक पहुँचने का रास्ता भी खुलेगा। एक दूत का काम सिर्फ़ ख़बर लाना नहीं, ताक़त नापना भी होता है।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 41 और 42"},
 kinkar:{t:"एक के बाद एक भेजना",l:"chh",x:"रावण ने एक साथ सब नहीं भेजा, एक के बाद एक भेजा। पहले किंकर नाम के पहरेदार, फिर चैत्य महल का रखवाला, फिर पाँच सेनापति, फिर अपना छोटा बेटा, और आख़िर में इंद्रजित। हर बार वही होता है, कोई लौटकर नहीं आता। कथा इसी क्रम से बताती है कि लंका को समझ में आने में कितनी देर लगी कि यह अकेला वानर क्या है।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 44 से 46"},
 akshay:{t:"सबसे छोटा बेटा",l:"chh",x:"अक्षकुमार रथ पर आया और पहले बाणों से घेरा। वाल्मीकि कहते हैं कि आख़िर में उसे पैरों से पकड़कर घुमाया गया और ज़मीन पर पटक दिया गया। रथ, सारथी और घोड़े भी उसी के साथ चूर हो गए।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 47"},
 brahmastra:{t:"पहरेदारों ने अस्त्र बेकार कर दिया",l:"man",x:"इंद्रजित के बाणों से बात नहीं बनी, तब उसने ब्रह्मास्त्र चलाया और वही बाँध सका। हनुमान चाहते तो छूट सकते थे, पर उन्होंने ब्रह्मा की मर्यादा रखी और चुप पड़े रहे, क्योंकि बँधकर ही रावण तक पहुँचा जा सकता था। असली मोड़ इसके बाद आता है: राक्षसों ने उन्हें छाल और सन की रस्सियों से भी बाँध दिया, और उसी पल ब्रह्मास्त्र का बंधन छूट गया, क्योंकि वह अस्त्र किसी दूसरे बंधन के साथ नहीं ठहरता। हनुमान को ख़ुद भी पता नहीं चला कि वे छूट चुके हैं। यानी रावण के अपने पहरेदारों ने ज़्यादा सावधानी दिखाकर सबसे बड़ा अस्त्र बेकार कर दिया।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 48, श्लोक 48 के आसपास"},
 dut:{t:"दूत को मारा नहीं जाता",l:"chh",x:"दंड चुनते वक़्त तर्क यह दिया गया कि वानरों को अपनी पूँछ सबसे प्यारी होती है, इसलिए वही जलाई जाए। मारने की जगह अपमान चुना गया, और वही फ़ैसला आगे लंका को ले डूबा।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 52"},
 poonch:{t:"सज़ा, जो टोह बन गई",l:"chh",x:"दंड चुनने की बहस के बाद रावण ने कहा कि मारना नहीं, कुछ और करो। तब तय हुआ कि पूँछ जलाई जाए, क्योंकि वानरों को अपनी पूँछ सबसे प्यारी होती है, और उसे पूरे नगर के चौराहों पर घुमाया जाए। हनुमान चुप इसलिए रहे कि यही मौक़ा था दिन के उजाले में पूरा नगर देख लेने का, जो रात में पूरा नहीं देखा जा सका था। सज़ा ही उनकी दूसरी टोह बन गई।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 53"},
 dahan:{t:"आग ने उसे क्यों नहीं जलाया",l:"chh",x:"आग हनुमान को ख़ुद क्यों नहीं जलाती, इसका कारण वे ख़ुद गिनाते हैं: सीता का अडिग रहना, राम का तेज, और अपने पिता पवन की अग्नि से मित्रता। इसी बीच वाटिका में सीता अग्नि से प्रार्थना कर रही होती हैं कि इस वानर का कुछ न बिगड़े। फिर पूँछ की आग छत दर छत फैलती है और सोने के महल राख होने लगते हैं।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 54"},
 dar_sita:{t:"जलाने के बाद का डर",l:"man",x:"लंका जलाकर वे समुद्र में पूँछ बुझाते हैं, और उसी पल उन्हें एक डर पकड़ता है: अगर सारा नगर जला है तो वाटिका भी जली होगी, और वहाँ तो वही बैठी थीं। वे ख़ुद को कोसते हैं कि ग़ुस्से में यह क्या कर दिया। फिर अपने ही तर्क से सँभलते हैं: जो आग मुझे नहीं जला सकी, वह उन्हें कैसे जलाएगी। तभी आसमान से चारण यह कहते सुनाई देते हैं कि लंका जली है, पर वे सुरक्षित हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 55"},
 charan:{t:"डर और राहत",l:"man",x:"आग लगाने के बाद हनुमान को डर लगा कि कहीं सीता भी न जल गई हों, और वे ख़ुद को कोसने लगे कि ग़ुस्से में यह क्या कर दिया। फिर वे अपने ही तर्क से सँभलते हैं: अगर वे जलतीं तो मेरी पूँछ ठंडी क्यों रहती। तभी आसमान से आवाज़ें आती हैं कि लंका जली है पर वे सुरक्षित हैं। इतने पर भी वे मानते नहीं और ख़ुद जाकर देखते हैं, और यही इस पूरी रात की सबसे बड़ी राहत है।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 55 और 56"},
 madhuvan:{t:"मना किया हुआ बाग़",l:"chh",x:"मधुवन कोई आम बाग़ नहीं था, वह सुग्रीव का अपना संरक्षित बाग़ था, जिसमें बिना इजाज़त घुसना मना था। लौटते वानरों ने अंगद की इजाज़त लेकर शहद पिया, फल तोड़े, और रोकने आए रखवालों को धकेल दिया। यही ऊधम आगे चलकर ख़बर बन जाता है।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 61"},
 khabar:{t:"पहला वाक्य, बाकी सब बाद में",l:"man",x:"वे पहले सीता की दिशा में सिर झुकाते हैं, फिर बोलते हैं। पहला वाक्य ब्योरा नहीं, सिर्फ़ इतना है कि सीता देखी गईं, जीवित हैं, और मन तुममें लगाए हुए हैं। लड़ाई, आग, दरबार, यह सब उसके बाद आता है। जो सबसे ज़रूरी था वह पहले कह दिया गया, बाकी सब उसके पीछे।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 65"},
 jain_lanka:{t:"दूसरी परंपरा की लंका",l:"gr",x:"जैन रामकथा में यह पूरा हिस्सा अलग ढंग से चलता है। वहाँ रावण राक्षस नहीं, विद्याधर राजा है, और उसके लोग भी वैसे ही हैं। उड़ना विद्या है, दूत भेजा हुआ है, और घटनाओं का क्रम भी बदला हुआ। सबसे बड़ा फ़र्क़ यह कि वहाँ पूँछ में आग लगने की बात ही नहीं आती। यानी जिस दृश्य से यह पूरी रात पहचानी जाती है, वह एक पूरी परंपरा में है ही नहीं।",s:"jain",p:2,ref:"पउमचरिय, उद्देश 51 (नाना महेंद्र वाला प्रसंग) और आगे के उद्देश"},
 lautna:{t:"जाते और लौटते का फ़र्क़",l:"chh",x:"लौटने की छलाँग जाने वाली छलाँग से भारी है, क्योंकि अब ख़बर साथ है। वे अरिष्ट पहाड़ की चोटी पर चढ़कर कूदते हैं, और उस धक्के से पेड़ उखड़ते हैं और चोटी दब जाती है। जाते वक़्त पहाड़ ने रुकने को कहा था, लौटते वक़्त पहाड़ नीचे दबता है। कथा यही फ़र्क़ दिखाकर बताती है कि अब वे वही नहीं रहे।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 57"},
 jambavan_role:{t:"जिसने याद दिलाया, वही अब पूछता है",l:"chh",x:"किनारे पर हाल पूछने वाले जांबवान यों ही सबसे आगे नहीं हैं। उड़ान से पहले जब सब हिम्मत हार चुके थे, तब उन्होंने ही हनुमान को उनका अपना बल और जन्म याद दिलाया था, और तभी वे इतने बड़े हुए कि समुद्र लाँघ सकें। इसलिए लौटकर पहला ब्योरा उन्हीं के सामने रखा जाता है।",s:"vr",p:1,ref:"जांबवान का याद दिलाना: किष्किंधाकांड, सर्ग 66; लौटकर सुनाना: सुंदरकांड, सर्ग 57 से 59"},
 katha:{t:"पूरी कथा एक साँस में",l:"chh",x:"वाल्मीकि यह हाल तीन बार सुनवाते हैं: पहले किनारे पर साथियों को, फिर सुग्रीव के सामने, और आख़िर में राम के सामने। हर बार ब्योरा थोड़ा बदलता है, और राम के सामने वह सबसे छोटा हो जाता है, क्योंकि पहला वाक्य ही सब कह देता है।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 58 और 59"},
 josh:{t:"जोश और रोक",l:"man",x:"जोश में अंगद कहता है कि अभी लौट चलो, हम ही लंका तोड़ देंगे और सीता को ले आएँगे। जांबवान रोक देते हैं, क्योंकि यह तय करना राम का काम है, टोली का नहीं। जीत के तुरंत बाद वाला यही पल सबसे कच्चा होता है, और कथा उसे बिना छिपाए दिखाती है।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 60"},
 dadhimukh:{t:"शिकायत में छिपी ख़बर",l:"chh",x:"दधिमुख शिकायत लेकर सीधे किष्किंधा पहुँचा। सुग्रीव ने सुनते ही उलटा अर्थ निकाला और लक्ष्मण से कहा कि जो हारकर लौटते हैं वे ऐसा ऊधम नहीं करते, इसलिए काम हो गया है, सीता मिल गई हैं, और यह किसी और से नहीं, हनुमान से ही हुआ होगा। यानी ख़बर पहुँचने से पहले ही पढ़ ली गई, एक शिकायत में से।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 62"},
 sugriva:{t:"नुक़सान छोड़ना",l:"man",x:"सुग्रीव ने दधिमुख को सज़ा नहीं दी, उलटा समझाकर लौटा दिया कि जाओ, उन्हें आने दो, वे मेरे पास आ रहे हैं। राजा के लिए यही परख का पल था: एक तरफ़ अपने बाग़ का नुक़सान, दूसरी तरफ़ वह ख़बर जिसका महीनों इंतज़ार था। उन्होंने नुक़सान छोड़ दिया।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 63"},
 manshila:{t:"गाल पर लगाया हुआ रंग",l:"chh",x:"सीता एक और निशानी भेजती हैं, जो कौए वाली बात से भी निजी है। एक दिन उनके माथे का टीका मिट गया था, तब राम ने गेरू जैसे लाल रंग से उनके गाल पर वही निशान बना दिया था। यह याद दिलाने को कहकर वे हनुमान को विदा करती हैं। यानी पहचान के लिए हथियार या मणि नहीं, एक छोटा सा दिन याद दिलाया जाता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 40"},
 rakshasi_naam:{t:"घेरे में बैठी राक्षसियों के नाम",l:"chh",x:"वाल्मीकि उन्हें भीड़ की तरह नहीं लिखते, नाम लेकर लिखते हैं। एकजटा, जिसकी आँखें ग़ुस्से से लाल हैं; हरिजटा, जिसकी आँखें बिल्ली जैसी हैं; प्रघसा, विकटा और दुर्मुखी। हर एक बारी बारी से डराती है, कोई समझाकर, कोई धमकाकर। आख़िर में वे कहती हैं कि इसका मांस खाकर निकुंभिला के मैदान में नाचेंगी, जहाँ रावण यज्ञ करता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 23 और 24"},
 chudamani:{t:"मणि का अपना इतिहास",l:"chh",x:"मणि हाथ में लेते ही राम उसे छाती से लगाकर रो पड़ते हैं। फिर वे सुग्रीव को उसका इतिहास बताते हैं: यह मणि पानी से निकली थी और यज्ञ से प्रसन्न होकर इंद्र ने जनक को दी थी। इसीलिए वे कहते हैं कि इसे देखकर मुझे अपने पिता और जनक, दोनों के दर्शन हो रहे हैं। दस महीने सीता ने इसे कपड़े में छिपाकर सँभाले रखा था।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 65"},
 sandesh:{t:"संदेश की तीन परतें",l:"man",x:"संदेश में तीन चीज़ें थीं: कौए वाली पुरानी बात, गाल पर लगाए रंग की याद, और यह गिनती कि दो महीने बचे हैं। इसी के साथ वे कहती हैं कि राम से कहना जल्दी करें, क्योंकि उतने ही दिन वे जी सकेंगी। सुनने वाला एक वानर है, पर बात सीधे राम से कही जा रही है।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 68"},
 ram_ro:{t:"दोबारा सुनने की माँग",l:"man",x:"वे मणि को छाती से लगाकर रोते हैं और सुग्रीव से कहते हैं कि इसे देखकर मुझे अपने पिता और जनक दोनों के दर्शन हो रहे हैं। फिर वे हनुमान से वही बात दोबारा कहने को कहते हैं जो सीता ने कही थी, एक एक शब्द। सुनी हुई बात पर उन्हें भरोसा नहीं होता, वे उसे दोहराकर सुनना चाहते हैं।",s:"vr",p:3,ref:"सुंदरकांड, सर्ग 66"},
 manas_sandesh:{t:"मानस वाली विदाई",l:"gr",x:"मानस में लौटने के बाद हनुमान चूड़ामणि सौंपते हैं और राम उसे छाती से लगा लेते हैं। फिर वे सीता का संदेश सुनते हैं और उनकी आँखें भर आती हैं। तुलसीदास यहाँ राजा या अवतार नहीं दिखाते, एक आदमी दिखाते हैं जिसे अपनी पत्नी की एक निशानी मिली है। इसी एक पल के लिए पूरा सुंदरकांड खड़ा है, और इसीलिए वह पाठ यहाँ आकर सबसे धीमा हो जाता है।",s:"manas",p:3,ref:"रामचरितमानस, सुंदरकांड, दोहा 31 और 32 के आसपास (संदेश, चूड़ामणि और राम का भर आना)"},
 sagar:{t:"समुद्र ने मदद क्यों की",l:"chh",x:"समुद्र ख़ुद सोचता है कि इस वानर को थकने नहीं देना चाहिए, क्योंकि उसे इसी वंश के सगर ने खुदवाकर बड़ा किया था। वह कहता है कि जो एहसान करे, उसका बदला लौटाना पुरानी रीत है। इसीलिए वह मैनाक से कहता है कि ऊपर उठकर इस मेहमान को ठहरने की जगह दे।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1; समुद्र का अपना कथन और मैनाक से उसका कहना"},
 baaje:{t:"बाजों को गले लगाकर सोना",l:"chh",x:"महल का सबसे याद रह जाने वाला दृश्य यही है। नाचने गाने वाली स्त्रियाँ थककर वहीं सो गई हैं, और हर एक अपना बाजा गले लगाए हुए है। कोई वीणा से लिपटी है, किसी की बग़ल में मड्डुक दबा है जैसे कोई बच्चे को लिए सो रही हो, कोई मृदंग से चिपकी है, कोई बाँसुरी थामे। कवि कहता है कि वे सब सोई हुई कमलिनियों जैसी लगती थीं। हनुमान इसी बीच से गुज़रते हुए उन्हें एक एक करके देखते हैं, और आगे बढ़ जाते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 10 और 11"},
 shinshapa:{t:"जिस पेड़ पर वे छिपे थे",l:"chh",x:"वाटिका में वे किसी भी पेड़ पर नहीं चढ़े थे। जिस पेड़ के नीचे सीता बैठी थीं, वे उसी शिंशपा पर ऊपर छिपे थे, पत्तों में पक्षी की तरह। इसीलिए रावण के आने पर वे सब कुछ ऊपर से देख और सुन पाते हैं, और बाद में राम को यह पूरा हाल सुना पाते हैं। छिपने की जगह वही थी जहाँ सबसे ज़्यादा ख़तरा था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 14 और सर्ग 58, जहाँ हनुमान ख़ुद यह बताते हैं"},
 nagri_stri:{t:"नगरी, सजी हुई स्त्री जैसी",l:"chh",sl:"ताम् रत्न वसन उपेताम् कोष्ठ आगार अवतंसकाम्",slm:"रत्न जिसके कपड़े हैं, और भंडार घर जिसके कान के कुंडल।",x:"वाल्मीकि नगर को एक सजी हुई स्त्री की तरह देखते हैं: रत्न उसके कपड़े हैं, भंडार घर कान के कुंडल, और हथियारों के घर उसकी छाती। दीयों से जलते बड़े मकानों के कारण वहाँ अँधेरा बचा ही नहीं था। यही नगर कुछ ही घंटों बाद धुएँ में बदल जाता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 3, श्लोक 18 और 19"},
 dvar_rok:{t:"यहाँ से आगे नहीं जा सकते",l:"chh",sl:"न शक्यम् खल्वियम् लङ्का प्रवेष्टुम् वानर त्वया",slm:"हे वानर, तुझसे यह लंका भीतर घुसी नहीं जा सकती।",x:"फाटक पर पहली बात यही कही जाती है, और वह धमकी नहीं, दावा है। रावण की सेना चारों तरफ़ पहरे पर है, इसलिए यह नगरी किसी के घुसने लायक नहीं। उसी दावे के बाद हनुमान पूछते हैं कि तू कौन है, और वहीं से पूरी बात खुलती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 3, श्लोक 24"},
