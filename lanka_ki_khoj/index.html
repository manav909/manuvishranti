 bhogavati:{t:"नगर किससे मिलता जुलता था",l:"chh",sl:"भुजग आचरिताम् गुप्ताम् शुभाम् भोगवतीम् इव",slm:"साँपों से भरी और उन्हीं से सुरक्षित, शुभ भोगवती नगरी जैसी।",x:"वाल्मीकि लंका की तुलना दो नगरों से करते हैं। एक भोगवती, जो नागों की नगरी है और साँपों से घिरी रहती है, और दूसरी अमरावती, जो इंद्र की नगरी है। यानी यह नगर देवताओं जैसा सुंदर भी है और साँपों जैसा ख़तरनाक भी। दीवारें सोने की हैं, और झंडों पर लगी छोटी घंटियाँ हवा में बजती रहती हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2 और 3"},
 naap:{t:"किसने कितनी छलाँग बताई",l:"chh",x:"चलने से पहले सबने अपनी अपनी हद बताई थी। गज ने दस योजन, गवाक्ष ने बीस, गवय ने तीस, शरभ ने चालीस, गंधमादन ने पचास, मैंद ने साठ, द्विविद ने सत्तर, सुषेण ने अस्सी, और बूढ़े जांबवान ने नब्बे, यह कहकर कि अब उम्र इतनी ही देती है। अंगद ने कहा सौ तो जाऊँगा, पर लौट पाऊँगा या नहीं, यह पक्का नहीं। किसी ने जाकर लौटने की बात नहीं कही। तब जांबवान हनुमान की तरफ़ मुड़े।",s:"vr",p:1,ref:"किष्किंधाकांड, सर्ग 65"},
 nirasha_gehra:{t:"लौटूँ ही नहीं, ऐसा भी सोचा",l:"man",x:"पूरा नगर छान लेने के बाद जो हार उन्हें लगी, वह कथा छिपाती नहीं। वे सोचते हैं कि बिना ख़बर लौटा तो समुद्र लाँघना, लंका में घुसना, यह सब बेकार गया। फिर आगे बढ़कर सोचते हैं कि किष्किंधा लौटूँगा ही नहीं, क्योंकि सुग्रीव के सामने ख़ाली हाथ कैसे जाऊँ, और वहाँ इंतज़ार कर रहे जांबवान और अंगद से क्या कहूँ। यह पूरी रात का सबसे नीचा पल है, और वे इसी से उठकर आगे बढ़ते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 12 और 13"},
 hath_roka:{t:"आधा ही ज़ोर लगाया",l:"chh",sl:"स्त्री चेति मन्यमानेन नातिक्रोधः स्वयम् कृतः",slm:"यह स्त्री है, ऐसा मानकर उन्होंने पूरा क्रोध नहीं किया।",x:"द्वार पर मार पड़ने के बाद भी उन्होंने पूरा ज़ोर नहीं लगाया। वाल्मीकि साफ़ लिखते हैं कि यह स्त्री है, ऐसा मानकर उन्होंने पूरा क्रोध नहीं किया, और बाएँ हाथ की मुट्ठी से ही मारा। गिरने के बाद उन्हें उस पर दया भी आई। पूरी रात में यह पहला मौक़ा है जहाँ ताक़त रोकी गई है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 3, श्लोक 40 से 43"},
 naag:{t:"साँप और गरुड़ की पुरानी दुश्मनी",l:"chh",x:"साँप गरुड़ से क्यों डरते हैं, यह पुरानी दुश्मनी है। कद्रू और विनता दो बहनें थीं। घोड़े के रंग पर लगी शर्त कद्रू ने छल से जीत ली, और विनता उसकी दासी बन गई। विनता के बेटे गरुड़ ने माँ को छुड़ाने के लिए स्वर्ग से अमृत लाकर दिया, और उसी दिन से नाग उनका भोजन ठहरे। इसीलिए ऊपर से गुज़रती परछाईं देखकर समुद्र के साँप छिप जाते हैं।",s:"vr",p:1,ref:"साँपों का गरुड़ समझना: सुंदरकांड, सर्ग 1, श्लोक 68; कद्रू और विनता की शर्त तथा गरुड़ का अमृत लाना: महाभारत, आदिपर्व, आस्तीक पर्व"},
 machhli:{t:"नीचे से दिखती उड़ान",l:"chh",x:"नीचे से देखने पर यह उड़ान तूफ़ान जैसी थी। वाल्मीकि कहते हैं कि पानी इतना उछला कि व्हेल, मछलियाँ, कछुए और मगर ऐसे खुलकर दिखने लगे जैसे किसी के ऊपर से कपड़ा हटा दिया गया हो। और जिस रास्ते से वे गुज़रे, वहाँ पानी में गड्ढा बन जाता रहा। ऊपर एक अकेली परछाईं थी, नीचे पूरा समुद्र उलट पलट रहा था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 dekhne_wale:{t:"आसमान के दर्शक",l:"chh",x:"ऋषियों, देवताओं और गंधर्वों ने उड़ते हनुमान को देखकर उनकी तारीफ़ की और फूल बरसाए। सूरज ने उन्हें तपाया नहीं और हवा ने साथ दिया, यानी रास्ते की बड़ी ताक़तें भी इस काम के साथ थीं। वाल्मीकि इन दर्शकों को बार बार लाते हैं, क्योंकि उनके बिना यह पता ही न चलता कि नीचे से यह उड़ान कैसी दिखती थी। सबसे बड़ा काम अक्सर अकेले होता है, पर देखने वाले उसे कथा बना देते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 aam_ghar:{t:"आम घरों की रात",l:"chh",x:"वाल्मीकि यहाँ घरों के भीतर तक ले जाते हैं। किसी घर में हँसी है, किसी में झगड़ा, कोई अकेली करवटें बदल रही है, और कहीं कोई ऊँची आवाज़ में पाठ कर रहा है। पूरा नगर एक साथ सोता नहीं, हिस्सों में सोता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 4 और 5"},
 chowki_card:{t:"पहरे की चौकी",l:"chh",x:"लंका के हर द्वार पर पहरा था और भीतर भी टोलियाँ घूमती रहती थीं, इसलिए बड़े शरीर के साथ भीतर जाना मुमकिन नहीं था। यही वजह है कि साँझ ढलने का इंतज़ार किया जाता है और फिर छोटा रूप लिया जाता है। पहरेदारों को आख़िर तक पता नहीं चलता कि जिस पर नज़र रखनी थी वह ऊपर से निकल गया, और यही इस रात की सबसे चुपचाप जीती हुई लड़ाई है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 3 और 4"},
 chaitya_card:{t:"लंका की पहली आग",l:"chh",x:"बाग़ उजाड़ने और किंकरों को मारने के बाद वे ख़ुद सोचते हैं कि चैत्य महल अभी बचा हुआ है, और वही राक्षसों के रक्षक देवता की जगह है। चोटी पर चढ़कर उन्होंने ताली बजाई, और उस आवाज़ से पक्षी तक गिर पड़े। फिर सौ पहरेदार हथियार लेकर घेर लेते हैं। आख़िर में वे वहीं का एक खंभा उखाड़कर घुमाते हैं, दूसरे खंभों से रगड़ खाकर आग पैदा होती है, और वही महल जल उठता है। लंका में पहली आग यहीं लगती है, पूँछ से नहीं।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 43"},
 mantri_card:{t:"एक अकेली आवाज़",l:"chh",x:"दरबार में पहले प्रहस्त पूछता है कि तू कौन है, कहाँ से आया, बाग़ क्यों उजाड़ा। हनुमान साफ़ कहते हैं कि मैं दूत हूँ। इसके बाद मंत्री एक ही राय पर आ जाते हैं, इसे मार डालो। तब विभीषण अकेला खड़ा होकर नियम याद दिलाता है कि दूत वध नहीं होता। रावण मानता है, और यहीं से पूँछ वाला फ़ैसला निकलता है।",s:"vr",p:2,ref:"सुंदरकांड, सर्ग 49 से 52"},
 kritti_lanka:{t:"बांग्ला कथा की रात",l:"gr",x:"बांग्ला की कृत्तिवासी रामायण पाँचाली के ढंग में है। उसके सुंदरकांड में लंका के द्वार पर रोकने वाली का नाम चामुंडी है, और वहाँ हनुमान को एक ऋषि का वरदान भी मिलता है।",s:"krittivasa",p:1,ref:"कृत्तिवासी रामायण, सुंदराकांड, अध्याय 1 से 9 (सागर पार की बातचीत, जन्म वृत्तांत, वरदान, लंका प्रवेश और चामुंडी से भेंट)"},
 ranga_lanka:{t:"तेलुगु कथा की लंका",l:"gr",x:"तेलुगु की पहली पूरी रामायण, द्विपद छंद में। उसके सुंदरकांडम् में लंका में घुसना, उद्यान वन, सीता का दर्शन, मंदोदरी का रावण को नीति समझाना, और लंका दहन, सब क्रम से आते हैं।",s:"ranganatha",p:1,ref:"रंगनाथ रामायण (वाविल्ल संस्करण), सुंदरकांडम्: लंकापुरी में प्रवेश पृष्ठ 211, उद्यान वन 214, सीता दर्शन 216, मंदोदरी की नीति 220, लंका दहन 236, ख़बर 240"},
 eknath_sita:{t:"कई बाग़ों वाली खोज",l:"gr",x:"मराठी की इस कथा में खोज एक बाग़ में नहीं, कई बाग़ों में चलती है, और हर बाग़ का नाम अलग लिया जाता है। इसी वजह से वह हिस्सा यहाँ सबसे लंबा है: अकेले सुंदरकांड बीस से ज़्यादा अध्यायों का है, और पहले ही अध्याय का नाम है लंकेचा शोध। ढूँढने में जितना वक़्त लगा, कथा उतना ही वक़्त लेती है।",s:"eknath",p:1,ref:"भावार्थ रामायण, सुंदरकांड, अध्याय 1 (लंकेचा शोध) से आगे; इस कांड में कम से कम 21 अध्याय"},
 ezhu_vatika:{t:"मलयालम कथा का बग़ीचा",l:"gr",x:"मलयालम की किलिप्पाट्टु में सुंदरकांडम् ग्यारह खंडों का है। वाटिका का पल खंड 5.4 सीता संदर्शनम् और खंड 5.7 हनुमत् सीता संवादम् में आता है, और द्वार पर रोकने वाली का नाम वहाँ लंका लक्ष्मी है।",s:"ezhu",p:1,ref:"अध्यात्म रामायण किलिप्पाट्टु, सुंदरकांडम्, खंड 5.1 से 5.11; यह पल खंड 5.4 और 5.7 में"},
 kandali_udaan:{t:"असमिया कथा की उड़ान",l:"gr",x:"असमिया की पहली बड़ी रामकथा, चौदहवीं सदी में राजा महामाणिक्य के कहने पर लिखी गई। उसके सुंदराकांड का एक हिस्सा आज भी हनुमान का लंका दर्शन नाम से अलग पढ़ा जाता है।",s:"kandali",p:1,ref:"सप्तकांड रामायण, सुंदराकांड का हनुमंतर लंकादर्शन वाला हिस्सा; आदिकांड और उत्तराकांड बाद में जोड़े गए"},
 rang_mandodari:{t:"मंदोदरी की नसीहत",l:"man",x:"तेलुगु की रंगनाथ रामायण में, सीता के ठुकराने के तुरंत बाद मंदोदरी रावण को रोकती है और कहती है कि बहू बेटी जैसी को मत छेड़। यह बात सुंदरकांड की बाकी कथाओं में कम आती है।",s:"ranganatha",p:2,ref:"रंगनाथ रामायण, सुंदरकांडम्, वाविल्ल 1947 संस्करण, पृष्ठ 220"},
 sarala_lanka:{t:"ओड़िया कथा की लंका",l:"gr",x:"ओड़िया की वह कथा जो लंका के बाद शुरू होती है, और जो और कहीं नहीं मिलती। पाताल की दूसरी लंका, हज़ार सिर वाला रावण, फाटक पर पानी पिलाने वाली देवी, और अंत में सीता के हाथ का फूलों वाला धनुष। बीस अध्यायों की यह कथा बताती है कि एक परंपरा वहाँ भी कथा बढ़ा सकती है जहाँ बाकी सब रुक जाते हैं।",s:"sarala",p:2,ref:"विलंका रामायण, पूर्व खंड (ओड़िया विभव की छपी प्रति); बीस अध्याय: हनुमान का विलंका पहुँचना और छह महीने पड़े रहना पृष्ठ 12, कम्बु का राम को ले जाना और विलंका दहन 34, सीता को लाना 76"},
 torave_aag:{t:"कन्नड़ कथा की आग",l:"gr",x:"कन्नड़ की पहली बड़ी रामकथा, भामिनी षट्पदी छंद में, नडुगन्नड़ भाषा में। इसके सुंदरकांड की आठवीं संधि कहती है कि हनुमान ने लंका को आग में ऐसे झोंका कि वह त्रिपुर दहन से पाँच गुना कहा जाए।",s:"torave",p:2,ref:"तोरवे रामायण, मैसूर प्राच्य विद्या संस्थान संस्करण 1966, संपुट 1; सुंदरकांड की नौ संधियाँ, पृष्ठ 439 से 541; लंका दहन आठवीं संधि, पृष्ठ 521 से 529"},
 mbh_short:{t:"सांत्वना के लिए सुनाई गई कथा",l:"gr",x:"यह कथा किसी को सांत्वना देने के लिए सुनाई जा रही है। युधिष्ठिर अपनी पत्नी के हरण से दुखी हैं, तब ऋषि कहते हैं कि सुनो, तुमसे पहले भी एक आदमी के साथ यही हुआ था। इसीलिए यहाँ ब्योरे नहीं हैं, सिर्फ़ ढाँचा है, और सबसे ज़्यादा ठहराव इस बात पर है कि सहने वाले को आख़िर में रास्ता मिलता है।",s:"mbh",p:1,ref:"महाभारत, वनपर्व (आरण्यक पर्व), अध्याय 258 से 275; कुछ छपी प्रतियों में गिनती अलग है"},
 adbhuta_sita:{t:"सीता की शक्ति वाली कथा",l:"gr",x:"इस कथा में सीता रावण की ही बेटी बताई गई हैं, और आगे चलकर वही हज़ार मुँह वाले बड़े रावण का अंत करती हैं। उस समय वे महाकाली का रूप लेती हैं, और उसके बाद राम उन्हें सहस्रनाम से स्तुति करते हैं।",s:"adbhuta",p:1,ref:"अद्भुत रामायण, सर्ग 23 से 25; पूरा ग्रंथ 27 सर्गों का"},
 ananda_extra:{t:"पूरी रात, एक सर्ग में",l:"gr",x:"यहाँ पूरी रात एक ही सर्ग में समा जाती है, और उसका नाम ही सब कह देता है: हनुमान सीता को ढूँढते हुए लंका पहुँचते हैं और लंका जलाते हैं। जो कथा दूसरी जगह पूरा कांड लेती है, वह यहाँ एक साँस है। इसका कारण यह है कि सुनाने वाले शिव हैं और सुनने वाली पार्वती, और उन्हें ब्योरा नहीं, सार चाहिए।",s:"ananda",p:2,ref:"आनंद रामायण, सार कांड, सर्ग 9 (हनुमान का सीता को ढूँढते हुए लंका पहुँचना और लंका दहन); सार कांड कुल तेरह सर्ग"},
 chalisa_yaad:{t:"पूरी रात, एक चौपाई में",l:"gr",x:"चालीस चौपाइयों में से सिर्फ़ एक इस पूरी रात को समेट लेती है: छोटा रूप धरकर उन्हें दिखाना, और डरावना रूप धरकर लंका जलाना। यानी जो कथा हज़ारों पंक्तियों में फैली है, वह रोज़ पढ़ी जाने वाली रचना में दो साँसों में आ जाती है। बहुत से लोग इस रात को इसी एक पंक्ति से जानते हैं।",s:"chalisa",p:2,sl:"सूक्ष्म रूप धरि सियहिं दिखावा। बिकट रूप धरि लंक जरावा॥",slm:"छोटा रूप धरकर सीता को दिखाई दिए, और डरावना रूप धरकर लंका जलाई।",ref:"हनुमान चालीसा, चौपाई 9; पूरी रचना में 40 चौपाइयाँ और 2 दोहे"},
 manas_lankini:{t:"मानस वाली रक्षिका",l:"gr",x:"रामचरितमानस में भी द्वार पर रोकने वाली रक्षिका है। हनुमान के एक घूँसे से वह गिर पड़ती है, और गिरकर वही पुरानी बात याद करती है जो उसे बहुत पहले कही गई थी।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड, दोहा 3 से 4 के बीच"},
 manas_masak:{t:"मच्छर जितना",l:"gr",x:"रामचरितमानस में हनुमान लंका में घुसने के लिए मच्छर जितने छोटे हो जाते हैं, जबकि वाल्मीकि में वे बिल्ली जितने छोटे होते हैं। फ़र्क़ छोटा दिखता है पर उसका असर बड़ा है: बिल्ली फिर भी दिख सकती है, मच्छर नहीं। तुलसीदास यह दिखाना चाहते हैं कि भीतर जाने वाला किसी की नज़र में आया ही नहीं, और उसी में उनकी नम्रता वाली बात भी छिपी है।",s:"manas",p:1,sl:"मसक समान रूप कपि धरी। लंकहि चलेउ सुमिरि नरहरी॥",slm:"हनुमान ने मच्छर जैसा छोटा रूप लिया और राम को याद करते हुए लंका की तरफ़ चल पड़े।",ref:"रामचरितमानस, सुंदरकांड, दोहा 3 और उसके बाद की पहली चौपाई"},
 manas_roop:{t:"बड़ा रूप दिखाना",l:"gr",x:"रामचरितमानस में सीता को यक़ीन नहीं आता कि इतना छोटा जीव राम का दूत हो सकता है। तब हनुमान उन्हें अपना बड़ा रूप दिखाते हैं, और दिखाते ही फिर छोटे हो जाते हैं। यह दोनों बातें साथ आती हैं, और यही तुलसीदास का ढंग है: ताक़त तभी दिखाई जाती है जब ज़रूरत हो, और उसके बाद उसे वापस रख दिया जाता है।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड, दोहा 12 और 13 के आसपास"},
 manas_sabha:{t:"भरे दरबार में जवाब",l:"gr",x:"मानस में यह जवाब चेतावनी बन जाता है: जिसने पहाड़ जैसे बलवानों को तिनके की तरह उठा दिया, उसी की स्त्री तूने उठाई है। तुलसीदास इसे दोहा 20 के आसपास रखते हैं, और आगे विभीषण वाली बात भी इसी क्रम में आती है।",s:"manas",p:2,ref:"रामचरितमानस, सुंदरकांड, दोहा 20 के बाद का संवाद"},
 manas_poonch:{t:"जाने से पहले विदा",l:"gr",x:"मानस में आग बुझाने के बाद वे सीधे नहीं लौटते। वे दोबारा सीता के पास जाते हैं, विदा माँगते हैं, और तभी चलते हैं। वाल्मीकि में लौटने से पहले यह दूसरी भेंट इस तरह नहीं आती। तुलसीदास के लिए विदा लेना उतना ही ज़रूरी है जितना लंका जलाना।",s:"manas",p:2,ref:"रामचरितमानस, सुंदरकांड, दोहा 24 और उसके बाद"},
 jain_sabha:{t:"वहाँ दरबार आता ही नहीं",l:"gr",x:"यहाँ दरबार का मतलब ही बदल जाता है। हनुमान चोरी छिपे पकड़े गए दूत नहीं हैं, वे भेजे हुए दूत हैं, और राम ने अपनी अँगूठी देकर कहा है कि सीता की चूड़ामणि लेकर आना। इसलिए वहाँ ब्रह्मास्त्र, बंधन और सज़ा वाली पूरी कड़ी ही नहीं आती। रावण भी राक्षस नहीं, विद्याधरों का बड़ा राजा है।",s:"jain",p:2,ref:"पउमचरिय, उद्देश 49 (हनु को दूत बनाना और अँगूठी देना) तथा 53 (लंका में विभीषण से भेंट, ग्यारहवाँ दिन)"},
 adhy_updesh:{t:"दरबार में दर्शन की बात",l:"gr",x:"अध्यात्म रामायण में हनुमान दरबार में रावण को सिर्फ़ चेतावनी नहीं देते। वे उसे समझाते हैं कि देह तू नहीं है, न इंद्रियाँ, न मन। जो जानने वाला है, वही तू है। और यह जानते ही बंधन छूट जाता है।",s:"adhy",ref:"अध्यात्म रामायण, सुंदरकांड, सर्ग 4",p:2},
 adhy_agni:{t:"आग देखकर जलाती है",l:"gr",x:"जलती लंका में एक घर बचा रह जाता है, और वह विभीषण का है। इसी परंपरा में आग का ठंडा होना भी दो कारणों से जुड़ता है, सीता की प्रार्थना और पवन से अग्नि की मित्रता। यानी यहाँ आग अंधी नहीं है, वह देखकर जलाती है।",s:"adhy",ref:"अध्यात्म रामायण, सुंदरकांड, सर्ग 4",p:2},
 adhy_milan:{t:"राम का गले लगाना",l:"gr",x:"यहाँ राम बदले की बात करते हैं और फिर कहते हैं कि देने को कुछ बचा ही नहीं। इसी सर्ग में वे आलिंगन को ही सबसे बड़ा दान कहते हैं, और यही इस कथा का अंत है, कोई वरदान या भेंट नहीं।",s:"adhy",ref:"अध्यात्म रामायण, सुंदरकांड, सर्ग 5",p:3},
 adhy_vatika:{t:"वाटिका, दर्शन की नज़र से",l:"gr",x:"अध्यात्म रामायण के सुंदरकांड में यही दृश्य दर्शन की तरह पढ़ा गया है। वहाँ सीता का बंधन जीव के बंधन जैसा है, और हनुमान का आना पहचान लौटने जैसा। इसीलिए उस पाठ में ब्योरे कम हैं और अर्थ ज़्यादा, और हर दृश्य के पीछे एक दूसरी कथा चलती रहती है। जो पाठक ब्योरा ढूँढता है उसे वहाँ कम मिलेगा, और जो अर्थ ढूँढता है उसे ज़्यादा।",s:"adhy",p:1,ref:"अध्यात्म रामायण, सुंदरकांड, सर्ग 2 (शिंशपा के नीचे सीता, रावण का आना, त्रिजटा का सपना) और सर्ग 3 (मुद्रिका, चूड़ामणि, विशाल रूप)"},
 kamba_nagar:{t:"कंबन की लंका",l:"gr",x:"कंबन का सुंदरकांडम् चौदह पडलम् में बँटा है, और हर पडलम् का अपना नाम है। नगर की खोज वाला हिस्सा दूसरा है, जिसका नाम ही है ऊर् तेडु पडलम्, यानी नगर ढूँढने का अध्याय। नाम से ही पता चल जाता है कि वहाँ किस बात को अलग हिस्से लायक माना गया। जिस कथा में खोज को अपना अध्याय मिले, वहाँ ढूँढना घटना नहीं, काम माना जाता है।",s:"kamba",p:1,ref:"कंब रामायण, सुंदरकांडम्, पडलम् 2 (ऊर् तेडु पडलम्)"},
 kamba_lanka:{t:"तमिल की लंका",l:"gr",x:"कंबन के सुंदरकांडम् का आख़िरी पडलम् तिरुवडि तोऴुद पडलम् है, यानी वह अध्याय जिसमें लौटकर चरणों में प्रणाम किया जाता है। यहीं ख़बर पहुँचती है। नाम पर ध्यान देने लायक बात यह है कि उस अध्याय का नाम ख़बर पर नहीं, झुकने पर है। यानी उस परंपरा के लिए सबसे बड़ी बात यह नहीं कि क्या बताया गया, बल्कि यह कि बताने वाला किस भाव से लौटा।",s:"kamba",p:3,ref:"कंब रामायण, सुंदरकांडम्, पडलम् 14 (तिरुवडि तोऴुद पडलम्)"},
};

const PRJ={lon0:74,lat0:17,k:20,sq:.99};
function PX(lat,lon){return [(lon-PRJ.lon0)*PRJ.k*PRJ.sq,(PRJ.lat0-lat)*PRJ.k];}
function CAM(latN,lonW,latS,lonE){const a=PX(latN,lonW),b=PX(latS,lonE);return [a[0],a[1],b[0]-a[0],b[1]-a[1]];}
function LINE(pts){return pts.map((q,i)=>(i?"L":"M")+PX(q[0],q[1]).map(v=>v.toFixed(2)).join(" ")).join(" ");}

const PLACES={
 r_niti:{n:"विभीषण की नीति",only:"raja",la:7.052,lo:80.762,t:"दूत मारा नहीं जाता",lore:"दरबार का वह हिस्सा जहाँ छोटा भाई खड़ा होकर नियम याद दिलाता है कि दूत को मारा नहीं जाता, उसे दंड देकर लौटाया जाता है। यही एक बात पूरी रात का रुख़ बदल देती है।"},
 r_adhikar:{n:"दूत का अधिकार",only:"raja",la:7.098,lo:80.808,t:"मैं किसी का भेजा हुआ हूँ",lore:"दरबार के बीच की वह जगह जहाँ बँधा हुआ आदमी ख़ुद को दूत बताता है और उसी नाते बोलने का हक़ माँगता है। पूरी कथा में यही सबसे साफ़ बात है कि अधिकार पद से नहीं, काम से आता है।"},
 r_fariyaad:{n:"दधिमुख की फ़रियाद",only:"raja",la:12.24,lo:76.54,t:"शिकायत, और उसका उलटा नतीजा",lore:"किष्किंधा का वह हिस्सा जहाँ बाग़ का रखवाला शिकायत लेकर पहुँचता है। राजा सुनता है और उलटा अर्थ निकालता है, क्योंकि वह जानता है कि हारकर लौटने वाले ऊधम नहीं करते।"},
 r_faisla:{n:"राजा का पहला सवाल",only:"raja",la:12.94,lo:76.58,t:"ख़बर के बाद क्या पूछा जाता है",lore:"डेरे का वह हिस्सा जहाँ ख़बर मिलने के बाद पहला सवाल पूछा जाता है। वह सवाल यह नहीं होता कि लंका कैसी है या कितने मारे गए, पूछा यह जाता है कि वे कैसी हैं और उन्होंने क्या कहा। कोई भी बड़ा फ़ैसला ख़बर से नहीं, उसके बाद पूछे गए सवाल से बनता है।"},
 j_khali:{n:"जो कोना ख़ाली निकला",only:"jigyasu",la:7.986,lo:81.004,t:"यहाँ कुछ नहीं मिला",lore:"महल का वह हिस्सा जहाँ पूरी तलाशी के बाद भी कुछ नहीं मिलता। कथा इन ख़ाली कोनों को छोड़ती नहीं, एक एक करके गिनाती है, क्योंकि खोज में न मिलना भी एक ख़बर है। हर ख़ाली कोना अगली जगह को थोड़ा और पक्का कर देता है।"},
 j_chauraha:{n:"दो रास्तों का चौराहा",only:"jigyasu",la:7.868,lo:80.858,t:"यहाँ से दोनों तरफ़ जाया जा सकता है",lore:"नगर की वह जगह जहाँ से दो रास्ते निकलते हैं और दोनों में से किसी पर भी जाया जा सकता है। इस रात में कई बार ऐसा हुआ कि आगे का रास्ता किसी और ने नहीं, ढूँढने वाले के अपने फ़ैसले ने तय किया।"},
 j_sawal:{n:"वह सवाल जो बचा रह गया",only:"jigyasu",la:13.02,lo:76.72,t:"कथा हर बात का जवाब नहीं देती",lore:"लौटने के बाद की वह जगह जहाँ कुछ सवाल बिना जवाब के रह जाते हैं। यही सवाल आगे की कथाओं को जन्म देते हैं, और इसी वजह से इस एक रात पर सदियों से लिखा जाता रहा है।"},
 s_chhoda:{n:"छोड़ा हुआ पन्ना",only:"shastri",la:6.802,lo:80.952,t:"वह सर्ग जो इस खेल में नहीं है",lore:"बाग़ का वह कोना जहाँ कथा सबसे नीचे उतरती है। वाल्मीकि का एक पूरा सर्ग यहीं का है, जिसमें सीता अपने बारे में सबसे कठोर बात सोचती हैं। इस खेल में वह सर्ग जान बूझकर नहीं लिखा गया, और यह जगह उसी फ़ैसले को सामने रखती है।"},
 s_naam:{n:"नाम का सवाल",only:"shastri",la:9.58,lo:79.02,t:"यह कांड सुंदर क्यों कहलाता है",lore:"लौटने के रास्ते की वह जगह जहाँ यह सवाल उठाया जा सकता है कि रामायण के सातों कांडों में सिर्फ़ इसी का नाम किसी घटना पर नहीं है। बाकी सब जगह या काम के नाम पर हैं, और यह अकेला नाम गुण पर है।"},
 s_ant:{n:"कांड का आख़िरी श्लोक",only:"shastri",la:12.86,lo:76.68,t:"जहाँ कवि ख़ुद बोलता है",lore:"उस जगह की बात जहाँ कांड ख़त्म होता है और कवि सुनने वाले से सीधे बात करता है। यही वह हिस्सा है जिसे लोग पाठ के अंत में पढ़ते हैं, और इसी वजह से सुंदरकांड अलग से पढ़ा जाने वाला कांड बन गया।"},
 sd_sanyam:{n:"अपने ऊपर की पहरेदारी",only:"sadhak",la:7.882,lo:80.886,t:"सबसे कठिन पहरा भीतर का है",lore:"महल का वह हिस्सा जहाँ सोई हुई स्त्रियों के बीच से गुज़रते हुए ढूँढने वाला अपने ही मन को तौलता है। वाल्मीकि यह सवाल खुलकर रखते हैं और उसका जवाब भी उसी के मन से दिलवाते हैं।"},
 sd_jap:{n:"नाम लेकर चलना",only:"sadhak",la:8.072,lo:80.682,t:"हर क़दम पर एक ही नाम",lore:"वह जगह जहाँ हर मुश्किल से पहले एक ही नाम लिया जाता है और फिर क़दम बढ़ता है। यह जादू नहीं, ठहरने का तरीक़ा है, क्योंकि नाम लेते ही जल्दी उतर जाती है। मानस में यह बात सबसे साफ़ है, और वहीं से यह कांड पाठ का हिस्सा बना।"},
 sd_dhiraj:{n:"बैठकर इंतज़ार",only:"sadhak",la:6.858,lo:80.836,t:"कुछ न करना भी एक काम है",lore:"बाग़ का वह कोना जहाँ घंटों सिर्फ़ बैठकर देखना पड़ता है। न बोलना, न सामने आना, न हिलना। इस पूरी रात का सबसे कठिन हिस्सा यही है, और वह किसी लड़ाई से नहीं जीता जाता।"},
 k_mandodari:{n:"मंदोदरी का कक्ष",only:"kathapremi",la:7.906,lo:80.938,t:"एक ग़लतफ़हमी, जो हर कथा में अलग है",lore:"महल का वह कमरा जहाँ सोई हुई एक स्त्री को देखकर पल भर के लिए लगा कि खोज पूरी हो गई। फिर अपने ही तर्क से यह ग़लतफ़हमी टूट गई। यही वह जगह है जिस पर हर परंपरा अलग तरह से रुकी है।"},
 k_sangeet:{n:"सोए हुए बजाने वाले",only:"kathapremi",la:8.042,lo:80.912,t:"साज़ बिखरे हैं, बजाने वाले सो रहे हैं",lore:"महल का वह हिस्सा जहाँ रात का संगीत ख़त्म हो चुका है और बजाने वाले अपने ही साज़ों पर सो गए हैं। कोई वीणा से लिपटा है, कोई ढोल पर। यह दृश्य हर कथा में अलग लंबाई का है, और उसी से पता चलता है कि वह कथा किसके लिए कही गई थी।"},
 k_sapna:{n:"त्रिजटा का सपना",only:"kathapremi",la:6.826,lo:80.902,t:"एक सपना, जो सबको चुप करा देता है",lore:"बाग़ के उस कोने की जगह जहाँ एक बूढ़ी राक्षसी हड़बड़ाकर उठती है और अपना सपना सुनाती है। यही सपना ताने रोक देता है। इस सपने का ब्योरा हर परंपरा में अलग है, कहीं लंबा, कहीं दो पंक्तियों का।"},
 b_jeev:{n:"पानी के नीचे के जीव",only:"balak",la:8.34,lo:79.88,t:"उड़ते हुए नीचे देखो",lore:"समुद्र का वह हिस्सा जहाँ से गुज़रते हुए नीचे पानी के भीतर बड़ी बड़ी आकृतियाँ दिखती हैं। ऊपर की हवा में परछाईं दौड़ रही है और नीचे मछलियाँ बिखर रही हैं।"},
 b_chhota:{n:"बिल्ली जितना",only:"balak",la:8.096,lo:80.742,t:"इतना बड़ा, और अब इतना छोटा",lore:"वह जगह जहाँ पूरा शरीर सिकोड़कर बिल्ली जितना कर लिया जाता है, ताकि कोई देख न सके। थोड़ी देर पहले वही शरीर पहाड़ जितना था। इस पूरी रात में जीत बड़े होने से नहीं, छोटे होने से मिलती है, और यह बदलाव यहीं दिखता है।"},
 b_panchhi:{n:"पंछियों की डाल",only:"balak",la:6.946,lo:80.776,t:"ऊपर बैठे हुए दर्शक",lore:"बाग़ की वह डाल जहाँ पंछी बैठे हैं और नीचे सब कुछ देख रहे हैं। जब आदमी चुप हों, तब पंछी ही बताते हैं कि आसपास क्या चल रहा है। उनकी हलचल से पता चलता है कि कोई आ रहा है, और उसी से सँभलने का वक़्त मिल जाता है।"},
 b_bandar:{n:"मधुवन के बंदर",only:"balak",la:12.32,lo:76.62,t:"बाग़ उजड़ा, और सब हँस रहे हैं",lore:"वह बाग़ जहाँ लौटती टोली ने धावा बोल दिया। फल टूटते हैं, रखवाले दौड़ते हैं, और उन्हें भी हँसते हुए भगा दिया जाता है। यहाँ डर नहीं, ऊधम है, और पूरी कथा में यही एक जगह है जहाँ सब खुलकर हँसते हैं। उसी हँसी के भीतर से सबसे बड़ी ख़बर निकलती है।"},
 t_parikha:{n:"परिखा और प्राकार",only:"yatri",la:7.828,lo:80.652,t:"खाई, पुल और सोने की दीवार",lore:"नगर के चारों ओर की खाई और उसके भीतर की ऊँची दीवार। पानी में कमल हैं और मगर भी, और दीवार के ऊपर बुर्ज हैं, जिन पर पहरा रहता है। किसी नगर की पहली सुंदरता और पहली रक्षा, दोनों यहीं दिखती हैं।"},
 t_bazaar:{n:"सोने वाला बाज़ार",only:"yatri",la:7.902,lo:80.796,t:"दुकानें, गलियाँ और रात का शोर",lore:"नगर का वह हिस्सा जहाँ चौड़ी सड़कें, सजी हुई दुकानें और घर एक दूसरे से सटे हुए हैं। यहाँ रात में भी रोशनी है, और यही बताता है कि यह नगर कितना भरा हुआ था।"},
 t_atari:{n:"ऊपर की अटारियाँ",only:"yatri",la:8.006,lo:80.962,t:"छतों के ऊपर का रास्ता",lore:"घरों और महलों की ऊपरी मंज़िलें, जिनसे होकर पूरा नगर बिना ज़मीन पर उतरे पार किया जा सकता है। ऊपर से नगर की बनावट एक साथ दिखती है: कहाँ बस्ती है, कहाँ दीवार, और कहाँ बाग़।"},
 t_ped:{n:"वाटिका के पेड़",only:"yatri",la:6.832,lo:80.792,t:"अशोक, चंपा और सप्तपर्ण",lore:"बाग़ का वह हिस्सा जहाँ पेड़ों की किस्में गिनाई जाती हैं। यह वर्णन सिर्फ़ सजावट नहीं है, इससे पता चलता है कि यह बाग़ राजा का था और उसमें क्या क्या लगाया गया था।"},
 y_kinkar:{n:"किंकरों की टोली",only:"yoddha",la:6.902,lo:80.962,t:"अस्सी हज़ार का पहला रेला",lore:"वह जगह जहाँ रावण के भेजे पहले लड़ाके पहुँचे। वे संख्या में सबसे ज़्यादा थे और सबसे पहले आए, इसलिए इस दिन की लड़ाई का ढंग यहीं तय हुआ। घेरकर लड़ने वालों के बीच पीछे हटने की जगह नहीं बचती, और यही पहली परीक्षा है।"},
 y_jambu:{n:"जम्बुमाली का रथ",only:"yoddha",la:6.996,lo:81.006,t:"पहला सेनापति, और पहला सच्चा मुक़ाबला",lore:"वह जगह जहाँ प्रहस्त का बेटा रथ पर आया, धनुष लेकर। उसके आने से पहले तक सब भीड़ थी, यहाँ पहली बार सामने कोई ऐसा था जिसे नाम लेकर भेजा गया। यहीं से दूर का वार शुरू होता है और लड़ाई का ढंग बदल जाता है।"},
 y_saat:{n:"सात मंत्रिपुत्र",only:"yoddha",la:7.082,lo:80.902,t:"दरबार के बेटों की बारी",lore:"वह जगह जहाँ मंत्रियों के सात बेटे एक साथ भेजे गए, अपने रथों और टुकड़ियों के साथ। वे गिनती से नहीं, नाम से भेजे गए थे, और एक साथ भेजे जाने का मतलब यही है कि अकेले भेजने पर अब भरोसा नहीं रहा।"},
 y_senapati:{n:"पाँच सेनापतियों की क़तार",only:"yoddha",la:7.146,lo:81.026,t:"नाम वाले पाँच, एक साथ",lore:"वह जगह जहाँ पाँच सेनापति अपनी अपनी टुकड़ियों के साथ आए, और हर एक का नाम गिनाया गया। यह इस दिन की आख़िरी पूरी सेना थी। इसके बाद दरबार के पास भेजने को सेना नहीं, अपने बेटे बचते हैं।"},
 toli:{n:"आसमान में लौटती टोली",la:9.42,lo:79.22,t:"अब एक नहीं, पूरी टोली उड़ रही है",lore:"मधुवन के बाद अंगद, हनुमान और बाकी सब एक साथ आसमान में उठते हैं। जाते वक़्त एक अकेला गया था, लौटते वक़्त पूरी टोली लौट रही है, और यही फ़र्क़ बताता है कि काम हो चुका है।"},
 prasravan:{n:"प्रस्रवण की चढ़ाई",la:12.98,lo:76.52,t:"ऊपर डेरे तक जाता रास्ता",lore:"प्रस्रवण उस पहाड़ का नाम है जिसके ऊपर राम का डेरा है, और यह उसी की चढ़ाई है। यही आख़िरी रास्ता है, और इसी के बाद वह वाक्य कहा जाता है जिसके लिए यह पूरी रात थी। नीचे पूरी टोली है, ऊपर एक आदमी दिन गिन रहा है, और बीच में यह छोटी सी चढ़ाई बची है।"},
 bujhana:{n:"पूँछ बुझाने का किनारा",la:8.05,lo:80.42,t:"आग अब भी जल रही है",lore:"नगर जलाने के बाद वह किनारा जहाँ जलती पूँछ समुद्र में डुबोई जाती है। यही वह जगह है जहाँ ग़ुस्सा उतरता है और सबसे बड़ा डर पकड़ता है, क्योंकि अगर सारा नगर जला है तो वह बग़ीचा भी जला होगा।"},
 lankakinara:{n:"लंका का किनारा",la:8.18,lo:80.62,t:"पार पहुँचकर पहली बार ज़मीन",lore:"समुद्र पार करने के बाद पहली बार पैर जिस ज़मीन पर पड़ते हैं। यह नगर नहीं, नगर के नीचे का किनारा है, जहाँ से ऊपर चढ़ाई शुरू होती है। रास्ते की सारी रुकावटें यहीं पीछे छूट जाती हैं।"},
 pushpak:{n:"पुष्पक के भीतर",la:7.985,lo:80.762,t:"उड़ने वाले विमान के भीतर",lore:"महल के बीच खड़े उस उड़ने वाले विमान का भीतरी हिस्सा, जो पहले कुबेर का था और जिसे रावण लड़ाई में छीनकर लाया। वाल्मीकि इसे सोने की जालीदार खिड़कियों और रत्न जड़े खंभों वाला बताते हैं। नगर की सबसे सुंदर चीज़ भी यहाँ किसी और से ली हुई है।"},
 uttardwar:{n:"उत्तर का फाटक",la:8.045,lo:80.845,t:"सबसे बड़ा फाटक, और सबसे ज़्यादा पहरा",lore:"नगर के चार फाटकों में से वह जिस तक वे सबसे पहले पहुँचते हैं। वाल्मीकि साफ़ कहते हैं कि वे उत्तर के फाटक पर आकर रुके और सोचने लगे। यहीं यह तय होता है कि भीतर जाना कैसे है, और यहीं से पूरी रात की चाल बनती है।"},
 sarovar:{n:"वाटिका का सरोवर",la:6.886,lo:80.828,t:"सीढ़ियों वाला एक ठहरा हुआ पानी",lore:"अशोक वाटिका के भीतर वह सरोवर जिसकी सीढ़ियाँ पानी तक जाती हैं और जिसमें कमल खिले रहते हैं। बग़ीचे का सबसे शांत कोना यही है, और इसी शांति के बीच वह बैठी हैं जिनके लिए यह पूरी रात है।"},
 surasap:{n:"खुला हुआ मुँह",la:8.05,lo:79.74,t:"रास्ते के बीच कोई परखने खड़ी है",lore:"समुद्र के ऊपर वह जगह जहाँ नागों की माता रास्ता रोकती हैं। यह लड़ाई की जगह नहीं, परीक्षा की जगह है, और उसे देवताओं ने ही भेजा है। यहाँ जीतना नहीं, वरदान तोड़े बिना निकलना होता है।"},
 nikumbhila:{n:"निकुंभिला का मैदान",la:6.86,lo:80.72,t:"यहाँ यज्ञ की आग जलती है",lore:"लंका के बाहर वह मैदान जहाँ राक्षसों का यज्ञ होता है। वाटिका में डराती हुई राक्षसियाँ इसी जगह का नाम लेती हैं, यह कहकर कि वे यहीं नाचेंगी। आगे की कथा में यही मैदान लड़ाई का सबसे बड़ा मोड़ बनता है।"},
 mainakp:{n:"पानी से उठा पहाड़",la:8.42,lo:79.55,t:"समुद्र के बीच कुछ ऊपर उठ रहा है",lore:"समुद्र के बीच वह सोने वाला पहाड़, जिसे इंद्र ने पाताल के मुँह पर ढक्कन की तरह रखा था और जिसे पवन ने पंख समेत पानी में छिपाया था। रास्ते की यह पहली रुकावट असल में रुकावट नहीं, ठहरने का न्योता है।"},
 sinhikap:{n:"परछाईं वाला घेरा",la:7.62,lo:79.92,t:"नीचे पानी में कुछ खिंच रहा है",lore:"समुद्र का वह हिस्सा जहाँ परछाईं पकड़ने वाली रहती है। यहाँ ख़तरा शरीर से नहीं, परछाईं से आता है, और यही इस पूरी उड़ान की सबसे अजीब रुकावट है। ऊपर उड़ने वाले को पहले लगता है कि हवा उलटी चल रही है, और नीचे देखने पर ही बात समझ आती है।"},
 toran:{n:"वाटिका का तोरण",la:6.918,lo:80.862,t:"फाटक पर एक के बाद एक टोली आ रही है",lore:"वाटिका के फाटक का मेहराब, जहाँ से लोहे का डंडा उखाड़ा गया। हर लड़ाई के बाद वे लौटकर यहीं आ बैठते हैं, जैसे यही उनकी जगह हो। किंकर, जंबुमाली, मंत्री के सात बेटे और पाँच सेनापति, सब यहीं आए।"},
 v_fatak:{n:"विलंका का फाटक",la:6.62,lo:80.42,t:"फाटक पर कोई बैठी है",lore:"विलंका का फाटक, जहाँ गाँव की देवी बैठी रहती है। वहाँ का नियम यह है कि जो शत्रु आए उसे पीने को दिया जाए। यहीं हनुमान गिरते हैं और छह महीने पड़े रहते हैं, जो इस पूरी कथा का सबसे अलग हिस्सा है।"},
 v_maidan:{n:"मिटी हुई सेना का मैदान",la:6.44,lo:80.72,t:"एक ताली से सब बिखर गया",lore:"वह मैदान जहाँ लड़ाई हुई ही नहीं। पाताल के रावण ने सिर्फ़ ताली बजाई और सेना बिखर गई। राम भी दूर जाकर गिरे, और यहीं से यह कथा दूसरी तरफ़ मुड़ जाती है। लंका वाली रात में हर लड़ाई में कोई न कोई सामने था, यहाँ सामने कुछ भी नहीं है, सिर्फ़ एक आवाज़ है।"},
 j_nagar:{n:"विद्याधरों का नगर",la:7.05,lo:78.35,t:"यहाँ कोई राक्षस नहीं रहता",lore:"जैन परंपरा की लंका, जहाँ रहने वाले राक्षस नहीं, विद्याधर हैं। वे मांस नहीं खाते और डरावने नहीं हैं, वे बस दूसरे लोग हैं। इसीलिए यहाँ दुश्मनी है, नफ़रत नहीं।"},
 j_vidya:{n:"उड़ान की विद्या",la:7.32,lo:78.12,t:"उड़ना यहाँ सीखा जाता है",lore:"वह जगह जहाँ यह साफ़ होता है कि उड़ना वरदान नहीं, विद्या है। जिसने सीखी, वह उड़ा, इसलिए यहाँ उड़ान पर कोई चौंकता नहीं और न कोई उसे चमत्कार कहता है। इसी एक बात से रास्ते की वे तीनों रुकावटें भी हट जाती हैं जो बाकी कथाओं में सबसे मशहूर हैं।"},
 j_dut:{n:"भेजा हुआ दूत",la:7.58,lo:78.44,t:"चोरी छिपे नहीं, बुलाकर",lore:"वह जगह जहाँ दूत का आना छिपाकर नहीं होता। उसके पास राम की अँगूठी है और वह अपने काम से आया है, इसलिए उसे रोका नहीं जाता। जो कथा हर बात का कारण बताती हो, वहाँ चोरी छिपे घुसने की ज़रूरत भी नहीं पड़ती, क्योंकि काम सीधा है और सीधा ही किया जाता है।"},
 j_darbar:{n:"बिना पकड़ वाला दरबार",la:7.84,lo:78.62,t:"यहाँ कोई बाँधा नहीं जाता",lore:"वह दरबार जहाँ दूत बँधा हुआ नहीं आता। यहाँ न पकड़ना होता है, न मारने की राय, न दंड, इसलिए वह पूरी कड़ी इस परंपरा में है ही नहीं। जो दृश्य बाकी कथाओं में सबसे बड़ा मोड़ है, यहाँ वह एक मुलाक़ात भर रह जाता है, और कथा उसी से आगे बढ़ जाती है।"},
 j_aag:{n:"आग, पर पूँछ से नहीं",la:8.06,lo:78.35,t:"जलती लंका, दूसरा कारण",lore:"वह जगह जहाँ लंका जलती तो है, पर पूँछ से नहीं। जिस दृश्य से यह पूरी रात पहचानी जाती है, वह इस परंपरा में है ही नहीं। अंत वही रहता है और रास्ता बदल जाता है, और यही बताता है कि किसी कथा की पहचान उसके अंत से नहीं, उसके रास्ते से बनती है।"},
 j_lautna:{n:"निशानी लेकर लौटना",la:8.28,lo:78.18,t:"काम पूरा, सीधा लौटना",lore:"वह जगह जहाँ से दूत निशानी लेकर सीधे लौट जाता है। न जलती पूँछ, न तमाशा, न सज़ा। जैन कथा हर बात का कारण बताती है, इसलिए यहाँ लौटना भी बिना नाटक के होता है। उसके पास वही है जिसके लिए वह आया था, और उतना ही काफ़ी माना जाता है।"},
 s_pushkar:{n:"पुष्कर द्वीप",la:8.86,lo:81.58,t:"वह दूसरा नगर, जहाँ से ललकार आई",lore:"अद्भुत रामायण में वह द्वीप जहाँ से हज़ार मुँह वाला रावण आता है। लंका जीतने के बाद भी एक और नगर बचा रह जाता है, और कथा यह दिखाने के लिए उसे लाती है कि जीत कभी पूरी नहीं लगती।"},
 j_nishani:{n:"अँगूठी और चूड़ामणि",la:7.72,lo:78.88,t:"दोनों निशानियाँ, आमने सामने",lore:"जैन कथा की वह जगह जहाँ दोनों निशानियाँ साफ़ दिखती हैं। जाते वक़्त राम की अँगूठी और लौटते वक़्त सीता की चूड़ामणि, और बीच में कोई तमाशा नहीं। निशानी यहाँ सबूत है, और सबूत को नाटक की ज़रूरत नहीं होती, इसलिए यह पूरा लेन देन चुपचाप हो जाता है।"},
 s_darbar:{n:"जीत के बाद का दरबार",la:8.62,lo:81.35,t:"लड़ाई ख़त्म, और सब सँभल रहे हैं",lore:"लंका की लड़ाई ख़त्म होने के बाद का वह दरबार जहाँ से अद्भुत रामायण की अपनी कथा शुरू होती है। सब ठहर चुके हैं, सब सँभल रहे हैं, और तभी एक और नाम सुनाई देता है। जहाँ बाकी कथाएँ ख़त्म होती हैं, यह वहीं से चलना शुरू करती है, और यही उसकी पहचान है।"},
 s_hazar:{n:"हज़ार मुँह वाली ललकार",la:8.34,lo:81.62,t:"एक और रावण, और यह पहले से बड़ा है",lore:"वह दूसरा रावण, जिसके हज़ार मुँह हैं और जो पुष्कर द्वीप से ललकारता है। लंका वाला उसके आगे छोटा पड़ जाता है, और यही इस कथा की पहली चोट है। जो सेना अभी अभी जीती थी, उसे फिर से शुरू से खड़ा होना है, और इस बार सामने वाला पहले से बड़ा है।"},
 s_maya:{n:"माया का बंधन",la:8.08,lo:81.78,t:"दोनों भाई बँध चुके हैं",lore:"वह जगह जहाँ माया के बल पर राम और लक्ष्मण दोनों बाँध दिए जाते हैं और कोई अस्त्र काम नहीं आता। जब सबसे बड़े भी हार जाते हैं, तब कथा किसी और तरफ़ देखने लगती है। चारों तरफ़ सन्नाटा है, और सबकी नज़र उसी पर जाती है जो अब तक पीछे खड़ी थीं।"},
 s_aage:{n:"सीता का आगे आना",la:7.86,lo:81.92,t:"अब वे आगे खड़ी हैं",lore:"वह पल जब बग़ीचे में बैठी रहने वाली आगे बढ़ती हैं। इस कथा में उनकी चुप्पी कमज़ोरी नहीं थी, रुका हुआ बल थी। जो अब तक बचाई जा रही थीं, वही अब सबको बचाने खड़ी हैं, और इसी एक क़दम से पूरी कथा का रुख़ बदल जाता है।"},
 s_roop:{n:"रूप बदलना",la:7.58,lo:82.06,t:"मनुष्य रूप छूट रहा है",lore:"वह पल जब वे अपना मनुष्य रूप छोड़कर महाकाली का रूप लेती हैं और पल भर में उसके हज़ार सिर काट देती हैं। पूरी परंपरा में यही दृश्य इस ग्रंथ की पहचान है, और इसी वजह से इसे शाक्त परंपरा की रामकथा कहा जाता है। इसके बाद सब चुप हैं।"},
 s_brahma:{n:"ब्रह्मा का समझाना",la:7.32,lo:82.18,t:"सब ख़त्म, और अब समझाना बाकी है",lore:"अंत के बाद वह पल जब ब्रह्मा राम को समझाते हैं कि जो कुछ होता है, शक्ति के साथ ही होता है। कथा यहाँ हार जीत की नहीं, साथ की बात करती है। सत्ताईस सर्गों वाले उस ग्रंथ में यही तीन सर्ग सबसे ज़्यादा याद किए जाते हैं, और यह वाक्य सबसे आख़िर में रखा गया है।"},
 v_utar:{n:"नीचे उतरता रास्ता",la:6.86,lo:80.18,t:"पानी के नीचे जाता रास्ता",lore:"लंका के बाद का वह रास्ता जो नीचे जाता है। ओड़िया कथा विलंका को पाताल में रखती है, इसलिए यह जगह नक्शे पर नहीं मिलती। खेल में इसके पिन समुद्र के नीचे दिखाए गए हैं, यह बात साफ़ बताकर।"},
 v_surekha:{n:"सुरेखा का घेरा",la:6.30,lo:80.50,t:"माया का रूप धरकर कोई खड़ी है",lore:"वह जगह जहाँ सुरेखा माया का रूप धरकर सामने आती है। पहचानने से पहले ही वह निगल लेती है, और भीतर अँधेरे में भी वही होता है जो लंका में हुआ था: वे छोटे होते हैं और रास्ता ढूँढ लेते हैं।"},
 v_darbar:{n:"हज़ार सिर वाला दरबार",la:6.20,lo:80.66,t:"दरबार हँस रहा है",lore:"पाताल का दरबार, जहाँ हज़ार सिर वाला रावण बैठा है। वहाँ उन्हें उगल दिया जाता है और पूरा दरबार हँसता है। हँसी ज़्यादा देर नहीं टिकती, और यह लंका वाले दरबार का उलटा जोड़ है।"},
 v_kambu:{n:"कम्बु का छल",la:6.12,lo:80.30,t:"ब्राह्मण के वेश में कोई आया है",lore:"वह जगह जहाँ कम्बु नाम का असुर ब्राह्मण का वेश धरकर आता है और मौक़ा देखकर राम को ही उठा ले जाता है। छुड़ाने के बाद उसी रात विलंका जलती है, जैसे पहली रात लंका जली थी।"},
 v_bulawa:{n:"बुलावा",la:6.02,lo:80.52,t:"अब उन्हें लाना पड़ा",lore:"वह पल जब तय होता है कि इस रावण को मारने के लिए सीता चाहिए। बहस होती है, और आख़िर में हनुमान ही सीता और लक्ष्मण को वहाँ लाते हैं। पहली रात में उनका काम ख़बर पहुँचाना था, यहाँ लोगों को पहुँचाना है।"},
 v_dhanush:{n:"फूलों का धनुष",la:5.92,lo:80.38,t:"देवी से एक धनुष मिला",lore:"वह जगह जहाँ देवी मंगला सीता को धनुष देती हैं। वह लोहे का नहीं, फूलों का है, और देखने में खिलौना लगता है। यही इस कथा की सबसे बड़ी बात है, क्योंकि जिसे कोई हथियार मानता ही नहीं, वही अंत करता है। धनुष हाथ में आते ही मैदान चुप हो जाता है।"},
 v_ant:{n:"आख़िरी बाण",la:5.84,lo:80.60,t:"यहीं सब ख़त्म होता है",lore:"वह मैदान जहाँ सब ख़त्म होता है। फूल का बाण छूटता है, असुर का मन डोलता है, और वहीं उसका अंत हो जाता है। मरते हुए वही असुर क्षमा माँगता है, और यही ओड़िया परंपरा का अपना मोड़ है।"},
 kishkindha:{n:"सुग्रीव का महल",la:15.335,lo:76.462,t:"राजा के दरबार में एक शिकायत",lore:"वानरों की राजधानी, जहाँ सुग्रीव का दरबार है। ख़बर यहाँ सीधे नहीं पहुँचती, एक शिकायत के रास्ते पहुँचती है, और सुग्रीव उसी शिकायत से उलटा अर्थ निकालकर समझ जाते हैं कि काम हो गया।"},
 madhuvan:{n:"मधुवन",la:15.22,lo:76.6,t:"मीठे बाग़ में मौज",lore:"सुग्रीव का अपना संरक्षित बाग़, जहाँ बिना इजाज़त घुसना मना था। लौटती टोली ने अंगद की इजाज़त से शहद पिया और रखवालों को धकेल दिया। यही ऊधम आगे चलकर पहली ख़बर बना।"},
 shibir:{n:"राम का शिबिर",la:9.155,lo:79.44,t:"राम दिन गिन रहे हैं",lore:"प्रस्रवण पहाड़ पर राम का डेरा, जहाँ वे दिन गिन रहे हैं। यहीं चूड़ामणि सौंपी जाती है, यहीं वे उसे छाती से लगाकर रोते हैं, और यहीं वे कहते हैं कि सीता ने जो कहा वह एक एक शब्द दोबारा सुनाओ।"},
 kinara:{n:"उस पार का किनारा",la:9.288,lo:79.313,t:"वानर बैठे इंतज़ार कर रहे हैं",lore:"इस पार का वह किनारा जहाँ बाकी वानर इंतज़ार में बैठे हैं। उड़ान से पहले यहीं सबने अपनी अपनी हद बताई थी, और यहीं जांबवान ने हनुमान को उनका अपना बल याद दिलाया था। लौटते वक़्त पहली आवाज़ भी यहीं पहुँचती है।"},
 ghera:{n:"वानरों का घेरा",la:9.22,lo:79.38,t:"पूरी कथा सुनाई जा रही है",lore:"किनारे पर वानरों का घेरा, जहाँ लौटकर पहला पूरा हाल सुनाया जाता है। वाल्मीकि यह हाल तीन बार सुनवाते हैं, और यह पहली बार है। यहीं जोश में अंगद कहता है कि अभी चलो लंका तोड़ दें, और जांबवान रोक देते हैं।"},
 devlok:{n:"आसमान के दर्शक",la:9.02,lo:79.62,t:"ऊपर से कोई देख रहा है",lore:"आसमान में खड़े वे लोग जो यह सब देख रहे थे: सिद्ध, चारण, गंधर्व और देवता। वे फूल बरसाते हैं, और सिंहिका के मरने के बाद वही चार बातें गिनाते हैं जो ऐसे काम के लिए चाहिए: साहस, नज़र, बुद्धि और कौशल।"},
 akash:{n:"समुद्र के ऊपर",la:8.86,lo:79.58,t:"रास्ते में तीन रुकावटें",lore:"यह सौ योजन चौड़ा समुद्र है। संपाति ने बताया था कि लंका यहाँ से सौ योजन दूर एक द्वीप पर है, और यही दूरी नापकर सब अपनी अपनी हद बता रहे थे। परछाईं पानी पर दस योजन चौड़ी और तीस योजन लंबी पड़ती है।"},
 samudra:{n:"पानी के भीतर",la:8.62,lo:79.52,t:"साँप ऊपर देखकर छिप रहे हैं",lore:"समुद्र के भीतर का वह हिस्सा जहाँ से यह उड़ान तूफ़ान जैसी दिखी। पानी इतना उछला कि मछलियाँ, कछुए और मगर खुलकर दिखने लगे, और जिस रास्ते से वे गुज़रे वहाँ पानी में गड्ढा बनता गया। नीचे रहने वाले साँपों ने उन्हें गरुड़ समझा, और वह डर पुराना है।"},
 arisht:{n:"लौटती उड़ान",la:8.3,lo:80.3,t:"चोटी से वापसी की छलाँग",lore:"अरिष्ट पहाड़ की वह चोटी जहाँ से लौटने की छलाँग लगी। उस धक्के से पेड़ उखड़े और चोटी दब गई। जाते वक़्त एक पहाड़ ने रुकने को कहा था, लौटते वक़्त पहाड़ नीचे दबता है, और कथा यही फ़र्क़ दिखाकर बताती है कि अब वे वही नहीं रहे।"},
 trikut:{n:"त्रिकूट की चोटी",la:7.957,lo:80.76,t:"ऊपर से पूरी लंका दिखती है",lore:"लंका त्रिकूट नाम के पहाड़ पर बसी है, और कथा कहती है कि उसे विश्वकर्मा ने बनाया था। चोटी से नीचे देखने पर पूरा नगर एक साथ दिखता है, इसीलिए असमिया कथा में इस हिस्से का नाम ही हनुमान का लंका दर्शन है।"},
 dvar:{n:"लंका का द्वार",la:7.905,lo:80.712,t:"दीवार पर कोई पहरा दे रहा है",lore:"नगर की दीवार सोने के रंग की है, फाटक सफ़ेद, और मेहराबों पर हाथी खड़े हैं। झंडों पर लगी छोटी घंटियाँ हवा में बजती रहती हैं। यहीं वह रक्षिका खड़ी रहती है जो असल में ख़ुद नगरी है।"},
 chowki:{n:"पहरेदारों की चौकी",la:7.882,lo:80.748,t:"पहरेदार आपस में बात कर रहे हैं",lore:"लंका के हर द्वार पर पहरा था और भीतर भी टोलियाँ घूमती थीं। इसी वजह से बड़े शरीर के साथ भीतर जाना मुमकिन नहीं था। पहरेदारों को यह पता ही नहीं चलता कि जिस पर नज़र रखनी थी वह बिल्ली जितना होकर ऊपर से निकल गया।"},
 nagar:{n:"नगर की गलियाँ",la:7.93,lo:80.8,t:"संगीत, नशा और सोने की छतें",lore:"गलियों में सोने के महल, रत्न जड़े फ़र्श, और क्रौंच तथा मोर की आवाज़ें। वाल्मीकि नगर को सजी हुई स्त्री की तरह देखते हैं, और यह भी कहते हैं कि यह भोगवती और अमरावती दोनों जैसा है, यानी सुंदर भी और ख़तरनाक भी।"},
 aamghar:{n:"आम घरों की गली",la:7.968,lo:80.836,t:"किसी घर में कोई जाग रहा है",lore:"लंका के आम घर, जहाँ वाल्मीकि भीतर तक ले जाते हैं। किसी घर में हँसी है, किसी में झगड़ा, कोई अकेली करवटें बदल रही है, कहीं कोई ऊँची आवाज़ में पाठ कर रहा है। पूरा नगर एक साथ नहीं सोता, हिस्सों में सोता है।"},
 chhat:{n:"जलती छतें",la:7.942,lo:80.868,t:"आग एक छत से दूसरी तक",lore:"लंका की छतें, जिन पर से होकर आग फैली। जलते हुए नगर का वर्णन ऊपर से है, इसलिए पहले चमक दिखती है, फिर धुआँ, फिर नीचे भागते लोग। बीच में विभीषण का घर बचा रह जाता है।"},
 mahal:{n:"रावण का महल",la:7.998,lo:80.792,t:"सब सो रहे हैं",lore:"रावण का महल, जिसके बीच में पुष्पक विमान खड़ा है। भीतर सोने की जालीदार खिड़कियाँ, रत्न जड़े खंभे, और बाजों को गले लगाए सोई हुई स्त्रियाँ। यही वह जगह है जहाँ एक पल को लगा कि खोज पूरी हो गई।"},
 pangrih:{n:"नशे का घर",la:7.995,lo:80.906,t:"रात का दौर ख़त्म हो चुका है",lore:"वह जगह जहाँ रात भर पीने पिलाने का दौर चलता है। वाल्मीकि इसका ब्योरा खुलकर देते हैं: जूठे बरतन, बचा हुआ खाना, बिखरी मालाएँ। इसी सर्ग में हनुमान ख़ुद से पूछते हैं कि कहीं यह देखना पाप तो नहीं।"},
 chaitya:{n:"चैत्य महल",la:7.9,lo:80.828,t:"सबसे ऊँची चोटी पर कोई चढ़ा है",lore:"राक्षसों के रक्षक देवता का ऊँचा महल। बाग़ उजाड़ने के बाद वे ख़ुद तय करते हैं कि यह अभी बचा हुआ है, और चोटी पर चढ़कर ताली बजाते हैं। लंका की पहली आग यहीं लगती है, पूँछ से नहीं, खंभों की रगड़ से।"},
 chowk:{n:"नगर का चौक",la:7.858,lo:80.806,t:"भीड़ जमा है",lore:"नगर का वह चौक जहाँ भीड़ जमा होती है। यहीं एक एक करके भेजे गए योद्धा आते हैं, यहीं पूँछ पर कपड़े लपेटे जाते हैं, और यहीं से जलते हुए पूरे नगर में घुमाया जाता है। सज़ा को तमाशा बनाने की जगह यही है।"},
 sabha:{n:"रावण का दरबार",la:7.845,lo:80.86,t:"बँधा हुआ दूत खड़ा है",lore:"रावण का दरबार, जहाँ बँधे हुए दूत को लाया जाता है। पूछताछ प्रहस्त करता है, मंत्री मारने की राय देते हैं, और विभीषण अकेला खड़ा होकर नियम याद दिलाता है। यहीं वह भाषण होता है जिसमें बँधा हुआ दूत दरबार को सलाह देता है।"},
 mantri:{n:"मंत्रियों की बैठक",la:7.812,lo:80.892,t:"सब एक ही राय पर हैं",lore:"दरबार से लगा वह कमरा जहाँ मंत्री आपस में बात करते हैं। सब एक ही राय पर हैं, इसे मार डालो। एक अकेली आवाज़ पूरा फ़ैसला बदल देती है, और दंड में मौत की जगह पूँछ चुनी जाती है।"},
 ghar:{n:"एक अलग सा घर",la:7.828,lo:80.744,t:"यहाँ कोई नाम ले रहा है",lore:"नगर में वह एक घर जो बाकी सबसे अलग है। मानस में हनुमान उसे तुलसी और राम के नाम से पहचानते हैं, और वहीं उन्हें विभीषण मिलते हैं। यही घर आगे जलती लंका में बचा रह जाता है, और इसका कारण बहुत पुराना है: जब रावण ने कुबेर से लंका छीनी, तब विभीषण कुबेर के साथ चला गया था।"},
 vatika:{n:"अशोक वाटिका",la:6.9332,lo:80.8105,t:"पेड़ों के बीच कोई अकेली बैठी है",lore:"अशोक का मतलब ही है बिना शोक के, और कथा की सबसे बड़ी विडंबना यही है कि सबसे ज़्यादा शोक इसी बाग़ में है। बीच में एक शिंशपा पेड़ है, उसी के नीचे वे बैठी हैं, और राक्षसियाँ घेरा बनाकर पहरा देती हैं।"},
 kona:{n:"वाटिका का कोना",la:6.9,lo:80.766,t:"कोई नींद से हड़बड़ाकर उठी है",lore:"वाटिका का वह कोना जहाँ पहरा देने वाली राक्षसियाँ बैठती हैं। यहीं त्रिजटा नींद से हड़बड़ाकर उठती है और अपना सपना सुनाती है, और उसी से उस रात के ताने थम जाते हैं।"},

   "वहाँ रावण का बेटा इसी मैदान पर यज्ञ करता है, और वही यज्ञ तोड़ा जाता है।",
   "यानी जो नाम आज सिर्फ़ धमकी में आया, वह आगे सबसे बड़ा मोड़ बन जाता है।"],ref:"रामचरितमानस, लंकाकांड, निकुंभिला वाला प्रसंग"}]},
 "khoj-mainakp-0":{say:["नीचे पानी हिल रहा है, और उसके बीच से कुछ ऊपर उठ रहा है।",
  "यह सोने वाला वह पहाड़ है जिसे समुद्र ने ऊपर भेजा है, ताकि आप थोड़ी देर ठहर सकें।",
  "वह आदमी का रूप लेकर सामने आता है और कहता है कि रुक जाइए, पर रुकना नहीं होता।"],cards:["mainak_karz"],
  more:[{src:"bhanubhakta",cards:["nep_pahad"],say:["नेपाली कथा में पहाड़ का उठना घर की बात जैसी कही जाती है।",

 "भाषा सीधी है और चाल गाने जैसी, इसलिए यह पल जल्दी बीत जाता है।"],
 ref:"भानुभक्त रामायण, नेपाली"},{src:"kandali",cards:["mainak_chhoti"],say:["असम की कथा में यह ठहराव बहुत छोटा है।",
   "पहाड़ उठता है, कहता है, और पीछे छूट जाता है, सब एक ही साँस में।",
   "कवि ने विस्तार छोड़कर सार लिया था, और यहाँ वह साफ़ दिखता है।"],ref:"सप्तकांड रामायण, सुंदरकांड"}]},
 "khoj-sinhikap-0":{say:["नीचे पानी में एक गहरा घेरा सा बन रहा है, और उड़ान पीछे खिंचने लगती है।",
  "पहले लगता है कि उलटी हवा है, फिर नीचे देखने पर समझ आता है कि परछाईं पकड़ी जा चुकी है।",
  "पहचानते ही डर हट जाता है, क्योंकि यह बात पहले से बताई जा चुकी थी।"],cards:["chhaya_pakad"],
  more:[{src:"jain",cards:["jain_bina"],say:["इस कथा में यहाँ कुछ होता ही नहीं।",
   "उड़ना यहाँ विद्या है, इसलिए रास्ते में न कोई परखने आता है, न कोई पकड़ने।",
   "जो सबसे बड़ा ख़तरा दिखता है, वह इस परंपरा में है ही नहीं।"],ref:"पउमचरिय, विमलसूरि"}]},
 "aag-toran-1":{say:["बाग़ उजड़ चुका है। वे फाटक के मेहराब पर बैठ गए हैं, और वहीं से पूरा रास्ता दिखता है।",
  "पहली टोली आती है, अस्सी हज़ार की। वे मेहराब से एक लोहे का डंडा उखाड़ लेते हैं, और वही सब कुछ तय कर देता है।",
  "फिर एक एक करके और आते हैं। हर बार वे फिर उसी मेहराब पर लौट आते हैं, जैसे यही उनकी जगह हो।",
  "जो बच निकलते हैं वे दरबार तक ख़बर ले जाते हैं, और वहाँ से अगला नाम भेजा जाता है।"],
  cards:["kinkar_80","jambumali","saat_bete","paanch_senapati"],more:[{src:"gobind",cards:["gobind_veer"],say:["ब्रजभाषा की उस रचना में यह हिस्सा वीर रस में आता है।",
 "वहाँ ज़ोर डर या विनती पर नहीं, हिम्मत और सामना करने पर रहता है।",
 "छंद तेज़ हैं और शब्द ऐसे चुने गए हैं जो सुनते ही खड़ा कर दें।"],
 ref:"दसम ग्रंथ, रामावतार वाला हिस्सा"},{src:"manas",say:["मानस में यह पूरी कड़ी तेज़ी से बीतती है। रखवाले आते हैं, फिर सेना, फिर अक्षय।",
 "तुलसीदास नाम गिनाने पर नहीं रुकते, वे उस एक बात पर रुकते हैं कि जो भी आया, लौटा नहीं।",
 "इसीलिए वहाँ यह हिस्सा लड़ाई कम और चेतावनी ज़्यादा लगता है।"],ref:"रामचरितमानस, सुंदरकांड, अक्षय वध वाला हिस्सा"}]},
 "vidya-j_nagar-0":{src:"jain",cards:["jn_log"],say:["यह लंका है, पर यहाँ कोई राक्षस नहीं रहता। दीवारें वही हैं, फाटक वही, और भीतर बस्ती भी वैसी ही।",
  "यहाँ रहने वाले विद्याधर हैं, जो मांस नहीं खाते और डरावने नहीं हैं। वे बस दूसरे लोग हैं, जिनके पास कुछ विद्याएँ हैं।",
  "रावण भी यहाँ उन्हीं का राजा है, कोई अलग जाति का नहीं, और इसीलिए उसकी ताक़त भी सीखी हुई है, दी हुई नहीं।",
  "इस एक बदलाव से पूरी कथा का मिज़ाज बदल जाता है: यहाँ दुश्मनी है, नफ़रत नहीं।"],ref:"पउमचरिय, विमलसूरि"},
 "vidya-j_vidya-0":{src:"jain",cards:["jn_sikha"],say:["यहाँ उड़ना वरदान नहीं, सीखी हुई विद्या है।",
  "जिसने सीखी, वह उड़ा, इसलिए उड़ान पर कोई चौंकता नहीं।",
  "कथा हर बात का कारण बताती है, और यही उसका ढंग है।","इसलिए यहाँ न कोई पहाड़ रोकता है, न कोई मुँह खोलकर परखता है, क्योंकि उनकी ज़रूरत ही नहीं रही।"],ref:"पउमचरिय, विमलसूरि"},
 "vidya-j_dut-1":{src:"jain",cards:["jn_bheja"],say:["दूत यहाँ चोरी छिपे नहीं आता, भेजा जाता है।",
  "उसके पास राम की अँगूठी है और वह अपने काम से आया है।",
  "इसलिए उसे रोका नहीं जाता, और पकड़े जाने वाली पूरी कड़ी यहाँ है ही नहीं।","उसका काम ख़बर लाना भी है और ख़बर देना भी, इसलिए वह छिपकर चलने की जगह सीधे कहता है कि किसने भेजा है।"],ref:"पउमचरिय; इस परंपरा में दूत वाला प्रसंग"},
 "vidya-j_darbar-1":{src:"jain",cards:["jn_binabandh"],say:["दरबार में वह बँधा हुआ नहीं आता।",
  "इसलिए न मारने की राय होती है, न दंड, और न वह भाषण जो बँधे हुए दूत ने दिया था।",
  "बात सीधे होती है, और उसी तरह ख़त्म भी।","जो दरबार दूसरी कथाओं में सबसे बड़ा मोड़ है, वह यहाँ एक मुलाक़ात भर रह जाता है।"],ref:"पउमचरिय, विमलसूरि"},
 "vidya-j_aag-2":{src:"jain",cards:["jn_aag"],say:["लंका यहाँ भी जलती है, पर पूँछ से नहीं।",
  "इस परंपरा में वह दृश्य आता ही नहीं जिसे बाकी सब सबसे ज़्यादा याद रखते हैं।",
  "अंत वही रहता है, और रास्ता पूरा बदल जाता है।","इसी से पता चलता है कि किसी कथा की पहचान उसके अंत से नहीं, उसके रास्ते से बनती है।"],ref:"पउमचरिय, विमलसूरि"},
 "vidya-j_lautna-2":{src:"jain",cards:["jn_seedha"],say:["निशानी लेकर वह सीधे लौट जाता है।",
  "न जलती पूँछ, न तमाशा, न सज़ा। काम हुआ और लौटना हुआ।",
  "जो कथा हर बात का कारण बताती है, वह अंत भी बिना नाटक के करती है।","लौटते वक़्त उसके पास वही है जिसके लिए वह आया था, और उतना ही काफ़ी माना जाता है।"],ref:"पउमचरिय, विमलसूरि"},
 "shakti-s_pushkar-0":{src:"adbhuta",cards:["adb_dweep"],say:["समुद्र के उस पार एक और नगर है, पुष्कर द्वीप, और ललकार वहीं से आई है।",
  "लंका जीतने के बाद भी कुछ बचा रह गया था, और वह पहले से बड़ा निकला।",
  "सेना अभी हथियार रख ही रही थी कि यह ख़बर पहुँची, इसलिए थकान और डर एक साथ बैठ जाते हैं।",
  "कथा यह दिखाने के लिए उसे लाती है कि जीत कभी पूरी नहीं लगती, और कोई न कोई किनारा हमेशा बचा रह जाता है।"],ref:"अद्भुत रामायण, सर्ग 23"},
 "vidya-j_nishani-2":{src:"jain",cards:["jn_dono"],say:["यहाँ दोनों निशानियाँ साफ़ दिखती हैं।",
  "जाते वक़्त राम की अँगूठी, और लौटते वक़्त सीता की चूड़ामणि।",
  "बीच में न पकड़, न बंधन, न तमाशा, सिर्फ़ लेना और देना।","निशानी यहाँ सबूत है, और सबूत को नाटक की ज़रूरत नहीं होती।"],ref:"पउमचरिय; इस परंपरा में दूत वाला प्रसंग"},
 "shakti-s_darbar-0":{src:"adbhuta",cards:["adb_baad"],say:["लंका की लड़ाई ख़त्म हो चुकी है। दरबार बैठा है, घाव बाँधे जा रहे हैं, और सब यह मान चुके हैं कि अब आराम है।",
  "जहाँ बाक़ी सारी कथाएँ यहीं ख़त्म होती हैं, यह ग्रंथ यहीं से चलना शुरू करता है।",
  "तभी एक और नाम सुनाई देता है, और वह पहले वाले से बड़ा है।",
  "सत्ताईस सर्गों वाले इस ग्रंथ में यह हिस्सा तेईस से पच्चीस तक चलता है, और यही उसकी पहचान है।"],ref:"अद्भुत रामायण, सर्ग 23"},
 "shakti-s_hazar-0":{src:"adbhuta",cards:["adb_hazar"],say:["सामने खड़ा है वह दूसरा रावण, जिसके हज़ार मुँह हैं, और जिसकी आवाज़ हज़ार तरफ़ से आती है।",
  "लंका वाला उसके आगे छोटा पड़ जाता है। जिसे अभी अभी सबसे बड़ा मानकर हराया गया था, वह अब गिनती में भी नहीं आता।",
  "उसकी ललकार सुनकर वह सेना ठिठक जाती है जो कुछ दिन पहले जीत चुकी थी।",
  "जो अभी अभी जीते थे, उन्हें फिर से शुरू से खड़ा होना है, और इस बार बिना यह जाने कि जीतने का रास्ता क्या है।"],ref:"अद्भुत रामायण, सर्ग 23"},
 "shakti-s_maya-1":{src:"adbhuta",cards:["adb_bandhan"],say:["लड़ाई शुरू होते ही माया फैल जाती है।",
  "दोनों भाई बँध जाते हैं, और कोई अस्त्र काम नहीं आता।",
  "जब सबसे बड़े भी हार जाते हैं, तब कथा किसी और तरफ़ देखने लगती है।","चारों तरफ़ सन्नाटा है, और सबकी नज़र उसी पर टिक जाती है जो अब तक पीछे खड़ी थीं।"],ref:"अद्भुत रामायण, सर्ग 24"},
 "shakti-s_aage-1":{src:"adbhuta",cards:["adb_aage"],say:["दोनों भाई बँधे पड़े हैं और सेना हिल तक नहीं पा रही। तभी वे आगे बढ़ती हैं जो अब तक पीछे रहीं।",
  "इस कथा में उनकी चुप्पी कमज़ोरी नहीं थी, रुका हुआ बल थी। बग़ीचे वाली वही चुप्पी अब मैदान में खड़ी है।",
  "आगे बढ़ते ही सबकी नज़र बदल जाती है, और सामने वाला पहली बार ठिठकता है।",
  "जो अब तक बचाई जा रही थीं, वही अब सबको बचाने खड़ी हैं, और यही इस पूरे ग्रंथ का मोड़ है।"],ref:"अद्भुत रामायण, सर्ग 24"},
 "shakti-s_roop-2":{src:"adbhuta",cards:["adb_roop"],say:["वे अपना मनुष्य रूप छोड़ देती हैं।",
  "महाकाली का रूप लेकर वे पल भर में उसके हज़ार सिर काट देती हैं।",
  "पूरी परंपरा में यही दृश्य इस ग्रंथ की पहचान है।","इसके बाद सब चुप हैं, और किसी को समझ नहीं आ रहा कि अभी अभी क्या हुआ।"],ref:"अद्भुत रामायण, सर्ग 24 और 25"},
 "shakti-s_brahma-2":{src:"adbhuta",cards:["adb_saath"],say:["सब ख़त्म हो चुका है और अब समझाना बाकी है।",
  "ब्रह्मा राम को कहते हैं कि जो कुछ होता है, शक्ति के साथ ही होता है।",
  "इसलिए यह कथा हार जीत की नहीं, साथ की है।","और यही बात सबसे आख़िर में कही जाती है, ताकि सुनने वाला उसे लेकर लौटे।"],ref:"अद्भुत रामायण, सर्ग 25"},
 "vilanka-v_utar-0":{src:"sarala",say:["लंका पीछे छूट चुकी है। अब रास्ता नीचे जाता है, पानी के भीतर से होकर।",
  "यह दूसरी लंका है, जिसे विलंका कहते हैं। कथा इसे पाताल में रखती है, इसलिए यह नक्शे पर नहीं मिलती।",
  "नीचे उतरते हुए साँप रास्ता छोड़ते जाते हैं। ऊपर की रात यहाँ नहीं पहुँचती।"],cards:["v_khal"]},
 "vilanka-v_fatak-0":{src:"sarala",say:["फाटक पर कोई बैठी है। वह गाँव की देवी है, और यहाँ का नियम यही है कि जो शत्रु आए उसे पीने को दिया जाए।",
  "वह मुस्कुराकर पानी देती है। पीते ही पैर लड़खड़ाते हैं और वे वहीं गिर पड़ते हैं।",
  "उसके बाद छह महीने बीतते हैं। छह महीने वे वहीं पड़े रहते हैं, और कोई उन्हें उठाने नहीं आता।",
  "आख़िर देवता आते हैं और उन्हें फिर से उठाते हैं। तब जाकर फाटक पार होता है।"],cards:["v_chhah"]},

const MINW=7, MAXW=1400;   /* the texts now reach from Dunhuang to Mindanao */
function aspect(){const r=stage.getBoundingClientRect();const w=r.width||360,h=r.height||300;return w/h;}
function fit(box,pad){
 let [x,y,w,h]=box;const A=aspect();const k=pad||1.14;
 const cx=x+w/2, cy=y+h/2; w*=k; h*=k;
 if(w/h<A)w=h*A; else h=w/A;
 return clamp([cx-w/2,cy-h/2,w,h]);
}
function wideBox(){return mode==="texts"?textsBox():fitAll();}
function widest(){
 const A=aspect(),b=wideBox();
 let w=b[2]*1.14,h=b[3]*1.14;

 return Math.min(MAXW,w*1.06);
}
function holdBox(){
 const b=wideBox();
 return [b[0]-b[2]*.12,b[1]-b[3]*.12,b[2]*1.24,b[3]*1.24];
}
function clamp(v){
 const A=aspect();
 let w=Math.max(MINW,Math.min(v[2],widest())), h=w/A;
 let cx=v[0]+v[2]/2, cy=v[1]+v[3]/2;
 const B=holdBox();
 /* the drawn world never slides off into emptiness: inside the box, or centred */
 cx=w>=B[2]?B[0]+B[2]/2:Math.max(B[0]+w/2,Math.min(cx,B[0]+B[2]-w/2));
 cy=h>=B[3]?B[1]+B[3]/2:Math.max(B[1]+h/2,Math.min(cy,B[1]+B[3]-h/2));
 return [cx-w/2,cy-h/2,w,h];

 chalisa_char:{n:"चालीस चौपाइयों वाला चक्कर",src:"chalisa",at:["khoj-devlok-0","aag-chhat-3"],

 fig:(x,y,s,o)=>{                       /* the same people as the main pictures, never the same twice */
  o=o||{};
  const v=(o.v===undefined?((x*7+y*3)|0):o.v);
  const kind=o.kind||(o.crown?"ravan":(o.nari?"nari":"nar"));
  const sc=(s||1)*(o.child?1.35:2.1);
  const mix=(n,k)=>{let h=Math.imul(v+1+k*911,2654435761);h^=h>>>13;h=Math.imul(h,1597334677)>>>0;return h%n;};
  const style=' style="--skin:'+(o.skin||TD.SKIN[mix(TD.SKIN.length,1)])+
   ';--cloth:'+(o.cloth||TD.CLOTH[mix(TD.CLOTH.length,2)])+
   ';--cloth2:'+(o.cloth2||TD.CLOTH2[mix(TD.CLOTH2.length,3)])+
   ';--hair:'+(o.hair||TD.HAIR[mix(TD.HAIR.length,4)])+'"';
  const body=o.sit?D.sit(x,y,sc,{kind:kind})
   :D.person(x,y,sc,(o.d||0)*2,{kind:kind,act:o.walk?"walk":"stand",face:o.face===undefined?1:o.face});
  let extra="";
  const H=y-(o.sit?24:34)*(sc/2.1);      /* about head height */
  if(o.turban)extra+='<path d="M'+(x-5.2*s)+' '+(H+1)+' q'+(5.2*s)+' -'+(7*s)+' '+(10.4*s)+' 0 Z" fill="'+
   (o.turbanc||"#d9b46a")+'"/>';
  if(o.veil)extra+='<path d="M'+(x-6*s)+' '+(H+2)+' q'+(6*s)+' -'+(9*s)+' '+(12*s)+' 0 l-'+(1.5*s)+' '+(13*s)+
   ' h-'+(9*s)+' Z" fill="'+(o.veilc||"#c98aa0")+'" opacity=".92"/>';
  if(o.pot)extra+='<ellipse cx="'+x+'" cy="'+(H-6*s)+'" rx="'+(6*s)+'" ry="'+(4.6*s)+'" fill="#8a4a2c"/>'+
   '<path d="M'+(x-6*s)+' '+(H-6*s)+' q'+(6*s)+' '+(7*s)+' '+(12*s)+' 0 Z" fill="#a35a34"/>';
  if(o.basket)extra+='<path d="M'+(x+7*s)+' '+(y-16*s)+' h'+(12*s)+' l-'+(2*s)+' '+(8*s)+' h-'+(8*s)+' Z" fill="#a8832f"/>';
  if(o.staff)extra+='<path d="M'+(x+(o.face===-1?-8:8)*s)+' '+(y+1)+' v-'+(30*s)+'" stroke="#7a5a32" stroke-width="'+(1.8*s)+'" stroke-linecap="round"/>';
  if(o.spear)extra+='<path d="M'+(x+(o.face===-1?-9:9)*s)+' '+(y+1)+' v-'+(38*s)+'" stroke="#8a8f99" stroke-width="'+(1.6*s)+'"/>'+
   '<path d="M'+(x+(o.face===-1?-9:9)*s)+' '+(y-38*s)+' l'+(2.4*s)+' '+(5*s)+' h-'+(4.8*s)+' Z" fill="#c9ced6"/>';
  return '<g'+style+">"+body+extra+"</g>";

const kahiOpen=k=>!!(save.kahi&&save.kahi[k]);
const kahiReach=k=>KAHI[k]&&KAHI[k].on.some(c=>save.cards[c]);
const kahiCount=()=>Object.keys(KAHI).filter(kahiOpen).length;
function openKahi(){
 save.kahi=save.kahi||{};
 Object.keys(KAHI).forEach(k=>{
  if(save.kahi[k]||KAHI[k].cost>0)return;
  if(kahiReach(k)){save.kahi[k]=true;earn(2,"kahi",KAHI[k].n);}
 });
}
function kahiNeed(k){const K=KAHI[k];return K&&K.need?adhikar(K.need):{ok:true,miss:[],all:[]};}
function buyKahi(k){
 const K=KAHI[k];if(!K||kahiOpen(k))return;
 if(!kahiReach(k)){note("यह तब खुलेगा जब आप उस पल तक पहुँचेंगे जहाँ यह कहा गया था।");return;}
 const ad=kahiNeed(k);
 if(!ad.ok){note("अभी यह खुलने लायक नहीं: "+ad.miss[0].x+"।");return;}
 if(!spend(K.cost)){note("इसके लिए "+K.cost+" मणि चाहिए।");return;}
 save.kahi=save.kahi||{};save.kahi[k]=true;persist();
 note(K.n+" अब खुल गया।");drawPatra();deepKahi(k);
}

 brahmastra_v:{n:"इंद्रजित का ब्रह्मास्त्र",k:"astra",who:"इंद्रजित",from:"ब्रह्मा",

 akshaya:{n:"अक्षकुमार",x:"रावण का छोटा बेटा, जिसे किंकरों, चैत्य महल के रखवालों, जंबुमाली, मंत्री के सात बेटों और पाँच सेनापतियों के बाद भेजा गया। वह रथ पर आया और पहले बाणों से घेरा। वाल्मीकि कहते हैं कि आख़िर में उसे पैरों से पकड़कर घुमाया गया और ज़मीन पर पटक दिया गया, रथ, सारथी और घोड़े समेत। उसकी उम्र का ज़िक्र करके कवि यह भी कहता है कि वह पीछे नहीं हटा।",on:["akshay"]},
 indrajit:{n:"इंद्रजित",x:"रावण का बड़ा बेटा, जिसका नाम ही इंद्र को हराने से पड़ा। उसके बाण काम नहीं आए, तब उसने ब्रह्मास्त्र चलाया और वही बाँध सका। हनुमान चाहते तो छूट सकते थे, पर ब्रह्मा की मर्यादा रखकर चुप पड़े रहे, क्योंकि बँधकर ही रावण तक पहुँचा जा सकता था। आगे राक्षसों ने रस्सियाँ भी बाँध दीं और ब्रह्मास्त्र का बंधन अपने आप छूट गया, क्योंकि वह दूसरे बंधन के साथ नहीं ठहरता।",on:["brahmastra"]},
 ravan:{n:"रावण",x:"लंका का राजा, जिसने यह नगरी कुबेर से छीनी थी और उसी के साथ शाप भी पाया। ब्रह्मा से उसने मनुष्य को छोड़कर सबसे अभय माँगा था, और एक रोक भी साथ लगी कि जो स्त्री अपनी मर्ज़ी से न आए उसे वह छू नहीं सकता। इसीलिए वाटिका में वह मनाता है, अवधि देता है, धमकाता है, पर हाथ नहीं लगाता। दरबार में बँधे हुए दूत को देखकर भी वह उसे मारने का हुक्म देता है, और विभीषण की एक बात से वह हुक्म बदल जाता है।",on:["avadhi","manas_sabha"]},
 kinkar:{n:"किंकर टोली",x:"रावण की भेजी पहली टोली, गिनती अस्सी हज़ार, बड़े पेट और लंबे दाँतों वाले। हनुमान के पास कोई हथियार नहीं था, इसलिए उन्होंने फाटक के मेहराब से ही लोहे का डंडा उखाड़ लिया। इस टोली के बाद रावण ने एक एक करके नाम वाले योद्धा भेजे, और कथा इसी क्रम से बताती है कि लंका को समझने में कितनी देर लगी।",on:["kinkar"]},
 lankadevi:{n:"लंका देवी",x:"अध्यात्म रामायण में द्वार पर रोकने वाली का यही नाम है, और वहाँ वह पहले से जानती हैं कि जनक के घर जन्मी योगमाया हैं। हारकर वही हनुमान को रास्ता बताती हैं: वाटिका के बीच एक शिंशपा पेड़ है, उसी के नीचे जानकी बैठी हैं। यानी जिसे ढूँढा जा रहा है, उसके बारे में पहला पक्का संकेत दुश्मन की तरफ़ से मिलता है।",on:["adhy_sita"]},
 chamundi:{n:"चामुंडी",x:"बांग्ला की कृत्तिवासी रामायण में फाटक पर रोकने वाली का नाम लंकिनी नहीं, चामुंडी है। हनुमान उससे भिड़ते हैं और तभी भीतर जाते हैं। उसी कथा में आगे एक ऋषि का वरदान भी आता है। नाम बदलने से दृश्य वही रहता है, पर उसका रंग बदल जाता है।",on:["kritti_lanka"]},
 lankalakshmi:{n:"लंका लक्ष्मी",x:"मलयालम की किलिप्पाट्टु में उसी जगह खड़ी रक्षिका का नाम लंका लक्ष्मी है, और उस पूरे खंड का नाम ही है लंका लक्ष्मी मोक्षम्, यानी उसका छूटना। वहाँ यह हार नहीं, मुक्ति मानी जाती है। एक ही पल, और चार कथाओं में चार नाम।",on:["ezhu_vatika"]},
 p_jambumali:{n:"जम्बुमाली",only:"yoddha",x:"प्रहस्त का बेटा, और उस दिन का पहला ऐसा लड़ाका जिसे नाम लेकर भेजा गया। वह रथ पर आता है और धनुष चलाता है, इसलिए यह पहला मुक़ाबला है जिसमें दूर से वार होता है। उसके आने से पहले तक जो आए वे गिनती थे, और उसके बाद जो आए वे और बड़े दर्जे के थे।",on:["y_naam","y_dhanush"]},
 p_kinkar:{n:"किंकर",only:"yoddha",x:"रावण के वे लड़ाके जो सबसे पहले और सबसे ज़्यादा गिनती में भेजे गए। वे घेरकर लड़ते हैं, इसलिए उनके बीच पीछे हटने की जगह नहीं बचती। इस पूरे दिन की लड़ाई का ढंग उन्हीं से तय हुआ, क्योंकि पहला हथियार भी उन्हीं के बीच वहीं से उठाया गया।",on:["y_ghera","y_danda"]},
 p_nagarwale:{n:"नगर के लोग",only:"yatri",x:"लंका में रहने वाले आम लोग, जिनका ज़िक्र वाल्मीकि बार बार करते हैं। कोई सो रहा है, कोई गा रहा है, कोई खा पी रहा है, और किसी के घर में दीया जल रहा है। इन्हीं के होने से लंका दुश्मन का ठिकाना नहीं, एक भरी हुई बस्ती लगती है।",on:["t_gali","t_raunak"]},
 p_bajane:{n:"बजाने वाले",only:"kathapremi",x:"महल के वे लोग जो रात भर बजाते रहे और आख़िर में अपने ही साज़ों पर सो गए। कोई वीणा से लिपटा है, कोई ढोल पर सिर रखे है। यह पूरा ब्योरा कथा में यूँ ही नहीं है, इसी से पता चलता है कि कवि उस नगर को किस नज़र से देख रहा था।",on:["k_saaz","k_nazar"]},
 p_panchhi:{n:"बाग़ के पंछी",only:"balak",x:"अशोक वाटिका की डालों पर बैठे वे पंछी जो नीचे सब कुछ देखते रहते हैं। जब आदमी चुप हों, तब उनकी हलचल ही बताती है कि कोई आ रहा है। मलयालम की कथा में तो पूरी कहानी ही एक पंछी सुनाता है, इसलिए इस कथा में पंछी सिर्फ़ दर्शक नहीं हैं।",on:["b_shor","b_tota"]},
 p_teekakar:{n:"टीका लिखने वाले",only:"shastri",x:"वे लोग जिन्होंने सदियों तक इस कांड पर टीकाएँ लिखीं और यह सवाल उठाया कि इसका नाम सुंदर क्यों है। उनके नाम कथा के भीतर नहीं हैं, पर उनके बिना यह कांड आज जैसा पढ़ा जाता है वैसा न पढ़ा जाता। हर पुराने ग्रंथ के पीछे ऐसे बहुत से अनदेखे पाठक होते हैं।",on:["s_kyon","s_paath"]},
 p_paathi:{n:"पाठ करने वाले",only:"sadhak",x:"वे लोग जो इस कांड को कहानी की तरह नहीं, सहारे की तरह पढ़ते हैं। मंगलवार और शनिवार को इसका पाठ आम है, और कई घरों में यही अकेला हिस्सा है जो पूरा पढ़ा जाता है। किसी कथा का रोज़ दोहराया जाना उसे किताब से निकालकर लोगों में बसा देता है।",on:["sd_naam","sd_paath"]},
 p_mantri:{n:"रावण के मंत्री",only:"raja",x:"दरबार के वे लोग जो सबसे आसान राय देते हैं, कि मार डालो। आसान राय देना दरबार में सबसे सस्ता काम है, और राजा की असली परीक्षा यही है कि वह किसकी सुनता है। उसी दरबार में एक भाई खड़ा होकर नियम याद दिलाता है, और पूरा फ़ैसला बदल जाता है।",on:["r_niyam","r_dut"]},
 p_sunne:{n:"आगे सुनाने वाले",only:"jigyasu",x:"वे अनगिनत लोग जिन्होंने इस एक रात को अपनी अपनी ज़बान में आगे बढ़ाया, और जिनकी वजह से यह कथा इकतालीस अलग अलग रूपों में इस खेल तक पहुँची। उनमें कवि भी हैं, गाने वाले भी, कठपुतली चलाने वाले भी, और वे भी जिनका नाम कहीं दर्ज नहीं हुआ।",on:["j_bacha","j_aage"]},
 vidyadhar:{n:"विद्याधर",x:"जैन परंपरा में लंका के रहने वाले। वे राक्षस नहीं हैं, मांस नहीं खाते और डरावने नहीं हैं। उनके पास कुछ विद्याएँ हैं, जिनमें उड़ने की विद्या भी है, और वही उन्हें बाकी लोगों से अलग करती है। इसी एक बदलाव से पूरी कथा का मिज़ाज बदल जाता है, क्योंकि फिर लड़ाई किसी जाति से नहीं, कुछ लोगों से होती है।",on:["jn_log","jn_sikha"]},
 sahasramukh:{n:"हज़ार मुँह वाला रावण",x:"अद्भुत रामायण में लंका की लड़ाई के बाद एक और रावण सामने आता है, जिसके हज़ार मुँह हैं। वह राम और लक्ष्मण को माया में बाँध देता है। तब सीता आगे बढ़ती हैं, अपना मनुष्य रूप छोड़कर महाकाली का रूप लेती हैं और पल भर में उसके हज़ार सिर काट देती हैं। बाद में ब्रह्मा राम को समझाते हैं कि जो कुछ होता है, शक्ति के साथ ही होता है।",on:["adbhuta_sita"]},
 sahasramukh:{n:"हज़ार मुँह वाला रावण",x:"अद्भुत रामायण का वह दूसरा रावण, जो पुष्कर द्वीप से ललकारता है और जिसके हज़ार मुँह हैं। लंका वाला उसके आगे छोटा पड़ जाता है। वह माया के बल पर राम और लक्ष्मण दोनों को बाँध देता है, और तभी कथा किसी और तरफ़ मुड़ती है। उसका अंत किसी अस्त्र से नहीं, उस रूप से होता है जो सीता तब लेती हैं।",on:["adb_hazar","adb_bandhan"]},
 mahakali:{n:"महाकाली रूप में सीता",x:"इस परंपरा में बग़ीचे वाली चुप्पी कमज़ोरी नहीं, रुका हुआ बल थी। जब दोनों भाई बँध जाते हैं, तब वे आगे बढ़ती हैं, अपना मनुष्य रूप छोड़ती हैं और महाकाली का रूप लेकर पल भर में उसके हज़ार सिर काट देती हैं। पूरी परंपरा में यही दृश्य अद्भुत रामायण की पहचान है, और इसी वजह से इसे शाक्त परंपरा की रामकथा कहा जाता है।",on:["adb_roop","adb_aage"]},
 suvanna:{n:"सुवण्णमच्छा",x:"सोने की मछली वाली वह राजकुमारी जो थाई और खमेर कथाओं में मिलती है। वहाँ वह समुद्र में हनुमान से टकराती है, और वह टकराव लड़ाई से शुरू होकर किसी और ही जगह जाकर ख़त्म होता है। कंबोडिया में उस भेंट पर एक पूरा नाच है, जो वहाँ के सबसे मशहूर नाचों में गिना जाता है। भारत की किसी कथा में यह पात्र नहीं है, और यही बताता है कि हर जगह ने इस कथा में अपना कुछ जोड़ा।",on:["thai_teen","khmer_manch"]},
 trigangga:{n:"त्रिगंग्गा",x:"जावा के छाया नाटक की परंपरा में हनुमान का बेटा, जो अपने पिता की तरह सफ़ेद वानर है। वहाँ की कथा कहती है कि लंका जलाकर लौटते वक़्त समुद्र के ऊपर से यह जन्म हुआ, और पिता को इसका पता भी नहीं था। यह पात्र पुराने ग्रंथों में नहीं, मंच की परंपरा में जुड़ा, और वहाँ आज भी ज़िंदा है।",on:["java_patthar"]},
 laksamana_malay:{n:"लक्षमाना, मलय कथा वाला",x:"मलय कथा में राम के छोटे भाई का दर्जा कई जगह राम से भी बड़ा हो जाता है। वे आगे रहते हैं, तेज़ फ़ैसले लेते हैं, और लोग उन्हीं की हिम्मत की बात करते हैं। यही बात लाओ कथा में भी है, जहाँ नाम ही पहले भाई का है, और फिलीपींस की कथा में तो हनुमान वाला काम भी उन्हीं के नाम से आता है। एक ही पात्र, और तीन देशों में तीन बार ऊपर उठा हुआ।",on:["malay_laksamana","lao_naam"]},
 fatak_devi:{n:"फाटक की देवी",x:"विलंका के फाटक पर बैठी वह देवी, जिसका नियम यह है कि जो शत्रु आए उसे पीने को दिया जाए। वह मुस्कुराकर पानी देती है, और पीते ही पैर लड़खड़ा जाते हैं। लंका के द्वार पर जो रक्षिका लड़कर हारी थी, उसकी जगह यहाँ कोई लड़ती ही नहीं, और फिर भी यह हार सबसे लंबी है, क्योंकि उसके बाद छह महीने बीतते हैं।",on:["v_chhah"]},
 kambu:{n:"कम्बु",x:"विलंका का वह असुर जो ब्राह्मण का वेश धरकर आता है और भीख माँगने के बहाने राम को ही उठा ले जाता है। यह वही चाल है जो हरण के वक़्त चली गई थी, और कथा इसे दोहराकर याद दिलाती है कि छल हर बार वेश बदलकर आता है। हनुमान उन्हें छुड़ाते हैं, और उसी रात विलंका जलती है।",on:["v_kambu_card"]},
 mangala:{n:"देवी मंगला",x:"ओड़िया परंपरा की वह देवी जो अंत से ठीक पहले सामने आती हैं और सीता को फूलों का धनुष देती हैं। हथियार देने वाली देवी यहाँ लोहे का नहीं, फूल का धनुष देती हैं, और यही इस कथा का सबसे बड़ा उलटफेर है।",on:["v_phool"]},

/* ---------- the corner map: where in the whole you are standing ---------- */
const MINI=CAM(17.5,71.5,5.0,84.0);
const miniEl=document.getElementById("mini"),miniSvg=document.getElementById("minimap");
let miniVp=null;
function miniBuild(){
 if(!miniSvg)return;
 miniSvg.setAttribute("viewBox",MINI.map(n=>n.toFixed(2)).join(" "));
 miniSvg.innerHTML=
  '<path class="mland" d="'+LINE(COAST_IN)+' Z"/>'+
  '<path class="mland" d="'+LINE(COAST_LK)+' Z"/>'+
  '<path class="mshoal" d="'+LINE(BRIDGE_N)+" "+LINE(BRIDGE_S).replace("M","L")+' Z"/>'+
  '<path class="mcity" d="'+LINE(CITY)+' Z"/>'+
  '<g id="mdots"></g>'+
  '<rect class="mvp" x="0" y="0" width="10" height="10" rx="2"/>';
 miniVp=miniSvg.querySelector(".mvp");
 miniPaint();miniView();
}
function miniPaint(){
 if(!miniSvg)return;
 const box=miniSvg.querySelector("#mdots");if(!box)return;
 let g="";
 if(mode==="texts"){
  Object.keys(SRC).forEach(k=>{const S=SRC[k];if(!S.la)return;const q=PX(S.la,S.lo);
   const got=save.texts&&save.texts[k];
   g+='<circle class="mdot'+(got?" done":"")+(selText===k?" here":"")+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.4"/>';});
 }else{
  const W=run?run.N.watches[Math.min(run.w,run.N.watches.length-1)]:null;
  Object.keys(PLACES).forEach(id=>{
   const P=PLACES[id],live=W&&W.spots.includes(id);
   const key=run?run.N.id+"-"+id+"-"+run.w:"";
   const done=key&&SC[key]&&depthOf(key)>=layersOf(key).length;
   const here=run&&run.focus===id;
   if(!live&&!here&&!(run&&run.pickedHere.includes(id)))
    {g+='<circle class="mdot" cx="'+P.x.toFixed(1)+'" cy="'+P.y.toFixed(1)+'" r="2.4"/>';return;}
   g+='<circle class="mdot'+(here?" here":done?" done":" live")+'" cx="'+P.x.toFixed(1)+'" cy="'+P.y.toFixed(1)+'" r="'+(here?4.6:3.6)+'"/>';
  });
 }
 box.innerHTML=g;
}
let fullW=0,miniWant=null;
function fullWidth(){if(!fullW)fullW=fit(fitAll(),1.14)[2];return fullW;}
function miniAuto(){
 if(!miniEl)return;
 const need=cam[2]<fullWidth()*.45;      /* only when the whole is out of sight */
 if(!need&&miniWant!==null)miniWant=null;
 const open=miniWant===null?need:miniWant;
 miniEl.classList.toggle("shut",!open);
 const f=document.getElementById("miniFold");
 if(f)f.textContent=open?"छोटा करो":"नक्शा दिखाओ";
}
function miniView(){
 miniAuto();
 if(!miniVp)return;
 const x=Math.max(MINI[0],cam[0]),y=Math.max(MINI[1],cam[1]);
 const x2=Math.min(MINI[0]+MINI[2],cam[0]+cam[2]),y2=Math.min(MINI[1]+MINI[3],cam[1]+cam[3]);
 miniVp.setAttribute("x",x.toFixed(1));miniVp.setAttribute("y",y.toFixed(1));
 miniVp.setAttribute("width",Math.max(4,x2-x).toFixed(1));
 miniVp.setAttribute("height",Math.max(4,y2-y).toFixed(1));
}
function miniGo(e){
 const r=miniSvg.getBoundingClientRect();if(!r.width)return;
 const fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
 const px=MINI[0]+fx*MINI[2], py=MINI[1]+fy*MINI[3];
 const w=cam[2],h=w/aspect();
 shut();flyTo([px-w/2,py-h/2,w,h],1);
}
if(miniSvg){
 miniSvg.addEventListener("click",miniGo);
 miniSvg.addEventListener("pointerdown",e=>e.stopPropagation());
}
const miniFold=document.getElementById("miniFold");
if(miniFold)miniFold.onclick=()=>{miniWant=miniEl.classList.contains("shut");miniAuto();};

/* ---------- pan and zoom ---------- */
let ptr={},drag=null,pinch=null,moved=0,capId=null,justDragged=false;
function letGo(){if(capId!==null){try{stage.releasePointerCapture(capId);}catch(_){}capId=null;}}
function toWorld(e){const r=stage.getBoundingClientRect();
 return [cam[0]+(e.clientX-r.left)/r.width*cam[2],cam[1]+(e.clientY-r.top)/r.height*cam[3]];}
stage.addEventListener("pointerdown",e=>{if(e.target.closest(".sheet,.dio,.chip,.fold"))return;
 ptr[e.pointerId]=e;
 const k=Object.keys(ptr);
 if(k.length===1){anim++;drag={x:e.clientX,y:e.clientY,cam:cam.slice()};moved=0;}
 else if(k.length===2){const a=ptr[k[0]],b=ptr[k[1]];
  pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),cam:cam.slice()};drag=null;
  try{stage.setPointerCapture(e.pointerId);capId=e.pointerId;}catch(_){}}
});
stage.addEventListener("pointermove",e=>{
 if(!(e.pointerId in ptr))return;ptr[e.pointerId]=e;
 const k=Object.keys(ptr),r=stage.getBoundingClientRect();
 if(pinch&&k.length===2){const a=ptr[k[0]],b=ptr[k[1]];
  const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  const f=Math.max(.25,Math.min(4,pinch.d/d));
  const mx=(a.clientX+b.clientX)/2-r.left, my=(a.clientY+b.clientY)/2-r.top;
  const px=pinch.cam[0]+mx/r.width*pinch.cam[2], py=pinch.cam[1]+my/r.height*pinch.cam[3];
  const w=pinch.cam[2]*f,h=w/aspect();
  apply(clamp([px-(mx/r.width)*w,py-(my/r.height)*h,w,h]));return;}
 if(drag){
  moved=Math.max(moved,Math.hypot(e.clientX-drag.x,e.clientY-drag.y));
  if(moved<6)return;                     /* a small wobble is a tap, not a drag */
  if(capId===null){try{stage.setPointerCapture(e.pointerId);capId=e.pointerId;}catch(_){}svg.classList.add("drag");}
  const dx=(e.clientX-drag.x)/r.width*drag.cam[2],dy=(e.clientY-drag.y)/r.height*drag.cam[3];
  apply(clamp([drag.cam[0]-dx,drag.cam[1]-dy,drag.cam[2],drag.cam[3]]));}
});
["pointerup","pointercancel","pointerleave"].forEach(t=>stage.addEventListener(t,e=>{
 delete ptr[e.pointerId];if(Object.keys(ptr).length<2)pinch=null;
 if(!Object.keys(ptr).length){if(moved>=6)justDragged=true;drag=null;moved=0;letGo();svg.classList.remove("drag");}}));
stage.addEventListener("click",e=>{if(justDragged){justDragged=false;e.stopPropagation();e.preventDefault();}},true);
stage.addEventListener("wheel",e=>{
 const wide=(typeof innerWidth==="number"?innerWidth:1200)>=900;
 if(!wide&&!(e.ctrlKey||e.metaKey)){    /* stacked: the wheel keeps reading the story below */
  const box=PANE[panel],d=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*box.clientHeight:e.deltaY;
  dropAnchor();box.scrollTop+=d;return;}
 e.preventDefault();anim++;
 const r=stage.getBoundingClientRect();
 const fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
 const px=cam[0]+fx*cam[2], py=cam[1]+fy*cam[3];
 const f=e.deltaY>0?1.18:.85, w=cam[2]*f, h=w/aspect();
 apply(clamp([px-fx*w,py-fy*h,w,h]));},{passive:false});
function zoom(f){anim++;const cx=cam[0]+cam[2]/2,cy=cam[1]+cam[3]/2,w=cam[2]*f,h=w/aspect();
 apply(clamp([cx-w/2,cy-h/2,w,h]));}

function refit(){
 const cx=cam[0]+cam[2]/2, cy=cam[1]+cam[3]/2, w=cam[2], h=w/aspect();
 apply(clamp([cx-w/2,cy-h/2,w,h]));
}

function paint(){
 numOf={};let n=0;
 const W=run?run.N.watches[run.w]:null;
 Object.keys(PLACES).forEach(id=>{
  const m=marks[id],P=PLACES[id];if(!m)return;
  const inW=W&&W.spots.includes(id)&&mineOnly(id);
  const nowOpen=!run||!W||ghadiSpots().includes(id)||run.pickedHere.includes(id);
  const giftLock=false;
  const used=run&&run.pickedHere.includes(id);
  const key=run?run.N.id+"-"+id+"-"+run.w:"";
  const d=key&&SC[key]?depthOf(key):0, tot=key&&SC[key]?layersOf(key).length:0;
  const keyF=run?run.N.id+"-"+id+"-"+run.w:"";
  const totF=keyF&&SC[keyF]?layersOf(keyF).length:0;
  const dF=keyF?depthOf(keyF):0;
  let flag="";
  if(dF>0)flag=dF>=totF?" f-done":" f-part";
  let cls="mk"+flag;
  if(!inW)cls+=" hide";
  else if(!nowOpen)cls+=" later";          /* this place belongs to the other ghadi */
  else if(giftLock)cls+=" giftlock";
  else if(used)cls+=(run&&run.focus===id?" live here":" used");
  else{cls+=" live"+(d>0&&d>=tot?" full":d>0?" part":"")+(P.gift?" gift":"");n++;numOf[id]=n;}
  m.setAttribute("class",cls);
  m.setAttribute("tabindex",inW&&nowOpen&&!used&&!giftLock?"0":"-1");
  m.setAttribute("role","button");
  m.setAttribute("aria-label",P.n);
  const nm=m.querySelector(".num"),lb=m.querySelector(".lbl");
  if(nm)nm.textContent=numOf[id]||"";
  if(lb)lb.textContent=(numOf[id]?numOf[id]+". ":"")+P.n;

 });
 queueThin();
 miniPaint();
}

  else if(inW&&!nowOpen&&run.ghadi===0){
   why="पहली घड़ी कथा की है, और इस वक़्त कथा किसी और जगह चल रही है। वह पूरी होते ही यह जगह खुल जाएगी।";
   word="दूसरी घड़ी में";}
  else if(inW&&!nowOpen){why="यह जगह पहली घड़ी की थी, और वह बीत चुकी है।";word="वह घड़ी बीत गई";}

   word=(function(){let seen=false;run.N.watches.forEach((w0,i0)=>{const k0=run.N.id+"-"+id+"-"+i0;
    if(SC[k0]&&depthOf(k0)>0)seen=true;});return seen?"यहाँ हो आए":"इस घड़ी बंद";})();}

 }
 sheet.innerHTML='<div><b>'+(numOf[id]?numOf[id]+". ":"")+P.n+"</b><span>"+P.t+"</span>"+
