 dadhimukh:{n:"दधिमुख",x:"सुग्रीव के संरक्षित बाग़ मधुवन का रखवाला, रिश्ते में उन्हीं का। लौटती टोली ने बिना पूछे शहद पिया, फल तोड़े और रोकने आए रखवालों को धकेल दिया, तो वह सीधे किष्किंधा दौड़ा। उसकी शिकायत ही वह पहली ख़बर बनी जिससे सुग्रीव को पता चला कि सीता मिल गई हैं। सज़ा की जगह उसे समझाकर लौटा दिया गया।",on:["dadhimukh","madhuvan"]},
 akshaya:{n:"अक्षकुमार",x:"रावण का छोटा बेटा, जिसे किंकरों, चैत्य महल के रखवालों, जंबुमाली, मंत्री के सात बेटों और पाँच सेनापतियों के बाद भेजा गया। वह रथ पर आया और पहले बाणों से घेरा। वाल्मीकि कहते हैं कि आख़िर में उसे पैरों से पकड़कर घुमाया गया और ज़मीन पर पटक दिया गया, रथ, सारथी और घोड़े समेत। उसकी उम्र का ज़िक्र करके कवि यह भी कहता है कि वह पीछे नहीं हटा।",on:["akshay"]},
 indrajit:{n:"इंद्रजित",x:"रावण का बड़ा बेटा, जिसका नाम ही इंद्र को हराने से पड़ा। उसके बाण काम नहीं आए, तब उसने ब्रह्मास्त्र चलाया और वही बाँध सका। हनुमान चाहते तो छूट सकते थे, पर ब्रह्मा की मर्यादा रखकर चुप पड़े रहे, क्योंकि बँधकर ही रावण तक पहुँचा जा सकता था। आगे राक्षसों ने रस्सियाँ भी बाँध दीं और ब्रह्मास्त्र का बंधन अपने आप छूट गया, क्योंकि वह दूसरे बंधन के साथ नहीं ठहरता।",on:["brahmastra"]},
 ravan:{n:"रावण",x:"लंका का राजा, जिसने यह नगरी कुबेर से छीनी थी और उसी के साथ शाप भी पाया। ब्रह्मा से उसने मनुष्य को छोड़कर सबसे अभय माँगा था, और एक रोक भी साथ लगी कि जो स्त्री अपनी मर्ज़ी से न आए उसे वह छू नहीं सकता। इसीलिए वाटिका में वह मनाता है, अवधि देता है, धमकाता है, पर हाथ नहीं लगाता। दरबार में बँधे हुए दूत को देखकर भी वह उसे मारने का हुक्म देता है, और विभीषण की एक बात से वह हुक्म बदल जाता है।",on:["avadhi","manas_sabha"]},
 kinkar:{n:"किंकर टोली",x:"रावण की भेजी पहली टोली, गिनती अस्सी हज़ार, बड़े पेट और लंबे दाँतों वाले। हनुमान के पास कोई हथियार नहीं था, इसलिए उन्होंने फाटक के मेहराब से ही लोहे का डंडा उखाड़ लिया। इस टोली के बाद रावण ने एक एक करके नाम वाले योद्धा भेजे, और कथा इसी क्रम से बताती है कि लंका को समझने में कितनी देर लगी।",on:["kinkar"]},
 lankadevi:{n:"लंका देवी",x:"अध्यात्म रामायण में द्वार पर रोकने वाली का यही नाम है, और वहाँ वह पहले से जानती हैं कि जनक के घर जन्मी योगमाया हैं। हारकर वही हनुमान को रास्ता बताती हैं: वाटिका के बीच एक शिंशपा पेड़ है, उसी के नीचे जानकी बैठी हैं। यानी जिसे ढूँढा जा रहा है, उसके बारे में पहला पक्का संकेत दुश्मन की तरफ़ से मिलता है।",on:["adhy_sita"]},
 chamundi:{n:"चामुंडी",x:"बांग्ला की कृत्तिवासी रामायण में फाटक पर रोकने वाली का नाम लंकिनी नहीं, चामुंडी है। हनुमान उससे भिड़ते हैं और तभी भीतर जाते हैं। उसी कथा में आगे एक ऋषि का वरदान भी आता है। नाम बदलने से दृश्य वही रहता है, पर उसका रंग बदल जाता है।",on:["kritti_lanka"]},
 lankalakshmi:{n:"लंका लक्ष्मी",x:"मलयालम की किलिप्पाट्टु में उसी जगह खड़ी रक्षिका का नाम लंका लक्ष्मी है, और उस पूरे खंड का नाम ही है लंका लक्ष्मी मोक्षम्, यानी उसका छूटना। वहाँ यह हार नहीं, मुक्ति मानी जाती है। एक ही पल, और चार कथाओं में चार नाम।",on:["ezhu_vatika"]},
 sahasramukh:{n:"हज़ार मुँह वाला रावण",x:"अद्भुत रामायण में लंका की लड़ाई के बाद एक और रावण सामने आता है, जिसके हज़ार मुँह हैं। वह राम और लक्ष्मण को माया में बाँध देता है। तब सीता आगे बढ़ती हैं, अपना मनुष्य रूप छोड़कर महाकाली का रूप लेती हैं और पल भर में उसके हज़ार सिर काट देती हैं। बाद में ब्रह्मा राम को समझाते हैं कि जो कुछ होता है, शक्ति के साथ ही होता है।",on:["adbhuta_sita"]},
 fatak_devi:{n:"फाटक की देवी",x:"विलंका के फाटक पर बैठी वह देवी, जिसका नियम यह है कि जो शत्रु आए उसे पीने को दिया जाए। वह मुस्कुराकर पानी देती है, और पीते ही पैर लड़खड़ा जाते हैं। लंका के द्वार पर जो रक्षिका लड़कर हारी थी, उसकी जगह यहाँ कोई लड़ती ही नहीं, और फिर भी यह हार सबसे लंबी है, क्योंकि उसके बाद छह महीने बीतते हैं।",on:["v_chhah"]},
 kambu:{n:"कम्बु",x:"विलंका का वह असुर जो ब्राह्मण का वेश धरकर आता है और भीख माँगने के बहाने राम को ही उठा ले जाता है। यह वही चाल है जो हरण के वक़्त चली गई थी, और कथा इसे दोहराकर याद दिलाती है कि छल हर बार वेश बदलकर आता है। हनुमान उन्हें छुड़ाते हैं, और उसी रात विलंका जलती है।",on:["v_kambu_card"]},
 mangala:{n:"देवी मंगला",x:"ओड़िया परंपरा की वह देवी जो अंत से ठीक पहले सामने आती हैं और सीता को फूलों का धनुष देती हैं। हथियार देने वाली देवी यहाँ लोहे का नहीं, फूल का धनुष देती हैं, और यही इस कथा का सबसे बड़ा उलटफेर है।",on:["v_phool"]},
 patal_ravan:{n:"पाताल का रावण",x:"विलंका का राजा, जिसके हज़ार सिर हैं। वह लड़ता नहीं, सिर्फ़ ताली बजाता है और सेना बिखर जाती है। कोई अस्त्र उस पर नहीं चलता, और आख़िर में देवता ही कहते हैं कि इसे मारने के लिए सीता चाहिए। मरते हुए वह क्षमा माँगता है, और यही उसे लंका वाले रावण से अलग करता है।",on:["v_taali","v_kshama"]},
 surekha:{n:"सुरेखा",x:"ओड़िया की विलंका रामायण में पाताल की दूसरी लंका की असुरी। वह माया का रूप धरकर सामने आती है और पहचानने से पहले ही हनुमान को निगल लेती है, फिर हज़ार सिर वाले रावण के सामने उगल देती है। पूरा दरबार हँसता है, और छूटते ही वे रानियों के नाक कान काट देते हैं। हँसी वहीं ख़त्म हो जाती है।",on:["sarala_lanka"]}

/* ---------- the corner map: where in the whole you are standing ---------- */
const MINI=CAM(17.5,71.5,5.0,84.0);
const miniEl=document.getElementById("mini"),miniSvg=document.getElementById("minimap");
let miniVp=null;
function miniBuild(){
 if(!miniSvg)return;
 miniSvg.setAttribute("viewBox",MINI.map(n=>n.toFixed(2)).join(" "));
 miniSvg.innerHTML=
  '<path class="mland" d="'+LINE(COAST_IN)+' Z"/>'+
  '<path class="mland" d="'+LINE(COAST_LK)+' Z"/>'+
  '<path class="mshoal" d="'+LINE(BRIDGE_N)+" "+LINE(BRIDGE_S).replace("M","L")+' Z"/>'+
  '<path class="mcity" d="'+LINE(CITY)+' Z"/>'+
  '<g id="mdots"></g>'+
  '<rect class="mvp" x="0" y="0" width="10" height="10" rx="2"/>';
 miniVp=miniSvg.querySelector(".mvp");
 miniPaint();miniView();
}
function miniPaint(){
 if(!miniSvg)return;
 const box=miniSvg.querySelector("#mdots");if(!box)return;
 let g="";
 if(mode==="texts"){
  Object.keys(SRC).forEach(k=>{const S=SRC[k];if(!S.la)return;const q=PX(S.la,S.lo);
   const got=save.texts&&save.texts[k];
   g+='<circle class="mdot'+(got?" done":"")+(selText===k?" here":"")+'" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.4"/>';});
 }else{
  const W=run?run.N.watches[Math.min(run.w,run.N.watches.length-1)]:null;
  Object.keys(PLACES).forEach(id=>{
   const P=PLACES[id],live=W&&W.spots.includes(id);
   const key=run?run.N.id+"-"+id+"-"+run.w:"";
   const done=key&&SC[key]&&depthOf(key)>=layersOf(key).length;
   const here=run&&run.focus===id;
   if(!live&&!here&&!(run&&run.pickedHere.includes(id)))
    {g+='<circle class="mdot" cx="'+P.x.toFixed(1)+'" cy="'+P.y.toFixed(1)+'" r="2.4"/>';return;}
   g+='<circle class="mdot'+(here?" here":done?" done":" live")+'" cx="'+P.x.toFixed(1)+'" cy="'+P.y.toFixed(1)+'" r="'+(here?4.6:3.6)+'"/>';
  });
 }
 box.innerHTML=g;
}
let fullW=0,miniWant=null;
function fullWidth(){if(!fullW)fullW=fit(fitAll(),1.14)[2];return fullW;}
function miniAuto(){
 if(!miniEl)return;
 const need=cam[2]<fullWidth()*.45;      /* only when the whole is out of sight */
 if(!need&&miniWant!==null)miniWant=null;
 const open=miniWant===null?need:miniWant;
 miniEl.classList.toggle("shut",!open);
 const f=document.getElementById("miniFold");
 if(f)f.textContent=open?"छोटा करो":"नक्शा दिखाओ";
}
function miniView(){
 miniAuto();
 if(!miniVp)return;
 const x=Math.max(MINI[0],cam[0]),y=Math.max(MINI[1],cam[1]);
 const x2=Math.min(MINI[0]+MINI[2],cam[0]+cam[2]),y2=Math.min(MINI[1]+MINI[3],cam[1]+cam[3]);
 miniVp.setAttribute("x",x.toFixed(1));miniVp.setAttribute("y",y.toFixed(1));
 miniVp.setAttribute("width",Math.max(4,x2-x).toFixed(1));
 miniVp.setAttribute("height",Math.max(4,y2-y).toFixed(1));
}
function miniGo(e){
 const r=miniSvg.getBoundingClientRect();if(!r.width)return;
 const fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
 const px=MINI[0]+fx*MINI[2], py=MINI[1]+fy*MINI[3];
 const w=cam[2],h=w/aspect();
 shut();flyTo([px-w/2,py-h/2,w,h],1);
}
if(miniSvg){
 miniSvg.addEventListener("click",miniGo);
 miniSvg.addEventListener("pointerdown",e=>e.stopPropagation());
}
const miniFold=document.getElementById("miniFold");
if(miniFold)miniFold.onclick=()=>{miniWant=miniEl.classList.contains("shut");miniAuto();};

/* ---------- pan and zoom ---------- */
let ptr={},drag=null,pinch=null,moved=0,capId=null,justDragged=false;
function letGo(){if(capId!==null){try{stage.releasePointerCapture(capId);}catch(_){}capId=null;}}
function toWorld(e){const r=stage.getBoundingClientRect();
 return [cam[0]+(e.clientX-r.left)/r.width*cam[2],cam[1]+(e.clientY-r.top)/r.height*cam[3]];}
stage.addEventListener("pointerdown",e=>{if(e.target.closest(".sheet,.dio,.chip,.fold"))return;
 ptr[e.pointerId]=e;
 const k=Object.keys(ptr);
 if(k.length===1){anim++;drag={x:e.clientX,y:e.clientY,cam:cam.slice()};moved=0;}
 else if(k.length===2){const a=ptr[k[0]],b=ptr[k[1]];
  pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),cam:cam.slice()};drag=null;
  try{stage.setPointerCapture(e.pointerId);capId=e.pointerId;}catch(_){}}
});
stage.addEventListener("pointermove",e=>{
 if(!(e.pointerId in ptr))return;ptr[e.pointerId]=e;
 const k=Object.keys(ptr),r=stage.getBoundingClientRect();
 if(pinch&&k.length===2){const a=ptr[k[0]],b=ptr[k[1]];
  const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  const f=Math.max(.25,Math.min(4,pinch.d/d));
  const mx=(a.clientX+b.clientX)/2-r.left, my=(a.clientY+b.clientY)/2-r.top;
  const px=pinch.cam[0]+mx/r.width*pinch.cam[2], py=pinch.cam[1]+my/r.height*pinch.cam[3];
  const w=pinch.cam[2]*f,h=w/aspect();
  apply(clamp([px-(mx/r.width)*w,py-(my/r.height)*h,w,h]));return;}
 if(drag){
  moved=Math.max(moved,Math.hypot(e.clientX-drag.x,e.clientY-drag.y));
  if(moved<6)return;                     /* a small wobble is a tap, not a drag */
  if(capId===null){try{stage.setPointerCapture(e.pointerId);capId=e.pointerId;}catch(_){}svg.classList.add("drag");}
  const dx=(e.clientX-drag.x)/r.width*drag.cam[2],dy=(e.clientY-drag.y)/r.height*drag.cam[3];
  apply(clamp([drag.cam[0]-dx,drag.cam[1]-dy,drag.cam[2],drag.cam[3]]));}
});
["pointerup","pointercancel","pointerleave"].forEach(t=>stage.addEventListener(t,e=>{

function paint(){

 Object.keys(PLACES).forEach(id=>{
  const m=marks[id],P=PLACES[id];if(!m)return;
  const inW=W&&W.spots.includes(id);
  const giftLock=false;
  const used=run&&run.pickedHere.includes(id);
  const key=run?run.N.id+"-"+id+"-"+run.w:"";
  const d=key&&SC[key]?depthOf(key):0, tot=key&&SC[key]?layersOf(key).length:0;
  const keyF=run?run.N.id+"-"+id+"-"+run.w:"";
  const totF=keyF&&SC[keyF]?layersOf(keyF).length:0;
  const dF=keyF?depthOf(keyF):0;
  let flag="";
  if(dF>0)flag=dF>=totF?" f-done":" f-part";
  let cls="mk"+flag;
  if(!inW)cls+=" hide";
  else if(giftLock)cls+=" giftlock";
  else if(used)cls+=(run&&run.focus===id?" live here":" used");
  else{cls+=" live"+(d>0&&d>=tot?" full":d>0?" part":"")+(P.gift?" gift":"");n++;numOf[id]=n;}
  m.setAttribute("class",cls);

  if(nm)nm.textContent=numOf[id]||"";

 });

  else if(giftLock){why="यह जगह अभी बंद है, आगे खुलेगी।";word="अभी बंद है";}
  else if(used){why="इस घड़ी तुम यहाँ हो आए। यही पल किसी और ग्रंथ में पढ़ना हो तो कथा वाले पन्ने पर उसका बटन है।";word="यहाँ हो आए";}

   word=(function(){let seen=false;run.N.watches.forEach((w0,i0)=>{const k0=run.N.id+"-"+id+"-"+i0;
    if(SC[k0]&&depthOf(k0)>0)seen=true;});return seen?"यहाँ हो आए":"इस घड़ी बंद";})();}
  else if(left<=0){why="इस घड़ी की तुम्हारी चुनी हुई जगह हो चुकी। कथा वाले पन्ने पर वक़्त आगे बढ़ाओ, अगली घड़ी में यह जगह खुल सकती है।";word="इस घड़ी और नहीं";}
  else{why="अभी यहाँ नहीं जाया जा सकता।";word="अभी बंद है";}
 }
 sheet.innerHTML='<div><b>'+(numOf[id]?numOf[id]+". ":"")+P.n+"</b><span>"+P.t+"</span>"+
  (prog?"<span>"+prog+"</span>":"")+(why?'<span class="whyline">'+why+"</span>":"")+"</div>";
 const go=btn(word,"go"+(goNow?"":" shut"),goNow?()=>visit(id):()=>note(why));
 sheet.appendChild(go);
 if(!goNow&&run&&!here){
  /* wherever you have already read something, going back is free */
  let backW=-1;
  run.N.watches.forEach((w0,i0)=>{
   const k0=run.N.id+"-"+id+"-"+i0;
   if(SC[k0]&&depthOf(k0)>0)backW=i0;
  });
  const key0=run.N.id+"-"+id+"-"+run.w;
  const seenAll=SC[key0]&&depthOf(key0)>=layersOf(key0).length;
  if(backW>=0)
   sheet.appendChild(btn("फिर से देखो","go ghost",()=>backTo(id,backW)));
  if(inW&&!seenAll&&backW!==run.w&&left<=0&&purse()>=MANI_JAGAH)
   sheet.appendChild(btn(MANI_JAGAH+" मणि देकर अभी जाओ","go ghost",()=>{
    if(!spend(MANI_JAGAH)){note("इतनी मणि नहीं हैं।");return;}
    run.used--;visit(id);}));

 const span=Math.max(3.2,Math.min(cam[2]*.8,9));

}

/* ---------- flow ---------- */
function hud(){
 if(tally)tally.innerHTML='<span class="myname">'+myName()+'</span>'+
  '<span class="tinybar" title="कुल प्रगति"><i style="width:'+Math.round(progress()*100)+'%"></i></span>'+
  '<span class="coin">'+purse()+" मणि</span>";
 const lamp=document.getElementById("lamp");
 if(lamp){const r=readyCount()+(bhentReady()?1:0);lamp.hidden=!r;
  lamp.textContent=r>1?r+" इनाम तैयार":(readyCount()?"इनाम तैयार":"प्रहर की भेंट");}
 if(!run){nowLbl.textContent="शुरुआत";pips.innerHTML="";return;}
 const i=Math.min(run.w,run.N.watches.length-1);
 nowLbl.textContent=run.N.name+(run.w>=run.N.watches.length?"":", "+run.N.watches[i].n);
 pips.innerHTML=run.N.watches.map((w,j)=>'<span class="pip '+(j<run.w?"past":j===run.w?"now":"")+'"></span>').join("");
}
function start(id){
 const N=NIGHTS.find(n=>n.id===id);
 save.nights[id]=(save.nights[id]||0)+1;persist();
 if(mode==="texts")storyMap();
 run={N,w:0,went:[],lost:[],gone:[],used:0,pickedHere:[],busy:false,path:[]};
 story.innerHTML="";curStep=null;dropAnchor();story.scrollTo({top:0});shut();
 step("");
 el('<h2>'+N.name+"</h2>");
 el('<p class="quiet">'+N.about+"</p>");
 anchorFrom(0);            /* this night begins at its own first line */
 build();weather();turn();
}
function turn(){
 if(run.w>=run.N.watches.length)return dawn();
 const at=markPoint();
 step(run.N.watches[run.w].n);
 run.used=0;run.pickedHere=[];run.busy=false;run.focus=null;stage.classList.remove("focus");hideDio();
 hud();paint();weather();flyTo(watchBox());
 drawTrail();
 offer();
 anchorFrom(at);
}
function freshAt(id,w){                  /* is anything still unread there in this watch */
 const key=run.N.id+"-"+id+"-"+(w===undefined?run.w:w);
 if(!SC[key])return 0;
 return Math.max(0,layersOf(key).length-depthOf(key));
}
function offer(only){
 const at=markPoint();
 const W=run.N.watches[run.w];
 let open=W.spots.filter(x=>!run.pickedHere.includes(x));
 if(only==="fresh")open=open.filter(x=>freshAt(x)>0);
 if(only==="seen")open=open.filter(x=>freshAt(x)===0);
 const left=(twoVisits()?2:1)-run.used;
 if(only==="seen")
  el('<p class="quiet">ये जगहें तुम पहले ही पूरी पढ़ चुके हो।</p>');
 else if(only==="fresh")
  el('<p class="quiet">इन जगहों पर कुछ बचा हुआ है।</p>');
 else{
  }
 el('<p class="ask">अब कहाँ जाओगे?</p>');
 const f=el("","fork");
 open.forEach(id=>{
  const nf=freshAt(id);
  const b=document.createElement("button");
  b.className="card-pick"+(PLACES[id].gift?" gift":"");
  b.innerHTML='<span class="cp-no">'+(numOf[id]||"")+'</span><span class="cp-mid">'+
   '<b>'+PLACES[id].n+"</b><span>"+PLACES[id].t+"</span>"+
   '<span class="cp-left">'+(nf?nf+" रूप अभी बाकी":"यहाँ सब पढ़ा जा चुका")+"</span></span>"+
   '<span class="cp-go">जाओ</span>';
  b.onclick=()=>{f.remove();visit(id);};
  f.appendChild(b);
 });
 anchorFrom(at);
}
function visit(id){
 if(quizLocked()){lockNote();return;}
 if(!run){note("अभी कोई रात चल नहीं रही। कथा वाले पन्ने पर कोई हिस्सा चुनो।");return;}
 if(run.busy)return;
 if(run.pickedHere.includes(id)){note("इस घड़ी तुम "+PLACES[id].n+" हो आए।");return;}
 if((twoVisits()?2:1)-run.used<=0){
  note("इस घड़ी तुम्हारी चुनी हुई जगह हो चुकी। कथा वाले पन्ने पर वक़्त आगे बढ़ाओ।");return;}
 if(!run.N.watches[run.w]||!run.N.watches[run.w].spots.includes(id)){
  note("इस घड़ी "+PLACES[id].n+" में कुछ नहीं हो रहा।");return;}
 run.busy=true;shut();
 story.querySelectorAll(".fork").forEach(x=>x.remove());
 const at=markPoint();
 stepClear();
 stepRename(run.N.watches[run.w].n+", "+PLACES[id].n);
 const W=run.N.watches[run.w],key=run.N.id+"-"+id+"-"+run.w;
 const L=layersOf(key),d=Math.min(depthOf(key),L.length-1),S=L[d];
 didAct();
 run.path.push({id:id,w:run.w});
 run.pickedHere.push(id);run.used++;run.went.push(PLACES[id].n);run.focus=id;
 paint();
 const near=Math.max(.5,Math.min(cam[2]*.28,1.4));
 flyTo(around(id,Math.min(cam[2]*1.15,cam[2]+2)),1);
 setTimeout(()=>flyTo(around(id,near),1),260);
 stage.classList.add("focus");
 arrive(id);showDio(id);
 el('<p class="chose">तुम '+PLACES[id].n+" की ओर गए।</p>");
 const cut=splitSay(S.say);
 say(cut.story);
 el('<p class="w-src">'+SRC[S.src||"vr"].n+"</p>");
 aboutStrip(SRC[S.src||"vr"].n,cut.about);
 earned=[];
 save.texts=save.texts||{};
 const src0=S.src||"vr";
 if(!save.texts[src0]){save.texts[src0]=true;earn(5,"granth",SRC[src0].n);}
 const sceneTxt=(S.say||[]).join(" ");
 const hereSrc={};L.forEach(x=>{hereSrc[x.src||"vr"]=1;});
 (S.cards||[]).forEach(c=>{if(!save.cards[c]){save.cards[c]=true;earn(2,"baat");
  const C=CARDS[c];
  if(echoes(sceneTxt,C.x)){
   el('<p class="tucked">पोथी में जुड़ी: '+C.t+" ("+(L[C.l]||"बातें")+")</p>");return;}
  if(C.l==="gr"&&hereSrc[C.s])return;             /* that text is one tap away, no need to tease */
  foundBox(c,"एक बात मिली");}});
 if(depthOf(key)<d+1)earn(1,"roop");
 save.seen[key]=true;save.depth[key]=d+1;
 tally_up();gainNote();
 const readIdx=L.map((x,i)=>i).filter(i=>depthOf(key)>i||i===d);
 if(readIdx.length>1){
  const rf0=el("","fork");
  rf0.appendChild(btn("इन दोनों को आमने सामने रखो: "+SRC[L[readIdx[0]].src||"vr"].n+" और "+
   SRC[L[readIdx[1]].src||"vr"].n,"do",()=>sideBySide(id,run.w,readIdx[0],readIdx[1])));
 }
 const others=L.map((x,i)=>({x:x,i:i})).filter(o=>o.i!==d);
 if(others.length){
  const rf=el("","fork");
  others.forEach(o=>{
   const nm=SRC[o.x.src||"vr"].n;
   const read=depthOf(key)>o.i;
   const hint=(o.x.cards||[]).map(c=>CARDS[c]).find(C=>C&&C.l==="gr");
   const b=document.createElement("button");
   b.className="do read"+(read?" seen":"");
   b.innerHTML="यही पल "+nm+" में पढ़ो"+(read?" (पढ़ा हुआ)":"")+
    (hint?'<span class="hint">'+hint.t+"</span>":"");
   b.onclick=()=>openReader(id,run.w,o.i);
   rf.appendChild(b);
  });
 }
 run.busy=false;paint();
 const rest=W.spots.filter(x=>!run.pickedHere.includes(x));
 const freshRest=rest.filter(x=>freshAt(x)>0).length, seenRest=rest.length-freshRest;
 const more=(twoVisits()?2:1)-run.used>0&&rest.length>0;
 el('<p class="ask">अब क्या करोगे?</p>');
 const f=el("","fork");
 if(more)f.appendChild(btn("इसी घड़ी एक और जगह देखो","do",()=>{f.remove();offer();}));
 f.appendChild(btn("वक़्त आगे बढ़ाओ","do go",()=>{f.remove();
  const at2=markPoint();
  const missedIds=W.spots.filter(x=>!run.pickedHere.includes(x));
  const thread=missedIds.filter(x=>SPINE[run.N.id+"-"+x+"-"+run.w]);
  thread.forEach(x=>{run.gone=run.gone||[];run.gone.push(run.N.id+"-"+x+"-"+run.w);});
  const missed=missedIds.filter(x=>!SPINE[run.N.id+"-"+x+"-"+run.w]).map(x=>PLACES[x].n);
  if(missed.length)run.lost=run.lost.concat(missed);
  if(missedIds.length)elsewhere(thread,missed,run.w);
  run.focus=null;stage.classList.remove("focus");hideDio();run.w++;turn();anchorFrom(at2);}));
 anchorFrom(at);
}

function tellers(id){
 if(!run)return "";
 const key=run.N.id+"-"+id+"-"+run.w;
 if(!SC[key])return "";
 const L=layersOf(key);
 const bits=L.map(x=>{
  const k=x.src||"vr",nm=SRC[k].n;
  const c=(x.cards||[]).find(c=>CARDS[c]&&CARDS[c].s===k&&CARDS[c].ref);
  return nm+(c?" ("+CARDS[c].ref.split(";")[0].trim()+")":"");
 });
 return L.length>1?"इस पल को "+L.length+" ग्रंथ कहते हैं: "+bits.join(", ")
                  :"यह पल "+bits[0]+" से है";
}
function lines(a){
 const out=a.filter(Boolean).map(t=>String(t).trim().replace(/।+$/,"").trim()).filter(Boolean);
 return out.length?out.join("। ")+"।":"";
}
function keyNow(id){return run?run.N.id+"-"+id+"-"+run.w:"";}
function artFor(id){const k=keyNow(id);return (k&&DIOK[k])||DIO[id];}
function lightNote(id){
 const a=artFor(id),src=a?String(a):"";
 if(src.indexOf("D.presence")>-1||src.indexOf("D.glowin")>-1)
  return "जो दीया और रोशनी दिख रही है, वह उनकी जगह रखी गई है, क्योंकि इस खेल में राम, सीता और हनुमान का रूप नहीं बनाया गया";
 if(src.indexOf("D.flyer")>-1)
  return "आसमान पार करती रोशनी हनुमान की जगह है, क्योंकि इस खेल में उनका रूप नहीं बनाया गया";
 return "";
}
function showDio(id){
 const P=PLACES[id],k=keyNow(id);
 paintDio(P.n,artFor(id),lines([P.t,(k&&SEENK[k])||SEEN[id],lightNote(id),tellers(id)]));
}
function showHomeDio(k){
 const S=SRC[k];if(!S)return;
 const env=HOMEOF[k]||"ashram";
 const bits=[HOMEN[env],[S.who,S.lang,S.when].filter(Boolean).join(", ")];
 if(S.where)bits.push("यह ग्रंथ यहाँ रचा गया माना जाता है: "+S.where);
 paintDio(S.n,DIOT[env],lines(bits));
}
function paintDio(name,art,note){
 const box=document.getElementById("dio");if(!box)return;
 if(!art){box.className="dio";box.innerHTML="";return;}
 box.innerHTML='<div class="diopic"><svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet" aria-label="'+name+'">'+
  DEFS+art()+"</svg></div>"+
  '<div class="diobar"><b>'+name+'</b><span class="diobtns">'+
  (note?'<button class="diox" data-note>'+(dioNote?"ब्योरा बंद":"ब्योरा")+"</button>":"")+
  '<button class="diox" data-big>'+(dioBig?"छोटा":"बड़ा")+'</button>'+
  '<button class="diox" data-shut>बंद</button></span></div>'+
  (note?'<p class="dionote"'+(dioNote?"":" hidden")+">"+note+"</p>":"");
 box.className="dio open"+(dioBig?" big":"");
 const nb=box.querySelector("[data-note]"),np=box.querySelector(".dionote");
 if(nb)nb.onclick=()=>{dioNote=!dioNote;
  if(np){np.hidden=!dioNote;np.scrollTop=0;}
  nb.textContent=dioNote?"ब्योरा बंद":"ब्योरा";};
 const big=box.querySelector("[data-big]");
 if(big)big.onclick=()=>{dioBig=!dioBig;
  if(dioBig&&!dioNote&&np){dioNote=true;np.hidden=false;if(nb)nb.textContent="ब्योरा बंद";}
  box.className="dio open"+(dioBig?" big":"");
  big.textContent=dioBig?"छोटा":"बड़ा";};
 const x=box.querySelector("[data-shut]");if(x)x.onclick=hideDio;
}
function hideDio(){const box=document.getElementById("dio");if(box){box.className="dio";box.innerHTML="";}}

  const id=key.slice(pre.length,cut),w=+key.slice(cut+1);

   const src=SRC[S.src||"vr"];
   const card=(S.cards||[]).find(c=>CARDS[c]&&CARDS[c].ref);
   rows.push({w:w.n,p:PLACES[id].n,line:line,src:src.n,

/* the moments of this night you have not read yet */
function missedList(){
 if(!run)return [];
 const out=[];
 run.N.watches.forEach((w,i)=>{
  w.spots.forEach(id=>{
   const key=run.N.id+"-"+id+"-"+i;if(!SC[key])return;
   const L=layersOf(key),d=depthOf(key);
   for(let li=d;li<L.length;li++)
    out.push({id:id,w:i,li:li,p:PLACES[id].n,w_n:run.N.watches[i].n,
              src:SRC[L[li].src||"vr"].n});
  });
 });
 return out.slice(0,8);
}
function whereFound(c){                  /* which moment holds this find */
 let out="";
 Object.keys(SC).forEach(k=>{
  if(out)return;
  layersOf(k).forEach(L=>{
   if(out||!(L.cards||[]).includes(c))return;
   const cut=k.lastIndexOf("-"),night=k.slice(0,k.indexOf("-"));
   const id=k.slice(night.length+1,cut),w=+k.slice(cut+1);
   const N=NIGHTS.find(n=>n.id===night);
   if(N&&PLACES[id])out=PLACES[id].n+", "+N.watches[w].n;
  });
 });
 return out;
}

 Object.keys(PLACES).forEach(id=>{const P=PLACES[id];
  if((P.n+" "+P.t+" "+(P.lore||"")).indexOf(q)>-1)hit.push({k:"जगह",n:P.n,go:()=>deepPlace(id)});});
 Object.keys(SRC).forEach(k=>{const S=SRC[k];
  if((S.n+" "+(S.lore||"")+" "+(S.who||"")+" "+(S.lang||"")).indexOf(q)>-1)
   hit.push({k:"ग्रंथ",n:S.n,go:()=>deepGranth(k)});});
 if(!hit.length){box.innerHTML='<p class="shut-note">कुछ नहीं मिला। हो सकता है वह बात अभी खुली न हो।</p>';return;}
 box.innerHTML='<p class="shut-note">'+hit.length+" मिलीं</p>"+
  hit.slice(0,40).map((h,i)=>'<div class="note tapme" data-hit="'+i+'"><div class="who">'+h.n+
   '</div><span class="vkind">'+h.k+'</span><span class="more">पूरा पढ़ो</span></div>').join("");
 box.querySelectorAll("[data-hit]").forEach(b=>{b.onclick=()=>hit[+b.dataset.hit].go();});
}
function fill(){
 pothi.innerHTML="";
 const tb=document.createElement("div");tb.className="tabs";pothi.appendChild(tb);
 Object.keys(L).forEach(k=>tb.appendChild(btn(L[k],"tab"+(tab===k?" on":""),()=>{tab=k;fill();pothi.scrollTop=0;})));
 tb.appendChild(btn("जगहें","tab"+(tab==="places"?" on":""),()=>{tab="places";fill();pothi.scrollTop=0;}));
 tb.appendChild(btn("फ़र्क़","tab"+(tab==="farq"?" on":"")+"",()=>{tab="farq";fill();pothi.scrollTop=0;}));
 tb.appendChild(btn("स्रोत","tab"+(tab==="src"?" on":""),()=>{tab="src";fill();pothi.scrollTop=0;}));
 tb.appendChild(btn("खोजो","tab"+(tab==="find"?" on":""),()=>{tab="find";fill();pothi.scrollTop=0;}));
 const body=document.createElement("div");pothi.appendChild(body);
 let out="";
 if(tab==="find"){
  out+='<p class="shut-note">जो भी याद हो उसका एक शब्द लिखो: किसी बात का, पात्र का, जगह का, ग्रंथ का या संग्रह की चीज़ का।</p>';
  out+='<input class="findbox" id="findbox" type="text" placeholder="जैसे: गरुड़, मैनाक, वाटिका, ब्रह्मास्त्र" value="'+(findQ||"")+'">';
  out+='<div id="findout"></div>';
 }else if(tab==="places"){
  NIGHTS.forEach(N=>{
   out+="<h3>"+N.name+"</h3>";
   N.watches.forEach((w,i)=>{
    const rows=w.spots.map(s=>{const k=N.id+"-"+s+"-"+i;const t=SC[k]?layersOf(k).length:1;const d=depthOf(k);
      return '<button class="link" data-place="'+s+'">'+PLACES[s].n+"</button> ("+t+" में से "+Math.min(d,t)+" रूप)";}).join(", ");
    out+='<p class="shut-note">'+w.n+": "+rows+"</p>";
   });
  });
 }else if(tab==="farq"){
  out+='<p class="shut-note">एक ही पल, अलग अलग ग्रंथ।</p>';
  FARQ.forEach(F=>{
   out+='<h2 class="tapme" data-farq="'+FARQ.indexOf(F)+'">'+F.q+' <span class="more">पूरा पढ़ो</span></h2>';
   F.rows.forEach(r=>{
    const [k,t,card]=r,got=!!save.cards[card]||!!(save.farq&&save.farq[FARQ.indexOf(F)]);
    out+='<p class="'+(got?"note-got":"note-shut")+'"><b>'+SRC[k].n+":</b> "+
      (got?t:"अभी बंद। यह बात "+SRC[k].n+" वाले किसी पल में खुलेगी।")+"</p>";
   });
  });
 }else if(tab==="src"){
  const pal=Object.keys(SRC).filter(k=>SRC[k].level!=="granth");
  const gr=Object.keys(SRC).filter(k=>SRC[k].level==="granth");
  out+="<h2>समय के बारे में</h2>";
  out+='<p class="shut-note">जो ग्रंथ से है: वाल्मीकि में वे सूरज डूबने का इंतज़ार करते हैं, फिर साँझ ढलते ही बिल्ली जितने छोटे होकर नगर में घुसते हैं (सर्ग 2)। खोज पूरी रात चलती है (सर्ग 4 से 13)। रावण वाटिका में रात के आख़िरी पहर में आता है (सर्ग 18)। बाग़ उजाड़ना, लड़ाई, दरबार और लंका दहन दिन में होते हैं (सर्ग 41 से 55)। लौटना उसके बाद।</p>';
  out+='<p class="shut-note">जो खेल की बनावट है: ग्रंथ एक समय में एक ही धागा कहते हैं, और कहीं यह नहीं लिखा कि इसी वक़्त फ़लाँ जगह क्या हो रहा था। किस घड़ी में कौन सी जगहें एक साथ रखी जाएँ, यह खेल ने तय किया है, ताकि एक ही रात को कई कोनों से देखा जा सके। हर पल अपनी जगह ग्रंथ में है, पर उनका आमने सामने होना खेल का जोड़ है।</p>';
  out+='<p class="shut-note">इस खेल में राम, सीता और हनुमान की आकृति नहीं बनाई गई। उनकी जगह रोशनी, दीया और फूल हैं।</p>';
  out+='<p class="shut-note">हवाला सर्ग, दोहा या अध्याय तक मिलाया गया है।</p>';
  pal.forEach(k=>{
   const S=SRC[k];
   out+='<div class="note"><div class="who">'+S.n+"</div>"+
    '<div class="from">'+[S.who,S.lang,S.when].filter(Boolean).join(", ")+"</div>"+
    '<div class="from">'+(S.u?"खुली प्रति मौजूद है":S.pr?"छपी प्रति: "+S.pr:"छपी प्रति से मिलाया गया")+"</div>"+"</div>";
  });
  if(gr.length) out+='<p class="shut-note">इनमें अभी बनावट तक मिलान हुआ है।</p>';
  gr.forEach(k=>{
   const S=SRC[k];
   out+='<div class="note"><div class="who">'+S.n+"</div>"+
    '<div class="from">'+[S.who,S.lang,S.when].filter(Boolean).join(", ")+"</div>"+
    '<div class="from">'+(S.u?"खुली प्रति मौजूद है":S.pr?"छपी प्रति: "+S.pr:"छपी प्रति से मिलाया गया")+"</div>"+"</div>";
  });
 }else{
  const ids=Object.keys(CARDS).filter(c=>CARDS[c].l===tab);
  const mine=ids.filter(c=>save.cards[c]);
  out+='<p class="shut-note">'+L[tab]+": "+ids.length+" में से "+mine.length+"</p>";
  mine.forEach(c=>{
   const C=CARDS[c],w=whereFound(c);
   out+='<div class="note tapme" data-card="'+c+'"><div class="who">'+C.t+'</div><p style="margin:.3rem 0 0">'+
    C.x.slice(0,110)+(C.x.length>110?"...":"")+'</p><span class="more">पूरा पढ़ो</span>'+
    (C.sl?'<div class="mool"><span class="mool-line">'+C.sl+'</span><span class="mool-arth">'+(C.slm||"")+"</span></div>":"")+
    (w?'<div class="from">यह यहाँ मिली: '+w+"</div>":"")+
    '<div class="from">'+SRC[C.s].n+(C.ref?", "+C.ref:", हवाला अभी मिलाया नहीं गया")+
    "</div></div>";
  });
  const left=ids.length-mine.length;
  if(left)out+='<p class="shut-note">'+left+" बातें अभी बंद हैं। वे उन्हीं पलों में खुलेंगी जहाँ वे छिपी हैं।</p>";
 }
 out+='<p class="shut-note"><button class="link" id="wipe">सब कुछ भूल जाओ</button></p>';
 body.innerHTML=out;
 body.querySelectorAll("[data-farq]").forEach(b=>{b.onclick=()=>deepFarq(+b.dataset.farq);});
 body.querySelectorAll("[data-card]").forEach(b=>{b.onclick=()=>deepCard(b.dataset.card);});
 body.querySelectorAll("[data-place]").forEach(b=>{b.onclick=()=>deepPlace(b.dataset.place);});
 const fb=document.getElementById("findbox");
 if(fb){
  fb.oninput=()=>{findQ=fb.value;drawFind();};
  drawFind();
 }
 const w=document.getElementById("wipe");
 if(w)w.onclick=()=>{
  if(w.dataset.sure!=="1"){w.dataset.sure="1";w.textContent="पक्का? दोबारा दबाओ";
   note("दोबारा दबाओगे तो सब कुछ मिट जाएगा।");
   setTimeout(()=>{if(w&&w.dataset.sure==="1"){w.dataset.sure="";w.textContent="सब कुछ भूल जाओ";}},6000);
   return;}
  save=blankSave();persist();closeCard();fill();front();showPanel("story");
  note("सब कुछ मिट गया। खेल फिर पहले दिन से शुरू है।");
 };
}

document.getElementById("pcardShut").onclick=closeCard;
document.getElementById("scrollShut").onclick=closeScroll;
document.getElementById("scrollPrint").onclick=()=>{
 document.body.classList.add("printing");
 note("छपाई का पन्ना खुल रहा है। पोथी वैसी ही छपेगी जैसी दिख रही है।");
 setTimeout(()=>{try{window.print();}catch(e){}
  setTimeout(()=>document.body.classList.remove("printing"),200);},60);
};
document.getElementById("deepShut").onclick=closeDeep;
document.getElementById("deepBack").onclick=closeDeep;
document.getElementById("scrollBack").onclick=closeScroll;
document.getElementById("scrollBtn").onclick=openScroll;
document.getElementById("pcardBack").onclick=closeCard;
document.getElementById("tally").onclick=openCard;
document.getElementById("lamp").onclick=()=>{
 const names=Object.keys(ACH).filter(k=>save.ach&&save.ach[k]==="ready").map(k=>ACH[k].n);
 const got=[];
 const n=claimAll();
 if(n)got.push(names.slice(0,2).join(", ")+(names.length>2?" और "+(names.length-2)+" और":"")+": +"+(n*5)+" मणि");
 if(bhentReady()&&takeBhent2())got.push("प्रहर की भेंट: +"+MANI_BHENT+" मणि");
 hud();
 note(got.length?got.join("। ")+"। थैली में "+purse()+"।":"अभी कुछ तैयार नहीं है।");
};
catchUp();foldLbl();tabs();showPanel("story");miniBuild();front();fitLater();
</script>
