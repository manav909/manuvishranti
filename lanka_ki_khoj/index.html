<!doctype html>
<html lang="hi" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="लंका की खोज: सुंदरकांड की एक रात, असली भूगोल के नक्शे पर।">
<title>लंका की खोज</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--page:#f0f2ed;--ink:#17222f;--quiet:#586a79;--rule:#c6cfc8;--tide:#236f68;--haldi:#9a6a09;--fire:#a5311f;
 --mark:#e2e8df;--sea:#9dc2d4;--sea2:#c4dce7;--land:#d9d2b4;--land2:#ece5cb;--wall:#8f7c50;--walldark:#6f6040;
 --rock:#bdb493;--rocklit:#d8d2b6;--grove:#95b487;--grovedark:#75996c;--street:#c6bda3;--roof:#c9b795;
 --roofdark:#a08e6d;--roofside:#b3a17f;--wave:#8fb4c4;--shade:#6f7d80;--shoal:#bcd8e0;--gone:#8b9aa1;
 --shell:#e3e7e0;--barbg:#e7ebe3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --page:#0d1520;--ink:#e9e1cd;--quiet:#94a3b2;--rule:#26364a;--tide:#5fb3aa;--haldi:#e0a93c;--fire:#e06a58;
 --mark:#16212f;--sea:#0b2033;--sea2:#123047;--land:#39432f;--land2:#4b553c;--wall:#9c8a5c;--walldark:#61553a;
 --rock:#5a6350;--rocklit:#79826a;--grove:#3f5a46;--grovedark:#2e4435;--street:#5a5340;--roof:#6b5f46;
 --roofdark:#413826;--roofside:#544936;--wave:#1d3d54;--shade:#050a10;--shoal:#16405a;--gone:#5d6c7a;
 --shell:#070c14;--barbg:#121d2b}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--shell);color:var(--ink);overflow:hidden;
 font-family:"Tiro Devanagari Hindi","Noto Serif Devanagari",serif;font-size:1.06rem;line-height:1.8}

/* ---- the shell: a bar on top, two panes below, each with its own scroll ---- */
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-height:100%;max-width:84rem;margin:0 auto;
 background:var(--page);box-shadow:0 0 0 1px var(--rule)}
#bar{flex:0 0 auto;display:flex;align-items:center;gap:.5rem;padding:.3rem .6rem;
 background:var(--barbg);border-bottom:1px solid var(--rule);min-height:2.6rem}
.brand{font-family:"Rozha One",serif;font-size:1.15rem;color:var(--haldi);white-space:nowrap}
.barmid{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:.5rem;justify-content:center}
.now{font-family:"Rozha One",serif;font-size:1rem;color:var(--ink);white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:.26rem;align-items:center;flex:0 0 auto}
.pip{width:.5rem;height:.5rem;border-radius:50%;background:var(--rule)}
.pip.past{background:var(--tide)}.pip.half{opacity:.72}
.pip.now{background:var(--haldi);box-shadow:0 0 0 3px rgba(154,106,9,.18)}
.tally{font-size:.82rem;color:var(--quiet);white-space:nowrap}
#board{flex:1 1 auto;min-height:0;display:grid;
 grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46%) minmax(0,1fr)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--page)}
#mapPane{border-bottom:1px solid var(--rule)}
.panehead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:.4rem;
 padding:.25rem .45rem;background:var(--barbg);border-bottom:1px solid var(--rule);overflow:hidden}
.headbtns{display:flex;gap:.3rem;align-items:center;flex-wrap:nowrap;overflow:hidden}
.chip{background:var(--page);border:1px solid var(--rule);border-radius:99px;padding:.16rem .7rem;
 font:inherit;font-size:.86rem;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--haldi)}
.chip.on{background:var(--tide);border-color:var(--tide);color:var(--page)}
.chip.sq{width:1.9rem;padding:0;text-align:center;font-size:1rem}
.fold{background:none;border:1px solid var(--rule);border-radius:99px;padding:.16rem .7rem;
 font:inherit;font-size:.86rem;color:var(--quiet);cursor:pointer;white-space:nowrap;flex:0 0 auto}
.fold:hover{color:var(--ink);border-color:var(--haldi)}
.fold b{font-weight:400;font-family:"Rozha One",serif;color:var(--haldi);font-size:.95rem}
#stage{position:relative;flex:1 1 auto;min-height:0;background:var(--sea);touch-action:none;overflow:hidden}
#map{display:block;width:100%;height:100%;cursor:grab}
#map.drag{cursor:grabbing}
.panebody{flex:1 1 auto;min-height:0;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;
 padding:1rem 1.1rem 2rem;-webkit-overflow-scrolling:touch}
.panel[hidden]{display:none}

/* ---- folded panes keep their bar, so nothing disappears ---- */
#app.mapmin #board{grid-template-rows:auto minmax(0,1fr)}
#app.mapmin #stage{display:none}
#app.mapmin #mapPane .headbtns{display:none}
#app.sidemin #board{grid-template-rows:minmax(0,1fr) auto}
#app.sidemin .panebody{display:none}
#app.sidemin #sidePane .headbtns{display:none}
@media (min-width:900px){
 #board{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 #mapPane{border-bottom:none;border-right:1px solid var(--rule)}
 #app.mapmin #board{grid-template-columns:2.9rem minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
 #app.mapmin #mapPane .panehead{writing-mode:vertical-rl;height:100%;justify-content:flex-start;
  padding:.6rem .25rem;border-bottom:none;border-right:1px solid var(--rule)}
 #app.sidemin #board{grid-template-columns:minmax(0,1fr) 2.9rem;grid-template-rows:minmax(0,1fr)}
 #app.sidemin #sidePane .panehead{writing-mode:vertical-rl;height:100%;justify-content:flex-start;
  padding:.6rem .25rem;border-bottom:none}
}

/* ---- things that sit on the map ---- */
/* ---- the journey strip under the map ---- */
.trail{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;gap:.35rem;align-items:center;
 padding:.35rem .5rem;overflow-x:auto;overflow-y:hidden;background:var(--barbg);
 border-top:1px solid var(--rule)}
.trail:empty{display:none}
.twatch{flex:0 0 auto;font-size:.74rem;color:var(--quiet);padding:0 .2rem;white-space:nowrap}
.tchip{flex:0 0 auto;display:flex;align-items:center;gap:.35rem;white-space:nowrap;cursor:pointer;
 background:var(--page);border:1px solid var(--rule);border-radius:99px;padding:.16rem .6rem;
 font:inherit;font-size:.82rem;color:var(--ink)}
.tchip:hover{border-color:var(--haldi)}
.tchip i{width:.5rem;height:.5rem;border-radius:50%;background:var(--rule);display:block}
.tchip.went i{background:var(--tide)}
.tchip.full i{background:#3f9d5a}
.tchip.now{border-color:var(--haldi);color:var(--haldi)}
.tmiss{flex:0 0 auto;font-size:.74rem;color:var(--quiet);white-space:nowrap;padding:0 .2rem;opacity:.8}
.mini{position:absolute;left:.5rem;top:.5rem;z-index:5;width:min(30%,7.6rem);
 background:var(--page);border:1px solid var(--rule);border-radius:.6rem;overflow:hidden;
 box-shadow:0 6px 18px rgba(0,0,0,.24)}
.mini.shut{width:auto}
.mini.shut #minimap{display:none}
#minimap{display:block;width:100%;height:auto;cursor:pointer;background:var(--sea)}
.minibar{display:flex;align-items:center;justify-content:space-between;gap:.4rem;
 padding:.1rem .45rem;border-top:1px solid var(--rule)}
.mini.shut .minibar{border-top:none}
.wx{font-size:.72rem;color:var(--quiet);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minix{background:none;border:none;font:inherit;font-size:.72rem;color:var(--tide);cursor:pointer;padding:0;white-space:nowrap}
.minix:hover{color:var(--haldi)}
#minimap .mland{fill:var(--land);stroke:var(--wall);stroke-width:.8}
#minimap .mshoal{fill:var(--shoal);opacity:.6}
#minimap .mcity{fill:none;stroke:var(--wall);stroke-width:1.4;opacity:.8}
#minimap .mdot{fill:var(--gone);opacity:.7}
#minimap .mdot.live{fill:var(--tide);opacity:1}
#minimap .mdot.done{fill:#3f9d5a;opacity:1}
#minimap .mdot.here{fill:var(--haldi)}
#minimap .mvp{fill:var(--haldi);fill-opacity:.12;stroke:var(--haldi);stroke-width:2.2;
 vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion:no-preference){
 #minimap .mdot.here{animation:hglow 3s ease-in-out infinite}
 @keyframes hglow{0%,100%{opacity:.7}50%{opacity:1}}
}
#wx .sky{pointer-events:none}
@media (prefers-reduced-motion:no-preference){
 .cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
 @keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(230px)}}
 .moon circle{animation:glow 6s ease-in-out infinite}
 @keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}
 .smoke ellipse{animation:rise 7s ease-in-out infinite}
 .smoke ellipse:nth-child(2){animation-delay:1.2s}
 .smoke ellipse:nth-child(3){animation-delay:2.4s}
 @keyframes rise{0%{transform:translateY(4px) scale(.85);opacity:.15}45%{opacity:.5}100%{transform:translateY(-14px) scale(1.25);opacity:0}}
 .wind path{stroke-dasharray:10 26;animation:gust 3.2s linear infinite}
 @keyframes gust{to{stroke-dashoffset:-36}}
 .mist ellipse{animation:sway 9s ease-in-out infinite}
 @keyframes sway{0%,100%{transform:translateX(-6px)}50%{transform:translateX(8px)}}
}
.sheet{position:absolute;left:.5rem;right:.5rem;bottom:3.1rem;background:var(--page);border:1px solid var(--rule);
 border-radius:.7rem;padding:.5rem .7rem;display:none;box-shadow:0 8px 22px rgba(0,0,0,.2);z-index:5}
.sheet.open{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sheet b{font-family:"Rozha One",serif;font-weight:400;font-size:1.05rem;display:block}
.sheet span{color:var(--quiet);font-size:.9rem;display:block;line-height:1.5}
.sheet .whyline{color:var(--fire)}
.go{display:inline-flex;align-items:center;background:var(--tide);color:var(--page);
 border:1px solid var(--tide);border-radius:99px;padding:.22rem .9rem;font:inherit;font-size:.9rem;
 line-height:1.6;cursor:pointer;white-space:nowrap;text-decoration:none}
.go:hover{background:var(--haldi);border-color:var(--haldi);color:var(--page)}
.go.ghost{background:none;border-color:var(--rule);color:var(--ink)}
.go.ghost:hover{background:none;border-color:var(--haldi);color:var(--haldi)}
.go[disabled],.go.shut{background:none;border-color:var(--rule);color:var(--quiet);cursor:not-allowed}
.go.shut:hover{background:none;border-color:var(--rule);color:var(--quiet)}
.panel h1{font-family:"Rozha One",serif;font-weight:400;font-size:2.4rem;color:var(--haldi);margin:.2rem 0 .3rem;line-height:1.15}
.panel h2{font-family:"Rozha One",serif;font-weight:400;font-size:1.45rem;margin:1.4rem 0 .3rem}
.panel p{margin:0 0 .9rem}
.rolebar{margin:.1rem 0 .55rem;font-size:.92rem;color:var(--tide);border-left:3px solid var(--tide);padding-left:.6rem}
.recap{margin:.1rem 0 .5rem;font-size:.9rem;color:var(--quiet);border-left:2px solid var(--rule);padding-left:.6rem}
.quiet{color:var(--quiet);font-style:italic}
.gain{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin:.2rem 0 .9rem}
.gain b{font-weight:400;font-family:"Rozha One",serif;color:var(--page);background:var(--haldi);
 border-radius:99px;padding:.06rem .6rem;font-size:.92rem}
.gain span{border:1px solid var(--rule);border-radius:99px;padding:.06rem .6rem;
 font-size:.82rem;color:var(--quiet)}
.gain .gain-all{border-color:var(--haldi);color:var(--haldi)}
.scrollbtn{background:none;border:1px solid var(--haldi);border-radius:99px;color:var(--haldi);
 padding:.1rem .8rem;font:inherit;font-size:.84rem;cursor:pointer;white-space:nowrap;margin-right:.4rem}
.scrollbtn:hover{background:var(--haldi);color:var(--page)}
@media print{
 body>*{display:none!important}
 body.printing #scroll{display:block!important;position:static;padding:0}
 body.printing #scroll .pcard-back,body.printing #scroll .pcard-btns{display:none!important}
 body.printing #scroll .pcard-box{box-shadow:none;border:none;max-height:none;width:auto}
 body.printing #weave{overflow:visible;color:#000}
 body.printing #weave h2,body.printing #weave .w-where{color:#000}
}
.weave{font-size:1.06rem;line-height:1.95}
.weave h2{font-family:"Rozha One",serif;font-weight:400;font-size:1.5rem;color:var(--haldi);
 margin:1.4rem 0 .5rem;text-align:center}
.weave h2:first-child{margin-top:.2rem}
.weave p{margin:0 0 1rem;text-align:justify}
.weave i{color:var(--quiet);font-style:italic}
.w-where{font-family:"Rozha One",serif;color:var(--haldi);font-size:1.02rem;margin:1rem 0 .2rem;
 text-align:left;opacity:.95}
.w-turn{text-align:center;color:var(--haldi);font-family:"Rozha One",serif;margin:1.2rem 0 .8rem}
.w-also{display:block;margin-top:.4rem;padding-left:.8rem;border-left:2px solid var(--rule)}
.w-card{display:block;margin-top:.4rem;padding-left:.8rem;border-left:2px solid var(--haldi)}
.w-src{color:var(--quiet);font-size:.84rem;margin:.2rem 0 .6rem}
.w-refs{font-size:.82rem;color:var(--quiet);text-align:left}
.lamp{background:var(--haldi);color:var(--page);border:none;border-radius:99px;
 padding:.1rem .7rem;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap;margin-right:.4rem}
.lamp[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){
 .lamp{animation:lampglow 2.2s ease-in-out infinite}
 @keyframes lampglow{0%,100%{box-shadow:0 0 0 0 rgba(212,160,23,.5)}50%{box-shadow:0 0 0 7px rgba(212,160,23,0)}}
}
.claim{background:var(--haldi);color:var(--page);border:none;border-radius:99px;padding:.1rem .7rem;
 font:inherit;font-size:.8rem;cursor:pointer;white-space:nowrap;margin-top:.3rem}
.pcell.ready{opacity:1;border-color:var(--haldi);background:rgba(212,160,23,.1)}
.mypad{margin:0 0 .3rem;font-size:1.05rem}
.mypad b{font-weight:400;font-family:"Rozha One",serif;font-size:1.35rem;color:var(--haldi)}
.pgroup{margin:.7rem 0 .2rem;font-size:.86rem;color:var(--quiet)}
.myname{font-family:"Rozha One",serif;color:var(--ink);margin-right:.5rem}
.tinybar{display:inline-block;width:4.5rem;height:7px;background:var(--rule);border-radius:99px;
 overflow:hidden;vertical-align:middle;margin-right:.5rem}
.tinybar i{display:block;height:100%;background:var(--tide)}
.giftrow{display:flex;flex-direction:column;gap:.5rem;margin:.4rem 0 .8rem}
.coin{border:1px solid var(--haldi);border-radius:99px;padding:.02rem .5rem;color:var(--haldi);margin-right:.4rem}
.pick.buy{border-color:var(--haldi);color:var(--haldi)}
.chose{color:var(--tide)}
.about{border:1px dashed var(--rule);border-radius:.7rem;margin:.3rem 0 .8rem;overflow:hidden}
.aboutlid{display:flex;align-items:center;justify-content:space-between;gap:.5rem;width:100%;
 background:none;border:none;font:inherit;cursor:pointer;padding:.4rem .7rem;text-align:left}
.aboutlid b{font-weight:400;font-size:.92rem;color:var(--quiet)}
.abouttag{font-size:.78rem;border:1px solid var(--rule);border-radius:99px;padding:.04rem .55rem;color:var(--quiet)}
.aboutlid:hover b,.aboutlid:hover .abouttag{color:var(--haldi);border-color:var(--haldi)}
.aboutbody{padding:0 .8rem .5rem;color:var(--quiet);font-size:.94rem}
.aboutbody p{margin:0 0 .5rem;line-height:1.75}
.about.shut .aboutbody{display:none}
.elsew{border:1px dashed var(--rule);border-radius:.7rem;margin:.5rem 0 .8rem;overflow:hidden}
.elsewlid{display:flex;align-items:center;justify-content:space-between;gap:.5rem;width:100%;
 background:none;border:none;font:inherit;cursor:pointer;padding:.45rem .7rem;text-align:left}
.elsewlid b{font-weight:400;font-family:"Rozha One",serif;font-size:1rem;color:var(--quiet)}
.elsewtag{font-size:.78rem;border:1px solid var(--rule);border-radius:99px;padding:.04rem .55rem;color:var(--quiet)}
.elsewlid:hover b,.elsewlid:hover .elsewtag{color:var(--haldi);border-color:var(--haldi)}
.elsewbody{padding:0 .8rem .6rem}
.elsewbody p{margin:0 0 .5rem;line-height:1.75}
.elsewbody b{font-weight:400;color:var(--tide)}
.elsew.shut .elsewbody{display:none}
.thread{margin:.2rem 0 .6rem;padding-left:.8rem;border-left:3px solid var(--tide);color:var(--ink)}
.thread b{font-weight:400;color:var(--tide)}
/* ---- a find, wrapped ---- */
.gift{border:1px solid var(--haldi);border-radius:.8rem;overflow:hidden;margin:.6rem 0 .9rem;
 background:var(--mark)}
.gift.g-man{border-color:var(--fire)}
.gift.g-gr{border-color:var(--tide)}
.giftlid{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;cursor:pointer;
 background:none;border:none;font:inherit;padding:.6rem .7rem;position:relative;overflow:hidden}
.giftlid b{flex:1 1 auto;min-width:0;font-weight:400;font-family:"Rozha One",serif;font-size:1.08rem;color:var(--haldi)}
.gift.g-man .giftlid b{color:var(--fire)}
.gift.g-gr .giftlid b{color:var(--tide)}
.gifttag{flex:0 0 auto;font-size:.74rem;border:1px solid var(--rule);border-radius:99px;
 padding:.04rem .55rem;color:var(--quiet)}
.giftact{flex:0 0 auto;font-size:.8rem;border:1px solid var(--rule);border-radius:99px;
 padding:.06rem .6rem;color:var(--quiet)}
.giftlid:hover .giftact{border-color:var(--haldi);color:var(--haldi)}
.giftbody{padding:0 .8rem .7rem;line-height:1.8}
.giftbody b{display:block;font-weight:400;font-family:"Rozha One",serif;font-size:1.05rem;
 color:var(--ink);margin:.1rem 0 .3rem}
.giftbody p{margin:0 0 .4rem}
.gift.shut .giftbody{display:none}
@media (prefers-reduced-motion:no-preference){
 .gift.shut{animation:giftbob 2.6s ease-in-out infinite}
 @keyframes giftbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
 .gift.shut .giftlid::after{content:"";position:absolute;top:0;bottom:0;width:40%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.18),rgba(255,255,255,0));
  animation:giftshine 2.6s linear infinite}
 @keyframes giftshine{0%{left:-45%}100%{left:105%}}
 .gift.just .giftbody{animation:giftopen .45s ease-out 1}
 @keyframes giftopen{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
}
.fbox{border:1px solid var(--haldi);border-left-width:4px;border-radius:.7rem;
 padding:.6rem .8rem;margin:.6rem 0 .9rem;background:var(--mark)}
.fbox b{display:block;font-weight:400;font-family:"Rozha One",serif;font-size:1.1rem;
 color:var(--haldi);margin-bottom:.3rem}
.fbox p{margin:0 0 .4rem;line-height:1.8}
.mool{margin:.5rem 0;padding:.5rem .7rem;border-left:3px solid var(--tide);background:var(--page);
 border-radius:.4rem}
.mool-line{display:block;font-size:1.02rem;line-height:1.9;color:var(--ink)}
.mool-arth{display:block;font-size:.86rem;color:var(--quiet);margin-top:.25rem}
.giftwhere{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:.6rem;
 padding-top:.5rem;border-top:1px solid var(--rule)}
.giftwhere span{font-size:.82rem;color:var(--quiet)}
.tucked{margin:.2rem 0 .6rem;font-size:.86rem;color:var(--quiet)}
.fsrc{display:block;font-size:.82rem;color:var(--quiet)}
.found{border-left:3px solid var(--haldi);background:var(--mark);padding:.45rem .8rem;margin:0 0 .9rem;border-radius:0 5px 5px 0}
.found b{font-weight:400;font-family:"Rozha One",serif}
.gift{border-left-color:var(--fire)}
/* ---- the story as a stack of cards ---- */
.step{border:1px solid var(--rule);border-radius:.9rem;padding:.2rem .9rem .9rem;margin:0 0 .8rem;
 background:var(--page)}
.step:last-child{border-color:var(--haldi)}
.stephead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:.6rem;
 background:none;border:none;font:inherit;color:var(--quiet);cursor:pointer;padding:.55rem 0;text-align:left}
.stephead b{font-weight:400;font-family:"Rozha One",serif;font-size:1rem;color:var(--haldi)}
.stephead .steptag{font-size:.8rem;border:1px solid var(--rule);border-radius:99px;padding:.06rem .6rem}
.step.shut{padding:0 .9rem;background:var(--mark)}
.step.shut .stepbody{display:none}
.stephead:hover .steptag{border-color:var(--haldi);color:var(--haldi)}
.ask{margin:.8rem 0 .4rem;font-family:"Rozha One",serif;font-size:1.15rem;color:var(--haldi)}
.fork{display:flex;flex-direction:column;gap:.5rem;margin:.2rem 0 .6rem}
/* ---- a place you can tap ---- */
.card-pick{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;cursor:pointer;
 background:var(--mark);border:1px solid var(--rule);border-radius:.8rem;padding:.6rem .7rem;font:inherit;
 min-height:3.4rem;transition:border-color .15s,transform .1s}
.card-pick:hover{border-color:var(--haldi)}
.card-pick:active{transform:scale(.99)}
.cp-no{flex:0 0 auto;width:2rem;height:2rem;border-radius:50%;background:var(--tide);color:var(--page);
 display:flex;align-items:center;justify-content:center;font-family:"Rozha One",serif;font-size:1.05rem}
.cp-mid{flex:1 1 auto;min-width:0}
.cp-mid b{display:block;font-weight:400;font-family:"Rozha One",serif;font-size:1.15rem;color:var(--ink)}
.cp-mid span{display:block;font-size:.88rem;color:var(--quiet);line-height:1.5}
.cp-left{color:var(--tide)}
.cp-go{flex:0 0 auto;background:var(--tide);color:var(--page);border-radius:99px;padding:.2rem .8rem;font-size:.9rem}
.card-pick.gift .cp-no{background:var(--fire)}
/* ---- a plain big button ---- */
.do{display:block;width:100%;text-align:left;cursor:pointer;background:var(--page);
 border:1px solid var(--rule);border-radius:.8rem;padding:.7rem .9rem;font:inherit;font-size:1.02rem;
 color:var(--ink);min-height:3rem}
.do:hover{border-color:var(--haldi);color:var(--haldi)}
.do.go{background:var(--tide);border-color:var(--tide);color:var(--page)}
.do.go:hover{background:var(--haldi);border-color:var(--haldi);color:var(--page)}
.do.read{border-color:var(--fire);color:var(--fire)}
.do.buy{border-color:var(--haldi);color:var(--haldi)}
.do.shut,.do[disabled]{color:var(--quiet);border-style:dashed;cursor:not-allowed}
.do.seen{opacity:.7}
.do .hint{display:block;font-size:.82rem;color:var(--quiet);margin-top:.15rem}
/* ---- the progress card ---- */
.pcard{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:1rem}
.pcard[hidden]{display:none}
.pcard-back{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.pcard-box{position:relative;width:min(38rem,100%);max-height:92%;display:flex;flex-direction:column;
 background:var(--page);border:1px solid var(--haldi);border-radius:.9rem;overflow:hidden;
 box-shadow:0 18px 50px rgba(0,0,0,.45)}
.pcard-top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:.5rem;
 padding:.45rem .7rem;background:var(--barbg);border-bottom:1px solid var(--rule)}
.pcard-top b{font-family:"Rozha One",serif;font-weight:400;font-size:1.2rem;color:var(--haldi)}
.pcard-btns{display:flex;align-items:center;gap:.4rem;flex:0 0 auto;white-space:nowrap}
.pcard-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:.8rem 1rem 1.4rem}
.panel-like h2{font-family:"Rozha One",serif;font-weight:400;font-size:1.3rem;margin:1.2rem 0 .4rem}
.panel-like h2:first-child{margin-top:.2rem}
.panel-like p{margin:0 0 .8rem}
#tally{cursor:pointer}
.card-chip{border-color:var(--haldi);color:var(--haldi)}
/* ---- filling bars ---- */
.pbar{margin:0 0 .7rem}
.plbl{display:flex;justify-content:space-between;gap:.6rem;font-size:.92rem;margin-bottom:.2rem}
.plbl b{font-weight:400;color:var(--haldi)}
.ptrack{display:block;height:8px;background:var(--rule);border-radius:99px;overflow:hidden}
.ptrack i{display:block;height:100%;background:var(--tide);border-radius:99px;transition:width .5s ease}
.pnote{display:block;font-size:.8rem;color:var(--quiet);margin-top:.15rem}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.6rem;margin:.4rem 0 1.2rem}
.vcell{display:flex;gap:.6rem;border:1px solid var(--rule);border-radius:.7rem;padding:.6rem;opacity:.5}
.vcell.got{opacity:1;border-color:var(--haldi)}
.vcell.ready{opacity:1;border-color:var(--tide)}
.vicon{flex:0 0 auto;width:3.2rem;height:3.2rem}
.vi .vglow{fill:rgba(212,160,23,.18);stroke:var(--haldi);stroke-width:1.2}
.vi .vdark{fill:rgba(0,0,0,.25);stroke:var(--quiet);stroke-width:1.2}
.vi .vline{fill:none;stroke:var(--haldi);stroke-width:1.6;stroke-linecap:round}
.vi .vcrack{fill:none;stroke:var(--fire);stroke-width:1.6;stroke-linecap:round}
.vbody{min-width:0}
.findbox{width:100%;box-sizing:border-box;background:var(--mark);border:1px solid var(--rule);
 border-radius:.6rem;padding:.5rem .7rem;color:var(--ink);font:inherit;font-size:1rem;margin:.2rem 0 .8rem}
.findbox:focus{outline:none;border-color:var(--haldi)}
.tapme{cursor:pointer}
.tapme:hover{border-color:var(--haldi)}
.more{display:inline-block;margin-top:.3rem;font-size:.78rem;border:1px solid var(--rule);
 border-radius:99px;padding:.02rem .55rem;color:var(--quiet)}
.tapme:hover .more{border-color:var(--haldi);color:var(--haldi)}
.deeptop{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.vicon.big{width:4.4rem;height:4.4rem}
.vbody b{display:block;font-weight:400;font-family:"Rozha One",serif;font-size:1.05rem;color:var(--haldi)}
.vkind{display:inline-block;font-size:.74rem;border:1px solid var(--rule);border-radius:99px;
 padding:.02rem .5rem;color:var(--quiet);margin:.2rem 0}
.vbody p{margin:.2rem 0 .3rem;font-size:.9rem;line-height:1.7}
.vrow{display:block;font-size:.82rem;color:var(--quiet);line-height:1.6}
.vrow.done{color:var(--tide)}
.vrow.todo{color:var(--haldi)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.5rem;margin:.4rem 0 1rem}
.pcell{border:1px solid var(--rule);border-radius:.6rem;padding:.4rem .6rem;opacity:.5}
.pcell.got{opacity:1;border-color:var(--haldi)}
.pcell b{display:block;font-family:"Rozha One",serif;font-weight:400;font-size:1rem;color:var(--haldi)}
.pcell span{font-size:.84rem;color:var(--quiet);line-height:1.5}
/* ---- the shelf you spend at ---- */
.beattag{font-size:.72rem;color:var(--haldi);border:1px solid var(--haldi);border-radius:99px;padding:.02rem .4rem;margin-left:.25rem}
.beat{margin:.12rem 0;font-size:.93rem;line-height:1.75;border-left:2px solid var(--haldi);padding-left:.6rem}
.glance{margin:.2rem 0 .4rem;font-size:.92rem}
.glance b{font-weight:400;color:var(--haldi);margin-right:.4rem}
.quizbox{border:1px solid var(--rule);border-radius:.7rem;padding:.6rem .7rem;margin:.2rem 0 1rem}
.q-ask{margin:0 0 .6rem;font-size:1rem}
.qopts{display:flex;flex-wrap:wrap;gap:.4rem}
.q-lock{margin:.6rem 0 .4rem;font-size:.82rem;color:var(--quiet)}
.q-right{margin:0 0 .5rem;color:var(--tide)}
.q-wrong{margin:0 0 .5rem;color:var(--fire)}
.needs{display:block;margin-top:.2rem}
.needs span{display:block;font-size:.78rem;line-height:1.5}
.need-ok{color:var(--tide)}
.need-ok::before{content:"मिल चुका: "}
.need-no{color:var(--quiet)}
.need-no::before{content:"चाहिए: "}
.ptrack.small{height:5px;margin-top:.3rem}
.shoplist{display:flex;flex-direction:column;gap:.4rem;margin:.4rem 0 1rem}
.shopline{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
 border:1px solid var(--rule);border-radius:.6rem;padding:.35rem .6rem}
.shopline span{font-size:.88rem;color:var(--quiet);min-width:0}
.shopline b{font-weight:400;color:var(--ink);font-family:"Rozha One",serif;font-size:1rem}
/* ---- the night you made yourself ---- */
.mera-w{font-family:"Rozha One",serif;color:var(--haldi);margin:1rem 0 .3rem;font-size:1.05rem}
.mera{margin:0 0 .5rem;padding-left:.8rem;border-left:2px solid var(--rule)}
.mera-src{color:var(--quiet);font-size:.82rem;white-space:nowrap}
.meter{height:.35rem;background:var(--rule);border-radius:99px;overflow:hidden;margin:.2rem 0 .8rem}
.meter i{display:block;height:100%;background:var(--tide)}
.link{background:none;border:none;font:inherit;color:var(--tide);text-decoration:underline;cursor:pointer;padding:0}
a{color:var(--tide)}
.sc{transition:opacity .16s linear;pointer-events:none}
.sc .arrive{opacity:0}
.sc .arrive .ring1,.sc .arrive .ring2{fill:none;stroke:var(--haldi);stroke-width:.7}
.sc .arrive .spot{fill:var(--haldi);opacity:.12}
.sc .arrive .spark{fill:var(--haldi)}
.sc.focus .arrive{opacity:1}
.rin{max-width:36rem;margin:0 auto}
.rwhere{color:var(--quiet);font-style:italic;margin:0 0 .2rem}
.rtitle{font-family:"Rozha One",serif;font-weight:400;font-size:1.5rem;color:var(--haldi);margin:0 0 .5rem}
.rtabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.rtour{font:inherit;font-size:.95rem;border-radius:99px;padding:.5rem 1.1rem;cursor:pointer;
 border:1px solid var(--haldi);background:rgba(212,160,23,.12);color:var(--haldi);transition:.15s}
.rtour:hover{background:rgba(212,160,23,.22)}
.rtab{background:none;border:1px solid var(--rule);border-radius:99px;padding:.15rem .7rem;
 font:inherit;font-size:.88rem;color:var(--quiet);cursor:pointer}
.rtab.on{border-color:var(--haldi);color:var(--ink)}
#reader p{margin:0 0 .85rem}
.rnote{display:block;font-size:.8rem;color:var(--quiet);margin-top:.1rem}
.rsrc{color:var(--quiet);font-size:.9rem}
.rmeta{color:var(--tide);font-size:.95rem;margin:0 0 .6rem}
.tstrip{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.tstrip{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:.4rem;margin:.6rem 0;padding-bottom:.25rem;
 scrollbar-width:none}
.tstrip::-webkit-scrollbar{display:none}
.tstep{flex:0 0 auto;display:inline-flex;align-items:center;gap:.4rem;background:var(--mark);
 border:1px solid var(--rule);border-radius:99px;padding:.3rem .85rem;font:inherit;font-size:.86rem;
 color:var(--quiet);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.tstep::before{content:"";width:.42rem;height:.42rem;border-radius:99px;background:var(--rule)}
.tstep.been::before{background:var(--tide)}
.tstep.been{color:var(--ink)}
.tstep:hover{border-color:var(--haldi);color:var(--haldi)}
.tstep.on{border-color:var(--haldi);color:var(--haldi);background:rgba(212,160,23,.12)}
.tstep.on::before{background:var(--haldi)}
.tourcall{position:relative;display:block;width:100%;text-align:left;overflow:hidden;
 border:1px solid var(--haldi);border-radius:.9rem;background:linear-gradient(135deg,rgba(212,160,23,.16),rgba(212,160,23,.05));
 color:var(--ink);font:inherit;padding:.7rem .9rem;cursor:pointer;transition:.18s}
.tourcall:hover{background:linear-gradient(135deg,rgba(212,160,23,.28),rgba(212,160,23,.1));
 transform:translateY(-1px)}
.tourcall .tchip{display:inline-block;font-size:.72rem;letter-spacing:.04em;background:var(--haldi);
 color:#22180a;border-radius:99px;padding:.06rem .55rem;margin-bottom:.3rem}
.tourcall .tcall{display:block;font-size:.86rem;color:var(--quiet)}
.tourcall .tcallname{display:block;font-family:"Rozha One",serif;font-size:1.2rem;color:var(--haldi);line-height:1.3}
.tourcall .tcalln{display:block;font-size:.78rem;color:var(--quiet);margin-top:.15rem}
.tourcall.been{border-color:var(--rule);background:var(--mark)}
.tourcall.been .tchip{background:var(--rule);color:var(--quiet)}
.tourcall.been .tcallname{color:var(--ink)}
.tourcall.shine{animation:tcallglow 3.4s ease-in-out infinite}
.tourcall.shine::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:35%;
 background:linear-gradient(100deg,transparent,rgba(255,230,150,.35),transparent);
 transform:skewX(-18deg);animation:tsweep 3.4s ease-in-out infinite;pointer-events:none}
@keyframes tcallglow{0%,100%{box-shadow:0 0 0 rgba(212,160,23,0)}
 50%{box-shadow:0 0 18px rgba(212,160,23,.35)}}
@keyframes tsweep{0%{left:-45%}55%{left:115%}100%{left:115%}}
@media (prefers-reduced-motion:reduce){.tourcall.shine,.tourcall.shine::after{animation:none}}
.tbtn{font:inherit;font-size:.95rem;border-radius:99px;padding:.5rem 1.1rem;cursor:pointer;
 border:1px solid var(--rule);background:var(--mark);color:var(--ink);transition:.15s}
.tbtn.go{background:var(--tide);border-color:var(--tide);color:#0c1a1a;font-weight:500}
.tbtn.go:hover{filter:brightness(1.08)}
.tbtn.ghost{color:var(--quiet)}
.tbtn.ghost:hover{border-color:var(--haldi);color:var(--haldi)}
.tbtn.done{opacity:.6;cursor:default}
.tcount{margin:.5rem 0 0;font-size:.82rem;color:var(--quiet);text-align:right}
.tart{border:1px solid var(--rule);border-radius:.7rem;background:var(--mark);padding:.4rem;margin:.5rem 0}
.tart svg{display:block;width:100%;height:auto}
.tname{font-family:"Rozha One",serif;font-weight:400;font-size:1.25rem;color:var(--haldi);margin:.4rem 0 .3rem}
.tart{border:1px solid var(--rule);border-radius:.7rem;overflow:hidden;margin:.5rem 0;background:#0a1220}
.tart svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.tstone{fill:#2a3547;stroke:#3b4a61;stroke-width:1}
.tplas{fill:#e8e2d2;stroke:#c3bba6;stroke-width:.7}
.tcorn{fill:url(#tgGold)}
.tpil{fill:#d9b46a}
.tpil2{fill:#c99a3c}
.tarch{fill:url(#tgGold);stroke:#8a6318;stroke-width:.6}
.tcurl{fill:none;stroke:#c99a3c;stroke-width:2;stroke-linecap:round}
.tgoldwall{fill:url(#tgGold);stroke:#7a5512;stroke-width:.5}
.tmoat{fill:#1b4450}
.tlotus{fill:#f2b6c8;animation:tflick 4s ease-in-out infinite}
.tkalash{fill:#ffd98a}
.tpole{stroke:#b9a06a;stroke-width:1.6;fill:none}
.tflagc{fill:#c0442f}
.tbell{fill:#ffd98a}
.tghat{fill:#6f6a5c;stroke:#4f4a40;stroke-width:.6}
.tmud{fill:#a8845a;stroke:#7a5c3a;stroke-width:.7}
.tbamboo{stroke:#8a6a3a;stroke-width:2;stroke-linecap:round;fill:none}
.tawn{fill:#b9563f;stroke:#7d3626;stroke-width:.6}
.tware{fill:#d9b46a}
.tgrid{stroke:rgba(90,60,10,.55);stroke-width:.5;fill:none}
.tfar{fill:#1b2537}
.tgoldy{fill:url(#tgGold)}
.tthatch{fill:#6b4f2a;stroke:#4a361c}
.tdoorw{fill:#120e14;stroke:#3b4a61}
.tstall{fill:#8a5a2a;stroke:#5c3a1c}
.tstall.b{fill:#6b4a3a}
.tpotw{fill:#8a4a2c;stroke:#5c3520}
.tpathline{fill:none;stroke:rgba(240,199,90,.5);stroke-width:2.4;stroke-dasharray:7 7}
.twin g{animation:twinflick 4s ease-in-out infinite}
.twin path{fill:#ffcf7a;opacity:.9}
.tdhvaj{animation:tsway 4.5s ease-in-out infinite;transform-origin:center bottom}
.tstars circle{fill:#fff;opacity:.8;animation:tstar 3.4s ease-in-out infinite}
.tlamp{animation:tflick 2.6s ease-in-out infinite;transform-origin:center}
.tfire{animation:tflick 1.5s ease-in-out infinite}
.tflame{fill:#ffb347;animation:tlick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
.tflame.b{fill:#ffe08a;animation-duration:.8s}
.tsmoke circle{fill:rgba(190,190,200,.16);animation:tsmoke 6s linear infinite}
.tsway{animation:tsway 5s ease-in-out infinite;transform-origin:center bottom}
.tripple path{fill:none;stroke:rgba(190,230,230,.35);stroke-width:1.6;animation:tripple 5s linear infinite}
.tfig{animation:tbreathe 4s ease-in-out infinite;transform-origin:center bottom}
.dwalkline{animation:twalk 9s linear infinite}

.tbeast{animation:tstep 4s ease-in-out infinite}
.tbub circle{fill:rgba(200,240,240,.5);animation:tbub 5s linear infinite}
.ttick rect{fill:#f0c75a;animation:ttick 3s ease-in-out infinite}
.tglowbig{fill:url(#tgLamp);animation:tflick 4s ease-in-out infinite}
.tring{stroke:#f0c75a;stroke-width:3;animation:tpulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tring.b{stroke:rgba(240,199,90,.5);animation-delay:-1.3s}
.tnote circle{fill:#ffd27a;animation:tnote 3.4s ease-in-out infinite}
.tdrip path{stroke:url(#tgGold);stroke-width:3;stroke-linecap:round;animation:tdrip 3.6s ease-in-out infinite}
.twing{animation:tflap 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:right center}
.twing.b{transform-origin:left center;animation-delay:-.8s}
.tflyer{animation:tfloat 5s ease-in-out infinite}
.tperch{animation:tbreathe 3.4s ease-in-out infinite}
.tmany circle{animation:tbreathe 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tbow{animation:tfloat 6s ease-in-out infinite}
.tmoon circle{animation:none}
@keyframes twinflick{0%,100%{opacity:.85}45%{opacity:.35}}
@keyframes tstar{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes tflick{0%,100%{opacity:.9}50%{opacity:1}}
@keyframes tlick{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.16) scaleX(.92)}}
@keyframes tsmoke{0%{transform:translateY(0) scale(.8);opacity:.5}100%{transform:translateY(-52px) scale(1.5);opacity:0}}
@keyframes tsway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes tripple{0%{transform:translateX(0)}100%{transform:translateX(-80px)}}
@keyframes tbreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
@keyframes twalk{0%{transform:translateX(-30px)}100%{transform:translateX(300px)}}
@keyframes tstep{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes tbub{0%{transform:translateY(0);opacity:.6}100%{transform:translateY(-70px);opacity:0}}
@keyframes ttick{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes tpulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:.6}}
@keyframes tnote{0%{transform:translateY(0);opacity:.3}50%{opacity:1}100%{transform:translateY(-16px);opacity:0}}
@keyframes tdrip{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes tflap{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes tfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.tart *{animation:none!important}}
.twoup{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:.6rem 0 1rem}
@media (max-width:640px){.twoup{grid-template-columns:1fr}}
.tcol{border:1px solid var(--rule);border-radius:.7rem;padding:.6rem .8rem;background:var(--mark)}
.tcol h3{font-family:"Rozha One",serif;font-weight:400;font-size:1.1rem;color:var(--haldi);margin:0 0 .4rem}
.tcol p{margin:0 0 .6rem;line-height:1.8}
.rbtns{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
.rhome{background:none;border:1px solid var(--rule);color:var(--ink);border-radius:99px;
 padding:.28rem 1rem;font:inherit;cursor:pointer;white-space:nowrap;margin-top:.4rem}
.rhome:hover{border-color:var(--haldi)}
.tx{cursor:pointer;transition:opacity .16s linear}
.tx .tsh{fill:var(--shade);opacity:.26}
.tx .tleaf{fill:var(--page);stroke:var(--walldark);stroke-width:.5}
.tx .tband{fill:var(--gone)}
.tx .tring{fill:none;stroke:var(--haldi);stroke-width:.9;opacity:0}
.tx .tlbl{font-family:"Tiro Devanagari Hindi",serif;font-size:3.4px;fill:var(--quiet);
 paint-order:stroke;stroke:var(--page);stroke-width:1.4px;stroke-linejoin:round}
.tx.got .tband{fill:var(--fire)}
.tx.got .tring{opacity:.85}
.tx.got .tleaf{stroke:var(--haldi)}
.tx.got .tlbl{fill:var(--ink)}
.tx:hover .tring{opacity:1}
@media (prefers-reduced-motion:no-preference){
 .tx.got .tring{animation:tglow 4.5s ease-in-out infinite}
 @keyframes tglow{0%,100%{opacity:.5;r:6.2}50%{opacity:1;r:7}}
}
.rback{background:var(--tide);color:var(--page);border:1px solid var(--tide);border-radius:99px;
 padding:.28rem 1rem;font:inherit;cursor:pointer;margin-top:.4rem;white-space:nowrap}
.rback:hover{background:var(--haldi);border-color:var(--haldi)}
.mk .flagg{opacity:0}
.mk .fpole{stroke:var(--page);stroke-width:.8;fill:none}
.mk.f-part .flagg,.mk.f-done .flagg{opacity:1}
.mk.f-part .fcloth{fill:var(--haldi)}
.mk.f-done .fcloth{fill:#3f9d5a}
.dio{position:absolute;right:.5rem;top:.5rem;width:min(58%,22rem);
 display:none;flex-direction:column;max-height:calc(100% - 1rem);
 border:1px solid var(--rule);border-radius:.7rem;overflow:hidden;background:var(--page);
 box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:4}
.dio.open{display:flex}
.dio.big{left:.5rem;right:.5rem;top:50%;bottom:auto;transform:translateY(-50%);width:auto}

.mk{cursor:default;transition:opacity .16s linear}
.mk .sh{fill:var(--shade);opacity:.32}
.mk .body{transform-box:fill-box;transform-origin:50% 100%;
 transition:transform .28s cubic-bezier(.34,1.56,.64,1),filter .25s ease}
.mk .drop{fill:var(--gone);stroke:var(--page);stroke-width:.7;stroke-linejoin:round}
.mk .eye{fill:var(--page);opacity:.9}
.mk .num{font-family:"Rozha One",serif;font-size:3.1px;fill:var(--ink);opacity:0}
.mk .lbl{font-family:"Tiro Devanagari Hindi",serif;font-size:4.2px;fill:var(--ink);
 paint-order:stroke;stroke:var(--page);stroke-width:1.5px;stroke-linejoin:round;
 transition:opacity .25s ease;pointer-events:none}
.mk .cnt circle{fill:var(--page);stroke:var(--tide);stroke-width:.7}
.mk .cnt text{font-family:"Rozha One",serif;font-size:3.1px;fill:var(--tide)}
.mk.live{cursor:pointer}
.mk.later{opacity:.32;filter:saturate(.3);cursor:pointer}
.mk.live .drop{fill:var(--tide)}
.mk.live .eye{fill:var(--page);opacity:1}
.mk.live .num{fill:var(--tide);opacity:1;font-size:2.9px}
.mk.live .body{filter:drop-shadow(0 .5px .6px rgba(0,0,0,.4))}
.mk.part .drop{fill:var(--haldi)}
.mk.part .num{fill:var(--haldi)}
.mk.full .drop{fill:var(--haldi);opacity:.55}
.mk.used .drop{fill:var(--gone);opacity:.75}
.mk.used .body{transform:scale(.82)}
.mk.giftlock .drop{fill:var(--fire);opacity:.45}
.mk.gift .drop{fill:var(--fire)}
.mk.gift .num{fill:var(--fire)}

.tabs{display:flex;gap:.8rem;flex-wrap:wrap;margin:0 0 .5rem;position:sticky;top:-1rem;

/* ================= game skin: depth, light and motion ================= */
:root{--lift:0 10px 26px rgba(8,16,26,.24);--lift2:0 18px 44px rgba(8,16,26,.34);

/* the map sits under a sky and a rim, so it reads as a world, not a page */
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
 background:radial-gradient(120% 90% at 50% 12%,transparent 46%,rgba(6,12,20,.30) 100%);
 mix-blend-mode:multiply}
#stage:before{content:"";position:absolute;inset:-2px;pointer-events:none;z-index:6;
 box-shadow:inset 0 0 0 1px var(--rule),inset 0 22px 42px -26px rgba(255,255,255,.35);border-radius:.2rem}
#map{filter:drop-shadow(0 6px 10px rgba(6,12,20,.22))}

/* places stand up off the map, with a shadow under them and a little life */
.mk{filter:drop-shadow(0 4px 5px rgba(6,12,20,.45))}
.mk.live{cursor:pointer}
.mk.later{opacity:.32;filter:saturate(.3) drop-shadow(0 2px 3px rgba(6,12,20,.3))}
.mk .halo{fill:var(--tide);opacity:0}
@media (prefers-reduced-motion:no-preference){
 .mk.live{animation:bob 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
 .mk.live:nth-of-type(2n){animation-delay:-1.4s}
 .mk.live:nth-of-type(3n){animation-delay:-2.7s}
 @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -2.2px}}
 .mk.here .halo{animation:halo 2.6s ease-out infinite}
 @keyframes halo{0%{opacity:.45;r:4}70%{opacity:0;r:13}100%{opacity:0;r:13}}
 .mk.live:hover{filter:drop-shadow(0 7px 9px rgba(6,12,20,.5)) brightness(1.08)}
}

/* the story pane: cards with weight, arriving instead of appearing */
.step{box-shadow:var(--lift);background:
 linear-gradient(180deg,color-mix(in srgb,var(--page) 92%,var(--edge)) 0%,var(--page) 34%);
 position:relative;overflow:hidden}
.step:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
 background:linear-gradient(180deg,var(--tide),transparent)}
@media (prefers-reduced-motion:no-preference){
 .step{animation:deal .42s cubic-bezier(.2,.9,.25,1) both}
 @keyframes deal{from{opacity:0;transform:translateY(16px) scale(.985) rotate(.25deg)}
  to{opacity:1;transform:none}}
 .card-pick{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
 .card-pick:hover{transform:translateY(-2px) scale(1.006);box-shadow:var(--lift)}
 .card-pick:active{transform:translateY(1px) scale(.994);box-shadow:none}
 .do{transition:transform .14s ease,box-shadow .14s ease,background .18s ease}
 .do:hover{transform:translateY(-1px);box-shadow:var(--lift)}
 .do:active{transform:translateY(1px)}
 .dio{animation:push .5s cubic-bezier(.2,.9,.25,1) both}
 @keyframes push{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
}
.card-pick{box-shadow:0 2px 0 var(--rule)}
.do.go{box-shadow:0 6px 16px -6px var(--tide),0 2px 0 color-mix(in srgb,var(--tide) 70%,black)}
.dio{box-shadow:var(--lift2);border-radius:.7rem;overflow:hidden}

/* the picture itself gets air above and ground below */
.dio svg{display:block}
.dsky{filter:saturate(1.05)}
.dland{filter:drop-shadow(0 -6px 12px rgba(6,12,20,.25))}

/* the top bar reads as a heads up display */
#bar{box-shadow:0 6px 18px -12px rgba(6,12,20,.7);backdrop-filter:saturate(1.1)}
.pip{box-shadow:0 0 0 1px var(--rule)}
.pip.now{box-shadow:0 0 10px var(--tide),0 0 0 1px var(--tide)}

/* the floating sheet lifts off the map */
.sheet{box-shadow:var(--lift2);border-radius:.9rem;

@media (prefers-reduced-motion:no-preference){

 @keyframes rise2{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}

/* inside a picture: haze far away, light above, and a slow drift of the whole scene */
.dhaze{fill:url(#dHaze);pointer-events:none;mix-blend-mode:screen;opacity:.5}
.dvig{fill:url(#dVig);pointer-events:none;mix-blend-mode:multiply;opacity:.75}
.diopic{position:relative;perspective:700px}
.diopic svg{border-radius:.5rem}
@media (prefers-reduced-motion:no-preference){
 .dio.open .dparx{animation:sceneIn .7s cubic-bezier(.2,.9,.25,1) both,sceneDrift 26s ease-in-out infinite 1s;
  transform-box:view-box;transform-origin:50% 60%}
 @keyframes sceneIn{from{transform:scale(1.10) translateY(6px)}to{transform:none}}
 @keyframes sceneDrift{0%,100%{transform:scale(1.015) translateX(-1.4px)}50%{transform:scale(1.015) translateX(1.4px)}}
 .dio.open .dhaze{animation:hazeBreathe 14s ease-in-out infinite}
 @keyframes hazeBreathe{0%,100%{opacity:.38}50%{opacity:.6}}
}

/* landing on a place should feel like landing */
@media (prefers-reduced-motion:no-preference){
 .mk.land .body{animation:land .6s cubic-bezier(.2,.9,.25,1) both;transform-box:fill-box;transform-origin:50% 100%}

  75%{transform:scale(1.06,.95)}100%{transform:none}}
 .mk.land .sh{animation:thud .6s ease-out both}
 @keyframes thud{0%{opacity:.2;transform:scale(.4)}55%{opacity:.55;transform:scale(1.5)}100%{opacity:.35;transform:scale(1)}}
}

/* things you earn should feel earned */
.gift,.elsew{box-shadow:var(--lift)}
@media (prefers-reduced-motion:no-preference){
 .gift.shut .giftlid{animation:knock 5s ease-in-out infinite}
 @keyframes knock{0%,92%,100%{transform:none}94%{transform:rotate(-1.2deg)}96%{transform:rotate(1.2deg)}98%{transform:rotate(-.6deg)}}
 .note{animation:pop .3s cubic-bezier(.2,.9,.25,1) both}
 @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
}

/* ---- the role screen: faces you can walk up to ---- */
.rolegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.4rem,1fr));gap:.7rem;margin:.4rem 0 .8rem}
.rolecard{position:relative;display:flex;flex-direction:column;align-items:center;gap:.25rem;

.rolecard:before{content:"";position:absolute;inset:0;pointer-events:none;

.rolename{font-family:"Rozha One",serif;font-size:1.1rem;color:var(--rt)}
.roleline{font-size:.8rem;color:var(--quiet);line-height:1.45;text-align:center}
.rolemud{font-size:.74rem;color:var(--haldi)}
.roletag{font-size:.74rem;color:var(--rt);border:1px solid var(--rt);border-radius:99px;padding:.02rem .55rem;margin-top:.2rem}

.ravatar{width:100%;max-width:5.6rem;height:auto;display:block}

.avbg{fill:color-mix(in srgb,var(--rt) 16%,var(--mark))}
.avsh{fill:#000;opacity:.18}
.avbody,.avhead{fill:var(--rt)}
.avlimb,.avstaff,.avline{stroke:var(--rt);stroke-width:2;stroke-linecap:round;fill:none}
.avfar{fill:color-mix(in srgb,var(--rt) 34%,var(--mark))}
.avfar2{fill:color-mix(in srgb,var(--rt) 22%,var(--mark))}
.avglow,.avaura{fill:var(--rt);opacity:.16}
.avlamp{fill:#ffd96b}
.avpothi{fill:color-mix(in srgb,var(--rt) 30%,var(--mark));stroke:var(--rt);stroke-width:1.2}
.avshape{fill:color-mix(in srgb,var(--rt) 55%,var(--mark));stroke:var(--rt);stroke-width:1.4}
.avglint{stroke:#fff;stroke-width:1.6;opacity:.7}
.avwing{fill:var(--rt)}
.avcanopy{fill:color-mix(in srgb,var(--rt) 45%,var(--mark));stroke:var(--rt);stroke-width:1.2}
.avcrown{fill:#e0a93c}
.rolewait{border:1px solid var(--rt);border-radius:1rem;padding:.6rem .7rem;background:color-mix(in srgb,var(--rt) 10%,var(--page))}
.rolehero{display:flex;gap:.9rem;align-items:center;margin:.2rem 0 .6rem}
.rolehead h1{margin:0}
.rolehead p{margin:.1rem 0 0;color:var(--quiet);font-size:.92rem}
@media (prefers-reduced-motion:no-preference){
 .rolecard{transition:transform .18s cubic-bezier(.2,.9,.25,1),box-shadow .18s ease,border-color .18s ease}
 .rolecard:hover,.rolecard:focus-visible{transform:translateY(-4px) scale(1.02);
  border-color:var(--rt);box-shadow:0 16px 30px -16px var(--rt),0 0 0 1px var(--rt)}
 .rolecard:active{transform:translateY(0) scale(.99)}
 .rolecard .av{transform-box:view-box;transform-origin:50% 92%}
 .rolecard:hover .av{animation:avwake .9s cubic-bezier(.2,.9,.25,1) both}

 @keyframes avpulse{0%,100%{opacity:.14}50%{opacity:.38}}
 .rolecard:hover .avglint{animation:avglint 1.1s ease-in-out infinite}
 @keyframes avglint{0%{opacity:0;transform:translateX(-5px)}45%{opacity:.85}100%{opacity:0;transform:translateX(6px)}}

 @keyframes avstep{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}

 @keyframes avfly{0%,100%{transform:translate(0,0)}50%{transform:translate(-4px,-5px)}}

 manas:{lore:"अवधी में तुलसीदास की रचना, जो उत्तर भारत में सबसे ज़्यादा पढ़ी और गाई जाती है। यहाँ कथा भक्ति की तरफ़ झुकती है: हनुमान मच्छर जितने छोटे होते हैं, विभीषण का घर तुलसी से पहचाना जाता है, और लौटने से पहले विदा लेना उतना ही ज़रूरी है जितना लंका जलाना।",n:"रामचरितमानस",level:"pal",u:"https://sanskritdocuments.org/doc_z_otherlang_hindi/manas5_i.html",un:"सुंदरकांड का पूरा मूल पाठ",who:"तुलसीदास",lang:"अवधी",when:"सोलहवीं सदी",
  where:"काशी और अयोध्या",la:25.31,lo:83.01},
 adhy:{lore:"दर्शन की तरफ़ झुकी हुई कथा, जो शिव पार्वती के संवाद के रूप में चलती है। यहाँ राम ब्रह्म हैं और सीता माया, इसलिए द्वार पर रोकने वाली भी पहले से जानती है कि जनक के घर जन्मी योगमाया हैं। इसका सुंदरकांड पाँच सर्गों का है।",n:"अध्यात्म रामायण",level:"pal",who:"ब्रह्मांड पुराण के उत्तर भाग में; परंपरा इसे रामानंद से भी जोड़ती है",lang:"संस्कृत",when:"तेरहवीं से पंद्रहवीं सदी; सुंदरकांड पाँच सर्गों का, शिव और पार्वती के संवाद में",
  where:"जगह पक्की नहीं, उत्तर भारत की परंपरा",la:25.44,lo:81.85,u:"https://archive.org/download/adhyatma-ramayan-hindi-tr.-munilal-gita-press-gorakhpur/Adhyatma%20Ramayana/Adhyatma%20Ramayana%20English%20Translation%20Lala%20Baijnath%201912.pdf"},
 kannassa:{lore:"मलयालम की उस दौर की रामकथा जिसे निरणम के राम पणिक्कर ने चौदहवीं सदी में रचा, और जिसे कण्णस्स रामायणम् कहते हैं। एषुत्तच्छन से यह पुरानी है, और इसी तरह की रचनाओं ने उस भाषा को कथा कहने लायक बनाया। निरणम के कवियों का घराना इसी काम के लिए याद किया जाता है।",n:"कण्णस्स रामायणम्",level:"pal",who:"निरणम राम पणिक्कर",lang:"मलयालम",when:"चौदहवीं सदी",
  where:"निरणम, केरल",la:9.32,lo:76.55,pr:"कण्णस्स रामायणम्, मलयालम छपी प्रतियाँ"},
 taili:{lore:"युन्नान के ताई लू लोगों के बीच चलने वाली रामकथा, जिसे लंका सिप हो कहते हैं। यह चीन की सीमा के भीतर की परंपरा है, और वहाँ तक यह कथा दक्षिण पूर्व एशिया के रास्ते पहुँची। नाम में ही लंका है, यानी वहाँ भी इसी नगर की कथा सबसे ऊपर रही।",n:"लंका सिप हो",level:"pal",who:"ताई लू परंपरा",lang:"ताई लू",when:"लोक और पांडुलिपि परंपरा में",
  where:"शिशुआंगबन्ना, युन्नान",la:22.01,lo:100.80,pr:"लंका सिप हो, ताई लू पाठ और अध्ययन"},
 mappila:{lore:"केरल के मापिला मुसलमानों के बीच गाई जाने वाली रामकथा, जिसे मापिला रामायणम् कहते हैं। यह किसी दरबार की रचना नहीं, लोगों के बीच बनी और गाई गई कथा है, और उसकी बोली तथा मुहावरे उसी समाज के हैं। इसमें हँसी मज़ाक की जगह भी है, क्योंकि यह मंच और मजलिस की कथा है, पोथी की नहीं।",n:"मापिला रामायणम्",level:"pal",who:"मापिला लोकपरंपरा",lang:"मलयालम की मापिला बोली",when:"लोक परंपरा में",
  where:"मालाबार, केरल",la:11.25,lo:75.78,pr:"मापिला रामायणम्, संकलित पाठ और अध्ययन"},
 ramacharitam:{lore:"मलयालम की सबसे पुरानी बची हुई काव्य रचना, जिसे चीरामन ने लगभग बारहवीं सदी में रचा। ख़ास बात यह है कि इसमें पूरी रामकथा नहीं है, सिर्फ़ युद्ध वाला हिस्सा है। यानी उस भाषा की शुरुआत ही लड़ाई वाले कांड से हुई, और भाषा भी ऐसी है जिसमें मलयालम और तमिल दोनों की छाया दिखती है।",n:"रामचरितम्",level:"pal",who:"चीरामन",lang:"पुराना मलयालम",when:"लगभग बारहवीं सदी",
  where:"केरल",la:8.89,lo:76.61,pr:"रामचरितम्, मलयालम छपी प्रतियाँ और अध्ययन"},
 maranao: {lore:"फिलीपींस के मरानाओ लोगों की रामकथा, जिसे महारादिया लावाना कहते हैं। यह बड़े दारंगन नाम के कथा चक्र का हिस्सा है, गद्य में कही जाती है और गाई भी जाती है। सबसे अलग बात यह है कि वहाँ हनुमान वाला काम लक्षमाना के नाम से आता है, और नाम तथा जगहें लानाओ झील के आसपास की हो जाती हैं। सन 1968 में इसे पहली बार लिखकर दर्ज किया गया, जब एक शोधकर्ता ने इसे वहाँ के गाने वालों से सुना।",n:"महारादिया लावाना",level:"pal",who:"मरानाओ परंपरा, दारंगन कथा चक्र",lang:"मरानाओ",when:"सत्रहवीं से उन्नीसवीं सदी के बीच पहुँची, 1968 में दर्ज",
  where:"लानाओ झील, मिंदानाओ",la:7.87,lo:124.28,pr:"महारादिया लावाना, जुआन आर फ्रांसिस्को वाला अंग्रेज़ी अनुवाद"},
 tibbati:{lore:"तिब्बती में मिली रामकथा, जिसके पन्ने दुनहुआंग की उन गुफाओं से मिले जहाँ सदियों तक पुरानी पोथियाँ बंद पड़ी रहीं। यह पूरी किताब की शक्ल में नहीं, टुकड़ों में मिलती है, और खोतान की कथा भी इसी से मिलती जुलती है। इससे पता चलता है कि यह कथा रेशम के रास्ते से होकर हिमालय के पार भी पहुँची थी।",n:"तिब्बती रामकथा",level:"pal",who:"अज्ञात, दुनहुआंग की पोथियों से",lang:"तिब्बती",when:"दुनहुआंग की पोथियों में",
  where:"दुनहुआंग की गुफाएँ",la:40.14,lo:94.66,pr:"दुनहुआंग से मिली तिब्बती पांडुलिपियाँ और उनके अनुवाद"},
 siddhi:{lore:"नेपाल भाषा यानी नेवारी में लिखी रामकथा, जिसे सिद्धिदास महाजु ने बीसवीं सदी की शुरुआत में रचा। नेपाल में एक ही समय कई भाषाएँ चलती हैं, और यह उस दूसरी भाषा की रामकथा है, भानुभक्त वाली नेपाली से अलग। एक ही देश, दो ज़बानें, और दोनों में अपनी अपनी रामकथा।",n:"सिद्धि रामायण",level:"pal",who:"सिद्धिदास महाजु",lang:"नेपाल भाषा",when:"बीसवीं सदी की शुरुआत",
  where:"काठमांडू घाटी",la:27.71,lo:85.32,pr:"सिद्धि रामायण, नेपाल भाषा की छपी प्रतियाँ"},
 kalpavruksham:{lore:"तेलुगु की वह रामकथा जिसे विश्वनाथ सत्यनारायण ने बीसवीं सदी में रचा और जिसका नाम है रामायण कल्पवृक्षम्। यह उस समय लिखी गई जब लोग कह रहे थे कि अब पुरानी कथाओं का ज़माना गया। कवि ने वही कथा दोबारा कही, अपने ढंग से, और उसी पर उन्हें ज्ञानपीठ मिला। यह बताता है कि यह कथा किसी पुरानी सदी में बंद नहीं हुई।",n:"रामायण कल्पवृक्षम्",level:"pal",who:"विश्वनाथ सत्यनारायण",lang:"तेलुगु",when:"बीसवीं सदी",
  where:"आंध्र",la:16.51,lo:80.63,pr:"रामायण कल्पवृक्षम्, तेलुगु छपी प्रतियाँ"},
 pampa:{lore:"कन्नड़ की जैन रामकथा, जिसे नागचंद्र ने बारहवीं सदी में रचा और जिसे लोग पंप रामायण भी कहते हैं। जैन परंपरा की दूसरी बड़ी रामकथा यही है, और इसका ढंग पउमचरिय जैसा ही है: हर बात का कारण बताना, चमत्कार से बचना, और हिंसा पर ठहरकर सोचना। एक ही परंपरा, दो भाषाएँ, और सदियों का फ़ासला।",n:"रामचंद्र चरित पुराण",level:"pal",who:"नागचंद्र",lang:"कन्नड़",when:"बारहवीं सदी",
  where:"कर्नाटक",la:13.31,lo:75.24,pr:"रामचंद्र चरित पुराण यानी पंप रामायण, कन्नड़ छपी प्रतियाँ"},
 gobind:{lore:"ब्रजभाषा में लिखी वह रामकथा जो दसम ग्रंथ के चौबीस अवतार वाले हिस्से में आती है, और जिसे रामावतार कहा जाता है। इसका ढंग वीर रस का है: यहाँ ज़ोर लड़ाई, हिम्मत और सही के लिए खड़े होने पर रहता है। सत्रहवीं सदी की यह रचना कथा को उपदेश से ज़्यादा हिम्मत की बात बनाकर कहती है।",n:"रामावतार",level:"pal",who:"दसम ग्रंथ, चौबीस अवतार",lang:"ब्रजभाषा",when:"सत्रहवीं सदी",
  where:"आनंदपुर साहिब, पंजाब",la:31.24,lo:76.50,pr:"दसम ग्रंथ, रामावतार वाला हिस्सा"},
 hikayat:{lore:"मलय में लिखी रामकथा, जिसे हिकायत सेरी राम कहते हैं। हिकायत का मतलब है सुनाई जाने वाली कहानी, इसलिए यह गद्य में है और दरबार तथा मजलिस में पढ़ने के लिए बनी। नाम वहाँ की ज़बान में ढल जाते हैं: राम सेरी राम, सीता सिति देवी, लक्ष्मण लक्षमाना, और रावण महाराजा वाना। इसकी सबसे अलग बात यह है कि कई जगह लक्ष्मण का दर्जा राम से भी बड़ा हो जाता है। हनुमान वहाँ हनुमान केरा पुतिह यानी सफ़ेद वानर हैं।",n:"हिकायत सेरी राम",level:"pal",who:"मलय परंपरा, कई हाथ",lang:"मलय",when:"पांडुलिपि लगभग सन 1600 में इकट्ठा की गई",
  where:"केलंतान और मलय प्रायद्वीप",la:6.13,lo:102.24,pr:"हिकायत सेरी राम, मलय पाठ और अंग्रेज़ी अनुवाद"},
 molla:{lore:"तेलुगु की वह रामकथा जिसे सोलहवीं सदी में मोल्ला ने रचा, एक कुम्हार की बेटी ने। वे पढ़ाई के किसी बड़े घराने से नहीं आतीं और ख़ुद कहती हैं कि उनकी कविता उन्हें मिली हुई देन है। सबसे बड़ी बात इसकी भाषा है: उन्होंने जान बूझकर सीधी तेलुगु चुनी और संस्कृत के भारी शब्द बहुत कम रखे, जबकि उनसे पहले के कवि उन्हें खुलकर बरतते थे। यह तेलुगु की पहली संक्षेप रामकथा मानी जाती है।",n:"मोल्ला रामायणम्",level:"pal",who:"आतुकूरि मोल्ला",lang:"तेलुगु",when:"सोलहवीं सदी",
  where:"गोपवरम, आंध्र",la:14.95,lo:79.02,pr:"मोल्ला रामायणम्, तेलुगु छपी प्रतियाँ"},
 jagamohan:{lore:"ओड़िया की वह रामकथा जिसे बलराम दास ने पंद्रहवीं सदी में रचा, और जिसे लोग दांडी रामायण कहते हैं। यह जगन्नाथ को अर्पित है और ओड़िशा में घर घर पढ़ी जाती है। विलंका रामायण से यह अलग है: वह लंका के बाद की कथा है, यह पूरी रामकथा। एक ही भाषा में दो अलग कवि, और दोनों अपनी अपनी दिशा में।",n:"जगमोहन रामायण",level:"pal",who:"बलराम दास",lang:"ओड़िया",when:"पंद्रहवीं सदी",
  where:"पुरी, ओड़िशा",la:19.81,lo:85.83,pr:"जगमोहन रामायण यानी दांडी रामायण, ओड़िया छपी प्रतियाँ"},
 kashmiri:{lore:"कश्मीरी में लिखी रामकथा, जिसे रामावतारचरित कहते हैं और जिसे दिवाकर प्रकाश भट्ट ने रचा। इसकी सबसे अलग बात यह है कि इसमें सब कुछ कश्मीर का हो जाता है: रहन सहन, कपड़े, रीति रिवाज और जगहें। पढ़ते हुए लगता है कि यह सब अयोध्या या लंका में नहीं, कश्मीर में ही हो रहा है। नाम भी वहीं के ढंग के हो जाते हैं, जैसे इंद्रजित वहाँ इंद्रजेथ है।",n:"रामावतारचरित",level:"pal",who:"दिवाकर प्रकाश भट्ट",lang:"कश्मीरी",when:"उन्नीसवीं सदी के आसपास",
  where:"कश्मीर घाटी",la:34.08,lo:74.80,pr:"रामावतारचरित, कश्मीरी पाठ और अंग्रेज़ी अनुवाद"},
 giridhar:{lore:"गुजराती की वह रामकथा जिसे गिरधर ने सन 1835 में पूरा किया। उन्होंने कथा मुख्य रूप से वाल्मीकि और हनुमन्नाटक से ली, और उसे सीधी सादी भाषा में लिखा। सबसे बड़ी बात इसका संगीत है: यह कई रागों और छंदों में बँधी है, जैसे धनाश्री, बिलावल, मारू, सोरठ और आसावरी, इसलिए इसे पढ़ा कम और गाया ज़्यादा जाता है।",n:"गिरधर रामायण",level:"pal",who:"गिरधर",lang:"गुजराती",when:"सन 1835",
  where:"गुजरात",la:22.31,lo:72.14,pr:"गिरधरकृत रामायण, गुजराती छपी प्रतियाँ"},
 bhanubhakta:{lore:"नेपाल की पहली बड़ी रामकथा, जिसे भानुभक्त आचार्य ने उन्नीसवीं सदी में नेपाली में रचा। उस समय धर्म की बात संस्कृत में ही लिखी जाती थी, और यही इसका सबसे बड़ा क़दम है, क्योंकि इससे कथा आम लोगों की ज़बान में आ गई। पहले यह ज़बानी फैली, और पूरी छपी 1887 में, कवि के जाने के बाद। नेपाल में उन्हें आदिकवि कहा जाता है।",n:"भानुभक्त रामायण",level:"pal",who:"भानुभक्त आचार्य",lang:"नेपाली",when:"उन्नीसवीं सदी, छपी 1887 में",
  where:"तनहुँ, नेपाल",la:27.92,lo:84.25,pr:"भानुभक्त रामायण, साझा प्रकाशन तथा अन्य छपी प्रतियाँ"},
 kavitavali:{lore:"तुलसीदास की दूसरी रामकथा, मानस से अलग। यह अवधी में नहीं, ब्रजभाषा में है, और चौपाई दोहे में नहीं, कवित्त और सवैया में। इसमें पूरी कथा क्रम से नहीं चलती, बस चुने हुए दृश्य बहुत ज़ोर से कहे जाते हैं। इसीलिए इसका सुंदर काण्ड और लंका काण्ड आग के वर्णन के लिए जाने जाते हैं। एक ही कवि, और दो बिल्कुल अलग कथाएँ।",n:"कवितावली",level:"pal",who:"तुलसीदास",lang:"ब्रजभाषा",when:"सोलहवीं सदी के आख़िर में",
  where:"काशी",la:25.31,lo:83.01,pr:"कवितावली, गीता प्रेस तथा अन्य छपी प्रतियाँ, सुंदर काण्ड और लंका काण्ड"},
 yama:{lore:"बर्मा की रामकथा, जिसका नाम यम ज़ातदो है, यानी राम की जातक कथा। तेरहवीं सदी के आख़िर में आवा में इसका ज़िक्र मिलता है, और सोलहवीं सदी तक यह ज़बानी ही चलती रही। वहाँ राम को यम कहा जाता है, और कथा ज़्यादातर कठपुतली के मंच पर मिलती है, जिसे यम ज़ात प्वे कहते हैं। लिखे हुए पाठ से ज़्यादा यह खेली जाने वाली कथा है।",n:"यम ज़ातदो",level:"pal",who:"बर्मी परंपरा, कई हाथ",lang:"बर्मी",when:"तेरहवीं सदी से ज़बानी, बाद में लिखी गई",
  where:"आवा और मंडले, म्यांमार",la:21.85,lo:95.98,pr:"यम ज़ातदो के छपे पाठ और अंग्रेज़ी संक्षेप"},
 lao:{lore:"लाओस की रामकथा, जिसका नाम फ्रा लक फ्रा लाम है, यानी पहले लक्ष्मण, फिर राम। नाम का यह क्रम ही बता देता है कि वहाँ भाई का दर्जा कितना बड़ा है। इस परंपरा में राम को बुद्ध का ही पहले का जन्म माना जाता है, इसलिए कथा जीत हार से ज़्यादा सही रास्ते पर चलने की बात करती है। यह मंदिरों की दीवारों पर बनी मिलती है और गाकर भी सुनाई जाती है।",n:"फ्रा लक फ्रा लाम",level:"pal",who:"लाओ परंपरा",lang:"लाओ",when:"मंदिरों की दीवारों और ज़बानी परंपरा में",
  where:"लुआंग प्रबांग, लाओस",la:19.89,lo:102.14,pr:"फ्रा लक फ्रा लाम के छपे पाठ और अनुवाद"},
 reamker:{lore:"कंबोडिया की राष्ट्रीय रामकथा, जिसका नाम ही है राम की कीर्ति। इसकी सबसे पुरानी चर्चा सातवीं सदी के एक पत्थर के लेख में मिलती है, और जो पाठ आज बचा है वह सोलहवीं सदी का है। नाम बदल जाते हैं: राम वहाँ प्रेअह रीम, सीता नेअंग सेदा, और रावण क्रोंग रीप। यह कथा किताब से ज़्यादा मंच पर मिलती है, नाच और छाया नाटक में, और इसके दृश्य अंकोर वात तथा राजमहल की दीवारों पर बने हैं।",n:"रीमकेर",level:"pal",who:"खमेर परंपरा, कई हाथ",lang:"खमेर",when:"बचा हुआ पाठ सोलहवीं सदी का",
  where:"अंकोर और नोम पेन्ह, कंबोडिया",la:13.41,lo:103.87,pr:"रीमकेर, खमेर पाठ और अंग्रेज़ी अनुवाद की छपी प्रतियाँ"},
 kakawin:{lore:"जावा की सबसे पुरानी रामकथा, लगभग नौवीं सदी के मध्य जावा में लिखी गई, छब्बीस सर्गों और लगभग सत्ताईस सौ पदों की। ख़ास बात यह है कि यह वाल्मीकि से नहीं, भट्टिकाव्य नाम की उस संस्कृत रचना से ली गई है जो कथा के साथ व्याकरण भी सिखाती थी। पहला आधा उसी के पास रहता है, दूसरा आधा अपने रास्ते चला जाता है। इसी कथा के दृश्य जावा के पत्थर के मंदिरों की दीवारों पर खुदे हैं।",n:"ककविन रामायण",level:"pal",who:"मध्य जावा का कोई दरबारी कवि",lang:"पुरानी जावानी",when:"नौवीं सदी, 26 सर्ग",
  where:"मध्य जावा, इंडोनेशिया",la:-7.75,lo:110.49,pr:"ककविन रामायण, पुरानी जावानी पाठ की छपी प्रतियाँ और अंग्रेज़ी अनुवाद"},
 ramakien:{lore:"थाईलैंड की राष्ट्रीय रामकथा, जिसे आज के रूप में अठारहवीं सदी में राजा राम प्रथम के दरबार ने पूरा किया। नाम बदल जाते हैं: राम यहाँ फ्रा राम हैं, सीता नांग सीदा, रावण थोतसकान, और विभीषण फिपेक। हनुमान यहाँ सफ़ेद वानर हैं और ब्रह्मचारी नहीं। यह कथा पढ़ी कम, नाची और खेली ज़्यादा जाती है, खोन नृत्य और छाया नाटक में।",n:"रामकियेन",level:"pal",who:"राजा राम प्रथम का दरबार",lang:"थाई",when:"अठारहवीं सदी",
  where:"अयुत्थया और बैंकाक, थाईलैंड",la:14.35,lo:100.58,pr:"रामकियेन, राम प्रथम वाला पाठ; अंग्रेज़ी संक्षेप कई छपी प्रतियों में"},
 kamba:{lore:"तमिल की सबसे बड़ी रामकथा, जिसे कंबन ने रचा। इसमें हर हिस्से का अपना अध्याय है, जैसे नगर ढूँढने का अध्याय और लौटकर चरणों में सिर रखने का अध्याय। कंबन ब्योरे में नहीं, दृश्य में जाते हैं, इसलिए उनकी लंका देखी हुई लगती है।",n:"कंब रामायण",level:"pal",who:"कंबन",lang:"तमिल",when:"सुंदरकांडम् में 14 पडलम्",
  where:"तेरषुंदूर, तमिलनाडु",la:11.01,lo:79.62,u:"https://archive.org/download/adhyatma-ramayan-hindi-tr.-munilal-gita-press-gorakhpur/Kamba%20Ramayana/Kamba-Ramayanam%20Sheshadri%20T.%20Part%203%20Kishkindha%20Sunderkand%20%20Bhuvan%20Vani%20Trust.pdf"},
 jain:{lore:"सबसे पुरानी जैन रामकथा, प्राकृत में। यहाँ लंका के लोग राक्षस नहीं, विद्याधर हैं, और हनुमान भी वानर नहीं, विद्याधर वीर हैं। उड़ना जादू नहीं, विद्या है। सबसे बड़ा फ़र्क़ यह कि यहाँ पूँछ में आग लगने की बात ही नहीं आती।",n:"पउमचरिय",level:"pal",u:"https://archive.org/details/cWFP_paumacariyam-of-acharya-vimala-suri-with-hindi-trans.-part-2-editor-dr.-h.-jacob",un:"प्राकृत मूल, हिंदी अनुवाद सहित (भाग 2, प्राकृत टेक्स्ट सोसाइटी)",who:"विमलसूरि",lang:"प्राकृत, जैन परंपरा",when:"सबसे पुरानी जैन रामकथा; अध्ययन इसे चौथी सदी के आसपास रखते हैं",
  where:"पश्चिम भारत (पुष्टि बाकी)",la:21.50,lo:73.20},
 kurma:{lore:"वह पुराण जिसमें सबसे पहले यह बात मिलती है कि रावण असली सीता को नहीं, उनकी छाया को ले गया। वहीं से यह विचार पद्म पुराण, ब्रह्मवैवर्त, अध्यात्म रामायण और मानस तक जाता है।",n:"कूर्म पुराण और ब्रह्मवैवर्त पुराण",level:"pal",pr:"कूर्म पुराण, गीता प्रेस गोरखपुर का संस्कृत और हिंदी संस्करण",who:"पुराण परंपरा; छाया सीता की कथा सबसे पहले कूर्म पुराण में",lang:"संस्कृत",when:"कूर्म पुराण लगभग 550 से 850 ईस्वी",
  where:"जगह पक्की नहीं",la:24.80,lo:82.60,u:""},
 mbh:{lore:"महाभारत के वनपर्व में सुनाई गई छोटी रामकथा। यह किसी को सांत्वना देने के लिए कही जा रही है, इसलिए इसमें ब्योरे नहीं, सिर्फ़ ढाँचा है, और सबसे ज़्यादा ठहराव इस बात पर है कि सहने वाले को आख़िर में रास्ता मिलता है।",n:"महाभारत, रामोपाख्यान",level:"pal",u:"https://www.ibiblio.org/sripedia/ebooks/mb/m03/m03000.htm",un:"वनपर्व का पूरा अनुवाद (गांगुली, 1883 से 1896)",who:"मार्कंडेय युधिष्ठिर को सुनाते हैं",lang:"संस्कृत",when:"वनपर्व के 704 श्लोक, अध्याय 258 से 275",
  where:"जगह पक्की नहीं",la:29.97,lo:77.55},
 adbhuta:{lore:"शाक्त परंपरा की कथा, सत्ताईस सर्गों की, जिसमें सीता रावण की ही बेटी बताई गई हैं। सर्ग तेईस से पच्चीस में लंका के बाद एक और रावण आता है, और अंत सीता के हाथ होता है, राम के नहीं।",n:"अद्भुत रामायण",level:"pal",pr:"अद्भुत रामायण, 27 सर्ग; शांति लाल नागर का अनुवाद, 2001",who:"वाल्मीकि के नाम से जुड़ी, शाक्त परंपरा",lang:"संस्कृत",when:"27 सर्ग, सीता केंद्र में",
  where:"जगह पक्की नहीं",la:27.10,lo:78.00,u:""},
 ananda:{lore:"शिव और पार्वती के संवाद वाला ग्रंथ, जिसमें पूरी लंका कथा पहले ही कांड में आ जाती है। यह पूरी रात वहाँ एक ही सर्ग है, क्योंकि सुनने वाली को ब्योरा नहीं, सार चाहिए। इसमें कई प्रसंग ऐसे जुड़े हैं जो पुराने पाठों में नहीं मिलते।",n:"आनंद रामायण",level:"pal",pr:"आनंद रामायण, शांति लाल नागर का अनुवाद; सार कांड, सर्ग 9, पृष्ठ 95",who:"परंपरा इसे वाल्मीकि से जोड़ती है; शिव और पार्वती के संवाद के रूप में",lang:"संस्कृत",when:"नौ कांड, 109 सर्ग, लगभग 12,300 श्लोक; अध्यात्म रामायण के बाद की",
  where:"जगह पक्की नहीं",la:19.90,lo:75.30,u:""},
 krittivasa:{lore:"बांग्ला की वह रामकथा जो पाँचाली के ढंग में, घर के लोगों को सुनाने के लिए लिखी गई। इसीलिए यहाँ रिश्ते और घर की बातें ज़्यादा आती हैं, और द्वार पर रोकने वाली का नाम लंकिनी नहीं, चामुंडी है।",n:"कृत्तिवासी रामायण",level:"pal",pr:"कृत्तिवास रामायण, भुवन वाणी ट्रस्ट लखनऊ का हिंदी संस्करण",who:"कृत्तिवास ओझा, फुलिया",lang:"बांग्ला",when:"पंद्रहवीं सदी, पाँचाली के ढंग में सात कांड",
  where:"फुलिया, बंगाल",la:23.20,lo:88.50,u:""},
 ranganatha:{lore:"तेलुगु की पहली पूरी रामायण, द्विपद छंद में, जिसे गाकर सुनाया जाता है। इसीलिए यह दरबार की नहीं, लोगों की कथा लगती है। इसमें एक बात ऐसी है जो कम मिलती है: सीता के ठुकराने के तुरंत बाद मंदोदरी रावण को नीति समझाती है।",n:"रंगनाथ रामायण",level:"pal",who:"गोना बुद्धा रेड्डी, काकतीय काल के सामंत",lang:"तेलुगु, द्विपद छंद",when:"सात कांड, 17,290 द्विपद; रचना काल पर मतभेद, 1220 से 1240 या 1294 से 1300 ईस्वी",
  where:"आंध्र",la:16.50,lo:80.60,u:"https://archive.org/details/in.ernet.dli.2015.329386"},
 eknath:{lore:"मराठी की सबसे बड़ी रामकथा, वारकरी परंपरा की, जिसमें रामायण का मतलब यही ग्रंथ है। इसका सुंदरकांड बीस से ज़्यादा अध्यायों का है, और खोज एक बाग़ में नहीं, कई नाम वाले बाग़ों में चलती है।",n:"भावार्थ रामायण",level:"pal",u:"https://archive.org/details/BhavarthRamayanHindi",un:"पूरा ग्रंथ, हिंदी अनुवाद में",who:"एकनाथ, पैठण; अंतिम भाग किसी शिष्य का",lang:"मराठी, ओवी छंद",when:"सोलहवीं सदी, सात कांड और लगभग 297 अध्याय",
  where:"पैठण, महाराष्ट्र",la:19.48,lo:75.38},
 ezhu:{lore:"मलयालम की वह कथा जिसे सुनाने वाला कोई आदमी नहीं, एक तोता है, और नाम भी तोते के गीत जैसा है। इसका सुंदरकांडम् ग्यारह खंडों का है, और द्वार पर रोकने वाली का नाम यहाँ लंका लक्ष्मी है, जिसके खंड का नाम ही है उसका छूटना।",n:"अध्यात्म रामायण किलिप्पाट्टु",level:"pal",who:"एषुत्तच्छन, अध्यात्म रामायण का मलयालम रूप",lang:"मलयालम",when:"सोलहवीं सदी के आसपास; सुंदरकांडम् ग्यारह खंडों में",
  where:"तिरूर, केरल",la:10.91,lo:75.92,u:"https://archive.org/download/adhyatma-ramayan-hindi-tr.-munilal-gita-press-gorakhpur/Adhyatma%20Ramayana/Adhyatma%20Ramayana%20%26%20Uttara%20Ramayana%20Hindi-Trans%20of%20Malayalam%20Kuttan%20Pillai%20N.P.%20Bhuvan%20Vani%20Trust.pdf"},
 kandali:{lore:"असम की पहली बड़ी रामकथा, चौदहवीं सदी में राजा महामाणिक्य के कहने पर लिखी गई, ताकि लोग अपनी ही बोली में कथा सुन सकें। कवि ने ख़ुद कहा है कि उन्होंने विस्तार छोड़कर सार लिया। इसका एक हिस्सा आज भी अलग से गाकर पढ़ा जाता है, हनुमान का लंका दर्शन।",n:"सप्तकांड रामायण",level:"pal",pr:"माधव कंदली रामायण, शांति लाल नागर का अनुवाद, मुंशीराम मनोहरलाल, 2000",who:"माधव कंदली; आदि और उत्तर कांड बाद में शंकरदेव तथा माधवदेव के",lang:"असमिया",when:"चौदहवीं सदी, राजा महामाणिक्य के कहने पर",
  where:"असम",la:26.20,lo:92.90,u:""},
 sarala:{lore:"ओड़िया की वह कथा जो लंका के बाद शुरू होती है, बीस अध्यायों की, और कहीं और नहीं मिलती। पाताल की दूसरी लंका, हज़ार सिर वाला रावण, और अंत में सीता के हाथ का फूलों वाला धनुष। यही इस खेल की चौथी रात है।",n:"विलंका रामायण",level:"pal",who:"सारला दास, जगतसिंहपुर की सारला चंडी को समर्पित",lang:"ओड़िया",when:"पंद्रहवीं सदी; दांडी छंद में, गाकर सुनाने लायक",
  where:"ओड़िशा",la:20.30,lo:86.00,u:"https://archive.org/details/bilanka-ramayana-purba-khanda-"},
 torave:{lore:"कन्नड़ की पहली बड़ी रामकथा, भामिनी षट्पदी छंद में, जिसे गाकर पढ़ा जाता है। इसकी आठवीं संधि लंका दहन की है, और वहीं वह दावा आता है कि यह जलाना त्रिपुर जलाने वाले से पाँच गुना कहा जाए।",n:"तोरवे रामायण",level:"pal",who:"नरहरि, जिन्हें कुमार वाल्मीकि कहा जाता है",lang:"कन्नड़",when:"लगभग 1500 ईस्वी; भामिनी षट्पदी छंद, नडुगन्नड़ भाषा",

const CARDS={
 vilap:{t:"देखने वाले का रोना",l:"man",x:"ढूँढ लेने की ख़ुशी से पहले एक और चीज़ आती है। उन्हें देखकर हनुमान की ही आँखें भर आती हैं। वे सोचते हैं कि जिस चाँदनी और फूलों से किसी को सुख मिलता है, वही इन्हें और दुखी कर रहे हैं, क्योंकि वे पुराने दिनों की याद दिलाते हैं। पहचानने के बाद वे राम को मन ही मन प्रणाम करते हैं और फिर पत्तों में छिप जाते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 16 और 17"},
 gaakar:{t:"सीधे बात नहीं, कथा सुनाई",l:"chh",x:"वे सीधे सामने नहीं आते। डाल पर बैठकर, धीमी और मीठी आवाज़ में, वे राम की पूरी कहानी सुनाने लगते हैं: दशरथ नाम का एक राजा था, फिर वन, फिर हरण, फिर सुग्रीव, और आख़िर में यह कि एक दूत ढूँढता हुआ लंका पहुँचा। सीता वह सुनती हैं, और उसी में उन्हें भरोसा मिलता है। फिर वे ऊपर देखती हैं और पेड़ पर बैठा वानर दिखता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 31"},
 ravan_dekhna:{t:"दुश्मन को देखकर पहला ख़याल",l:"man",x:"दरबार में बँधे हुए खड़े होकर वे पहली बार रावण को सामने से देखते हैं, और जो सोचते हैं वह चौंकाने वाला है: कितना तेज है, कितना रूप, कितनी धीरता। अगर यह अधर्म पर न टिका होता तो देवताओं का राज भी सँभाल सकता था। दुश्मन की बड़ाई मान लेना कमज़ोरी नहीं, नाप लेना है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 49"},
 dut_bhashan:{t:"बँधे हुए का भाषण",l:"chh",x:"पूछे जाने पर वे साफ़ कहते हैं कि मैं वानरों के राजा सुग्रीव का दूत हूँ और राम का संदेश लाया हूँ। फिर वे सलाह देते हैं, माँगते नहीं: सीता को लौटा दो, वरना जो जनस्थान में हुआ वही यहाँ होगा, और उस वक़्त तुम्हें कोई नहीं बचा सकेगा। बँधा हुआ दूत दरबार को सलाह दे रहा है, और यही इस पूरे हिस्से की सबसे बड़ी बात है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 50 और 51"},
 pahli_awaaz:{t:"लौटते ही पहली आवाज़",l:"chh",x:"उस पार उतरते ही वे इतनी ज़ोर से गरजते हैं कि पहाड़ हिल जाता है। यह ख़बर देने से पहले की ख़बर है: इंतज़ार करते वानर उसी आवाज़ से समझ जाते हैं कि काम हो गया। वे कूदते हैं, चिल्लाते हैं, और पेड़ों की डालें हिलाने लगते हैं। शब्द बाद में आते हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 57"},
 peshkash:{t:"रावण की पेशकश",l:"chh",x:"धमकी से पहले वह मनाने की कोशिश करता है। वह कहता है कि मेरी सारी रानियों के ऊपर तुम्हारी जगह होगी, सारा धन तुम्हारा होगा, बस मान जाओ। उसी बातचीत में वह अपनी ताक़त भी गिनाता है। सीता बीच में एक तिनका रखकर जवाब देती हैं, यानी सीधे उसकी तरफ़ देखे बिना। मनाना पूरा होते ही अवधि और धमकी शुरू होती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 20 से 22"},
 bada_roop:{t:"ले चलने के लिए बड़ा होना",l:"chh",x:"जब वे कहते हैं कि मैं आपको पीठ पर बैठाकर ले चल सकता हूँ, तब सीता को यक़ीन नहीं होता कि इतना सा जीव यह कर पाएगा। तब वे उनके सामने अपना बड़ा रूप कर लेते हैं, पहाड़ जितना। रूप दिखाना यहाँ डराने के लिए नहीं, भरोसा दिलाने के लिए है। फिर भी सीता मना कर देती हैं, और इसी से पता चलता है कि उनका मना करना ताक़त पर शक नहीं था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 37"},
 shakun:{t:"बाईं आँख का फड़कना",l:"man",x:"तानों के बाद वे सबसे नीचे थीं, और आस टूटने के क़रीब। तभी शरीर ने अपने आप कुछ कहा: बाईं आँख फड़की, फिर बायाँ कंधा, फिर बाईं जाँघ। पुरानी मान्यता में स्त्री के लिए बाईं तरफ़ का फड़कना शुभ माना जाता है। कवि कहते हैं कि वे ऐसे खिल उठीं जैसे सूखा पौधा देर से आई बारिश में। जो बात हनुमान अभी कहने वाले थे, उसकी ख़बर उन्हें शरीर से पहले ही मिल गई।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 29"},
 sita_jawab:{t:"सीता का जवाब",l:"chh",x:"रावण के सामने वे झुकती नहीं। वे साफ़ कहती हैं कि तेरे जीने का एक ही रास्ता है, मुझे लौटा दे। और यह भी कि जो अपनी ताक़त पर भरोसा करता है वह चुराकर नहीं लाता। यही जवाब सुनकर वह अवधि देता है और राक्षसियों को डराने का काम सौंपता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 21 और 22"},
 sandeh:{t:"कहीं यह रावण ही तो नहीं",l:"man",x:"पहली बात सुनकर भी उन्हें भरोसा नहीं होता। वे सोचती हैं कि रावण एक बार साधु का वेश धरकर आ चुका है, तो यह वानर भी वही हो सकता है। वे कहती हैं कि अगर तू वही है और फिर से छल कर रहा है, तो मेरा दुख और बढ़ा रहा है। संदेह मूर्खता नहीं थी, पहले का अनुभव था।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 33 और 34"},
 parichay:{t:"अपना परिचय देकर भरोसा जीतना",l:"chh",x:"भरोसा जीतने के लिए हनुमान अपनी ही कहानी सुनाते हैं: किसका बेटा हूँ, किसके यहाँ रहता हूँ, राम से कैसे मिला, और सुग्रीव से क्या तय हुआ। फिर वे राम और लक्ष्मण का हुलिया एक एक करके बताते हैं। हथियार से नहीं, ब्योरे से भरोसा बनता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 35"},
 vidai:{t:"विदाई के शब्द",l:"man",x:"आख़िर में वे विदा करती हैं, पर एक शर्त के साथ: जल्दी करना। वे कहती हैं कि राम से कहना कि एक महीने के भीतर आ जाएँ, उसके बाद वे मुझे जीवित नहीं पाएँगे। यही वाक्य आगे पूरी लड़ाई की रफ़्तार तय करता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 39 और 40"},
 bhitar_mahal:{t:"भीतर का महल",l:"chh",x:"महल के भीतर एक और महल है, और वही सबसे सुंदर है। स्फटिक के फ़र्श, हाथी दाँत और चाँदी से जड़ी सीढ़ियाँ, और बीच में वही उड़ने वाला विमान खड़ा है। कवि यहाँ रुककर एक एक चीज़ गिनाते हैं, और तभी वह बात और भारी लगती है कि इतने सब के बीच जिसे ढूँढा जा रहा है वह कहीं नहीं है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 9"},
 kaanpna:{t:"आते हुए को देखकर",l:"man",x:"रावण को आते देखकर वे सिमट जाती हैं। कथा कहती है कि वे हवा में काँपते केले के पौधे जैसी लगीं, और अपने ही हाथों से ख़ुद को ढाँपकर ज़मीन की तरफ़ देखने लगीं। बोलने से पहले का यह पल ही बता देता है कि वहाँ दिन कैसे बीतते होंगे।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 19"},
 jawab_rakshasi:{t:"घेरे के बीच दिया गया जवाब",l:"chh",x:"राक्षसियाँ बारी बारी से कहती हैं कि मान जाओ, वरना अच्छा नहीं होगा। जवाब में सीता झगड़ती नहीं, एक ही बात दोहराती हैं: यह हो ही नहीं सकता, और जो तुम कह रही हो वह मुझसे कहलवाया नहीं जा सकता। फिर वे चुप हो जाती हैं और उनसे बात करना बंद कर देती हैं। उसके बाद का हिस्सा कथा का सबसे भारी हिस्सा है, और वहीं से सुबह वाला मोड़ शुरू होता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 25 और 26"},
 sabke_saamne:{t:"सबके सामने कही गई बात",l:"chh",x:"ख़बर अकेले में नहीं दी जाती। पूरी टोली राम के डेरे तक पहुँचती है, और वहीं सबके सामने कहा जाता है कि सीता देखी गईं। कथा इसे अलग सर्ग में रखती है, क्योंकि यह सिर्फ़ ख़बर नहीं, उस पूरी खोज का हिसाब है जो एक महीने की हद के भीतर पूरी करनी थी।",s:"vr",p:1,sl:"दृष्टा देवीति हनुमद्वदनादमृतोपमम्। आकर्ण्य वचनं रामो हर्षमाप सलक्ष्मणः॥",slm:"हनुमान के मुँह से अमृत जैसे वे शब्द सुनकर, कि सीता देखी गईं, राम और लक्ष्मण दोनों आनंद से भर गए।",ref:"सुंदरकांड, सर्ग 64"},
 toli_udaan:{t:"अकेले गए, साथ लौटे",l:"chh",x:"मधुवन के बाद अंगद, हनुमान और बाकी सब एक साथ आसमान में उठते हैं। नीचे वही समुद्र है जो कुछ दिन पहले अकेले पार किया गया था। जाते वक़्त एक गया था और लौटते वक़्त सब लौट रहे हैं, और यही फ़र्क़ अपने आप में सबसे बड़ी ख़बर है। जो काम अकेले शुरू हुआ था, वह अब सबका हो चुका है।",s:"vr",p:1,sl:"ते अम्बरं सहसोत्पत्य वेगवन्तः प्लवंगमाः। विनदन्तो महानादं घना वातेरिता यथा॥",slm:"वे तेज़ वानर एक साथ आसमान में उठे और ज़ोर से गरजते हुए ऐसे चले जैसे हवा के धक्के से बादल चलते हैं।",ref:"सुंदरकांड, सर्ग 64"},
 kamba_lautna:{t:"चरणों में सिर रखने वाला अध्याय",l:"gr",x:"तमिल कथा में लौटने का अपना अध्याय है, और उसका नाम ही चरणों में सिर रखने पर है। वहाँ ज़ोर रफ़्तार या जीत पर नहीं, उस पल पर है जब यह सब किसी के सामने रखा जाएगा। इसीलिए वहाँ उड़ान भी उसी एक पल की तैयारी जैसी लगती है, और कंबन उसे राहत की तरह लिखते हैं, जीत की तरह नहीं।",s:"kamba",p:1,ref:"कंब रामायण, सुंदर कांडम्"},
 aakhri_chadhai:{t:"आख़िरी क़दम अकेले के",l:"man",x:"पहाड़ की चढ़ाई पर पीछे पूरी टोली है, पर आख़िरी क़दम उसी को उठाने हैं जो ख़बर लाया है। ऊपर डेरे की आग दिखने लगती है, और उसी के पास बैठा एक आदमी दिन गिन रहा है। इसी रास्ते के बाद वह वाक्य कहा जाएगा जिसके लिए यह पूरी रात थी, और कथा उस वाक्य से पहले जान बूझकर थोड़ी देर ठहरती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 64 और 65"},
 kalpa_mann:{t:"बाहर के साथ भीतर भी",l:"gr",x:"बीसवीं सदी वाली कथा में चढ़ाई के साथ मन का हाल भी चलता है: थकान, जल्दी और हल्कापन, तीनों एक साथ। यही उस कथा का ढंग है, बाहर जो हो रहा है उसके साथ भीतर जो हो रहा है, वह भी कहा जाता है। पुरानी कथाएँ यह काम इशारों से करती हैं, और यह सीधे कहकर।",s:"kalpavruksham",p:1,ref:"रामायण कल्पवृक्षम्"},
 bujhana_dar:{t:"आग बुझते ही डर",l:"man",x:"जलती पूँछ समुद्र में डूबती है, भाप उठती है, और उसी पल ग़ुस्सा भी उतर जाता है। तभी सबसे बड़ा डर पकड़ता है: अगर सारा नगर जला है तो वह बग़ीचा भी जला होगा, और वहाँ तो वही बैठी थीं। वे ख़ुद को कोसते हैं कि ग़ुस्से में यह क्या कर दिया। फिर अपने ही तर्क से सँभलते हैं, और तभी आसमान से यह सुनाई देता है कि लंका जली है पर वे सुरक्षित हैं।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 55"},
 thai_laar_do:{t:"वहाँ समुद्र की ज़रूरत ही नहीं",l:"gr",x:"थाई कथा में यह आग समुद्र से नहीं बुझती, वे अपनी ही लार से बुझाते हैं। यह दृश्य वहाँ पढ़ा नहीं, नाचकर दिखाया जाता है, और उसमें हँसी की जगह भी रखी जाती है। एक ही दृश्य, और बुझाने के दो तरीक़े, जिनसे पता चल जाता है कि कथा किस जगह की है और किसके लिए कही जा रही है।",s:"ramakien",p:1,ref:"रामकियेन; खोन नृत्य की परंपरा"},
 kinare_saans:{t:"आख़िरी ठहराव",l:"man",x:"पार पहुँचकर पहली बार पैर ज़मीन पर पड़ते हैं, और यही आख़िरी जगह है जहाँ रुका जा सकता है। इसके बाद नगर है, पहरा है, और लगातार चलते रहना है। कथा इस पल पर ज़्यादा नहीं रुकती, पर जो रुकता है वह समझ जाता है कि यहाँ से आगे लौटने का रास्ता आसान नहीं रहेगा।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1 और 2"},
 molla_chhoti:{t:"छोटा करना भी चुनना है",l:"gr",x:"मोल्ला ने जान बूझकर कथा छोटी रखी, और वह तेलुगु की पहली संक्षेप रामकथा मानी जाती है। इसलिए वहाँ ठहराव कम हैं और चाल ज़्यादा। जो हिस्से दूसरी कथाओं में कई पन्नों के हैं, वहाँ वे एक पंक्ति में बीत जाते हैं। छोटा करना कमी नहीं, एक फ़ैसला है, और उस फ़ैसले के पीछे यह सोच है कि कथा हर किसी तक पहुँचे।",s:"molla",p:1,ref:"मोल्ला रामायणम्"},
 pushpak_bheetar:{t:"भीतर से देखा हुआ विमान",l:"chh",x:"वाल्मीकि पुष्पक को बाहर से नहीं, भीतर से दिखाते हैं: सोने की जालीदार खिड़कियाँ, रत्न जड़े खंभे, और ऐसा फ़र्श जिस पर पैर की आवाज़ नहीं होती। यह नगर की सबसे सुंदर चीज़ है और यह भी किसी और से ली हुई है, क्योंकि पहले यह कुबेर के पास था। इतनी सजावट के बीच खड़े होकर भी वही एक बात लौटती है कि जिसे ढूँढा जा रहा है वह यहाँ नहीं है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 7 और 8"},
 kavit_chhod:{t:"जो छोड़ दिया गया",l:"gr",x:"कवितावली ऐसे वर्णनों पर नहीं रुकती। वह पूरी कथा क्रम से नहीं कहती, सिर्फ़ चुने हुए दृश्य ज़ोर से कहती है, इसलिए महल का ठाठ वहाँ मिलता ही नहीं। जो मिलता है वह आग है, और मंदोदरी का रोना। किसी कथा को समझने के लिए यह देखना भी ज़रूरी है कि उसने क्या छोड़ा।",s:"kavitavali",p:1,ref:"कवितावली, तुलसीदास"},
 uttar_soch:{t:"फाटक पर रुककर सोचना",l:"man",x:"वाल्मीकि साफ़ लिखते हैं कि वे उत्तर के फाटक पर आकर रुके और सोचने लगे। यही इस पूरी रात का सबसे ज़रूरी ठहराव है, क्योंकि यहीं तय होता है कि भीतर कैसे जाना है। बड़े रूप में जाते तो पूरी सेना से भिड़ना पड़ता और खोज कभी पूरी न होती। इसलिए वे साँझ का इंतज़ार करते हैं और छोटे होकर जाते हैं। सोचने में बिताया गया यह वक़्त आगे की हर चाल बचा लेता है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 2"},
 kritti_dwar:{t:"बांग्ला में उसका नाम चामुंडी",l:"gr",x:"कृत्तिवासी रामायण में फाटक पर रोकने वाली का नाम लंकिनी नहीं, चामुंडी है। वह कथा घर के लोगों को सुनाने के लिए लिखी गई थी, इसलिए वहाँ यह भेंट भी सीधी और कम डरावनी है। नाम बदलते ही वह पराई कम और जानी पहचानी ज़्यादा लगने लगती है, और यही इस परंपरा का ढंग है।",s:"krittivasa",p:1,ref:"कृत्तिवासी रामायण, सुंदरकांड"},
 sarovar_shant:{t:"सबसे शांत कोना",l:"man",x:"वाटिका के भीतर सीढ़ियों वाला वह सरोवर है जहाँ न पहरा दिखता है, न आवाज़ आती है। पूरी रात में यही एक जगह है जहाँ कुछ हो नहीं रहा। और यही बात उसे भारी बना देती है, क्योंकि इसी शांति के बीच वह बैठी हैं जिनके लिए यह सारी दौड़ है। कथा में शांति हमेशा राहत नहीं होती, कभी वह सबसे बड़ा दबाव होती है।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 14 और 15"},
 eknath_paani:{t:"पानी वाले बाग़ का अपना नाम",l:"gr",x:"मराठी कथा में खोज एक बाग़ में नहीं, कई बाग़ों में चलती है, और हर बाग़ का नाम लेकर कहा जाता है। पानी वाले बाग़ का अपना नाम और अपना ब्योरा है। इसीलिए वहाँ पहुँचने में देर लगती है, और देर लगनी भी चाहिए, क्योंकि ढूँढने में सचमुच देर लगी थी।",s:"eknath",p:1,ref:"भावार्थ रामायण, एकनाथ, सुंदरकांड"},
 surasa_vardaan:{t:"जीतना नहीं, निकलना",l:"chh",x:"यह पड़ाव बाकी सबसे अलग है, क्योंकि यहाँ कोई दुश्मन नहीं है। नागों की माता को देवताओं ने भेजा है, सिर्फ़ यह देखने कि जाने वाला कैसा है। उनके पास ब्रह्मा का वरदान है कि कोई उनके मुँह में घुसे बिना आगे न जाए। इसलिए बड़े होते जाने से बात नहीं बनती। आख़िर में अंगूठे जितने छोटे होकर भीतर से निकलना पड़ता है, ताकि वरदान भी बचा रहे और रास्ता भी मिल जाए।",s:"vr",p:1,ref:"सुंदरकांड, सर्ग 1"},
 manas_surasa:{t:"वहाँ भी यही परीक्षा",l:"gr",x:"मानस में भी यह पड़ाव आता है और वहाँ भी वे नागों की माता हैं। तुलसीदास इसे परीक्षा कहकर ही लिखते हैं, इसलिए उसमें कोई कड़वाहट नहीं बचती। निकलते ही वे आशीर्वाद देती हैं और रास्ता खुल जाता है। दो अलग कथाएँ, और दोनों में यही बात कि परखने वाला दुश्मन नहीं होता।",s:"manas",p:1,ref:"रामचरितमानस, सुंदरकांड"},
